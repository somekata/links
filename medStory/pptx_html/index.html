[data-mode="yoko"] #deck{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding-bottom:0;box-sizing:border-box}
[data-mode="yoko"] #deck::-webkit-scrollbar{display:none}
[data-mode="yoko"] .slide{flex:0 0 100vw;flex-shrink:0;height:100vh;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:0;position:relative;box-sizing:border-box;overflow:hidden}
[data-mode="gradient"] #deck{display:block;position:relative;overflow:hidden;padding-bottom:0;box-sizing:border-box}
[data-mode="gradient"] .slide{position:absolute;inset:0;opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;padding:0;transition:opacity 0.6s cubic-bezier(0.32,0.72,0,1),transform 0.6s cubic-bezier(0.32,0.72,0,1);transform:scale(0.98);background:var(--bg);box-sizing:border-box;overflow:hidden}
[data-mode="gradient"] .slide.active{opacity:1;pointer-events:auto;transform:scale(1);z-index:2}
[data-mode="gradient"] .gradient-overlay{position:absolute;inset:0;opacity:1;pointer-events:none;z-index:0;transition:opacity 0.6s}
[data-mode="gradient"] .slide-inner{position:relative;z-index:1;overflow:hidden;box-sizing:border-box}
[data-mode="instant"] #deck{display:block;position:relative;overflow:hidden;padding-bottom:0;box-sizing:border-box}
[data-mode="instant"] .slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:0;background:var(--bg);box-sizing:border-box;overflow:hidden}
[data-mode="instant"] .slide.active{display:flex}
[data-mode="instant"] .gradient-overlay{display:none}
[data-mode="yoko"] .gradient-overlay{position:absolute;inset:0;opacity:0.35;pointer-events:none;z-index:0}
[data-mode="yoko"] .slide-inner{position:relative;z-index:1;overflow:hidden;box-sizing:border-box}
.slide-inner{position:relative;width:min(92vw, calc(92vh * ${_}));flex-shrink:0;aspect-ratio:${_};background:${U};box-shadow:0 20px 60px rgba(0,0,0,.15);border-radius:12px;overflow:hidden;border:1px solid ${p==="dark"?"#222":"#e5e7eb"};box-sizing:border-box;max-width:100%;word-break:break-word;overflow-wrap:break-word}
.controls{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:${p==="dark"?"rgba(20,20,20,.88)":"rgba(255,255,255,.92)"};backdrop-filter:blur(16px);padding:8px 12px;border-radius:999px;border:1px solid ${p==="dark"?"#333":"#e5e7eb"};z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.12);pointer-events:auto}
.mode-switch{display:flex;align-items:center;gap:2px;background:${p==="dark"?"#111":"#f3f4f6"};padding:3px;border-radius:999px;border:1px solid ${p==="dark"?"#222":"#e5e7eb"}}
.mode-btn{appearance:none;border:1px solid transparent;background:transparent;color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;gap:4px;transition:.2s;font-weight:500}
.mode-btn.active{background:${p==="dark"?"#222":"#fff"};border-color:${p==="dark"?"#333":"#e5e7eb"};box-shadow:0 2px 8px rgba(0,0,0,.08);color:var(--fg)}
.dot{width:6px;height:6px;border-radius:50%;background:${p==="dark"?"#444":"#d1d5db"};border:none;cursor:pointer;transition:.2s;flex-shrink:0}
.dot.active{background:var(--accent);transform:scale(1.35)}
.btn{appearance:none;border:1px solid ${p==="dark"?"#333":"#e5e7eb"};background:${p==="dark"?"#111":"#fff"};color:var(--fg);border-radius:999px;padding:8px 12px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--muted)}
.hint{position:fixed;top:16px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.7;background:${p==="dark"?"#111":"#fff"};padding:6px 14px;border-radius:999px;border:1px solid ${p==="dark"?"#222":"#e5e7eb"};z-index:50;display:flex;gap:12px;align-items:center;pointer-events:none}
.hint b{font-weight:600}
@media(max-width:700px){.slide-inner{width:min(96vw, calc(92vh * ${_}))}.hint{display:none}.mode-btn span.label{display:none}}
#progress,.controls,.hint{transition:opacity .3s}
body.ui-hidden #progress,body.ui-hidden .controls,body.ui-hidden .hint{opacity:0;pointer-events:none}
#laser{position:fixed;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:radial-gradient(circle,#fff 0 12%,#ff1a1a 30%,rgba(255,0,0,.55) 55%,rgba(255,0,0,0) 72%);box-shadow:0 0 14px 6px rgba(255,0,0,.45);pointer-events:none;z-index:10000;opacity:0;display:none;will-change:transform}
body.laser-on #laser{display:block}
body.laser-on,body.laser-on #deck{cursor:none}
body.laser-on .controls,body.laser-on .controls *{cursor:default}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:rgba(17,17,17,.82);color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;z-index:10001;opacity:0;pointer-events:none;transition:opacity .25s;white-space:nowrap}
.toast.show{opacity:1}
.btn.on{background:#ef4444;color:#fff;border-color:#ef4444}
.btn,.mode-btn{white-space:nowrap}

<body data-mode="${D}">
<div id="progress"></div>
<div class="hint"><b>表示:</b> <span id="modeLabel">${D}</span> • ← → / スワイプ / ホイール • F全画面 • L レーザー • H UI非表示 • ${t.length}枚</div>
<div id="deck" class="stage">${J}</div>
<div id="laser"></div>
<div id="toast" class="toast"></div>
<div class="controls">
<div class="mode-switch" id="modeSwitch">
<button class="mode-btn ${D==="yoko"?"active":""}" data-set-mode="yoko">↔ <span class="label">横スライド</span></button>
<button class="mode-btn ${D==="gradient"?"active":""}" data-set-mode="gradient">✨ <span class="label">グラデーション</span></button>
<button class="mode-btn ${D==="instant"?"active":""}" data-set-mode="instant">⚡ <span class="label">すぐ切り替え</span></button>
</div>
<div style="width:1px;height:18px;background:${p==="dark"?"#333":"#e5e7eb"}"></div>
<button class="btn" id="prev">◀</button>
<div id="dots" class="dots" style="display:flex;gap:6px;align-items:center"></div>
<button class="btn" id="next">▶</button>
<button class="btn" id="laserBtn" title="レーザーポインター (L)">🔴 L</button>
<button class="btn" id="uiBtn" title="操作UIの表示/非表示 (H)">隠す H</button>
<button class="btn" id="fs">全画面</button>
</div>
<script>
const deck=document.getElementById('deck');
const slides=[...document.querySelectorAll('.slide')];
const progress=document.getElementById('progress');
const dotsEl=document.getElementById('dots');
const modeLabel=document.getElementById('modeLabel');
const modeBtns=[...document.querySelectorAll('[data-set-mode]')];
let cur=0;
let curMode='${D}';
function makeDots(){
  dotsEl.innerHTML='';
  slides.forEach((_,i)=>{
    const d=document.createElement('button');
    d.className='dot'+(i===cur?' active':'');
    d.addEventListener('click',()=>go(i));
    dotsEl.appendChild(d);
  });
}
function applyMode(m){
  curMode=m;
  document.body.dataset.mode=m;
  modeLabel.textContent=m;
  modeBtns.forEach(b=>b.classList.toggle('active',b.dataset.setMode===m));
  if(m==='yoko'){
    slides.forEach(s=>{s.classList.remove('active');});
    // scroll to current
    requestAnimationFrame(()=>{deck.scrollTo({left:cur*deck.clientWidth,behavior:'auto'});});
  } else {
    slides.forEach((s,i)=>{s.classList.toggle('active',i===cur);});
  }
  update();
}
function go(i){
  cur=Math.max(0,Math.min(i,slides.length-1));
  if(curMode==='yoko'){
    deck.scrollTo({left:cur*deck.clientWidth,behavior:'smooth'});
  } else {
    slides.forEach((s,idx)=>s.classList.toggle('active',idx===cur));
  }
  update();
}
function update(){
  const p=((cur+1)/slides.length)*100;
  progress.style.width=p+'%';
  document.querySelectorAll('.dot').forEach((d,idx)=>d.classList.toggle('active',idx===cur));
}
deck.addEventListener('scroll',()=>{
  if(curMode!=='yoko') return;
  const n=Math.round(deck.scrollLeft/deck.clientWidth);
  if(n!==cur){cur=n;update();}
},{passive:true});
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('fs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();};
document.getElementById('modeSwitch').addEventListener('click',e=>{
  const btn=e.target.closest('[data-set-mode]');
  if(btn){applyMode(btn.dataset.setMode);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}
  if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}
});
let sx=0;
deck.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
deck.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>60){go(cur+(dx<0?1:-1));}
},{passive:true});
// wheel only for yoko
deck.addEventListener('wheel',e=>{
  if(curMode!=='yoko') return;
  if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){
    e.preventDefault();
    deck.scrollLeft+=e.deltaY;
  }
},{passive:false});
makeDots();
applyMode(curMode);
const controlsEl=document.querySelector('.controls');
const laserEl=document.getElementById('laser');
const toastEl=document.getElementById('toast');
let uiTimer=null,toastTimer=null,uiHidden=false,laserOn=false;
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1500);}
function showUI(){if(uiHidden)return;document.body.classList.remove('ui-hidden');clearTimeout(uiTimer);uiTimer=setTimeout(()=>{if(controlsEl.matches(':hover')){showUI();return;}document.body.classList.add('ui-hidden');},2500);}
function toggleUI(){uiHidden=!uiHidden;clearTimeout(uiTimer);if(uiHidden){document.body.classList.add('ui-hidden');toast('操作UIを非表示（Hで再表示）');}else{showUI();toast('操作UIを表示');}}
function toggleLaser(){laserOn=!laserOn;document.body.classList.toggle('laser-on',laserOn);document.getElementById('laserBtn').classList.toggle('on',laserOn);if(!laserOn)laserEl.style.opacity=0;toast(laserOn?'レーザーポインター ON（Lで解除）':'レーザーポインター OFF');}
document.getElementById('uiBtn').onclick=toggleUI;
document.getElementById('laserBtn').onclick=toggleLaser;
document.addEventListener('pointermove',e=>{
  if(laserOn){
    const over=e.target.closest&&e.target.closest('.controls');
    laserEl.style.opacity=over?0:1;
    laserEl.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';
    if(e.clientY>innerHeight-110)showUI();
  } else showUI();
},{passive:true});
document.addEventListener('mouseleave',()=>{laserEl.style.opacity=0;});
document.addEventListener('touchstart',()=>{if(!laserOn)showUI();},{passive:true});
document.addEventListener('click',()=>{if(!laserOn)showUI();},{passive:true});
document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='h')toggleUI();else if(k==='l')toggleLaser();else showUI();});
<\/script>
