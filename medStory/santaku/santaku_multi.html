<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>バイキンズ・バスター 30s — 精鋭3番勝負+</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","M PLUS Rounded 1c",sans-serif;
background:#080b18;color:#f8fafc;touch-action:manipulation;user-select:none}
button{font:inherit;-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:0;background:
radial-gradient(circle at 20% 10%,#302060 0,transparent 35%),
radial-gradient(circle at 90% 80%,#063c42 0,transparent 35%),
linear-gradient(135deg,#0b1024,#090b15 55%,#180d28);z-index:-2}
.wrap{width:min(100%,520px);height:100%;margin:auto;display:flex;flex-direction:column}
header{height:68px;display:flex;justify-content:space-between;align-items:center;padding:8px 14px;
background:rgba(10,14,30,.92);border-bottom:1px solid #29324a;backdrop-filter:blur(12px);z-index:5}
.stat{text-align:center;min-width:82px}.label{font-size:9px;color:#94a3b8;font-weight:900;letter-spacing:.12em}
.value{font-size:22px;font-weight:1000}.score{color:#fbbf24}.combo{color:#a78bfa}.timer{color:#fb7185}
main{flex:1;min-height:0;padding:12px;display:flex;flex-direction:column;justify-content:center}
.panel{background:rgba(15,20,39,.94);border:1px solid #303a59;border-radius:25px;box-shadow:0 20px 60px #0008;padding:18px}
.hidden{display:none!important}
h1,h2,p{margin:0}.title{text-align:center;font-size:27px;font-weight:1000;
background:linear-gradient(90deg,#fbbf24,#fb7185,#a78bfa);color:transparent;background-clip:text}
.sub{text-align:center;color:#cbd5e1;font-size:12px;margin:6px 0 14px}
.course-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.course{border:1px solid #3b4768;border-radius:17px;padding:12px;text-align:left;color:white;
background:linear-gradient(135deg,#18213d,#10152a);min-height:78px;cursor:pointer}
.course:active{transform:scale(.97)}
.course strong{display:block;font-size:16px}.course span{font-size:10px;color:#94a3b8}
.course.mix{grid-column:1/-1;background:linear-gradient(135deg,#4c1d95,#9f1239,#065f46)}
.course .emoji{font-size:22px;float:right}
.rules{margin-top:12px;background:#090d1c;border:1px solid #222b44;border-radius:16px;padding:11px;font-size:11px;color:#cbd5e1}
.rules b{color:#fbbf24}
.start-note{text-align:center;margin-top:12px;font-size:10px;color:#64748b}
.game{height:100%;display:flex;flex-direction:column;justify-content:space-between}
.card{position:relative;min-height:330px;border-radius:25px;padding:15px;
background:linear-gradient(145deg,#121932,#0d1121);border:2px solid #46527c;
display:flex;flex-direction:column;align-items:center;justify-content:space-between;
box-shadow:0 20px 50px #0008}
.badges{width:100%;display:flex;justify-content:space-between;gap:8px}
.badge{font-size:9px;font-weight:900;padding:5px 9px;border-radius:999px;background:#172036;border:1px solid #3b496b;color:#cbd5e1}
.avatar{width:155px;height:155px;display:flex;align-items:center;justify-content:center;animation:float 2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
.name{font-size:25px;font-weight:1000;text-align:center}
.desc{text-align:center;font-size:11px;color:#cbd5e1;margin-top:5px;background:#070b16;padding:7px 12px;border-radius:12px;border:1px solid #202a42}
.qtype{font-size:10px;color:#fbbf24;font-weight:900;background:#3b2508;padding:5px 10px;border-radius:999px;border:1px solid #76500e}
.question{text-align:center;font-size:14px;font-weight:900;margin:8px 0}
.answers{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.answer{border:1px solid #405070;border-radius:16px;padding:11px 12px;text-align:left;color:white;
background:linear-gradient(135deg,#1b2745,#121a30);cursor:pointer;min-height:54px}
.answer:active{transform:scale(.98)} .answer .ansmain{font-weight:1000;font-size:14px}.answer .anssub{font-size:9px;color:#94a3b8;margin-top:2px}
.feedback{position:fixed;left:50%;top:20%;transform:translateX(-50%);font-size:25px;font-weight:1000;z-index:20;opacity:0;pointer-events:none}
.feedback.show{animation:feed .55s ease-out}@keyframes feed{0%{opacity:0;transform:translate(-50%,20px) scale(.7)}30%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-45px) scale(1)}}
.result{text-align:center;max-height:94vh;overflow:auto}.result h2{color:#fbbf24;font-size:27px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}
.box{background:#090d1a;border:1px solid #27314a;border-radius:14px;padding:8px}.box small{font-size:9px;color:#64748b}.box b{display:block;font-size:20px}
.explain{text-align:left;background:#090d1a;border:1px solid #27314a;border-radius:16px;padding:12px;font-size:11px;color:#cbd5e1;line-height:1.6}
.explain h3{margin:0 0 7px;color:#fbbf24;font-size:13px}
.explain-item{padding:7px 8px;border-bottom:1px solid #1e293b}.explain-item:last-child{border-bottom:0}
.btn{width:100%;margin-top:12px;padding:13px;border:0;border-radius:16px;font-weight:1000;color:#090b14;
background:linear-gradient(90deg,#fbbf24,#fb7185);cursor:pointer}
.back{margin-top:8px;background:#182036;color:#cbd5e1;border:1px solid #34415f}
footer{text-align:center;font-size:9px;color:#475569;padding:5px}
.mini{font-size:9px;color:#64748b;text-align:center;margin-top:8px}
@media(max-height:700px){.card{min-height:275px}.avatar{width:120px;height:120px}.panel{padding:14px}.course{min-height:68px;padding:9px}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
<header>
  <div class="stat"><div class="label">SCORE</div><div id="score" class="value score">0</div></div>
  <div class="stat"><div class="label">TIME</div><div id="time" class="value timer">30.0</div></div>
  <div class="stat"><div class="label">COMBO</div><div id="combo" class="value combo">0</div></div>
</header>

<main>
<section id="start" class="panel">
  <div style="text-align:center;font-size:12px;color:#fbbf24;font-weight:900">🦠 バイキンズ × 医学知識</div>
  <h1 class="title">バイキンズ・バスター</h1>
  <div class="sub">30秒で、菌を「多面的」に見抜け！</div>

  <div class="course-grid">
    <button class="course" data-course="drug"><span class="emoji">💊</span><strong>抗菌薬</strong><span>この菌に使える薬は？</span></button>
    <button class="course" data-course="vaccine"><span class="emoji">💉</span><strong>ワクチン</strong><span>予防できるワクチンは？</span></button>
    <button class="course" data-course="precaution"><span class="emoji">🛡️</span><strong>感染対策</strong><span>接触・飛沫・空気？</span></button>
    <button class="course" data-course="disease"><span class="emoji">🏥</span><strong>疾患</strong><span>代表的な病気は？</span></button>
    <button class="course" data-course="class"><span class="emoji">🔬</span><strong>菌の種類</strong><span>GPC・GNR・非定型など</span></button>
    <button class="course mix" data-course="mix"><span class="emoji">🎯</span><strong>ミックス・コース</strong><span>全部ごちゃまぜ！何が問われるか分からない</span></button>
  </div>

  <div class="rules">
    <b>⚡ ルール</b><br>
    正解：+100pt ＋ コンボボーナス ＋0.5秒<br>
    不正解：コンボリセット・−2秒<br>
    <span style="color:#64748b">※学習用に単純化した問題です。実臨床では感染部位・重症度・感受性・耐性などを考慮します。</span>
  </div>
  <div class="start-note">コースを選ぶと30秒バトル開始</div>
</section>

<section id="game" class="game hidden">
  <div class="card" id="card">
    <div class="badges"><span id="badge" class="badge"></span><span id="tag" class="badge"></span></div>
    <div id="avatar" class="avatar"></div>
    <div>
      <div id="name" class="name"></div>
      <div id="desc" class="desc"></div>
    </div>
    <div id="qtype" class="qtype"></div>
    <div id="question" class="question"></div>
  </div>
  <div id="answers" class="answers"></div>
</section>

<section id="result" class="panel result hidden">
  <h2>タイムアップ！</h2>
  <div id="resultCourse" class="sub"></div>
  <div class="stats">
    <div class="box"><small>スコア</small><b id="resScore" style="color:#fbbf24">0</b></div>
    <div class="box"><small>正解数</small><b id="resCount" style="color:#34d399">0</b></div>
    <div class="box"><small>最大コンボ</small><b id="resCombo" style="color:#a78bfa">0</b></div>
  </div>
  <div id="rank" style="font-size:20px;font-weight:1000;color:#fb7185;margin-bottom:10px"></div>
  <div class="explain">
    <h3>📚 今回の学習ポイント</h3>
    <div id="explainList"></div>
  </div>
  <button id="retry" class="btn">もう一度挑戦</button>
  <button id="home" class="btn back">コース選択へ戻る</button>
</section>
</main>
<footer>バイキンズ・バスター © 感染症＆抗菌薬学習プロジェクト</footer>
<div id="feedback" class="feedback"></div>

const courseNames={drug:"💊 抗菌薬",vaccine:"💉 ワクチン",precaution:"🛡️ 感染対策",disease:"🏥 疾患",class:"🔬 菌の種類",mix:"🎯 ミックス"};
let course="mix",score=0,combo=0,maxCombo=0,count=0,time=30,current=null,timer=null,locked=false;
const $=id=>document.getElementById(id);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function pool(){
 if(course==="mix"){
   let out=[];Object.keys(Q).forEach(k=>Q[k].forEach(x=>out.push({...x,kind:k})));
   return out;
 }
 return Q[course].map(x=>({...x,kind:course}));
}
function newQuestion(){
 const p=pool(); let q=shuffle(p)[0];
 if(current) for(let i=0;i<10&&q[0]===current[0]&&p.length>1;i++) q=shuffle(p)[0];
 current=q;
 const b=B[q[0]]; $("badge").textContent=b.badge;$("tag").textContent=b.tag;
 $("name").textContent=b.name;$("desc").textContent=b.desc;$("avatar").innerHTML=b.svg;
 $("qtype").textContent=course==="mix"?"🎯 "+courseNames[q.kind]:"📚 "+courseNames[course];
 $("question").textContent=q[1];
 $("answers").innerHTML="";
 let answers=q[2].map((text,i)=>({text,i}));
 answers=shuffle(answers);
 answers.forEach(a=>{
   const btn=document.createElement("button");btn.className="answer";
   btn.innerHTML=`<div class="ansmain">${a.text}</div><div class="anssub">タップして回答</div>`;
   btn.onclick=()=>answer(a.i,q);
   $("answers").appendChild(btn);
 });
}
function answer(i,q){
 if(locked||time<=0)return;
 locked=true;
 const ok=i===q[3];
 if(ok){
   combo++;count++;maxCombo=Math.max(maxCombo,combo);
   const pts=100+(combo-1)*30;score+=pts;time=Math.min(30,time+.5);
   feedback(`+${pts}pt! +0.5秒`,"#34d399");
 }else{
   combo=0;time=Math.max(0,time-2);
   feedback("× 不正解　−2秒","#fb7185");
 }
 update();
 setTimeout(()=>{locked=false;if(time>0)newQuestion()},180);
}
function feedback(t,c){$("feedback").textContent=t;$("feedback").style.color=c;$("feedback").classList.remove("show");void $("feedback").offsetWidth;$("feedback").classList.add("show")}
function update(){$("score").textContent=score;$("combo").textContent=combo;$("time").textContent=time.toFixed(1)}
function start(c){
 course=c;score=0;combo=0;maxCombo=0;count=0;time=30;locked=false;
 $("start").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");
 update();newQuestion();clearInterval(timer);timer=setInterval(()=>{time-=.1;if(time<=0){time=0;end()}update()},100);
}
function end(){
 clearInterval(timer);timer=null;$("game").classList.add("hidden");$("result").classList.remove("hidden");
 $("resultCourse").textContent=courseNames[course]+"｜30秒間の結果";
 $("resScore").textContent=score;$("resCount").textContent=count;$("resCombo").textContent=maxCombo;
 let rank=score>=3000?"S+｜感染症・抗菌薬マスター":score>=2000?"S｜バイキンズ精鋭隊":score>=1200?"A｜防衛隊リーダー":score>=600?"B｜一般隊員":"C｜見習い隊員";
 $("rank").textContent=rank;
 const items=shuffle(pool()).slice(0,Math.min(5,pool().length));
 $("explainList").innerHTML=items.map(q=>`<div class="explain-item"><b style="color:#a78bfa">${B[q[0]].name}</b>：${q[4]}<br><span>${q[5]}</span></div>`).join("");
}
document.querySelectorAll(".course").forEach(b=>b.onclick=()=>start(b.dataset.course));
$("retry").onclick=()=>start(course);
$("home").onclick=()=>{$("result").classList.add("hidden");$("start").classList.remove("hidden")};
update();
</script>
