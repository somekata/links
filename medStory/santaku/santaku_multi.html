<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>バイキンズ・バスター 30s</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.app{max-width:620px;margin:auto;min-height:100vh;padding:16px}.screen{display:none}.active{display:block}
.card{background:#1f2937;border:1px solid #374151;border-radius:22px;padding:20px;box-shadow:0 12px 35px #0005}
h1,h2{margin-top:0}.title{text-align:center;font-size:30px;font-weight:900;margin:20px 0 8px}.sub{text-align:center;color:#cbd5e1;margin-bottom:20px}
.grid{display:grid;gap:12px}.course,.level{border:2px solid #374151;background:#111827;color:#fff;border-radius:17px;padding:16px;text-align:left;cursor:pointer}
.course:hover,.level:hover{border-color:#60a5fa}.course b,.level b{display:block;font-size:19px;margin-bottom:4px}.course span,.level span{color:#cbd5e1;font-size:13px}
.beginner{border-color:#22c55e}.middle{border-color:#eab308}.advanced{border-color:#ef4444}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.pill{background:#374151;border-radius:99px;padding:6px 9px;font-size:12px;font-weight:800}.timer{font-size:27px;font-weight:900;color:#fbbf24}
.bar{height:8px;background:#374151;border-radius:99px;overflow:hidden;margin-bottom:15px}.bar i{display:block;height:100%;width:100%;background:#f59e0b}
.stats{display:flex;justify-content:space-between;color:#cbd5e1;font-size:14px;margin-bottom:10px}
.bacteria{background:linear-gradient(135deg,#312e81,#581c87);border-radius:22px;padding:22px;text-align:center}.emoji{font-size:68px}.name{font-size:27px;font-weight:900}.hint{color:#ddd6fe;margin-top:4px}
.choices{display:grid;gap:11px;margin-top:18px}.choice{background:#f8fafc;color:#111827;border:0;border-radius:15px;padding:16px;font-weight:900;min-height:60px;cursor:pointer;box-shadow:0 4px #94a3b8}.choice:active{transform:translateY(2px);box-shadow:0 2px #94a3b8}.correct{background:#86efac!important}.wrong{background:#fca5a5!important}
.feedback{text-align:center;height:35px;padding-top:7px;font-size:20px;font-weight:900}
.back{width:100%;margin-top:12px;border:1px solid #4b5563;background:#1f2937;color:#fff;border-radius:13px;padding:12px;cursor:pointer}
.result{text-align:center}.score{font-size:58px;font-weight:1000;color:#fbbf24}.rank{font-size:23px;font-weight:900;margin:5px 0 18px}.learn{text-align:left;background:#111827;border-radius:15px;padding:14px}.learn li{margin:8px 0}.badge{display:inline-block;background:#374151;border-radius:99px;padding:4px 9px;font-size:12px}.small{text-align:center;color:#9ca3af;font-size:11px;margin:14px 0}
</style>
</head>
<body>
<div class="app">

<section id="courseScreen" class="screen active">
<div class="title">🦠 バイキンズ・バスター</div>
<div class="sub">30秒・3択で「知っている」を「答えられる」に。</div>
<div class="card"><h2>① コースを選ぶ</h2><div class="grid">
<button class="course" data-course="drug"><b>💊 抗菌薬</b><span>この菌には、どの抗菌薬？</span></button>
<button class="course" data-course="vaccine"><b>💉 ワクチン</b><span>この病原体には、どのワクチン？</span></button>
<button class="course" data-course="precaution"><b>🛡️ 感染対策</b><span>感染経路別予防策は？</span></button>
<button class="course" data-course="disease"><b>🏥 疾患</b><span>この菌が代表的に起こす疾患は？</span></button>
<button class="course" data-course="class"><b>🔬 菌の種類</b><span>この微生物は何に分類される？</span></button>
<button class="course" data-course="mix"><b>🎯 ミックス</b><span>全部入り。何が出るかはお楽しみ。</span></button>
</div></div>
</section>

<section id="levelScreen" class="screen">
<div class="title">⚔️ 難易度を選ぶ</div><div class="sub" id="selectedCourse"></div>
<div class="card"><div class="grid">
<button class="level beginner" data-level="beginner"><b>🟢 初級</b><span>3菌・組み合わせ固定・選択肢の位置も固定。まず基本を覚える。</span></button>
<button class="level middle" data-level="middle"><b>🟡 中級</b><span>同じ3菌・同じ正解だが、選択肢の位置だけシャッフル。</span></button>
<button class="level advanced" data-level="advanced"><b>🔴 上級</b><span>出題菌・組み合わせ・選択肢の位置が変化。実力勝負。</span></button>
</div><button class="back" id="backCourse">← コース選択へ</button></div>
</section>

<section id="gameScreen" class="screen">
<div class="top"><div><span class="pill" id="coursePill"></span> <span class="pill" id="levelPill"></span></div><div class="timer">⏱ <span id="time">30.0</span></div></div>
<div class="bar"><i id="timebar"></i></div>
<div class="stats"><span>Score <b id="score">0</b></span><span>Combo <b id="combo">0</b></span><span>Best <b id="bestCombo">0</b></span></div>
<div class="bacteria"><div class="emoji" id="bugEmoji">🦠</div><div class="name" id="bugName"></div><div class="hint" id="bugHint"></div></div>
<div class="choices" id="choices"></div><div class="feedback" id="feedback"></div>
<button class="back" id="quit">■ ゲームを終了</button>
</section>

<section id="resultScreen" class="screen">
<div class="card result"><div class="badge" id="resultLevel"></div><h2>TIME UP!</h2>
<div class="score" id="finalScore">0</div><div>points</div><div class="rank" id="rank"></div>
<div class="stats"><span>正解 <b id="correctCount">0</b></span><span>最大Combo <b id="maxCombo">0</b></span></div>
<div class="learn"><b>📚 今日の学び</b><ul id="learning"></ul></div>
<button class="back" id="again">同じ難易度でもう一度</button>
<button class="back" id="changeLevel">難易度を変える</button>
<button class="back" id="changeCourse">コースを変える</button>
</div></section>
<p class="small">※教育用の簡略化です。実際の診療では感染部位、重症度、薬剤感受性、患者背景などを考慮します。</p>
</div>

<script>
const CN={drug:"💊 抗菌薬",vaccine:"💉 ワクチン",precaution:"🛡️ 感染対策",disease:"🏥 疾患",class:"🔬 菌の種類",mix:"🎯 ミックス"};
const LN={beginner:"🟢 初級",middle:"🟡 中級",advanced:"🔴 上級"};
const DB={
drug:[
["肺炎球菌王","👑🦠","GPC・莢膜","ペニシリンG",["ペニシリンG","セフタジジム","アジスロマイシン"],"肺炎球菌ではペニシリン系が代表的な選択肢。"],
["リョクノーキン","🟢🦠","Pseudomonas aeruginosa","セフタジジム",["ペニシリンG","セフタジジム","アジスロマイシン"],"緑膿菌には抗緑膿菌活性をもつ薬剤を選ぶ。"],
["マイコプラズマ姫","👸🦠","細胞壁をもたない","アジスロマイシン",["ペニシリンG","セフタジジム","アジスロマイシン"],"マイコプラズマは細胞壁をもたない。"],
["MRSA","🛡️🦠","メチシリン耐性黄色ブドウ球菌","バンコマイシン",["バンコマイシン","アモキシシリン","セフタジジム"],"MRSAではバンコマイシンなどが代表的な選択肢。"],
["レジオネラ","🌊🦠","細胞内増殖","アジスロマイシン",["アジスロマイシン","ペニシリンG","セファゾリン"],"レジオネラでは細胞内移行性を考えた治療が重要。"]],
vaccine:[
["肺炎球菌王","👑🦠","莢膜をもつ","PCV",["PCV","Hibワクチン","MenACWY"],"肺炎球菌の予防にはPCVが用いられる。"],
["Hib","🦠🎩","Haemophilus influenzae type b","Hibワクチン",["PCV","Hibワクチン","MenACWY"],"Hibワクチンで侵襲性感染症を予防する。"],
["髄膜炎菌","🧠🦠","Neisseria meningitidis","MenACWY",["PCV","Hibワクチン","MenACWY"],"髄膜炎菌にはMenACWYワクチンがある。"],
["インフルエンザ","🤧🦠","呼吸器感染症","インフルエンザワクチン",["インフルエンザワクチン","PCV","Hibワクチン"],"インフルエンザはワクチンによる予防が行われる。"],
["帯状疱疹","🔥🦠","水痘・帯状疱疹ウイルス","帯状疱疹ワクチン",["帯状疱疹ワクチン","MenACWY","PCV"],"帯状疱疹にはワクチンによる予防がある。"]],
precaution:[
["MRSA","🛡️🦠","接触で伝播しうる","接触予防策",["接触予防策","飛沫予防策","空気予防策"],"MRSAでは接触を介した伝播を考える。"],
["インフルエンザ","🤧🦠","呼吸器飛沫","飛沫予防策",["接触予防策","飛沫予防策","空気予防策"],"インフルエンザでは飛沫予防策を基本に考える。"],
["結核菌","🫁🦠","空気感染","空気予防策",["接触予防策","飛沫予防策","空気予防策"],"結核では空気予防策が重要。"],
["髄膜炎菌","🧠🦠","呼吸器分泌物","飛沫予防策",["接触予防策","飛沫予防策","空気予防策"],"髄膜炎菌では飛沫を考慮した予防策が重要。"],
["ノロウイルス","🤢🦠","嘔吐・下痢","接触予防策",["接触予防策","飛沫予防策","空気予防策"],"ノロウイルスでは接触を介した伝播を防ぐ。"]],
disease:[
["ウェルシュ菌","💨🦠","Clostridium perfringens","ガス壊疽",["ガス壊疽","咽頭炎","膀胱炎"],"Clostridium perfringensはガス壊疽の代表的原因菌。"],
["A群溶連菌","🔴🦠","Streptococcus pyogenes","咽頭炎",["ガス壊疽","咽頭炎","膀胱炎"],"A群溶血性レンサ球菌は咽頭炎の代表的原因菌。"],
["大腸菌","🧫🦠","Escherichia coli","膀胱炎",["ガス壊疽","咽頭炎","膀胱炎"],"大腸菌は膀胱炎の代表的原因菌。"],
["肺炎球菌","👑🦠","Streptococcus pneumoniae","肺炎",["肺炎","髄膜炎","膀胱炎"],"肺炎球菌は肺炎、中耳炎、髄膜炎などを起こす。"],
["髄膜炎菌","🧠🦠","Neisseria meningitidis","髄膜炎",["肺炎","髄膜炎","膀胱炎"],"髄膜炎菌は髄膜炎や敗血症を起こす。"]],
class:[
["肺炎球菌王","👑🦠","Streptococcus pneumoniae","グラム陽性球菌",["グラム陽性球菌","グラム陰性桿菌","細胞壁をもたない"],"肺炎球菌はグラム陽性球菌（GPC）。"],
["肺炎桿菌","🫘🦠","Klebsiella pneumoniae","グラム陰性桿菌",["グラム陽性球菌","グラム陰性桿菌","細胞壁をもたない"],"Klebsiella pneumoniaeはグラム陰性桿菌（GNR）。"],
["クラミジア","🧬🦠","細胞内寄生性","細胞壁をもつ典型菌とは異なる",["グラム陽性球菌","グラム陰性桿菌","細胞壁をもつ典型菌とは異なる"],"クラミジアは典型的な細菌とは異なる特徴をもつ。"],
["緑膿菌","🟢🦠","Pseudomonas aeruginosa","グラム陰性桿菌",["グラム陽性球菌","グラム陰性桿菌","細胞壁をもたない"],"緑膿菌はグラム陰性桿菌（GNR）。"],
["マイコプラズマ","👸🦠","Mycoplasma pneumoniae","細胞壁をもたない",["グラム陽性球菌","グラム陰性桿菌","細胞壁をもたない"],"マイコプラズマは細胞壁をもたない。"]]};
const A=x=>({bug:x[0],emoji:x[1],hint:x[2],a:x[3],opts:x[4],learn:x[5]});
Object.keys(DB).forEach(k=>DB[k]=DB[k].map(A));
let fixed={},course="drug",level="beginner",time=30,score=0,combo=0,maxCombo=0,correct=0,queue=[],qi=0,current=null,timer=null,locked=false;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
clearInterval(timer);score=combo=maxCombo=correct=qi=0;time=30;locked=false;
if(course==="mix"){fixed.mix=sh(Object.values(DB).flat()).slice(0,3)}
queue=level==="advanced"?[]:fixed[course].map(x=>({...x}));
$("coursePill").textContent=CN[course];$("levelPill").textContent=LN[level];show("gameScreen");render();timer=setInterval(tick,100)}
function tick(){time=Math.max(0,time-.1);$("time").textContent=time.toFixed(1);$("timebar").style.width=time/30*100+"%";if(time<=0)finish()}
function render(){
locked=false;
current=level==="advanced"?sh(course==="mix"?Object.values(DB).flat():DB[course])[0]:queue[qi++%queue.length];
$("bugEmoji").textContent=current.emoji;$("bugName").textContent=current.bug;$("bugHint").textContent=current.hint;$("feedback").textContent="";
let opts=level==="beginner"?current.opts:sh(current.opts);$("choices").innerHTML="";
opts.forEach(o=>{let b=document.createElement("button");b.className="choice";b.textContent=o;b.onclick=()=>answer(o,b);$("choices").appendChild(b)})
}
function answer(o,b){
if(locked)return;locked=true;let ok=o===current.a;
if(ok){combo++;correct++;maxCombo=Math.max(maxCombo,combo);score+=100+(combo-1)*20;time=Math.min(30,time+.5);b.classList.add("correct");$("feedback").textContent="⭕ 正解！ +100"}
else{combo=0;time=Math.max(0,time-2);b.classList.add("wrong");$("feedback").textContent="❌ ちがう！ −2秒";document.querySelectorAll(".choice").forEach(x=>{if(x.textContent===current.a)x.classList.add("correct")})}
$("score").textContent=score;$("combo").textContent=combo;$("bestCombo").textContent=maxCombo;
setTimeout(()=>time>0?render():finish(),380)}
function finish(){
clearInterval(timer);show("resultScreen");$("resultLevel").textContent=CN[course]+" × "+LN[level];$("finalScore").textContent=score;$("correctCount").textContent=correct;$("maxCombo").textContent=maxCombo;
$("rank").textContent=score>=1800?"🏆 バイキンズマスター":score>=1100?"🥇 精鋭":score>=600?"🥈 研究員":"🥉 研修中";
let p=course==="mix"?Object.values(DB).flat():DB[course];$("learning").innerHTML=sh(p).slice(0,3).map(x=>"<li>"+x.learn+"</li>").join("")}
document.querySelectorAll(".course").forEach(b=>b.onclick=()=>{course=b.dataset.course;if(!fixed[course])fixed[course]=sh(course==="mix"?Object.values(DB).flat():DB[course]).slice(0,3);$("selectedCourse").textContent=CN[course];show("levelScreen")});
document.querySelectorAll(".level").forEach(b=>b.onclick=()=>{level=b.dataset.level;start()});
$("backCourse").onclick=()=>show("courseScreen");$("quit").onclick=()=>{clearInterval(timer);show("levelScreen")};$("again").onclick=start;$("changeLevel").onclick=()=>show("levelScreen");$("changeCourse").onclick=()=>show("courseScreen");
</script>
</body></html>
