
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>バイキンズバトル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Antique&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f1e8; --ink:#2b2622; --sub:#6b6257; --card:#fffdf7; --line:#d9d0bd;
  --accent:#b8402f; --good:#2e7d4f; --warn:#c88a12; --bad:#b3261e; --blue:#2f5d8a;
  --sBg:#dff1e4; --sFg:#1d5a37; --rBg:#f8dcd8; --rFg:#8f1d16; --uBg:#ece7da;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
html[data-fs="l"]{font-size:18.5px}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","BIZ UDPGothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;line-height:1.55;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
i{font-style:italic}
h1,h2,h3{margin:0}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"hd" "mn" "nv";max-width:1320px;margin:0 auto;background:var(--bg)}

/* header */
header{grid-area:hd;background:var(--card);border-bottom:2px solid var(--line);padding:calc(var(--safe-t) + 6px) 12px 8px}
.hd-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:"Zen Antique","Noto Sans JP",serif;font-size:1.15rem;font-weight:700;color:var(--accent);letter-spacing:.03em;white-space:nowrap}
.rank{font-size:.78rem;color:var(--sub);white-space:nowrap}
.bacs{font-weight:900;background:#fff4d6;border:1.5px solid #e2c36a;border-radius:999px;padding:2px 12px;white-space:nowrap}
.hd-stats{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:6px}
.chip{font-size:.85rem;font-weight:700;white-space:nowrap}
.chip small{font-weight:400;color:var(--sub);margin-right:3px}
.hpwrap{flex:1 1 170px;min-width:150px;display:flex;align-items:center;gap:6px}
.hpwrap b{font-size:.85rem;white-space:nowrap;min-width:5.2em}
.bar{flex:1;height:14px;border-radius:7px;background:#e6dfcd;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--good);transition:width .25s}
.bar.mid>i{background:var(--warn)} .bar.low>i{background:var(--bad)}
.bar.press>i{background:linear-gradient(90deg,#8bb87a,#e6b84a,#c9463a)}
.pressw{display:flex;align-items:center;gap:6px;flex:0 1 190px;min-width:130px}
.pressw small{font-size:.75rem;color:var(--sub);white-space:nowrap}

/* main + nav */
main{grid-area:mn;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:auto}
nav{grid-area:nv;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:2px solid var(--line);padding-bottom:var(--safe-b)}
nav button{border:0;background:transparent;min-height:58px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:700;font-size:.82rem;color:var(--sub)}
nav button span{font-size:1.35rem;line-height:1}
nav button[aria-selected="true"]{color:var(--accent);background:#fbeee6;box-shadow:inset 0 3px 0 var(--accent)}
.panel{padding:12px 12px 8px}
.panel[hidden]{display:none}
@media (min-width:900px){
  #app{grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"hd" "nv" "mn"}
  nav{grid-template-columns:repeat(4,minmax(0,170px));border-top:0;border-bottom:2px solid var(--line);padding:0 12px;gap:6px}
  nav button{flex-direction:row;gap:8px;min-height:48px;font-size:1rem}
  nav button[aria-selected="true"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .panel{padding:16px 16px 8px}
  .logo{font-size:1.4rem}
}

/* cards */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px}
.card h3{font-size:1rem;margin-bottom:8px;color:var(--accent)}
.sec{margin-top:14px}
.sec>h3{font-size:.95rem;margin:0 0 6px;color:var(--ink);display:flex;align-items:center;gap:6px}
.sec>h3 small{font-weight:400;color:var(--sub)}

/* play : 1画面に収める（スクロール最小化） */
body.on-play footer{display:none}
#p-play{height:100%;padding:6px 8px}
#playRoot{height:100%}
.play-grid{display:grid;gap:6px;height:100%;grid-template-rows:auto minmax(0,1fr)}
.act{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.act .sec{margin-top:0}
.act .sec>h3{font-size:.8rem;margin:0 0 3px}
@media (min-width:700px) and (min-height:380px){
  #p-play{padding:10px 12px}
  .play-grid{grid-template-columns:minmax(300px,5fr) 7fr;grid-template-rows:minmax(0,1fr);gap:12px}
  .ecard{display:flex;flex-direction:column;overflow-y:auto}
  .ecard .ehead{flex-direction:column;text-align:center}
  .ecard .eart{width:min(46%,26dvh,200px)}
  .ecard .hpline{justify-content:center}
  .ecard .banner{margin-top:auto}
}
.ecard{position:relative;padding:8px 10px;min-height:0}
.ecard.hit{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.ecard.hit{animation:none}.bar>i{transition:none}}
.ehead{display:flex;gap:8px;align-items:center}
.eart{flex:0 0 auto;width:clamp(58px,12dvh,104px);position:relative}
.eart svg{width:100%;height:auto;display:block}
.spr{position:relative;width:100%;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.spr img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:auto;user-select:none;-webkit-user-drag:none}
.spr-none img{filter:brightness(0) opacity(.42)}
.spr-gram img{filter:brightness(0) opacity(.8) drop-shadow(0 0 0 var(--gc)) drop-shadow(0 0 6px var(--gc))}
.spr .qm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:900;color:#fff;text-shadow:0 1px 4px #0006}
.spr .crown{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:1.3rem}
.spr.boss img{filter:drop-shadow(0 0 8px #b3261e88)}
.spr.boss.spr-none img{filter:brightness(0) opacity(.42) drop-shadow(0 0 8px #b3261e88)}
.spr.hurt img{animation:wob .5s infinite alternate}
@keyframes wob{from{transform:rotate(-4deg)}to{transform:rotate(4deg) translateY(2px)}}

.einfo{flex:1;min-width:0}
.ename{font-weight:900;font-size:1.15rem;line-height:1.3}
.ename .la{display:block;font-weight:400;font-size:.8rem;color:var(--sub)}
.esub{font-size:.8rem;color:var(--sub);margin:2px 0 4px}
.hpline{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:700}
.hpline .bar{height:12px}
.pipe{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0 0}
.pipe span{font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--uBg);color:var(--sub);font-weight:700}
.pipe span.on{background:var(--sBg);color:var(--sFg)}
.scn{font-size:.85rem;background:#faf3e0;border-left:4px solid #e2c36a;padding:6px 8px;margin:8px 0;border-radius:4px}
.srgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px}
.sr{border-radius:8px;text-align:center;padding:3px 2px;background:var(--uBg);color:var(--sub);border:1.5px solid transparent;min-height:46px;display:flex;flex-direction:column;justify-content:center}
.sr b{display:block;font-size:.72rem;line-height:1.15}
.sr span{font-size:1.05rem;font-weight:900;line-height:1.2}
.sr.S{background:var(--sBg);color:var(--sFg);border-color:#9cd0ae}
.sr.R{background:var(--rBg);color:var(--rFg);border-color:#e6a69f}
.kv{font-size:.82rem;color:var(--sub);margin-top:8px;display:grid;gap:2px}
.kv b{color:var(--ink)}
.banner{margin-top:8px;font-size:.92rem;font-weight:700;min-height:2.6em;background:#fff;border:1.5px dashed var(--line);border-radius:8px;padding:5px 8px}
.banner .ok{color:var(--sFg)} .banner .ng,.banner .bad{color:var(--rFg)}

.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dbtn{position:relative;min-height:56px;border:1.5px solid var(--line);border-left:7px solid var(--good);background:#fff;border-radius:10px;padding:6px 8px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.dbtn.W{border-left-color:var(--warn)} .dbtn.R{border-left-color:var(--bad)}
.dbtn .dn{font-weight:700;font-size:.88rem;line-height:1.25}
.dbtn .dm{font-size:.74rem;color:var(--sub);display:flex;justify-content:space-between;gap:6px}
.dbtn .dm b{color:var(--ink);font-size:.85rem}
.dbtn:active{background:#fbeee6}
.dbtn.zero{opacity:.45}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tbtn{min-height:50px;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:5px 8px;text-align:left;display:flex;flex-direction:column;justify-content:center}
.tbtn .tn{font-weight:700;font-size:.88rem;line-height:1.25}
.tbtn .tm{font-size:.72rem;color:var(--sub);display:flex;justify-content:space-between;gap:4px}
.tbtn.done{background:var(--sBg);border-color:#9cd0ae}
.tbtn.zero{opacity:.45}
.tbtn:active{background:#fbeee6}
.log{height:9rem;overflow-y:auto;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:.88rem}
.log p{margin:2px 0}
.log .ok{color:var(--sFg)} .log .ng,.log .bad{color:var(--rFg)} .log .info{color:var(--blue)}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
.tag{display:inline-block;min-width:1.4em;text-align:center;border-radius:4px;font-size:.7rem;font-weight:900;color:#fff;background:var(--good);padding:0 4px}
.tag.W{background:var(--warn)} .tag.R{background:var(--bad)}

/* stat / shop / misc */
.pill{display:inline-block;font-size:.8rem;border-radius:999px;padding:1px 10px;background:var(--uBg);font-weight:700}
.awbar{display:flex;height:22px;border-radius:11px;overflow:hidden;border:1px solid var(--line);background:#e6dfcd;margin:6px 0}
.awbar i{display:block;height:100%}
.awbar .A{background:var(--good)} .awbar .W{background:var(--warn)} .awbar .R{background:var(--bad)}
.twrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:10px;background:#fff;max-height:22rem;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:5px 8px;border-bottom:1px solid #eee6d3;text-align:center;white-space:nowrap}
th{background:#f3ecd9;position:sticky;top:0;z-index:1}
td.l,th.l{text-align:left}
.abt td.S{background:var(--sBg);color:var(--sFg);font-weight:900}
.abt td.R{background:var(--rBg);color:var(--rFg);font-weight:900}
.abt td.l{position:sticky;left:0;background:#fffdf7;z-index:1}
.two{display:grid;gap:12px}
@media (min-width:760px){.two{grid-template-columns:1fr 1fr}}
.shop{display:grid;gap:8px}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;min-height:52px}
.srow .nm{font-weight:700;font-size:.92rem;line-height:1.3}
.srow .ds{font-size:.76rem;color:var(--sub);font-weight:400;display:block}
.srow .pr{font-weight:900;white-space:nowrap}
.buy{min-height:44px;min-width:76px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:900}
.buy:disabled{background:#c9c2b2}
@media (min-width:760px){.shop{grid-template-columns:1fr 1fr}.shop .full{grid-column:1/-1}}
.btn{min-height:46px;padding:8px 18px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:700}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.sec2{background:#fff}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.prose p{margin:.5em 0}
.prose ul{margin:.4em 0;padding-left:1.3em}
.prose li{margin:.25em 0}
details{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
summary{font-weight:700;cursor:pointer;min-height:36px;display:flex;align-items:center}
.note{font-size:.8rem;color:var(--sub)}
.meter{font-size:.85rem}

/* overlay + toast */
.ov{position:fixed;inset:0;background:rgba(43,38,34,.55);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;overflow-y:auto}
.ov[hidden]{display:none}
.ovbox{background:var(--card);border-radius:18px;border:2px solid var(--accent);padding:18px 16px;width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.ovbox h2{font-family:"Zen Antique","Noto Sans JP",serif;font-size:1.45rem;color:var(--accent);margin-bottom:6px}
.ovbox .big{font-size:2.2rem;text-align:center}
.bd{margin:8px 0;border-top:1px dashed var(--line)}
.bd div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:.95rem}
.bd .tot{font-weight:900;border-top:2px solid var(--line);margin-top:3px;padding-top:6px}
.teach{background:#eef4fb;border-left:5px solid var(--blue);border-radius:6px;padding:8px 10px;margin:10px 0;font-size:.92rem}
.warnbox{background:#fff0d8;border-left:5px solid var(--warn);border-radius:6px;padding:8px 10px;margin:10px 0;font-size:.92rem}
.ovbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ovbtns .btn{flex:1 1 140px}
#toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 76px);transform:translateX(-50%);background:#2b2622;color:#fff;padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:60;max-width:92vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:.95}
@media (min-width:900px){#toast{bottom:24px}}

footer{margin:18px 0 6px;padding:12px;border-top:1px solid var(--line);font-size:.75rem;color:var(--sub);text-align:center;line-height:1.6}
.pad{padding:0 12px}
@media (min-width:900px){.pad{padding:0 16px}}

/* aura（MRSA・MRMPなど特別な耐性株） */
.spr.aura::before{content:'';position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(circle,rgba(255,59,48,.45) 0,rgba(255,59,48,.18) 48%,rgba(255,59,48,0) 72%);animation:auraP 1.3s ease-in-out infinite alternate;pointer-events:none}
.spr.aura img{filter:drop-shadow(0 0 5px #ff3b30) drop-shadow(0 0 12px rgba(255,59,48,.7))}
@keyframes auraP{from{transform:scale(.88);opacity:.65}to{transform:scale(1.08);opacity:1}}
@media (prefers-reduced-motion:reduce){.spr.aura::before{animation:none}}
.spr .fb{display:block;width:100%}
.spr .fb[hidden]{display:none}
.eart.wide{width:clamp(84px,17dvh,150px)}
.eart.wide .spr{aspect-ratio:4/3}
@media (min-width:700px) and (min-height:380px){.ecard .eart.wide{width:min(72%,34dvh,300px)}}
@media (max-width:699px) and (max-height:740px){.eart.wide{width:88px}}
@media (max-height:520px) and (min-width:700px){.ecard .eart.wide{width:min(40%,24dvh,130px)}}
/* compact overrides */
.ename{font-size:1rem}
.ename .la{display:inline;margin-left:6px;font-size:.72rem}
.esub{font-size:.72rem;margin:0 0 2px}
.scn{font-size:.74rem;line-height:1.35;margin:5px 0;padding:3px 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srgrid{grid-template-columns:repeat(4,1fr);gap:3px;margin-top:3px}
.sr{flex-direction:row;align-items:center;justify-content:space-between;min-height:26px;padding:1px 6px;border-radius:6px}
.sr b{display:inline;font-size:.66rem}
.sr span{font-size:.85rem}
.pipe{gap:3px;margin:5px 0 0}
.pipe span{font-size:.64rem;padding:0 6px}
.banner{display:block;width:100%;text-align:left;font-size:.78rem;min-height:2.9em;max-height:3.2em;overflow:hidden;margin-top:5px;padding:3px 7px;line-height:1.35;color:inherit}
.dgrid{grid-template-columns:repeat(4,1fr);gap:4px}
.dbtn{min-height:clamp(40px,6.2dvh,60px);padding:3px 5px;border-left-width:5px}
.dbtn .dn{font-size:.8rem}
.dbtn .dm{font-size:.62rem}
.dbtn .dm .fn{display:none}
.dbtn .dm{justify-content:flex-end}
.dbtn .dm b{font-size:.78rem}
.tgrid{grid-template-columns:repeat(5,1fr);gap:4px}
.tbtn{min-height:clamp(38px,5.6dvh,56px);padding:2px 4px}
.tbtn .tn{font-size:.7rem;line-height:1.15}
.tbtn .tm{font-size:.6rem}
.tbtn.heal{border-color:#e6a69f;background:#fff7f5}
@media (min-width:700px){
  .dgrid{grid-template-columns:repeat(4,1fr)}
  .dbtn .dm .fn{display:inline;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .dbtn .dm{justify-content:space-between}
  .dbtn .dn{font-size:.95rem} .dbtn .dm{font-size:.68rem}
  .tbtn .tn{font-size:.8rem} .tbtn .tm{font-size:.66rem}
  .sr b{font-size:.74rem}
  .ename{font-size:1.15rem} .scn{font-size:.82rem}
  .banner{font-size:.88rem}
  .pipe span{font-size:.72rem}
  .tgrid{grid-template-columns:repeat(5,1fr)}
}
@media (max-width:420px){.logo{font-size:1rem}.rank{display:none}.bacs{padding:1px 8px;font-size:.85rem}}
/* ヘッダ/ナビを低く */
header{padding:calc(var(--safe-t) + 3px) 10px 4px}
.hd-stats{margin-top:2px;gap:2px 10px}
.chip{font-size:.78rem}
.hpwrap{flex:1 1 130px;min-width:110px}.hpwrap b{font-size:.78rem;min-width:4.6em}
.bar{height:11px}
.pressw{flex:0 1 150px;min-width:100px}
nav button{min-height:46px}
nav button span{font-size:1.15rem}
@media (max-height:520px){
  .logo,.rank{display:none}
  nav button{min-height:38px;flex-direction:row;gap:6px;font-size:.78rem}
  nav button span{font-size:1rem}
}

.dgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
.tgrid{grid-template-columns:repeat(5,minmax(0,1fr))}
.dbtn,.tbtn,.sr{min-width:0}
.dbtn .dm .fn{min-width:0}
@media (max-width:699px) and (max-height:740px){
  .act .sec>h3{display:none}
  .esub{display:none}
  .scn{-webkit-line-clamp:1;margin:3px 0}
  .dbtn{min-height:36px}
  .tbtn{min-height:34px}
  .banner{min-height:2.4em;margin-top:3px}
  .play-grid,.act{gap:4px}
  .eart{width:56px}
}
@media (max-height:520px) and (min-width:700px){
  .ecard .ehead{flex-direction:row;text-align:left}
  .ecard .eart{width:min(30%,18dvh,90px)}
  .ecard .hpline{justify-content:flex-start}
  .scn{-webkit-line-clamp:1}
  .ename .la{display:none}
  .ecard{padding:5px 8px}
  .act .sec>h3{display:none}
  .dbtn,.tbtn{min-height:34px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hd-top">
      <div class="logo">バイキンズバトル</div>
      <div class="rank" id="hRank"></div>
      <div class="bacs" id="hBacs"></div>
    </div>
    <div class="hd-stats">
      <div class="chip" id="hLv"></div>
      <div class="chip" id="hLife"></div>
      <div class="hpwrap"><b id="hHpTxt"></b><div class="bar" id="hHpBar"><i></i></div></div>
      <div class="chip" id="hScore"></div>
      <div class="chip" id="hExp"></div>
      <div class="pressw" title="広域抗菌薬を使うほど上がり、耐性菌が出やすくなります"><small>耐性菌圧</small><div class="bar press" id="hPress"><i></i></div></div>
    </div>
  </header>

  <main id="main">
    <section class="panel" id="p-play" role="tabpanel"><div id="playRoot"></div></section>

 4:'レベル4以降：耐性菌（MRMP・CRPA・CRAB・MDRPなど）が登場。広域薬を使いすぎると耐性菌圧が上がります。'
};

const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const dById=id=>DRUGS.find(d=>d.id===id);
let G=null, eid=0, bestScore=0, tab='play';
try{bestScore=+localStorage.getItem('baikins_best')||0;}catch(e){}
try{const f=localStorage.getItem('baikins_fs'); if(f==='l')document.documentElement.setAttribute('data-fs','l');}catch(e){}

function newGame(){
  G={level:1,round:1,hpMax:100,hp:100,lives:3,score:0,exp:0,bacs:200,press:10,
    drugs:{ABPC:8,SBT_ABPC:2,CEZ:5,MEPM:2,VCM:2,AZM:3,CPFX:2,ABK:1},
    items:{gram:3,culture:3,ident:3,ast:3,antigen:1,gene:1,geneQuick:0,tdm:1,pcv:0,hib:0,heal1:1,heal2:0,heal3:0},
    dose:{},hist:[],buys:[],kills:0,misses:0,bests:0,log:[],enemy:null,lock:false,over:false,fx:null};
  DRUGS.forEach(d=>G.dose[d.id]=0);
}
function say(t,c){G.log.push({t,c:c||''});if(G.log.length>80)G.log.shift();}

function pickWeighted(list){
  const tot=list.reduce((s,x)=>s+x.w,0);let r=Math.random()*tot;
  for(const x of list){r-=x.w;if(r<=0)return x;}
  return list[list.length-1];
}
function pickEnemy(){
  const c=[];
  for(const sid in SP){const s=SP[sid];for(const v of s.v){
    if(v.min<=G.level){
      let w=v.w; if(v.res) w*=(1+G.press/40)*(1+Math.max(0,G.level-3)*0.25);
      c.push({s,v,w});
    }}}
  return pickWeighted(c);
}
function makeEnemy(s,v,bossDef){
  const L=G.level, boss=!!bossDef;
  const hpMax=boss?130+(L-1)*12:rnd(50,70)+(L-1)*5;
  const e={id:++eid,s,v,boss,bossName:boss?bossDef.name:null,hpMax,hp:hpMax,atk:boss?11+L:7+L,
    known:{gram:false,culture:false,ident:false,ast:false,vlabel:false,gene:false,geneTxt:null,antigen:null,drugs:{}},
    tdm:false,used:[],miss:0,vax:null};
  if(L===1){e.known.gram=e.known.ident=e.known.ast=e.known.vlabel=true;}
  else if(L===2){e.known.gram=e.known.ident=true;}
  return e;
}
function spawn(){
  G.lock=false;G.over=false;
  let e,bd=null;
  if(G.round>=5){
    bd=BOSS[((G.level-1)%4)+1];
    const s=SP[bd.sp];
    const list=s.v.filter(v=>bd.w[v.id]).map(v=>({v,w:bd.w[v.id]}));
    e=makeEnemy(s,pickWeighted(list).v,bd);
  }else{
    const p=pickEnemy();e=makeEnemy(p.s,p.v,null);
  }
  G.enemy=e;
  const s=e.s;
  if(s.vax&&G.items[s.vax]>0){
    G.items[s.vax]--;
    if(Math.random()<(e.v.vc||0)){
      e.hpMax=Math.round(e.hpMax*.5);e.hp=e.hpMax;e.atk=Math.round(e.atk*.6);e.vax='ok';
      say('💉 '+ITM[s.vax].name+'が有効！ 敵が弱体化している！','ok');
    }else{
      e.vax='ng';
      say('💉 '+ITM[s.vax].name+'は、この株の型には効かなかった…','ng');
    }
  }
  say(e.boss?'⚠️ ボス '+eName(e)+' が現れた！':eName(e)+'が現れた！','info');
  say('攻撃を選択してください。');
  render();
  if(bd){
    ov('<div class="big">👑</div><h2>ボス出現！</h2><p><b>'+bd.name+'</b></p><p>'+bd.intro+'</p>'+
       '<p class="note">ボスはHPが高く攻撃も強力です。HPに余裕を持って戦いましょう。</p>',
       [{t:'戦う！',c:'pri',f:()=>closeOv()}]);
  }
}
function eName(e){
  if(!e.known.ident)return e.boss?'？？？（ボスの気配）':'正体不明の菌';
  return e.boss?e.bossName+'（'+e.s.jp+'）':e.s.jp;
}
function eLabel(e){return e.known.vlabel&&e.v.lab?e.v.lab:'';}
function trueName(e){return e.s.jp+(e.v.lab?' '+e.v.lab:'');}

function hit(){G.fx='hit';}
function enemyTurn(){
  const e=G.enemy;
  const dmg=Math.max(1,rnd(e.atk-3,e.atk+3));
  G.hp=Math.max(0,G.hp-dmg);
  say((e.known.ident?e.s.jp:'敵')+'の攻撃！ HP -'+dmg,'bad');
  if(G.hp<=0)lifeLost();
}
function lifeLost(){
  G.lives--;
  if(G.lives<=0){gameOver();return;}
  G.hp=G.hpMax;
  say('💔 HPが0に！ ライフが1つ減った（残り'+G.lives+'）。HPが全回復した','bad');
  toast('ライフ -1（残り'+G.lives+'）');
}
function attack(id){
  const e=G.enemy;if(!e||G.lock||G.over)return;
  const d=dById(id);
  if(G.drugs[id]<=0){toast(d.name+'の在庫がありません。ITEMで購入できます');return;}
  G.drugs[id]--;G.dose[id]++;e.used.push(id);
  G.press=clamp(G.press+(d.aware==='A'?1:(id==='MEPM'?7:5)),0,100);
  const eff=e.v.drugs[id]==='S';
  e.known.drugs[id]=eff?'S':'R';
  const dmg=eff?rnd(28,44):rnd(0,3);
  e.hp=Math.max(0,e.hp-dmg);
  if(!eff){e.miss++;G.misses++;}
  G.hist.push({lv:G.level,rd:G.round,eid:e.id,name:eName(e),drug:d.ab,dmg:eff?dmg:0,eff});
  say(d.name+'で攻撃！ '+(eff?dmg+'のダメージ！':'効かない…（耐性）'),eff?'ok':'ng');
  hit();
  if(eff&&(id==='VCM'||id==='ABK')&&!e.tdm&&Math.random()<.35){
    G.hp=Math.max(0,G.hp-8);
    say('腎機能障害の副作用… HP -8（TDMで防げます）','ng');
    if(G.hp<=0){lifeLost();render();return;}
  }
  if(e.hp<=0){win(id);render();return;}
  enemyTurn();
  render();
}
function useTest(id){
  const e=G.enemy;if(!e||G.lock||G.over)return;
  const it=ITM[id],k=e.known;
  if(G.items[id]<=0){toast(it.name+'の在庫がありません。ITEMで購入できます');return;}
  let used=false,turn=false;
  const done=()=>toast('その検査は既に完了しています');
  if(id==='gram'){
    if(k.gram)return done();
    k.gram=true;used=true;say('グラム染色：'+e.s.morph,'info');
  }else if(id==='culture'){
    if(k.culture)return done();
    k.culture=true;used=true;turn=true;say('培養を提出。結果待ちの間に時間が過ぎる…','info');
  }else if(id==='ident'){
    if(k.ident)return done();
    if(!k.culture){toast('同定には先に「培養」が必要です');return;}
    k.ident=true;k.gram=true;used=true;say('同定結果：'+e.s.jp+'！','info');
  }else if(id==='ast'){
    if(k.ast)return done();
    if(!k.culture){toast('感受性には先に「培養」が必要です');return;}
    k.ast=true;k.vlabel=true;used=true;say('感受性結果が出ました。'+(eLabel(e)?'（'+eLabel(e)+'）':''),'info');
  }else if(id==='antigen'){
    if(k.antigen)return done();
    used=true;
    if(e.s.anti==='spn'){k.antigen='肺炎球菌尿中抗原：陽性';k.ident=true;k.gram=true;say('肺炎球菌の尿中抗原が陽性！ 正体は肺炎球菌です。','info');}
    else if(e.s.anti==='leg'){k.antigen='レジオネラ尿中抗原：陽性';k.ident=true;say('レジオネラの尿中抗原が陽性！ 正体はレジオネラです。','info');}
    else{k.antigen='肺炎球菌・レジオネラ：ともに陰性';say('尿中抗原は肺炎球菌・レジオネラともに陰性。この2種は除外できます。','info');}
  }else if(id==='gene'||id==='geneQuick'){
    if(k.gene)return done();
    used=true;k.gene=true;
    k.geneTxt=e.v.gene||e.s.geneNeg;
    e.v.gd.forEach(dd=>{k.drugs[dd]=e.v.drugs[dd];});
    if(e.v.gene)k.vlabel=true;
    if(id==='geneQuick'){k.ident=true;k.gram=true;say('geneQuick：菌名は'+e.s.jp+'。','info');}
    say('遺伝子検査：'+k.geneTxt+'。'+(e.v.gd.length?'β-ラクタム系の効き目が分かりました。':''),'info');
  }else if(id==='tdm'){
    if(e.tdm)return done();
    e.tdm=true;used=true;say('TDM実施：この戦いではVCM/ABKの腎障害を防げます。','info');
  }
  if(!used)return;
  G.items[id]--;
  if(turn)enemyTurn();
  render();
}
function useHeal(id){
  const e=G.enemy;if(!e||G.lock||G.over)return;
  const it=ITM[id];
  if(G.items[id]<=0){toast(it.name+'の在庫がありません。ITEMで購入できます');return;}
  if(G.hp>=G.hpMax){toast('HPは満タンです');return;}
  G.items[id]--;
  const before=G.hp;G.hp=Math.min(G.hpMax,G.hp+it.heal);
  say(it.name+'を使用。HP +'+(G.hp-before),'ok');
  enemyTurn();render();
}
function win(drugId){
  const e=G.enemy,d=dById(drugId);
  G.lock=true;
  const lines=[];let pts=e.boss?300:100;
  lines.push([e.boss?'ボス撃退ボーナス':'撃退ボーナス','+'+pts]);
  const accNames=DRUGS.filter(x=>x.aware==='A'&&e.v.drugs[x.id]==='S').map(x=>x.ab);
  let adv='';
  if(e.v.best.includes(drugId)){pts+=50;G.bests++;lines.push(['ベストチョイス！ '+d.ab,'+50']);}
  else if(d.aware==='A'){pts+=20;lines.push(['Access薬で撃退','+20']);}
  else if(accNames.length){adv=d.ab+'は広域すぎる選択でした。'+accNames.join('・')+'でも倒せます。広域薬の使いすぎは耐性菌圧を上げます。';}
  else{pts+=20;lines.push(['必要な広域薬を適切に使用','+20']);}
  const pen=Math.min(e.miss*10,40);
  if(pen){pts-=pen;lines.push(['効かない薬を使用 ×'+e.miss,'-'+pen]);}
  pts=Math.max(pts,20);
  const allAcc=e.used.length>0&&e.used.every(x=>dById(x).aware==='A');
  if(allAcc){G.press=clamp(G.press-6,0,100);lines.push(['Access薬のみで治療：耐性菌圧','-6']);}
  const bac=(e.boss?150:60)+Math.max(0,Math.round((pts-100)/5));
  const xp=Math.round(pts/2);
  G.score+=pts;G.exp+=xp;G.bacs+=bac;G.kills++;
  G.hist.forEach(h=>{if(h.eid===e.id)h.name=trueName(e);});
  say(trueName(e)+'を撃退！ +'+pts+'点','ok');
  if(G.score>bestScore){bestScore=G.score;try{localStorage.setItem('baikins_best',String(bestScore));}catch(x){}}
  const eff=DRUGS.filter(x=>e.v.drugs[x.id]==='S').map(x=>x.ab).join(', ');
  let html='<div class="big">🎉</div><h2>'+(e.boss?'ボス撃退！':'撃退！')+'</h2>'+
    '<p><b>'+trueName(e)+'</b>　'+e.s.la+'</p>'+
    '<div class="bd">'+lines.map(l=>'<div><span>'+l[0]+'</span><span>'+l[1]+'</span></div>').join('')+
    '<div class="tot"><span>合計</span><span>+'+pts+' 点 / +'+bac+' Bacs / EXP +'+xp+'</span></div></div>';
  if(adv)html+='<div class="warnbox">⚠️ '+adv+'</div>';
  html+='<div class="teach">📘 <b>ポイント</b><br>'+e.v.teach+'<br><span class="note">この菌で有効だった抗菌薬：'+eff+'</span></div>';
  if(e.vax==='ok')html+='<p class="note">💉 ワクチンで予防できたケースでした。</p>';
  let btn='次の敵へ';
  if(e.boss){
    const nl=G.level+1,hint=LEVEL_HINT[Math.min(nl,4)];
    html+='<div class="teach" style="background:#fff4d6;border-color:#e2c36a">⬆️ <b>レベル '+nl+' へ！</b> 最大HP+10・HP全回復<br>'+hint+'</div>';
    btn='レベル '+nl+' へ進む';
  }
  ov(html,[{t:btn,c:'pri',f:()=>advance()}]);
}
function advance(){
  const e=G.enemy;
  if(e.boss){G.level++;G.round=1;G.hpMax+=10;G.hp=G.hpMax;say('レベル '+G.level+' に上がった！ '+LEVEL_HINT[Math.min(G.level,4)],'info');}
  else{G.round++;G.hp=Math.min(G.hpMax,G.hp+15);}
  closeOv();spawn();
}
function gameOver(){
  if(G.over)return;
  G.over=true;G.lock=true;
  const e=G.enemy;
  const eff=DRUGS.filter(x=>e.v.drugs[x.id]==='S').map(x=>x.ab).join(', ');
  const bst=e.v.best.map(x=>dById(x).ab).join(' / ');
  say('治療失敗…','bad');
  ov('<div class="big">💔</div><h2>治療失敗…</h2><p>到達：レベル '+G.level+'・ラウンド '+G.round+'　スコア '+G.score+'（ベスト '+bestScore+'）</p>'+
     '<div class="teach">📘 <b>敵の正体：'+trueName(e)+'</b>　'+e.s.la+'<br>'+e.v.teach+
     '<br><span class="note">有効だった抗菌薬：'+eff+'／おすすめ：'+bst+'</span></div>'+
     '<p class="note">リトライするとスコアが半分になります。検査や背景情報を活用しましょう。</p>',
     [{t:'同じレベルからリトライ',c:'pri',f:()=>retry()},{t:'最初から',c:'',f:()=>{closeOv();showTitle();}}]);
}
function retry(){
  G.score=Math.floor(G.score/2);G.hp=G.hpMax;G.lives=3;G.round=1;
  closeOv();spawn();
}

/* shop */
function buy(kind,id){
  let name,price,apply;
  if(kind==='set'){
    name='抗菌薬セット10';price=SET_PRICE;
    apply=()=>DRUGS.filter(d=>d.set).forEach(d=>G.drugs[d.id]+=10);
  }else if(kind==='drug'){
    const d=dById(id);name=d.name+' ×10';price=d.price;apply=()=>{G.drugs[id]+=10;};
  }else{
    const it=ITM[id];name=it.name+(it.pack>1?' ×'+it.pack:'');price=it.price;apply=()=>{G.items[id]+=it.pack;};
  }
  if(G.bacs<price){toast('Bacsが足りません');return;}
  G.bacs-=price;apply();
  G.buys.push({name,price});
  toast(name+'を購入（-'+price+' Bacs）');
  render();
}

function shade(hex,f){
  const n=parseInt(hex.slice(1),16);
  const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function spriteKey(e){
  const k=Object.keys(SP).find(x=>SP[x]===e.s);const c=[];
  if(e.boss)c.push(k+':boss');
  if(e.v&&e.v.id)c.push(k+':'+e.v.id);
  c.push(k);
  for(const x of c){if(SPRITE_MAP[x])return SPRITE_MAP[x];}
  return null;
}
function bugArt(e){
  const key=spriteKey(e);
  if(!key||!SPRITES[key])return bugSVG(e);
  const k=e.known,s=e.s;
  const rev=k.ident?'full':(k.gram?'gram':'none');
  const hurt=e.hp/e.hpMax<.3;
  let cls='spr spr-'+rev+(hurt?' hurt':'')+(e.boss?' boss':'')+(rev==='full'&&e.v.aura?' aura':'');
  let st='';
  if(rev==='gram')st=' style="--gc:'+(s.gram==='+'?'#8a5cb0':(s.gram==='-'?'#e07a95':'#6fa0b0'))+'"';
  const lab=k.ident?s.jp:'正体不明の菌';
  return '<div class="'+cls+'"'+st+'><img src="'+SPRITES[key]+'" alt="'+lab+'" draggable="false" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span class="fb" hidden>'+bugSVG(e)+'</span>'+
    (rev==='none'?'<b class="qm">?</b>':'')+(e.boss&&rev==='full'?'<span class="crown">👑</span>':'')+'</div>';
}
function bugSVG(e){
  const s=e.s,k=e.known;
  const rev=k.ident?'full':(k.gram?'gram':'none');
  let col=rev==='full'?s.col:(rev==='gram'?(s.gram==='+'?'#8a5cb0':(s.gram==='-'?'#e07a95':'#6fa0b0')):'#8d877b');
  const st=shade(col,.62),a='fill="'+col+'" stroke="'+st+'" stroke-width="4"';
  let body='';
  switch(s.shape){
    case 'diplo':body='<circle cx="68" cy="90" r="42" '+a+'/><circle cx="132" cy="90" r="42" '+a+'/>';break;
    case 'cluster':body='<circle cx="56" cy="78" r="25" '+a+'/><circle cx="144" cy="78" r="25" '+a+'/><circle cx="70" cy="124" r="23" '+a+'/><circle cx="130" cy="124" r="23" '+a+'/><circle cx="100" cy="88" r="44" '+a+'/>';break;
    case 'rod':body='<rect x="20" y="54" width="160" height="72" rx="36" '+a+'/><path d="M22 90 q-14 -8 -14 -20 M178 90 q14 8 14 20" fill="none" stroke="'+st+'" stroke-width="3" stroke-linecap="round"/>';break;
    case 'cocco':body='<ellipse cx="100" cy="90" rx="68" ry="46" '+a+'/>';break;
    case 'chain':body='<circle cx="40" cy="90" r="27" '+a+'/><circle cx="160" cy="90" r="27" '+a+'/><circle cx="100" cy="90" r="42" '+a+'/>';break;
  }
  const hurt=e.hp/e.hpMax<.3;
  let face;
  if(rev==='none'){
    face='<text x="100" y="108" text-anchor="middle" font-size="52" font-weight="900" fill="#fff" font-family="sans-serif">?</text>';
  }else if(hurt){
    face='<path d="M76 72l16 16M92 72l-16 16M108 72l16 16M124 72l-16 16" stroke="#2b2622" stroke-width="4" stroke-linecap="round"/><path d="M84 112 q16 -10 32 0" fill="none" stroke="#2b2622" stroke-width="4" stroke-linecap="round"/>';
  }else{
    face='<circle cx="84" cy="82" r="10" fill="#fff"/><circle cx="116" cy="82" r="10" fill="#fff"/><circle cx="86" cy="84" r="5" fill="#2b2622"/><circle cx="114" cy="84" r="5" fill="#2b2622"/>'+
      '<path d="M72 66l22 8M128 66l-22 8" stroke="#2b2622" stroke-width="4" stroke-linecap="round"/>'+
      '<path d="M86 108 l7 -7 l7 7 l7 -7 l7 7" fill="none" stroke="#2b2622" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  let extra='';
  if(e.boss){
    extra+='<ellipse cx="100" cy="90" rx="96" ry="70" fill="#b3261e" opacity=".12"/>';
    if(rev==='full')extra+='<path d="M64 38 L72 8 L88 26 L100 4 L112 26 L128 8 L136 38 Z" fill="#f2c94c" stroke="#9a7410" stroke-width="3" stroke-linejoin="round"/>';
  }
  return '<svg viewBox="0 0 200 160" role="img" aria-label="'+(k.ident?s.jp:'正体不明の菌')+'">'+extra+body+face+'</svg>';
}
function rank(){let r=TITLES[0][1];TITLES.forEach(t=>{if(G.exp>=t[0])r=t[1];});return r;}

function renderHeader(){
  $('#hRank').textContent='称号：'+rank();
  $('#hBacs').textContent='💰 '+G.bacs+' Bacs';
  $('#hLv').innerHTML='<small>Lv</small>'+G.level+' <small style="margin-left:6px">R</small>'+Math.min(G.round,5)+'/5'+(G.round>=5?' 👑':'');
  $('#hLife').textContent='❤️'.repeat(Math.max(0,G.lives))+'🖤'.repeat(Math.max(0,3-G.lives));
  $('#hHpTxt').textContent='HP '+G.hp+'/'+G.hpMax;
  const p=G.hp/G.hpMax;
  const hb=$('#hHpBar');hb.className='bar'+(p<.3?' low':(p<.6?' mid':''));hb.firstElementChild.style.width=(p*100)+'%';
  $('#hScore').innerHTML='<small>スコア</small>'+G.score;
  $('#hExp').innerHTML='<small>EXP</small>'+G.exp;
  $('#hPress').firstElementChild.style.width=G.press+'%';
}
function srChip(e,d){
  const k=e.known;
  const st=k.ast?e.v.drugs[d.id]:(k.drugs[d.id]||'?');
  return '<div class="sr '+(st==='?'?'':st)+'"><b>'+d.ab+'</b><span>'+st+'</span></div>';
}
function renderPlay(){
  const root=$('#playRoot'),e=G.enemy;
  if(!e){root.innerHTML='<p class="empty">ゲームを開始してください。</p>';return;}
  const k=e.known;
  const hpP=e.hp/e.hpMax;
  const lbl=eLabel(e);
  const nm=eName(e)+(lbl?' <span class="pill">'+lbl+'</span>':'');
  const la=k.ident?'<span class="la">'+e.s.la+'</span>':'';
  const bg=e.s.scn+(e.v.risk?'［背景］'+e.v.risk:'');
  const last=G.log.slice(-2).map(l=>'<div class="'+l.c+'">'+l.t+'</div>').join('');
  const chip=(on,t)=>'<span class="'+(on?'on':'')+'">'+(on?'✔ ':'')+t+'</span>';
  const pipe=chip(k.gram,'グラム'+(k.gram?'：'+e.s.morph:''))+chip(k.culture||G.level===1,'培養')+chip(k.ident,'同定')+chip(k.ast,'感受性')+
    chip(k.antigen,'尿抗原：'+(k.antigen||'未'))+chip(k.gene,'遺伝子：'+(k.geneTxt||'未'));
  let h='<div class="play-grid"><div class="card ecard'+(G.fx==='hit'?' hit':'')+'">'+
    '<div class="ehead"><div class="eart'+(spriteKey(e)==='vre'?' wide':'')+'">'+bugArt(e)+'</div><div class="einfo">'+
    '<div class="ename">'+nm+la+'</div>'+
    '<div class="esub">'+e.s.site+(e.boss?'　👑ボス':'')+'</div>'+
    '<div class="hpline"><span>敵HP '+e.hp+'/'+e.hpMax+'</span><div class="bar'+(hpP<.3?' low':(hpP<.6?' mid':''))+'" style="flex:1"><i style="width:'+(hpP*100)+'%"></i></div></div>'+
    '</div></div>'+
    '<div class="scn">🩺 '+bg+'</div>'+
    '<div class="srgrid">'+DRUGS.map(d=>srChip(e,d)).join('')+'</div>'+
    '<div class="pipe">'+pipe+'</div>'+
    '<button class="banner" data-act="log" aria-live="polite" title="タップでメッセージ履歴">'+last+'</button></div>';
  h+='<div class="act">';
  h+='<div class="sec"><h3>💊 抗菌薬 <small><span class="tag">A</span>Access <span class="tag W">W</span>Watch</small></h3><div class="dgrid">'+
    DRUGS.map(d=>'<button class="dbtn '+d.aware+(G.drugs[d.id]<=0?' zero':'')+'" data-drug="'+d.id+'" title="'+d.name+'"><span class="dn">'+d.ab+'</span><span class="dm"><span class="fn">'+d.name+'</span><b>×'+G.drugs[d.id]+'</b></span></button>').join('')+'</div></div>';
  h+='<div class="sec"><h3>🔬 検査・回復 <small>回復は1ターン消費</small></h3><div class="tgrid">'+
    ITEMS.filter(x=>x.grp==='test'||x.grp==='heal').map(x=>{
      if(x.grp==='heal')return '<button class="tbtn heal'+(G.items[x.id]<=0?' zero':'')+'" data-heal="'+x.id+'"><span class="tn">'+x.name+'</span><span class="tm"><span>'+(x.heal>=999?'全回復':'+'+x.heal)+'</span><b>×'+G.items[x.id]+'</b></span></button>';
      const done=(x.id==='gram'&&k.gram)||(x.id==='culture'&&(k.culture||G.level===1))||(x.id==='ident'&&k.ident)||(x.id==='ast'&&k.ast)||(x.id==='antigen'&&k.antigen)||((x.id==='gene'||x.id==='geneQuick')&&k.gene)||(x.id==='tdm'&&e.tdm);
      const note=x.id==='culture'?'1T':(x.id==='ident'||x.id==='ast'?'要培養':'');
      return '<button class="tbtn'+(done?' done':'')+(G.items[x.id]<=0&&!done?' zero':'')+'" data-test="'+x.id+'"><span class="tn">'+x.name+(done?' ✔':'')+'</span><span class="tm"><span>'+note+'</span><b>×'+G.items[x.id]+'</b></span></button>';
    }).join('')+'</div></div>';
  h+='</div></div>';
  root.innerHTML=h;
  G.fx=null;
}
function renderStat(){
  const tot=Object.values(G.dose).reduce((a,b)=>a+b,0);
  const c={A:0,W:0,R:0};DRUGS.forEach(d=>c[d.aware]+=G.dose[d.id]);
  const pc=x=>tot?(x/tot*100):0;
  const dasc=DRUGS.reduce((s,d)=>s+d.dasc*G.dose[d.id],0);
  const avg=tot?dasc/tot:0;
  const hist=G.hist.slice().reverse().slice(0,60);
  let h='<div class="two"><div class="card"><h3>AWaRe比率とDASC</h3>'+
    '<div class="awbar"><i class="A" style="width:'+pc(c.A)+'%"></i><i class="W" style="width:'+pc(c.W)+'%"></i><i class="R" style="width:'+pc(c.R)+'%"></i></div>'+
    '<p><span class="tag">A</span> Access: <b>'+c.A+'</b> ('+pc(c.A).toFixed(2)+'%) ｜ <span class="tag W">W</span> Watch: <b>'+c.W+'</b> ('+pc(c.W).toFixed(2)+'%) ｜ <span class="tag R">R</span> Reserve: <b>'+c.R+'</b> ('+pc(c.R).toFixed(2)+'%)</p>'+
    '<p>DASC: <b>'+dasc+'</b>（平均DASC: <b>'+avg.toFixed(2)+'</b>）</p>'+
    '<p class="note">DASCは抗菌薬のスペクトラムの広さを数値化した指標です。このゲームでは教育用の概算値を使っています。AccessをできるだけAccessで、狭域を選ぶほど平均DASCは小さくなります。</p></div>'+
    '<div class="card"><h3>成績</h3><p>称号：<b>'+rank()+'</b>　撃退数：<b>'+G.kills+'</b>　ベストチョイス：<b>'+G.bests+'</b>　効かない薬を使った回数：<b>'+G.misses+'</b></p>'+
    '<p>スコア：<b>'+G.score+'</b>　ベスト：<b>'+bestScore+'</b></p>'+
    '<p>耐性菌圧：<b>'+Math.round(G.press)+'</b> / 100</p><div class="bar press"><i style="width:'+G.press+'%"></i></div>'+
    '<p class="note">広域薬（Watch）を使うと上がり、Access薬だけで治療すると下がります。高いほど耐性株が出現しやすくなります。</p></div></div>';
  h+='<div class="sec"><h3>⚔️ バトル履歴 <small>（最新60件）</small></h3>'+(hist.length?
    '<div class="twrap"><table><thead><tr><th>レベル</th><th>ラウンド</th><th class="l">敵</th><th>攻撃</th><th>ダメージ</th></tr></thead><tbody>'+
    hist.map(x=>'<tr><td>'+x.lv+'</td><td>'+x.rd+'</td><td class="l">'+x.name+'</td><td>'+x.drug+'</td><td'+(x.eff?'':' style="color:var(--rFg)"')+'>'+(x.eff?x.dmg:'効果なし')+'</td></tr>').join('')+'</tbody></table></div>':'<p class="note">まだ履歴がありません。</p>')+'</div>';
  $('#statRoot').innerHTML=h;
}
function shopRow(label,desc,price,attr,cls){
  return '<div class="srow '+(cls||'')+'"><div class="nm">'+label+(desc?'<span class="ds">'+desc+'</span>':'')+'</div><div class="pr">'+price+' B</div><button class="buy" '+attr+(G.bacs<price?' disabled':'')+'>購入</button></div>';
}
function renderItem(){
  let h='<div class="card"><h3>🛒 アイテムを購入　<span class="bacs" style="font-size:.9rem">💰 '+G.bacs+' Bacs</span></h3>'+
    '<div class="sec" style="margin-top:0"><h3>抗菌薬 <small>（広域ほど高価。1回の購入で ×10）</small></h3><div class="shop">'+
    shopRow('抗菌薬セット10','＊印の6種を各+10：'+DRUGS.filter(d=>d.set).map(d=>d.ab).join('・'),SET_PRICE,'data-buy="set"','full')+
    DRUGS.map(d=>shopRow('<span class="tag '+d.aware+'">'+d.aware+'</span> '+d.name+(d.set?'＊':''),d.ab+' ×10',d.price,'data-buy="drug:'+d.id+'"')).join('')+'</div></div>'+
    '<div class="sec"><h3>検査 <small>（4つの基本検査は ×5）</small></h3><div class="shop">'+
    ITEMS.filter(x=>x.grp==='test').map(x=>shopRow(x.name+(x.pack>1?' ×'+x.pack:''),x.desc,x.price,'data-buy="item:'+x.id+'"')).join('')+'</div></div>'+
    '<div class="sec"><h3>ワクチン</h3><div class="shop">'+
    ITEMS.filter(x=>x.grp==='vax').map(x=>shopRow(x.name,x.desc,x.price,'data-buy="item:'+x.id+'"')).join('')+'</div></div>'+
    '<div class="sec"><h3>回復薬</h3><div class="shop">'+
    ITEMS.filter(x=>x.grp==='heal').map(x=>shopRow(x.name,x.desc,x.price,'data-buy="item:'+x.id+'"')).join('')+'</div></div></div>';
  h+='<div class="two sec"><div class="card"><h3>🎒 持ち物</h3>'+
    '<p><b>抗菌薬の残り：</b>'+DRUGS.map(d=>d.name+(d.set?'＊':'')+'('+G.drugs[d.id]+')').join('、')+'</p>'+
    '<p class="note">＊は抗菌薬セットに含まれる抗菌薬</p>'+
    '<p><b>アイテムの残り：</b>'+ITEMS.map(x=>x.name+'('+G.items[x.id]+')').join('、')+'</p></div>'+
    '<div class="card"><h3>🧾 購入履歴</h3>'+(G.buys.length?'<div class="twrap" style="max-height:12rem"><table><tbody>'+G.buys.slice().reverse().map((b,i)=>'<tr><td class="l">'+b.name+'</td><td>-'+b.price+' B</td></tr>').join('')+'</tbody></table></div>':'<p class="note">まだ購入していません。</p>')+'</div></div>';
  $('#itemRoot').innerHTML=h;
}
function antibiogramHTML(){
  let h='<div class="twrap"><table class="abt"><thead><tr><th class="l">菌（耐性型）</th>'+DRUGS.map(d=>'<th>'+d.ab+'</th>').join('')+'</tr></thead><tbody>';
  for(const sid in SP){const s=SP[sid];s.v.forEach(v=>{
    h+='<tr><td class="l">'+s.jp+(v.lab?' '+v.lab:'')+'<br><span class="note">'+s.la+'</span></td>'+DRUGS.map(d=>'<td class="'+v.drugs[d.id]+'">'+v.drugs[d.id]+'</td>').join('')+'</tr>';
  });}
  return h+'</tbody></table></div><p class="note">ゲーム内の想定値（二値化・単純化）です。実際の感受性は地域・施設・患者背景で異なるため、必ず自施設のアンチバイオグラムと最新のガイドラインを確認してください。</p>';
}
function renderMisc(){
  const fs=document.documentElement.getAttribute('data-fs')==='l';
  $('#miscRoot').innerHTML='<div class="two"><div class="card prose"><h3>ゲームの解説</h3>'+
    '<p>このゲームは、抗菌薬の適正使用を楽しく学ぶために開発されたバトルシミュレーションゲームです。プレイヤーは、感染症を起こす細菌（バイキンズ）に対して、最適な抗菌薬を選びながらバトルを進めます。</p>'+
    '<p>細菌ごとに耐性（AMR）のタイプが異なり、同じ菌種でも耐性株がランダムに出現します。グラム染色・培養・同定・感受性などの検査で敵の特性を見極め、効く抗菌薬のなかでなるべく狭いものを選びましょう。</p>'+
    '<p>レベルが上がるほど敵の情報が少なくなり、背景情報から経験的治療を行う力が試されます。バトルで得たBacsで、抗菌薬・検査・ワクチン・回復薬を購入できます。</p>'+
    '<p>今後もアップデートを予定しており、より多様なシナリオや機能の追加を考えています。バグや設定上の不具合に気付かれた場合は、コメントでお知らせください。</p></div>'+
    '<div class="card prose"><h3>ルールと攻略ガイド</h3><ul>'+
    '<li><b>レベル・ラウンド・ステージ：</b>1レベルは4ラウンド＋ボス戦。ステージは感染部位（肺炎・尿路など）を表します。ボスを倒すとレベルアップ。</li>'+
    '<li><b>効く薬を狭く選ぶ：</b>効く抗菌薬（S）のなかで最も狭域のものがベストチョイス。広域すぎる選択は加点されません。</li>'+
    '<li><b>耐性菌圧：</b>Watch薬（特にMEPM）を使うと上がり、耐性株が増えます。Access薬だけで倒すと下がります。</li>'+
    '<li><b>検査の順番：</b>グラム染色 → 培養（1ターン消費）→ 同定・感受性。尿中抗原は肺炎球菌とレジオネラの迅速判定です。</li>'+
    '<li><b>geneCheck / geneQuick：</b>遺伝子から、β-ラクタム系の効き目が分かります。geneQuickは培養なしで菌名も判明。</li>'+
    '<li><b>TDM：</b>VCM・ABKの腎障害を防ぎます（なしだと約35%で副作用）。</li>'+
    '<li><b>ワクチン：</b>PCVは含まれる型のみ、Hibはb型莢膜株のみ有効。使うと敵が弱体化することがあります。</li>'+
    '<li><b>効かない薬を撃つと減点。</b>ただし結果は敵情報に記録されます。</li></ul></div></div>'+
    '<div class="card prose sec"><h3>AWaRe分類とDASC</h3>'+
    '<p>WHOのAWaRe分類は、抗菌薬を<span class="tag">A</span>Access（第一・第二選択で耐性リスクが低い）、<span class="tag W">W</span>Watch（耐性リスクが高く管理が必要）、<span class="tag R">R</span>Reserve（多剤耐性菌への最後の砦）に分けたものです。Access薬の割合を高く保つことが適正使用の目標です。</p>'+
    '<p>DASCは、抗菌薬が「どれだけ広い範囲の細菌をカバーするか」を数値化した指標です。ゲーム内のDASCは教育用の概算値で、実際の値とは異なります。ABK（アルベカシン）はWHOのAWaRe分類には未収載のため、ゲーム内ではWatch扱いにしています。</p>'+
    '<details><summary>📋 Antibiogram（ゲーム内の感受性表）を開く</summary>'+antibiogramHTML()+'</details></div>'+
    '<div class="card sec"><h3>設定</h3><div class="btn-row">'+
    '<button class="btn" data-fs="'+(fs?'m':'l')+'">文字サイズ：'+(fs?'大 → 標準にする':'標準 → 大きくする')+'</button>'+
    '<button class="btn" data-act="restart">最初からやり直す</button></div>'+
    '<p class="note">ベストスコア：'+bestScore+'（この端末に保存）</p></div>';
}
function render(){
  renderHeader();renderPlay();
  if(tab==='stat')renderStat();
  if(tab==='item')renderItem();
}
/* overlay / toast */
let ovBtns=[];
function ov(html,btns){
  ovBtns=btns||[];
  $('#ovBox').innerHTML=html+'<div class="ovbtns">'+ovBtns.map((b,i)=>'<button class="btn '+(b.c||'')+'" data-ovb="'+i+'">'+b.t+'</button>').join('')+'</div>';
  $('#ov').hidden=false;
  const f=$('#ovBox .btn');if(f)f.focus({preventScroll:true});
  $('#ovBox').scrollTop=0;
}
function closeOv(){$('#ov').hidden=true;G.lock=false;}
let tt=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800);}
function showTitle(){
  ov('<div class="big">🦠⚔️💊</div><h2>バイキンズバトル</h2>'+
     '<p>抗菌薬の適正使用を、バトルで楽しく学ぼう。</p>'+
     '<ul style="padding-left:1.2em;margin:.4em 0"><li>敵の感受性（S/R）を見て、<b>効く薬のなかで一番狭いもの</b>を選ぶ</li><li>レベルが上がると敵は<b>正体不明</b>に。検査と背景情報で見極める</li><li>広域薬を使いすぎると<b>耐性菌圧</b>が上がる</li></ul>'+
     '<p class="note">ベストスコア：'+bestScore+'</p><p class="note" style="font-size:.7rem">本ゲームは AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。二次利用・再配布は自己責任のもとで可能です。その際、本注記の保持を推奨します。</p>',
     [{t:'はじめる',c:'pri',f:()=>{closeOv();startGame();}}]);
}
function startGame(){newGame();say(LEVEL_HINT[1],'info');setTab('play');spawn();}
function setTab(t){
  tab=t;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===t)));
  ['play','stat','item','misc'].forEach(x=>{$('#p-'+x).hidden=(x!==t);});
  if(t==='stat')renderStat();
  if(t==='item')renderItem();
  if(t==='misc')renderMisc();
  $('#main').scrollTop=0;
  document.body.classList.toggle('on-play',t==='play');
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.ovb!==undefined){const f=ovBtns[+d.ovb];if(f&&f.f)f.f();return;}
  if(d.tab){setTab(d.tab);return;}
  if(d.drug){attack(d.drug);return;}
  if(d.test){useTest(d.test);return;}
  if(d.heal){useHeal(d.heal);return;}
  if(d.buy){const p=d.buy.split(':');buy(p[0],p[1]);return;}
  if(d.fs){
    if(d.fs==='l')document.documentElement.setAttribute('data-fs','l');else document.documentElement.removeAttribute('data-fs');
    try{localStorage.setItem('baikins_fs',d.fs);}catch(e){}
    renderMisc();return;
  }
  if(d.act==='log'){
    ov('<h2>メッセージ履歴</h2><div class="log" style="height:auto;max-height:55dvh">'+G.log.slice(-40).map(l=>'<p class="'+l.c+'">'+l.t+'</p>').join('')+'</div>',[{t:'閉じる',c:'pri',f:()=>closeOv()}]);
    const lb=document.querySelector('#ovBox .log');if(lb)lb.scrollTop=lb.scrollHeight;return;
  }
  if(d.act==='restart'){
    ov('<h2>最初からやり直しますか？</h2><p>現在の進行状況は失われます（ベストスコアは残ります）。</p>',
      [{t:'やり直す',c:'pri',f:()=>{closeOv();startGame();}},{t:'キャンセル',c:'',f:()=>closeOv()}]);
  }
});
newGame();render();renderMisc();showTitle();
// テスト用フック
window.__baikins={render,get G(){return G;},attack,useTest,useHeal,buy,setTab,advance,retry,startGame,DRUGS,SP,BOSS,closeOv};
})();
</script>
</body>
