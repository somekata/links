選べ。", "category": "MHC", "categoryShort": "MHC", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "class I分子はCD2と共発現する。", "short": "a"}, {"id": "b", "text": "class I分子は全ての有核細胞が持つ。", "short": "b"}, {"id": "c", "text": "ヒトではヒト白血球抗原（HLA）に相当する。", "short": "c"}, {"id": "d", "text": "class II分子は主に内在性抗原を提示する。", "short": "d"}, {"id": "e", "text": "class I分子はclass IIよりも大きなペプチド断片を提示する。", "short": "e"}], "correct": ["b", "c"], "explanation": "MHC class Iは全有核細胞に発現しCD8 T細胞に内在性抗原（8-10aa）を提示。class IIは樹状細胞・B細胞・マクロファージ等に限定しCD4 T細胞に外来抗原（13-25aa）を提示。ヒトMHCはHLAに相当。β2ミクログロブリンと共発現するのはclass IでCD2ではない。"}, {"id": 131, "title": "サイトカインについて正しい説明はどれか。2つ選べ。", "category": "サイトカイン", "categoryShort": "サイトカ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "IL-8はケモカインである。", "short": "a"}, {"id": "b", "text": "EGFはがん抑制因子である。", "short": "b"}, {"id": "c", "text": "TNF-αは好中球遊走因子である。", "short": "c"}, {"id": "d", "text": "IL-10は抗炎症性サイトカインである。", "short": "d"}, {"id": "e", "text": "G-CSFはマクロファージ増殖因子である。", "short": "e"}], "correct": ["a", "d"], "explanation": "IL-8（CXCL8）は好中球を遊走させるケモカイン、IL-10は抗炎症性サイトカインで制御性T細胞等が産生。EGFは増殖因子、TNF-αは炎症性サイトカインで好中球遊走は主にIL-8、G-CSFは好中球系増殖因子でM-CSFがマクロファージ増殖因子。"}, {"id": 132, "title": "後天性免疫不全症候群（AIDS）におけるニューモシスチス肺炎（PCP）について正しい説明はどれか。2つ選べ。", "category": "AIDS-PCP", "categoryShort": "AIDS", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "胸部CTでは異常を認めない。", "short": "a"}, {"id": "b", "text": "血清β-Dグルカンが高値である。", "short": "b"}, {"id": "c", "text": "ステロイド治療中のPCPに比べて菌量が多い。", "short": "c"}, {"id": "d", "text": "ステロイド治療中のPCPに比べて肺の損傷が強い。", "short": "d"}, {"id": "e", "text": "AIDSの治療を優先し、CD4陽性細胞数が200/μL以上になってからPCPの治療を開始する。", "short": "e"}], "correct": ["b", "c"], "explanation": "AIDSのPCPは亜急性、β-Dグルカン高値、菌量は多いが肺損傷は非HIV（ステロイド等）PCPの方が強い（免疫再構築による炎症が強い）。CTでは両側スリガラス影が典型的。治療はST合剤を直ちに開始し、ARTは早期開始が推奨されるがIRISに注意。"}, {"id": 133, "title": "Pneumocystis jiroveciiについて正しい説明はどれか。2つ選べ。", "category": "P.jirovecii", "categoryShort": "P.ji", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "細胞壁を有する。", "short": "a"}, {"id": "b", "text": "真核生物である。", "short": "b"}, {"id": "c", "text": "元々イヌから分離された。", "short": "c"}, {"id": "d", "text": "種名は日本人の名前に由来する。", "short": "d"}, {"id": "e", "text": "培養にはサブロー培地を用いる。", "short": "e"}], "correct": ["a", "b"], "explanation": "Pneumocystis jiroveciiは酵母様真菌に近縁の真核微生物、細胞壁にβ-Dグルカンを含む。ヒト特異的でイヌ由来ではない（旧P.cariniiはラット）。種名jiroveciiはチェコの寄生虫学者Otto Jirovecに由来。人工培地（サブロー）では培養不能で診断はPCR・鏡検。"}, {"id": 134, "title": "ニューモシスチス肺炎を起こしやすい状態はどれか。2つ選べ。", "category": "PJPリスク", "categoryShort": "PJPリ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "HbA1cが6.5%である。", "short": "a"}, {"id": "b", "text": "CD4陽性細胞が20/μLである。", "short": "b"}, {"id": "c", "text": "eGFRが85.5mL/min/1.73m2である。", "short": "c"}, {"id": "d", "text": "プレドニゾロン5mg/日を2週間内服中である。", "short": "d"}, {"id": "e", "text": "インフリキシマブ（抗TNFα抗体）による治療中である。", "short": "e"}], "correct": ["b", "e"], "explanation": "PJP高リスクはCD4<200/μL、TNFα阻害薬（インフリキシマブ）、高用量ステロイド長期、免疫抑制薬、悪性腫瘍等。PSL5mg2週間やHbA1c6.5%、eGFR85はリスクではない。通常PSL20mg以上4週間以上でリスク。"}, {"id": 135, "title": "Pneumocystis jiroveciiについて正しい説明はどれか。2つ選べ。", "category": "P.jirovecii形態", "categoryShort": "P.ji", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "担子菌門に属する。", "short": "a"}, {"id": "b", "text": "染色体は4本である。", "short": "b"}, {"id": "c", "text": "ゲノムサイズは約1Mbpである。", "short": "c"}, {"id": "d", "text": "ギムザ染色では嚢子よりも栄養体がよく染まる。", "short": "d"}, {"id": "e", "text": "グロコット染色では栄養体よりも嚢子がよく染まる。", "short": "e"}], "correct": ["d", "e"], "explanation": "P.jiroveciiは子嚢菌門に近縁、ギムザ染色では栄養体（トロフォゾイト）が、グロコット染色では嚢子の壁が黒く染まる。ゲノムは約8Mbp、染色体数は13本程度とされる。担子菌門ではない。"}, {"id": 136, "title": "後天性免疫不全症候群（AIDS）におけるニューモシスチス肺炎（PCP）について正しい説明はどれか。2つ選べ。", "category": "AIDS-PCP治療", "categoryShort": "AIDS", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "低酸素を認めない。", "short": "a"}, {"id": "b", "text": "KL-6が高値となる。", "short": "b"}, {"id": "c", "text": "第一選択薬はST合剤である。", "short": "c"}, {"id": "d", "text": "ステロイド治療中のPCPに比べて予後が悪い。", "short": "d"}, {"id": "e", "text": "ステロイドを併用している場合にはステロイドを中止する。", "short": "e"}], "correct": ["b", "c"], "explanation": "AIDS-PCPは低酸素を呈しKL-6やβ-Dグルカン高値、第一選択はST合剤（TMP-SMX）。非HIV-PCPの方が予後不良で死亡率高い。ステロイド併用例では原則継続し、重症例では補助的ステロイド追加が推奨される（中止ではない）。"}, {"id": 137, "title": "結核の感染診断に用いる検査法はどれか。2つ選べ。", "category": "結核感染診断", "categoryShort": "結核感染", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "LAMP法", "short": "a"}, {"id": "b", "text": "薬剤リンパ球刺激試験（DLST）", "short": "b"}, {"id": "c", "text": "ツベルクリン皮内反応（ツ反）", "short": "c"}, {"id": "d", "text": "インターフェロンγ遊離試験（IGRA）", "short": "d"}, {"id": "e", "text": "DNA-DNAハイブリダイゼーション（DDH）", "short": "e"}], "correct": ["c", "d"], "explanation": "結核の感染診断（LTBI含む）はツベルクリン反応とIGRA。LAMPは結核菌核酸検出で活動性結核診断、DLSTは薬疹、DDHは菌種同定法。"}, {"id": 138, "title": "インターフェロンγ遊離試験（IGRA）について正しい説明はどれか。2つ選べ。", "category": "IGRA", "categoryShort": "IGRA", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "採血前に皮下に抗原を接種する。", "short": "a"}, {"id": "b", "text": "陰性であれば潜在性結核感染症と診断する。", "short": "b"}, {"id": "c", "text": "陽性であれば結核に対する免疫があり、再感染しないことを意味する。", "short": "c"}, {"id": "d", "text": "T-SPOT.TBは、結核菌特異的抗原に反応するT細胞からのインターフェロンγ産生細胞の数を測定する検査である。", "short": "d"}, {"id": "e", "text": "QuantiFERON-TB Gold（QFT）は結核菌特異的抗原に対するT細胞からのインターフェロンγの産生量を測定する検査である。", "short": "e"}], "correct": ["d", "e"], "explanation": "T-SPOTはELISPOT法でIFN-γ産生細胞数を、QFTはELISA法でIFN-γ濃度を測定。皮下抗原接種はツ反の説明、陰性でLTBI否定ではなく、陽性は感染を示すが免疫の有無や再感染しないことを意味しない。"}, {"id": 139, "title": "インターフェロンγ遊離試験（IGRA）について誤っているのはどれか。2つ選べ。", "category": "IGRA誤り", "categoryShort": "IGRA", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "採血管にIL-8を加えておく。", "short": "a"}, {"id": "b", "text": "陰性であればBCG接種が必要である。", "short": "b"}, {"id": "c", "text": "陽性コントロールが低値の場合、判定保留となる。", "short": "c"}, {"id": "d", "text": "陽性コントロールにフィトヘマグルチニン（PHA）などのマイトジェンを用いる。", "short": "d"}, {"id": "e", "text": "結核菌特異的抗原に反応してインターフェロンγを産生するT細胞の活性を評価する。", "short": "e"}], "correct": ["a", "b"], "explanation": "IGRAは採血管に結核特異抗原（ESAT-6/CFP-10）と陽性対照PHA、陰性対照Nilを入れIFN-γを測定する。IL-8は加えない。陰性でもBCG適応は別途判断。陽性コントロール低値では免疫能低下で判定保留/不可となることがあり、PHAを用いること、T細胞活性評価は正しい説明。"}, {"id": 140, "title": "免疫クロマト法について正しい説明はどれか。2つ選べ。", "category": "免疫クロマト", "categoryShort": "免疫クロ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "標識抗体を用いる。", "short": "a"}, {"id": "b", "text": "PCRよりも感度が高い。", "short": "b"}, {"id": "c", "text": "IGRAの原理を用いている。", "short": "c"}, {"id": "d", "text": "測定時間は約2時間である。", "short": "d"}, {"id": "e", "text": "インフルエンザの診断に利用されている。", "short": "e"}], "correct": ["a", "e"], "explanation": "免疫クロマト法（LFA）は金コロイド等で標識した抗体を用いる迅速抗原検査で、インフルエンザ・COVID・RS等の診断に利用。PCRより感度は低く、測定は15分程度。IGRAはELISPOT/ELISA原理で異なる。"}, {"id": 141, "title": "潜在性結核感染症（LTBI）について正しい説明はどれか。2つ選べ。", "category": "LTBI", "categoryShort": "LTBI", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "診断にはPCRが最も有用である。", "short": "a"}, {"id": "b", "text": "結核菌が体内で活発に増殖している。", "short": "b"}, {"id": "c", "text": "2類感染症として保健所に届け出る必要がある。", "short": "c"}, {"id": "d", "text": "無治療では2か月以内に80%が活動性結核に進展する。", "short": "d"}, {"id": "e", "text": "イソニアジドとリファンピシンの2剤で3～4か月治療を行う。", "short": "e"}], "correct": ["c", "e"], "explanation": "LTBIは結核菌が潜伏し活動性がない状態、診断はIGRA/ツ反、PCRは活動性結核用。2類感染症として届出対象。無治療での発病は生涯5-10%程度。治療はINH+RFP 3-4か月（3HR）やRFP4か月、INH9か月等。"}, {"id": 142, "title": "インターフェロンγ遊離試験（IGRA）とツベルクリン皮内反応（ツ反）の違いについて正しい説明はどれか。2つ選べ。", "category": "IGRA vs ツ反", "categoryShort": "IGRA", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ツ反は48時間後に判定を行う。", "short": "a"}, {"id": "b", "text": "ツ反は採血を行う必要がある。", "short": "b"}, {"id": "c", "text": "IGRAはBCG接種の影響を受けない。", "short": "c"}, {"id": "d", "text": "SLEではツ反が陽性になりやすい。", "short": "d"}, {"id": "e", "text": "妊婦ではIGRAが陽性になりやすい。", "short": "e"}], "correct": ["a", "c"], "explanation": "ツ反は48-72時間後に硬結径で判定、皮内注射で採血不要。IGRAはRD1抗原（ESAT-6/CFP-10）を用いBCGの影響を受けない。SLE等免疫抑制ではツ反偽陰性になりやすい。妊婦でIGRA陽性になりやすい根拠はない。"}, {"id": 143, "title": "梅毒血清反応（STS）において生物学的偽陽性を認めやすいのはどれか。2つ選べ。", "category": "STS BFP", "categoryShort": "STS ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "妊娠", "short": "a"}, {"id": "b", "text": "B型肝炎", "short": "b"}, {"id": "c", "text": "C型肝炎", "short": "c"}, {"id": "d", "text": "慢性関節リウマチ", "short": "d"}, {"id": "e", "text": "全身性エリテマトーデス（SLE）", "short": "e"}], "correct": ["a", "e"], "explanation": "STS（RPR/VDRL）の生物学的偽陽性は妊娠、SLE、抗リン脂質抗体症候群等で見られる。脂質抗原に対する非特異反応でTPHA等で鑑別する。B型肝炎、C型肝炎、RAでは偽陽性の頻度は高くない。"}, {"id": 144, "title": "梅毒の治療について正しい説明はどれか。2つ選べ。", "category": "梅毒治療", "categoryShort": "梅毒治療", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "病期によって治療期間が異なる。", "short": "a"}, {"id": "b", "text": "ペニシリン系薬が第一選択である。", "short": "b"}, {"id": "c", "text": "STSが陰性化するまで治療を継続する。", "short": "c"}, {"id": "d", "text": "TPHAが陰性化するまで治療を継続する。", "short": "d"}, {"id": "e", "text": "治療開始後、悪寒戦慄を認めたら治療を中止する。", "short": "e"}], "correct": ["a", "b"], "explanation": "梅毒は病期で治療期間が異なる（早期2-4週、晩期4-8週等）、第一選択はペニシリン（アモキシシリンやベンザチンペニシリン筋注）。STSの陰性化は治療効果指標だが陰性化まで継続するわけではなく4倍低下等で効果判定、TPHAは長期陽性持続。Jarisch-Herxheimer反応は治療開始後発熱・悪寒で治療中止ではなく解熱鎮痛薬で対応。"}, {"id": 145, "title": "成人の標準的な上腕部の筋肉注射について正しい説明はどれか。2つ選べ。", "category": "筋注", "categoryShort": "筋注", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "皮膚を伸展して穿刺する。", "short": "a"}, {"id": "b", "text": "皮膚に対して垂直に穿刺する。", "short": "b"}, {"id": "c", "text": "注射針の長さは12mm程度が適している。", "short": "c"}, {"id": "d", "text": "三角筋と上腕三頭筋の境界に接種する。", "short": "d"}, {"id": "e", "text": "三角筋部への接種で上方にずれた場合には橈骨神経損傷が起こりやすい。", "short": "e"}], "correct": ["a", "b"], "explanation": "筋注は皮膚を伸展させ90度垂直に穿刺。成人上腕では25mm前後の針で三角筋中央部、肩峰から3横指下が目安。12mmは皮下注射用。三角筋と上腕三頭筋境界は不適切、上方ずれは肩峰下滑液包炎（SIRVA）リスク、橈骨神経は下方・深部でのリスク。"}, {"id": 146, "title": "薬力学（PD）のパラメーターはどれか。", "category": "PK/PD", "categoryShort": "PK/P", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "血中半減期", "short": "a"}, {"id": "b", "text": "C反応性ペプチド（CRP）", "short": "b"}, {"id": "c", "text": "最小発育阻止濃度（MIC）", "short": "c"}, {"id": "d", "text": "推定糸球体ろ過量（eGFR）", "short": "d"}, {"id": "e", "text": "血中濃度曲線下面積（AUC）", "short": "e"}], "correct": ["c"], "explanation": "薬力学（PD）は薬効を表す指標で抗菌薬ではMICが代表。PKは血中半減期、AUC、Cmax。CRPは炎症マーカー、eGFRは腎機能。PK/PD理論ではAUC/MIC、%T>MIC、Cmax/MIC等を用いる。"}, {"id": 147, "title": "疾患と病原体の組み合わせとして正しいのはどれか。2つ選べ。", "category": "疾患-病原体", "categoryShort": "疾患-病", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Kuru --- Epstein-Barr virus", "short": "a"}, {"id": "b", "text": "amoebic keratitis --- Amoebobacter roseus", "short": "b"}, {"id": "c", "text": "typhoid fever (enteric fever) --- Salmonella Typhi", "short": "c"}, {"id": "d", "text": "pseudomembranous colitis --- Clostridioides difficile", "short": "d"}, {"id": "e", "text": "Waterhouse-Friderichsen syndrome --- Chlamydia trachomatis", "short": "e"}], "correct": ["c", "d"], "explanation": "腸チフスはSalmonella Typhi、偽膜性腸炎はC.difficile。Kuruはプリオン、amoebic keratitisはAcanthamoeba、WFSはNeisseria meningitidis等による副腎出血。"}, {"id": 148, "title": "感染症に関する説明として正しいのはどれか。2つ選べ。", "category": "感染症", "categoryShort": "感染症", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "梅毒の診断にはインターフェロンγ遊離検査が有用である。", "short": "a"}, {"id": "b", "text": "クリプトコッカス症の診断には便中抗原検査が有用である。", "short": "b"}, {"id": "c", "text": "狂犬病は発症後に免疫グロブリン投与を行うことで救命可能である。", "short": "c"}, {"id": "d", "text": "クロイツフェルト・ヤコブ病では脳波で周期性同期放電が見られる。", "short": "d"}, {"id": "e", "text": "アスペルギルス症の診断にはガラクトマンナン抗原検査が有用である。", "short": "e"}], "correct": ["d", "e"], "explanation": "CJDでは脳波で周期性同期放電（PSD）が特徴、アスペルギルス症はガラクトマンナン抗原が有用。梅毒はSTS/TPHA、クリプトコックスは血清莢膜抗原（グルクロノキシロマンナン）、狂犬病は発症後救命困難でワクチン+免疫グロブリンは暴露後予防。"}, {"id": 149, "title": "腸内細菌科細菌に共通する特徴はどれか。2つ選べ。", "category": "腸内細菌科", "categoryShort": "腸内細菌", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "芽胞を形成する。", "short": "a"}, {"id": "b", "text": "鞭毛を持たない。", "short": "b"}, {"id": "c", "text": "通性嫌気性菌である。", "short": "c"}, {"id": "d", "text": "ブドウ糖を分解し酸を産生する。", "short": "d"}, {"id": "e", "text": "セファマイシン系薬に自然耐性を示す。", "short": "e"}], "correct": ["c", "d"], "explanation": "腸内細菌科は通性嫌気性グラム陰性桿菌でブドウ糖を発酵し酸を産生。芽胞形成せず、鞭毛は多くの菌が持つ（周毛）。セファマイシン自然耐性は一部の菌でESBLとは別。"}, {"id": 150, "title": "リツキシマブによる治療を開始する前に実施すべき検査はどれか。2つ選べ。", "category": "リツキシマブ前検査", "categoryShort": "リツキシ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "HBs抗原", "short": "a"}, {"id": "b", "text": "HBc抗体", "short": "b"}, {"id": "c", "text": "血液培養検査", "short": "c"}, {"id": "d", "text": "肺炎球菌尿中抗原検査", "short": "d"}, {"id": "e", "text": "インフルエンザ抗原検査", "short": "e"}], "correct": ["a", "b"], "explanation": "リツキシマブはB細胞枯渇によりHBV再活性化リスクが高いため、治療前にHBs抗原、HBs抗体、HBc抗体を測定し、必要に応じて核酸アナログ予防投与やHBV-DNAモニタリングを行う。血液培養や尿中抗原、インフル抗原は必須スクリーニングではない。"}, {"id": 151, "title": "鼻中隔前下部にある鼻出血の好発部位はどれか。", "category": "鼻出血", "categoryShort": "鼻出血", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "Roth spots", "short": "a"}, {"id": "b", "text": "McBurney's point", "short": "b"}, {"id": "c", "text": "Auerbach's plexus", "short": "c"}, {"id": "d", "text": "Kiesselbach's area", "short": "d"}, {"id": "e", "text": "Hesselbach's triangle", "short": "e"}], "correct": ["d"], "explanation": "鼻出血の約90%は鼻中隔前下部のキーゼルバッハ部位（Kiesselbach's area）からの出血で、毛細血管叢が豊富。Roth spotsは感染性心内膜炎の網膜出血、McBurneyは虫垂圧痛点、Auerbachは腸管筋層間神経叢、Hesselbachは鼠径ヘルニア三角。"}, {"id": 152, "title": "疾患と特徴的な症状・所見の組み合わせとして正しいのはどれか。2つ選べ。", "category": "疾患-症状", "categoryShort": "疾患-症", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "急性糸球体腎炎 --- 血尿", "short": "a"}, {"id": "b", "text": "リウマチ熱 --- 比較的徐脈", "short": "b"}, {"id": "c", "text": "ジカウイルス感染症 --- 皮疹", "short": "c"}, {"id": "d", "text": "ロア糸状虫症 --- 遊走性紅斑", "short": "d"}, {"id": "e", "text": "急性膀胱炎 --- 肋骨脊柱角叩打痛", "short": "e"}], "correct": ["a", "c"], "explanation": "急性糸球体腎炎は血尿・蛋白尿・浮腫・高血圧、ジカウイルスは発熱・皮疹・関節痛・結膜炎。リウマチ熱で比較的徐脈は腸チフスの特徴、ロア糸状虫はカルバー腫脹、膀胱炎でCVA叩打痛は腎盂腎炎の所見。"}, {"id": 153, "title": "免疫グロブリンに関する説明として正しいのはどれか。2つ選べ。", "category": "免疫グロブリン", "categoryShort": "免疫グロ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "IgEはFc領域を欠く。", "short": "a"}, {"id": "b", "text": "主に肝臓で合成される。", "short": "b"}, {"id": "c", "text": "IgAは胎盤移行性がある。", "short": "c"}, {"id": "d", "text": "血液中ではIgGが最も多い。", "short": "d"}, {"id": "e", "text": "IgMは血液中で5量体を形成している。", "short": "e"}], "correct": ["d", "e"], "explanation": "血液中Igで最も多いのはIgG（約75%）、次いでIgA、IgM。IgMは5量体で補体活性化が強い。IgはB細胞・形質細胞で産生、肝臓ではない。胎盤移行はIgG、Fc領域は全Igが持つ。"}, {"id": 154, "title": "核酸について正しい説明はどれか。2つ選べ。", "category": "核酸", "categoryShort": "核酸", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "グアニンはプリン塩基である。", "short": "a"}, {"id": "b", "text": "真核生物のDNAは核内にのみ限局している。", "short": "b"}, {"id": "c", "text": "ヌクレオシドは塩基とリン酸で構成される。", "short": "c"}, {"id": "d", "text": "アデニンはシトシンと2つの水素結合で対になっている。", "short": "d"}, {"id": "e", "text": "RNAの塩基としてチミンの代わりにウラシルが用いられている。", "short": "e"}], "correct": ["a", "e"], "explanation": "プリン塩基はアデニンとグアニン、ピリミジンはシトシン・チミン・ウラシル。真核DNAは核のほかミトコンドリアにも存在。ヌクレオシドは塩基+糖、ヌクレオチドは+リン酸。AはT（U）と2水素結合、CはGと3水素結合。"}, {"id": 155, "title": "ヒト免疫不全ウイルス（HIV）感染症の予防・治療について正しい説明はどれか。2つ選べ。", "category": "HIV", "categoryShort": "HIV", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "HIVの暴露後予防内服は一生継続する必要がある。", "short": "a"}, {"id": "b", "text": "AIDS発症後の抗レトロウイルス療法は3剤以上を併用する。", "short": "b"}, {"id": "c", "text": "HIVの暴露後予防内服は核酸系逆転写酵素阻害薬単剤で行う。", "short": "c"}, {"id": "d", "text": "HIV感染症の治療はCD4陽性細胞が400/μL以上になれば中止できる。", "short": "d"}, {"id": "e", "text": "HIVの治療によって検出限界未満に維持できれば、性行為による感染は起こらない。", "short": "e"}], "correct": ["b", "e"], "explanation": "HIV治療は3剤以上併用（2NRTI+INSTI等）、CD4回復しても中止できない。PEPは28日間3剤併用が原則、単剤ではない。U=U（Undetectable=Untransmittable）は検出限界未満維持で性感染しないという確立された概念。"}, {"id": 156, "title": "damage associated molecular patterns (DAMPs)はどれか。", "category": "DAMPs", "categoryShort": "DAMP", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "dectin-1", "short": "a"}, {"id": "b", "text": "β-D-glucan", "short": "b"}, {"id": "c", "text": "lipopolysaccharide", "short": "c"}, {"id": "d", "text": "toll-like receptor 4", "short": "d"}, {"id": "e", "text": "high mobility group box-1", "short": "e"}], "correct": ["e"], "explanation": "DAMPsは宿主細胞傷害で放出される内因性危険シグナルでHMGB-1、ATP、尿酸等。PAMPsは病原体由来でβ-D-グルカン、LPS等。dectin-1、TLR4はパターン認識受容体（PRR）。"}, {"id": 157, "title": "筋肉接種しなければならないワクチンはどれか。2つ選べ。", "category": "ワクチン接種部位", "categoryShort": "ワクチン", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "MRワクチン", "short": "a"}, {"id": "b", "text": "HPVワクチン", "short": "b"}, {"id": "c", "text": "水痘ワクチン", "short": "c"}, {"id": "d", "text": "結合型肺炎球菌ワクチン（PCV15）", "short": "d"}, {"id": "e", "text": "新型コロナワクチン（mRNAワクチン）", "short": "e"}], "correct": ["b", "e"], "explanation": "筋注必須はHPVワクチンと新型コロナmRNAワクチン。MR・水痘は皮下接種、PCV15は皮下接種可だが筋注も可。日本では長年皮下接種が主流だったが世界的には筋注が標準。"}, {"id": 158, "title": "ピロリ菌が原因となる疾患はどれか。2つ選べ。", "category": "ピロリ菌", "categoryShort": "ピロリ菌", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "硬性下疳", "short": "a"}, {"id": "b", "text": "軟性下疳", "short": "b"}, {"id": "c", "text": "骨髄繊維症", "short": "c"}, {"id": "d", "text": "悪性リンパ腫", "short": "d"}, {"id": "e", "text": "免疫性血小板減少症", "short": "e"}], "correct": ["d", "e"], "explanation": "H.pyloriは胃MALTリンパ腫、胃癌、胃・十二指腸潰瘍、ITP、鉄欠乏性貧血等の原因。硬性下疳は梅毒、軟性下疳はHaemophilus ducreyi、骨髄線維症は骨髄増殖性腫瘍。"}, {"id": 159, "title": "内視鏡を用いずに行うピロリ菌感染症の診断法はどれか。2つ選べ。", "category": "ピロリ診断", "categoryShort": "ピロリ診", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "培養法", "short": "a"}, {"id": "b", "text": "組織鏡検法", "short": "b"}, {"id": "c", "text": "便中抗原検査", "short": "c"}, {"id": "d", "text": "尿素呼気テスト", "short": "d"}, {"id": "e", "text": "迅速ウレアーゼ試験", "short": "e"}], "correct": ["c", "d"], "explanation": "非侵襲的検査は便中抗原、尿素呼気テスト、血清抗体。侵襲的（内視鏡要）は培養、組織鏡検、迅速ウレアーゼ試験。"}, {"id": 160, "title": "ピロリ菌感染症の一次除菌に用いる薬剤はどれか。2つ選べ。", "category": "ピロリ除菌", "categoryShort": "ピロリ除", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "クラリスロマイシン", "short": "a"}, {"id": "b", "text": "ピペラシリン", "short": "b"}, {"id": "c", "text": "シメチジン", "short": "c"}, {"id": "d", "text": "ランソプラゾール", "short": "d"}, {"id": "e", "text": "バンコマイシン", "short": "e"}], "correct": ["a", "d"], "explanation": "一次除菌はPPI（ランソプラゾール等）+アモキシシリン+クラリスロマイシン。シメチジンはH2ブロッカーで除菌レジメンには使わない、ピペラシリン・バンコは無関係。"}, {"id": 161, "title": "偏性嫌気性菌はどれか。2つ選べ。", "category": "嫌気性菌", "categoryShort": "嫌気性菌", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Clostridioides difficile", "short": "a"}, {"id": "b", "text": "Legionella pneumophila", "short": "b"}, {"id": "c", "text": "Mycoplasma pneumoniae", "short": "c"}, {"id": "d", "text": "Fusobacterium necrophorum", "short": "d"}, {"id": "e", "text": "Mycobacterium intracellulare", "short": "e"}], "correct": ["a", "d"], "explanation": "偏性嫌気性はC.difficileとFusobacterium necrophorum（Lemierre症候群起因菌）。Legionellaは好気性、Mycoplasmaは通性嫌気性、M.intracellulareは好気性抗酸菌。"}, {"id": 162, "title": "口腔カンジダ症の基礎疾患または危険因子として正しいのはどれか。2つ選べ。", "category": "口腔カンジダ", "categoryShort": "口腔カン", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "BCG接種歴", "short": "a"}, {"id": "b", "text": "ステロイドの内服", "short": "b"}, {"id": "c", "text": "後天性免疫不全症候群", "short": "c"}, {"id": "d", "text": "フルコナゾールの内服", "short": "d"}, {"id": "e", "text": "CD4陽性細胞が400/μL以上", "short": "e"}], "correct": ["b", "c"], "explanation": "口腔カンジダのリスクはステロイド内服・吸入、AIDS、抗菌薬、糖尿病、口腔乾燥。フルコナゾールは治療薬でリスクではない、CD4 400以上は正常域。BCG歴は無関係。"}, {"id": 163, "title": "播種性カンジダ症の基礎疾患または危険因子として正しいのはどれか。2つ選べ。", "category": "播種性カンジダ", "categoryShort": "播種性カ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "BCG接種歴", "short": "a"}, {"id": "b", "text": "ミカファンギンの投与", "short": "b"}, {"id": "c", "text": "アムホテリシンBの投与", "short": "c"}, {"id": "d", "text": "好中球数が500/μL未満", "short": "d"}, {"id": "e", "text": "中心静脈カテーテルの留置", "short": "e"}], "correct": ["d", "e"], "explanation": "播種性カンジダ血症リスクは好中球減少、中心静脈カテーテル、広域抗菌薬、腹部手術、TPN。ミカファンギン・AmBは治療薬でリスクではない。"}, {"id": 164, "title": "Fitz-Hugh-Curtis症候群の原因菌として正しいのはどれか。2つ選べ。", "category": "Fitz-Hugh-Curtis", "categoryShort": "Fitz", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Moraxella catarrhalis", "short": "a"}, {"id": "b", "text": "Mycobacterium leprae", "short": "b"}, {"id": "c", "text": "Neisseria gonorrhoeae", "short": "c"}, {"id": "d", "text": "Chlamydia trachomatis", "short": "d"}, {"id": "e", "text": "Mycoplasma pneumoniae", "short": "e"}], "correct": ["c", "d"], "explanation": "Fitz-Hugh-Curtis症候群は骨盤内炎症性疾患の上行感染による肝周囲炎で、Neisseria gonorrhoeaeとChlamydia trachomatisが二大原因。M.catarrhalisは中耳炎・副鼻腔炎、M.lepraeはハンセン病。"}, {"id": 165, "title": "Waterhouse-Friderichsen症候群の原因菌として正しいのはどれか。", "category": "Waterhouse-Friderichsen", "categoryShort": "Wate", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "Chlamydia psittaci", "short": "a"}, {"id": "b", "text": "Neisseria meningitidis", "short": "b"}, {"id": "c", "text": "Moraxella catarrhalis", "short": "c"}, {"id": "d", "text": "Legionella pneumophila", "short": "d"}, {"id": "e", "text": "Mycobacterium tuberculosis", "short": "e"}], "correct": ["b"], "explanation": "WFSは髄膜炎菌（N.meningitidis）等による劇症敗血症と両側副腎出血による副腎不全。DIC・ショックを来す。オウム病はC.psittaci、レジオネラ肺炎はL.pneumophila。"}, {"id": 166, "title": "溶血性尿毒症症候群の病態として正しいのはどれか。2つ選べ。", "category": "HUS", "categoryShort": "HUS", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "血小板数が低下する。", "short": "a"}, {"id": "b", "text": "ヘモグロビン値が低下する。", "short": "b"}, {"id": "c", "text": "ALT（GPT）が低下する。", "short": "c"}, {"id": "d", "text": "高ナトリウム血症になりやすい。", "short": "d"}, {"id": "e", "text": "血清クレアチニン値が低下する。", "short": "e"}], "correct": ["a", "b"], "explanation": "HUSはEHEC等のベロ毒素による血栓性微小血管症で、血小板減少、溶血性貧血（Hb低下）、腎機能障害（Cr上昇）が三徴。ALT低下や高Na、Cr低下ではない。"}, {"id": 167, "title": "ヒト型結核菌のRD1領域に含まれる遺伝子がコードする蛋白はどれか。2つ選べ。", "category": "RD1", "categoryShort": "RD1", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "KatG", "short": "a"}, {"id": "b", "text": "MCR1", "short": "b"}, {"id": "c", "text": "QRDR", "short": "c"}, {"id": "d", "text": "CFP-10", "short": "d"}, {"id": "e", "text": "ESAT-6", "short": "e"}], "correct": ["d", "e"], "explanation": "RD1領域は結核菌特異的でBCGには欠損、CFP-10とESAT-6をコードしIGRA抗原として用いられる。KatGはINH耐性、MCR1はコリスチン耐性、QRDRはキノロン耐性関連。"}, {"id": 168, "title": "脳神経の番号と脳神経の名称の組み合わせとして正しいのはどれか。2つ選べ。", "category": "脳神経", "categoryShort": "脳神経", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "II --- 視神経", "short": "a"}, {"id": "b", "text": "V --- 三叉神経", "short": "b"}, {"id": "c", "text": "VI --- 顔面神経", "short": "c"}, {"id": "d", "text": "VII --- 動眼神経", "short": "d"}, {"id": "e", "text": "VIII --- 迷走神経", "short": "e"}], "correct": ["a", "b"], "explanation": "脳神経：I嗅神経、II視神経、III動眼神経、IV滑車神経、V三叉神経、VI外転神経、VII顔面神経、VIII内耳神経、IX舌咽神経、X迷走神経、XI副神経、XII舌下神経。VIは外転神経、VIIは顔面神経、VIIIは内耳神経。"}, {"id": 169, "title": "トリアゾール系抗真菌薬はどれか。2つ選べ。", "category": "トリアゾール", "categoryShort": "トリアゾ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Omeprazole", "short": "a"}, {"id": "b", "text": "Fluconazole", "short": "b"}, {"id": "c", "text": "Voriconazole", "short": "c"}, {"id": "d", "text": "Lansoprazole", "short": "d"}, {"id": "e", "text": "Metronidazole", "short": "e"}], "correct": ["b", "c"], "explanation": "トリアゾール系抗真菌薬はフルコナゾール、ボリコナゾール、イトラコナゾール等。オメプラゾール・ランソプラゾールはPPI、メトロニダゾールはニトロイミダゾール系抗嫌気性菌薬。"}, {"id": 170, "title": "核酸増幅検査はどれか。2つ選べ。", "category": "核酸増幅", "categoryShort": "核酸増幅", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Western blotting", "short": "a"}, {"id": "b", "text": "Radioallergosorbent test", "short": "b"}, {"id": "c", "text": "Polymerase chain reaction", "short": "c"}, {"id": "d", "text": "Enzyme-linked immunosorbent assay", "short": "d"}, {"id": "e", "text": "Loop-mediated isothermal amplification", "short": "e"}], "correct": ["c", "e"], "explanation": "核酸増幅検査（NAAT）はPCRとLAMPが代表。Western blottingは蛋白検出、RASTはIgE測定、ELISAは酵素免疫測定。"}, {"id": 171, "title": "滅菌・消毒について正しいのはどれか。2つ選べ。", "category": "滅菌消毒", "categoryShort": "滅菌消毒", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "手指消毒には30%のエタノールが適している。", "short": "a"}, {"id": "b", "text": "オートクレーブは芽胞を滅菌することができる。", "short": "b"}, {"id": "c", "text": "100%のエタノールで芽胞を滅菌することができる。", "short": "c"}, {"id": "d", "text": "プリオンは100℃の煮沸により不活化することができる。", "short": "d"}, {"id": "e", "text": "オートクレーブは、2気圧、121℃の高圧蒸気を用いる方法である。", "short": "e"}], "correct": ["b", "e"], "explanation": "オートクレーブ（高圧蒸気滅菌）は121℃ 2気圧 20分で芽胞を含む全微生物を滅菌可能。手指消毒用エタノールは70%前後が最適で30%では効果不十分、100%は蛋白凝固が速く内部浸透せず芽胞は滅菌不能。プリオンは通常滅菌抵抗性で134℃長時間や水酸化ナトリウム処理が必要、100℃煮沸では不活化できない。"}, {"id": 172, "title": "可能性が高いのはどれか。（第115回医師国家試験D59より一部改変）", "category": "性感染症", "categoryShort": "性感染症", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "梅毒", "short": "a"}, {"id": "b", "text": "淋菌感染症", "short": "b"}, {"id": "c", "text": "性器ヘルペス", "short": "c"}, {"id": "d", "text": "クラミジア感染症", "short": "d"}, {"id": "e", "text": "尖圭コンジローマ", "short": "e"}], "correct": ["a"], "explanation": "無痛性の硬結を伴う外陰潰瘍（硬性下疳）と無痛性の鼠径リンパ節腫脹（横痃）は梅毒第1期の典型像。Treponema pallidum。淋菌は有痛性排膿、性器ヘルペスは有痛性多発小潰瘍、クラミジアは子宮頸管炎・尿道炎主体、尖圭コンジローマはHPVによる疣贅で潰瘍はきたさない。"}, {"id": 173, "title": "感染症と診断に有用な染色法の組み合わせとして正しいのはどれか。2つ選べ。", "category": "染色", "categoryShort": "染色", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "結核 --- Papanicolaou染色", "short": "a"}, {"id": "b", "text": "マラリア --- May-Giemsa染色", "short": "b"}, {"id": "c", "text": "伝染性単核球症 --- Grocott染色", "short": "c"}, {"id": "d", "text": "レジオネラ肺炎 --- Gimenez染色", "short": "d"}, {"id": "e", "text": "マイコプラズマ肺炎 --- Ziehl-Neelsen染色", "short": "e"}], "correct": ["b", "d"], "explanation": "マラリア原虫の診断はMay-Giemsa染色で赤血球内の原虫確認、レジオネラはGimenez染色で赤色桿菌。結核はZiehl-Neelsen（抗酸菌染色）、伝染性単核球症は異型リンパ球でGrocott（真菌用）ではない、マイコプラズマはグラム染色困難でPPLO培地やPCR。"}, {"id": 174, "title": "主としてマダニが媒介する疾患はどれか。2つ選べ。（第106回医師国家試験G16より一部改変）", "category": "媒介動物", "categoryShort": "媒介動物", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "重症熱性血小板減少症候群", "short": "a"}, {"id": "b", "text": "マラリア", "short": "b"}, {"id": "c", "text": "ライム病", "short": "c"}, {"id": "d", "text": "リーシュマニア感染症", "short": "d"}, {"id": "e", "text": "ペスト", "short": "e"}], "correct": ["a", "c"], "explanation": "マダニ媒介はSFTS（フタトゲチマダニ等）、ライム病（Borrelia burgdorferi）、日本紅斑熱、重症熱性血小板減少症候群。マラリアはハマダラカ（蚊）、リーシュマニアはサシチョウバエ、ペストはノミ（ネズミ）。"}, {"id": 175, "title": "Which of the following pathogens of pneumonia is the urinary antigen test available for in diagnosis? Choose two.", "category": "尿中抗原", "categoryShort": "尿中抗原", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Chlamydia psittaci", "short": "a"}, {"id": "b", "text": "Mycobacterium avium", "short": "b"}, {"id": "c", "text": "Legionella pneumophila", "short": "c"}, {"id": "d", "text": "Pseudomonas aeruginosa", "short": "d"}, {"id": "e", "text": "Streptococcus pneumoniae", "short": "e"}], "correct": ["c", "e"], "explanation": "肺炎の尿中抗原検査が有用なのはLegionella pneumophila SG1とStreptococcus pneumoniae。迅速診断で重症市中肺炎の初期治療決定に有用。C.psittaci、M.avium、P.aeruginosaには尿中抗原検査はない。"}, {"id": 176, "title": "Which of the following pathogens are obligate intracellular pathogens? Choose two.", "category": "細胞内寄生", "categoryShort": "細胞内寄", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Acinetobacter baumannii", "short": "a"}, {"id": "b", "text": "Chlamydia trachomatis", "short": "b"}, {"id": "c", "text": "Haemophilus influenzae", "short": "c"}, {"id": "d", "text": "Mycoplasma pneumoniae", "short": "d"}, {"id": "e", "text": "Orientia tsutsugamushi", "short": "e"}], "correct": ["b", "e"], "explanation": "偏性細胞内寄生菌はChlamydia trachomatis、Orientia tsutsugamushi（ツツガムシ病リケッチア）、Rickettsia等。人工培地では培養不能で細胞培養が必要。A.baumannii、H.influenzaeは細胞外増殖可能、M.pneumoniaeは細胞壁なしだがPPLO培地で増殖可能。"}, {"id": 177, "title": "病原体に関する説明として正しいのはどれか。2つ選べ。", "category": "病原体", "categoryShort": "病原体", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Streptococcus pneumoniaeはβ溶血性を示す。", "short": "a"}, {"id": "b", "text": "Enterococcus faeciumは腸内細菌科細菌である。", "short": "b"}, {"id": "c", "text": "Pseudomonas aeruginosaはブドウ糖を発酵し酪酸を産生する。", "short": "c"}, {"id": "d", "text": "Haemophilus influenzaeは発育にX因子とV因子を必要とする。", "short": "d"}, {"id": "e", "text": "Helicobacter pyloriは尿素を加水分解してアンモニアと二酸化炭素を発生する。", "short": "e"}], "correct": ["d", "e"], "explanation": "H.influenzaeはX因子（ヘミン）とV因子（NAD）を要しチョコレート寒天で発育。H.pyloriは強力なウレアーゼで尿素をアンモニアとCO2に分解し胃酸中和。S.pneumoniaeはα溶血、E.faeciumは腸球菌科（腸内細菌科ではない）、P.aeruginosaはブドウ糖非発酵菌で酪酸産生しない。"}, {"id": 178, "title": "抗酸菌染色に用いる染色液はどれか。2つ選べ。", "category": "染色", "categoryShort": "染色", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "クリスタルバイオレット", "short": "a"}, {"id": "b", "text": "サフラニン", "short": "b"}, {"id": "c", "text": "石炭酸フクシン", "short": "c"}, {"id": "d", "text": "メチレンブルー", "short": "d"}, {"id": "e", "text": "ヘマトキシリン", "short": "e"}], "correct": ["c", "d"], "explanation": "Ziehl-Neelsen抗酸菌染色は一次染色の石炭酸フクシン（カルボールフクシン）で赤く染め、脱色後にメチレンブルーで対比染色。クリスタルバイオレットはグラム染色一次染色、サフラニンはグラム染色対比染色、ヘマトキシリンはHE染色核染色。"}, {"id": 179, "title": "結核ワクチンおよび診断について、正しいものを2つ選べ。", "category": "結核ワクチン診断", "categoryShort": "結核ワク", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "BCGは結核菌群が持つRD1領域を欠く。", "short": "a"}, {"id": "b", "text": "IGRA検査で陽性化するのは結核菌群のみである。", "short": "b"}, {"id": "c", "text": "ツベルクリン反応の陽性化はBCG接種の影響を受けない。", "short": "c"}, {"id": "d", "text": "乳児のBCG接種でコッホ現象が見られた場合は結核感染を疑う。", "short": "d"}, {"id": "e", "text": "IGRAは結核菌特異抗原に対する液性免疫を指標とする診断法である。", "short": "e"}], "correct": ["a", "d"], "explanation": "BCGはRD1（ESAT-6/CFP-10領域）を欠損するためIGRAはBCG影響なし。コッホ現象（接種後10日以内に発赤・膿疱）は結核既感染を示唆し精査必要。IGRAは結核菌群以外にもM.kansasii等で陽性化しうる、ツ反はBCG影響受ける、IGRAは細胞性免疫（IFN-γ）指標で液性免疫ではない。"}, {"id": 180, "title": "非結核性抗酸菌はどれか。2つ選べ。", "category": "NTM", "categoryShort": "NTM", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Mycobacterium bovis", "short": "a"}, {"id": "b", "text": "Mycobacterium leprae", "short": "b"}, {"id": "c", "text": "Mycobacterium kansasii", "short": "c"}, {"id": "d", "text": "Mycobacterium tuberculosis", "short": "d"}, {"id": "e", "text": "Mycobacterium intracellulare", "short": "e"}], "correct": ["c", "e"], "explanation": "結核菌群（MTB complex）はM.tuberculosis、M.bovis、M.africanum等。非結核性抗酸菌（NTM）はそれ以外で、M.kansasii（肺NTM症）、M.intracellulare（MAC症）が代表。M.lepraeはらい菌で抗酸菌だがNTM分類では別扱いされることもあるが、本問ではkansasiiとintracellulareが正解。"}, {"id": 181, "title": "食中毒原因菌のうち、3類感染症の原因菌として誤っているものを2つ選べ。", "category": "食中毒", "categoryShort": "食中毒", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Vibrio cholerae", "short": "a"}, {"id": "b", "text": "Shigella sonnei", "short": "b"}, {"id": "c", "text": "Yersinia enterocolitica", "short": "c"}, {"id": "d", "text": "Salmonella Typhimurium", "short": "d"}, {"id": "e", "text": "Enterohemorrhagic Escherichia coli", "short": "e"}], "correct": ["c", "d"], "explanation": "3類感染症はコレラ（V.cholerae）、細菌性赤痢（Shigella spp.）、腸チフス・パラチフス、腸管出血性大腸菌感染症（EHEC）。Y.enterocoliticaは偽虫垂炎の原因だが3類ではない、S.Typhimuriumは感染性胃腸炎（5類定点）で3類ではない。"}, {"id": 182, "title": "食中毒原因菌とその症状の組み合わせとして正しいのはどれか。2つ選べ。", "category": "食中毒", "categoryShort": "食中毒", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Shigella sonnei ----- しぶり腹", "short": "a"}, {"id": "b", "text": "Vibrio cholerae ----- 偽虫垂炎症候群", "short": "b"}, {"id": "c", "text": "Bacillus cereus ----- 嘔吐", "short": "c"}, {"id": "d", "text": "Yersinia enterocolitica ----- 目の充血、いちご舌、手足の紅斑", "short": "d"}, {"id": "e", "text": "Salmonella Typhimurium ----- バラ疹、稽留熱", "short": "e"}], "correct": ["a", "c"], "explanation": "S.sonnei（赤痢）はテネスムスを伴うしぶり腹、B.cereus嘔吐型は短潜伏の嘔吐。V.choleraeは米のとぎ汁様大量水様便、偽虫垂炎はY.enterocolitica。眼充血・いちご舌・紅斑は川崎病や猩紅熱、バラ疹・稽留熱は腸チフス（S.Typhi）の特徴でTyphimuriumではない。"}, {"id": 183, "title": "ボツリヌス感染症に関する説明として誤っているのはどれか。2つ選べ。", "category": "ボツリヌス", "categoryShort": "ボツリヌ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "DPTワクチンによる予防が可能である。", "short": "a"}, {"id": "b", "text": "乳児に蜂蜜を与える場合は100℃で5分以上加熱したものを与える。", "short": "b"}, {"id": "c", "text": "真空パック等の酸素が遮断された状態の食材中で菌が増殖し感染を起こす。", "short": "c"}, {"id": "d", "text": "毒素が神経筋接合部でのアセチルコリンの放出を抑制し、弛緩性の麻痺を引き起こす。", "short": "d"}, {"id": "e", "text": "毒素は熱に弱いため、食材の加熱により中毒を防ぐことができる。", "short": "e"}], "correct": ["a", "b"], "explanation": "ボツリヌスは偏性嫌気性C.botulinumが真空パック等で増殖し毒素産生。毒素は神経筋接合部のACh放出抑制で弛緩性麻痺、80℃30分で不活化。DPTはジフテリア・百日咳・破傷風でボツリヌスは含まず予防不能。乳児ボツリヌスは蜂蜜中の芽胞が原因で、100℃加熱では芽胞は死滅せず、1歳未満は蜂蜜自体を与えない。"}, {"id": 184, "title": "破傷風およびその原因菌に関する説明として誤っているのはどれか。2つ選べ。", "category": "破傷風", "categoryShort": "破傷風", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "痙攣性麻痺を引き起こす毒素としてテタノリジンを産生する。", "short": "a"}, {"id": "b", "text": "光などの外来刺激により痙攣が誘発される。", "short": "b"}, {"id": "c", "text": "土壌中の芽胞が組織に侵入して感染がおこる。", "short": "c"}, {"id": "d", "text": "培養が容易であるため、診断は培養同定検査に基づいて行う。", "short": "d"}, {"id": "e", "text": "破傷風トキソイドによる能動免疫により発病予防が可能である。", "short": "e"}], "correct": ["a", "d"], "explanation": "破傷風菌C.tetaniはテタノスパスミン（痙性麻痺）とテタノリジン（溶血毒素）産生。痙性麻痺（強直性痙攣）を起こすのはテタノスパスミンで、テタノリジンは溶血毒素。光・音刺激で痙攣誘発、土壌芽胞が創傷侵入、トキソイドで予防可。培養は嫌気性で困難、診断は臨床的に行い培養同定ではない。"}, {"id": 185, "title": "CTX-M型の基質特異性拡張型β-ラクタマーゼ（ESBL）では分解されないβラクタム系薬はどれか。2つ選べ。", "category": "ESBL", "categoryShort": "ESBL", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アズトレオナム（モノバクタム系薬）", "short": "a"}, {"id": "b", "text": "セフトリアキソン（セファロスポリン系薬）", "short": "b"}, {"id": "c", "text": "セフメタゾール（セファマイシン系薬）", "short": "c"}, {"id": "d", "text": "ピペラシリン（ペニシリン系薬）", "short": "d"}, {"id": "e", "text": "メロペネム（カルバペネム系薬）", "short": "e"}], "correct": ["c", "e"], "explanation": "CTX-M型ESBLはペニシリン、第1-3世代セフェム、アズトレオナムを分解するが、セファマイシン（セフメタゾール、セフォキシチン等）とカルバペネム（メロペネム等）には安定で分解されない。ESBL産生菌の治療はセファマイシンやカルバペネム、βラクタマーゼ阻害薬配合剤が選択肢だが重症はカルバペネムが推奨。"}, {"id": 186, "title": "抗菌薬関連大腸炎の代表的な原因菌はどれか。2つ選べ。", "category": "抗菌薬関連腸炎", "categoryShort": "抗菌薬関", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Escherichia coli", "short": "a"}, {"id": "b", "text": "Clostridioides difficile", "short": "b"}, {"id": "c", "text": "Clostridium botulinum", "short": "c"}, {"id": "d", "text": "Klebsiella oxytoca", "short": "d"}, {"id": "e", "text": "Streptococcus agalactiae", "short": "e"}], "correct": ["b", "d"], "explanation": "抗菌薬関連腸炎の代表はClostridioides difficile（偽膜性腸炎、CDI）とKlebsiella oxytoca（出血性大腸炎、特にペニシリン系後）。E.coliはEHEC等で抗菌薬関連ではない、C.botulinumはボツリヌス、S.agalactiaeはGBS。"}, {"id": 187, "title": "感染症と聴取すべき病歴の組み合わせとして正しいのはどれか。2つ選べ。", "category": "問診", "categoryShort": "問診", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "オウム病 --- 鳥類の飼育や鳥小屋の清掃", "short": "a"}, {"id": "b", "text": "ツツガムシ病 --- 海外渡航", "short": "b"}, {"id": "c", "text": "夏型過敏性肺炎 --- 抗菌薬の内服", "short": "c"}, {"id": "d", "text": "破傷風 --- 牛肉の生食", "short": "d"}, {"id": "e", "text": "レジオネラ肺炎 --- 温泉や24時間風呂での入浴", "short": "e"}], "correct": ["a", "e"], "explanation": "オウム病（Chlamydia psittaci）は鳥類の糞吸入、レジオネラ肺炎は温泉・循環式浴槽・冷却塔のエアロゾル吸入が病歴聴取ポイント。ツツガムシ病は山林・草むらでの刺し口、夏型過敏性肺炎は住居のカビ（Trichosporon）、破傷風は土壌汚染創傷歴。"}, {"id": 188, "title": "抗ヘルペス薬として誤っているのはどれか。2つ選べ。", "category": "抗ヘルペス", "categoryShort": "抗ヘルペ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アシクロビル", "short": "a"}, {"id": "b", "text": "オセルタミビル", "short": "b"}, {"id": "c", "text": "バラシクロビル", "short": "c"}, {"id": "d", "text": "ファムシクロビル", "short": "d"}, {"id": "e", "text": "リトナビル", "short": "e"}], "correct": ["b", "e"], "explanation": "抗ヘルペス薬はアシクロビル、バラシクロビル（プロドラッグ）、ファムシクロビル、バラシクロビルの活性体。オセルタミビルはノイラミニダーゼ阻害の抗インフル薬、リトナビルはHIVプロテアーゼ阻害薬（ブースト用）。"}, {"id": 189, "title": "梅毒の診断に関する次の記述のうち正しいものはどれか。2つ選べ。", "category": "梅毒診断", "categoryShort": "梅毒診断", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "TPHAは治療判定には不向きである。", "short": "a"}, {"id": "b", "text": "TPHAは感染の早期から陽性となりやすい。", "short": "b"}, {"id": "c", "text": "STSはカルジオリピンの血中濃度を測定する方法である。", "short": "c"}, {"id": "d", "text": "STSでは自己免疫性疾患や妊娠が生物学的偽陽性の原因となりやすい。", "short": "d"}, {"id": "e", "text": "TPHAは梅毒トレポネーマ由来成分の血中濃度を測定する方法である。", "short": "e"}], "correct": ["a", "d"], "explanation": "STS（RPR/VDRL）はカルジオリピンを抗原とする脂質抗原試験で活性指標、治療で低下。TPHA（TPLA含む）はトレポネーマ抗原試験で一度陽性になると長期持続し治療判定不向き。STSは妊娠・SLE等で生物学的偽陽性（BFP）をきたす。STSは濃度ではなく抗体価、TPHAは抗体検出であり成分濃度測定ではない、早期はSTSが先に陽性化しやすい。"}, {"id": 190, "title": "ワクチンにより予防可能なウイルス感染症はどれか。2つ選べ。", "category": "ワクチン", "categoryShort": "ワクチン", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "風疹", "short": "a"}, {"id": "b", "text": "B型肝炎", "short": "b"}, {"id": "c", "text": "C型肝炎", "short": "c"}, {"id": "d", "text": "咽頭結膜熱", "short": "d"}, {"id": "e", "text": "口唇ヘルペス", "short": "e"}], "correct": ["a", "b"], "explanation": "風疹はMRワクチン、B型肝炎はHBワクチンで予防可能。C型肝炎、咽頭結膜熱（アデノウイルス）、口唇ヘルペス（HSV-1）には実用化ワクチンはない。"}, {"id": 191, "title": "Chlamydia trachomatisによる尿道炎に対する抗菌薬として誤っているのはどれか。2つ選べ。", "category": "クラミジア治療", "categoryShort": "クラミジ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アジスロマイシン", "short": "a"}, {"id": "b", "text": "アミカシン", "short": "b"}, {"id": "c", "text": "ペニシリンG", "short": "c"}, {"id": "d", "text": "ミノサイクリン", "short": "d"}, {"id": "e", "text": "レボフロキサシン", "short": "e"}], "correct": ["b", "c"], "explanation": "C.trachomatis尿道炎は偏性細胞内寄生で、細胞移行性の高いアジスロマイシン、ミノサイクリン、レボフロキサシンが有効。ペニシリンG（細胞壁合成阻害、細胞内移行不良）とアミカシン（アミノグリコシド、グラム陰性用でクラミジア無効）は誤り。"}, {"id": 192, "title": "百日せきに関する説明として正しいのはどれか。", "category": "百日咳", "categoryShort": "百日咳", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "2類感染症である。", "short": "a"}, {"id": "b", "text": "抗菌薬が無効である。", "short": "b"}, {"id": "c", "text": "感染症法で就業制限がある。", "short": "c"}, {"id": "d", "text": "ワクチンにより予防可能な疾患である。", "short": "d"}, {"id": "e", "text": "基本再生産数はインフルエンザよりも小さい。", "short": "e"}], "correct": ["d"], "explanation": "百日咳（Bordetella pertussis）は5類全数、DPTワクチンで予防可能、マクロライド（エリスロマイシン等）が有効で早期投与で感染性低下、R0は12-17とインフル（1-2）よりはるかに大きい。就業制限はあるが感染症法の就業制限は3類等が主体、2類ではない。"}, {"id": 193, "title": "梅毒の症状として誤っているのはどれか。", "category": "梅毒症状", "categoryShort": "梅毒症状", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "脊髄癆", "short": "a"}, {"id": "b", "text": "硬性下疳", "short": "b"}, {"id": "c", "text": "尖圭コンジローマ", "short": "c"}, {"id": "d", "text": "バラ疹", "short": "d"}, {"id": "e", "text": "無痛性横痃", "short": "e"}], "correct": ["c"], "explanation": "梅毒症状：I期 硬性下疳と無痛性横痃、II期 バラ疹・扁平コンジローマ、III期 ゴム腫、IV期 脊髄癆・進行麻痺。尖圭コンジローマはHPVによる疣贅で梅毒ではない、梅毒では扁平コンジローマと呼称。"}, {"id": 194, "title": "原虫が持たない構造はどれか。", "category": "原虫", "categoryShort": "原虫", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "核膜", "short": "a"}, {"id": "b", "text": "細胞膜", "short": "b"}, {"id": "c", "text": "細胞壁", "short": "c"}, {"id": "d", "text": "ゴルジ体", "short": "d"}, {"id": "e", "text": "ミトコンドリア", "short": "e"}], "correct": ["c"], "explanation": "原虫は真核生物の単細胞生物で核膜、細胞膜、ゴルジ体、ミトコンドリアを有するが、細菌や真菌のような堅牢な細胞壁は持たない。アメーバ、マラリア原虫、トリパノソーマ等が含まれる。"}, {"id": 195, "title": "疾患と病原体の組み合わせのうち正しいのはどれか。2つ選べ。", "category": "真菌症", "categoryShort": "真菌症", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "赤痢 --- Candida albicans", "short": "a"}, {"id": "b", "text": "鵞口瘡 --- Cryptococcus neoformans", "short": "b"}, {"id": "c", "text": "ムーコル症 --- Rhizopus oryzae", "short": "c"}, {"id": "d", "text": "夏型過敏性肺炎 --- Trichosporon asahii", "short": "d"}, {"id": "e", "text": "ニューモシスチス肺炎 --- Aspergillus fumigatus", "short": "e"}], "correct": ["c", "d"], "explanation": "ムーコル症原因はRhizopus oryzae等ムーコル目、夏型過敏性肺炎はTrichosporon asahii（旧T.mucoides）の胞子吸入によるIII型アレルギー。赤痢はShigella/Entamoeba、鵞口瘡はCandida albicans、PJPはPneumocystis jirovecii。"}, {"id": 196, "title": "カンジダ症およびその原因病原体について正しい説明はどれか。", "category": "カンジダ症", "categoryShort": "カンジダ", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "病型としては、肺感染症が最も多い。", "short": "a"}, {"id": "b", "text": "原因としてはCandida albicansが最も多い。", "short": "b"}, {"id": "c", "text": "Candida albicansは細胞壁の周囲に莢膜を有する。", "short": "c"}, {"id": "d", "text": "カンジダ血症では血清ガラクトマンナン抗原が陽性となる。", "short": "d"}, {"id": "e", "text": "Candida glabrataにはキャンディン系抗真菌薬が無効である。", "short": "e"}], "correct": ["b"], "explanation": "カンジダ症の最多起因菌はCandida albicans。病型は口腔・食道・血流感染が多く肺は稀。莢膜を有するのはCryptococcus、ガラクトマンナンはAspergillus、β-Dグルカンがカンジダで陽性。C.glabrataにもキャンディン系は有効（アゾール耐性傾向）。"}, {"id": 197, "title": "不活化ワクチンはどれか。", "category": "ワクチン", "categoryShort": "ワクチン", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "MRワクチン", "short": "a"}, {"id": "b", "text": "水痘ワクチン", "short": "b"}, {"id": "c", "text": "日本脳炎ワクチン", "short": "c"}, {"id": "d", "text": "ムンプスワクチン", "short": "d"}, {"id": "e", "text": "ロタウイルスワクチン", "short": "e"}], "correct": ["c"], "explanation": "不活化ワクチンは日本脳炎、インフルエンザ、HPV、A型肝炎等。MR・水痘・ムンプス・ロタ・BCGは生ワクチン。mRNAコロナワクチンは核酸ワクチンで不活化ではないが広義に非生ワクチン。"}, {"id": 198, "title": "COVID-19ワクチンの接種経路として適切なのはどれか。", "category": "ワクチン接種経路", "categoryShort": "ワクチン", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "皮内", "short": "a"}, {"id": "b", "text": "皮下", "short": "b"}, {"id": "c", "text": "経口", "short": "c"}, {"id": "d", "text": "筋肉内", "short": "d"}, {"id": "e", "text": "静脈内", "short": "e"}], "correct": ["d"], "explanation": "COVID-19 mRNAワクチンは筋肉内接種（三角筋）が適切で免疫原性高く局所副反応少ない。皮下では効果減弱、静脈内は禁忌。HPVも筋注、MR・水痘は皮下。"}, {"id": 199, "title": "ワクチンの筋肉注射について正しい説明はどれか。2つ選べ。", "category": "ワクチン筋注", "categoryShort": "ワクチン", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "接種後はしっかりと揉んでもらう。", "short": "a"}, {"id": "b", "text": "不活化ワクチンの接種部位としては適さない。", "short": "b"}, {"id": "c", "text": "成人では三角筋が接種部位として最も適している。", "short": "c"}, {"id": "d", "text": "注入前には必ずシリンジを引いて血液の逆流を確認する。", "short": "d"}, {"id": "e", "text": "接種時、被接種者は手を腰に当てず、腕を下ろした方がよい。", "short": "e"}], "correct": ["c", "e"], "explanation": "筋注は成人三角筋中央（肩峰3横指下）、被接種者は腕を下ろし三角筋弛緩。接種後は揉まずに軽く押さえる、血液逆流確認（吸引）は不要と近年改定、不活化ワクチンこそ筋注が適しており免疫原性高い。"}, {"id": 200, "title": "感染症法の類型分類について正しい説明はどれか。", "category": "感染症法", "categoryShort": "感染症法", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "一類は全てウイルス感染症である。", "short": "a"}, {"id": "b", "text": "二類は全て節足動物媒介性である。", "short": "b"}, {"id": "c", "text": "三類は全て細菌感染症である。", "short": "c"}, {"id": "d", "text": "四類は全て呼吸器系の感染症である。", "short": "d"}, {"id": "e", "text": "五類は全て全数把握の対象である。", "short": "e"}], "correct": ["c"], "explanation": "3類はコレラ、細菌性赤痢、腸管出血性大腸菌感染症、腸チフス・パラチフスで全て細菌性腸管感染症。1類はエボラ等ウイルスと細菌（ペスト）含む、2類は結核等呼吸器主体、4類は動物媒介・節足動物媒介で多様、5類は全数と定点がある。"}, {"id": 201, "title": "アデノウイルスによって起こる疾患はどれか。2つ選べ。", "category": "アデノウイルス", "categoryShort": "アデノウ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "手足口病", "short": "a"}, {"id": "b", "text": "咽頭結膜熱", "short": "b"}, {"id": "c", "text": "出血性結膜炎", "short": "c"}, {"id": "d", "text": "ヘルパンギーナ", "short": "d"}, {"id": "e", "text": "流行性角結膜炎", "short": "e"}], "correct": ["b", "e"], "explanation": "アデノウイルスは咽頭結膜熱（プール熱、血清型3・4・7）、流行性角結膜炎（EKC、血清型8・19・37）、咽頭炎、肺炎、胃腸炎などを起こす。手足口病はコクサッキーA16・エンテロ71、出血性結膜炎はエンテロウイルス70・コクサッキーA24、ヘルパンギーナはコクサッキーA群が主な原因でアデノウイルスではない。"}, {"id": 202, "title": "PCRに必要な試薬・機器として誤っているのはどれか。2つ選べ。", "category": "PCR", "categoryShort": "PCR", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Mg2+", "short": "a"}, {"id": "b", "text": "EDTA", "short": "b"}, {"id": "c", "text": "dNTP", "short": "c"}, {"id": "d", "text": "TEバッファー", "short": "d"}, {"id": "e", "text": "サーマルサイクラー", "short": "e"}], "correct": ["b", "d"], "explanation": "PCRに必要なのは鋳型DNA、プライマー、dNTP、耐熱性DNAポリメラーゼ（Taq）、Mg2+（補因子）、緩衝液、サーマルサイクラー。EDTAはMg2+をキレートし反応を阻害するためPCR反応液には添加しない。TEバッファー（Tris-EDTA）はDNA保存用でEDTAを含むためPCRでは不適。"}, {"id": 203, "title": "サンプルa,b,cに関して、リアルタイムPCRによる定量を実施した。基準物質のCt値が25、a,b,cのCtはそれぞれ22,26,32であった。添加したサンプルの初期量について正しい説明はどれか。", "category": "PCR", "categoryShort": "PCR", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "aは基準物質の約1/8倍である。", "short": "a"}, {"id": "b", "text": "bは基準物質の約1.2倍である。", "short": "b"}, {"id": "c", "text": "cは基準物質の1000倍以上である。", "short": "c"}, {"id": "d", "text": "aはbの約16倍である。", "short": "d"}, {"id": "e", "text": "cはbの約1000倍である。", "short": "e"}], "correct": ["d"], "explanation": "リアルタイムPCRではCt値が1小さいと鋳型量は約2倍多い。基準25に対しa22は3低いので2^3=8倍多い、b26は1高いので1/2倍、c32は7高いので1/128倍。a22とb26の差は4なのでaはbの2^4=16倍多い。cはbより6高いので1/64倍であり、1000倍ではない。"}, {"id": 204, "title": "PCRで2つのプライマーのTm値がともに60℃の時、適切なアニーリング温度はどれか。", "category": "PCR", "categoryShort": "PCR", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "12℃", "short": "a"}, {"id": "b", "text": "36℃", "short": "b"}, {"id": "c", "text": "57℃", "short": "c"}, {"id": "d", "text": "65℃", "short": "d"}, {"id": "e", "text": "82℃", "short": "e"}], "correct": ["c"], "explanation": "アニーリング温度（Ta）はプライマーのTm値より3-5℃低く設定するのが原則。Tm60℃なら55-57℃前後が適切。低すぎると非特異的増幅、高すぎると増幅効率低下を来す。12℃や36℃は低すぎ、65℃・82℃はTm以上で結合しない。"}, {"id": 205, "title": "PCRについて正しいのはどれか。", "category": "PCR", "categoryShort": "PCR", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "変性温度は70℃付近に設定する。", "short": "a"}, {"id": "b", "text": "プライマーのTm値は70℃付近に設定する。", "short": "b"}, {"id": "c", "text": "Taqポリメラーゼの至適反応温度は37℃である。", "short": "c"}, {"id": "d", "text": "アニーリングの温度はTm値よりも10℃高い温度とする。", "short": "d"}, {"id": "e", "text": "アニーリング温度が低いほど非特異的な増幅が起こりやすい。", "short": "e"}], "correct": ["e"], "explanation": "PCRの変性は94-98℃、プライマーTmは55-65℃程度、Taq至適は72℃、アニーリングはTmより3-5℃低く設定する。アニーリング温度が低すぎるとプライマーが非特異的部位にも結合し非特異増幅が起こりやすくなる。70℃変性では不十分、Tm70℃は高すぎ、37℃は大腸菌由来ポリメラーゼの至適、Tmより10℃高いと結合しない。"}, {"id": 206, "title": "PCRについて正しいのはどれか。", "category": "PCR", "categoryShort": "PCR", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "定量的PCRでは蛍光物質を用いる。", "short": "a"}, {"id": "b", "text": "定量的PCRではRNAを鋳型として用いる。", "short": "b"}, {"id": "c", "text": "逆転写PCRではDNAポリメラーゼを用いない。", "short": "c"}, {"id": "d", "text": "逆転写PCRではPCRの前にcDNAからmRNAを合成する。", "short": "d"}, {"id": "e", "text": "マルチプレックスPCRでは二種類以上のDNAポリメラーゼを用いる。", "short": "e"}], "correct": ["a"], "explanation": "定量的（リアルタイム）PCRではSYBR GreenやTaqManプローブ等の蛍光物質で増幅をリアルタイムにモニターする。鋳型はDNA、RNAを対象とする場合は逆転写後に行う。逆転写PCRは逆転写酵素でmRNAからcDNA合成後にDNAポリメラーゼでPCRする。cDNAからmRNA合成ではない。マルチプレックスは複数プライマーセットを同一反応で用いるがポリメラーゼは通常1種類。"}, {"id": 207, "title": "PCRで適切なアニーリング温度 (Ta) について正しいのはどれか。", "category": "PCR", "categoryShort": "PCR", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "常に50℃に設定する。", "short": "a"}, {"id": "b", "text": "伸長温度よりも約2-3℃高く設定する。", "short": "b"}, {"id": "c", "text": "増幅するDNA断片の長さを考慮して設定する。", "short": "c"}, {"id": "d", "text": "変性温度よりも約5-10℃高い温度に設定する。", "short": "d"}, {"id": "e", "text": "プライマーのTm値よりも約3-5℃低い温度に設定する。", "short": "e"}], "correct": ["e"], "explanation": "適切なアニーリング温度はプライマーのTm値より3-5℃低く設定する。常に50℃ではなくプライマー配列依存、伸長温度（72℃）より低く、変性温度（94℃）よりはるかに低く設定する。断片長は伸長時間に影響するがTaには直接関係しない。"}, {"id": 208, "title": "Taqポリメラーゼの至適温度について正しいのはどれか。", "category": "PCR", "categoryShort": "PCR", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "25℃", "short": "a"}, {"id": "b", "text": "37℃", "short": "b"}, {"id": "c", "text": "50℃", "short": "c"}, {"id": "d", "text": "60℃", "short": "d"}, {"id": "e", "text": "72℃", "short": "e"}], "correct": ["e"], "explanation": "Thermus aquaticus由来のTaqポリメラーゼは耐熱性で至適温度は72℃前後、伸長反応は72℃で行う。25℃は室温、37℃はヒト・マウス酵素の至適、50-60℃はアニーリング域。"}, {"id": 209, "title": "逆転写PCRについて正しいのはどれか。2つ選べ。", "category": "PCR", "categoryShort": "PCR", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "PCRの後に逆転写を行う。", "short": "a"}, {"id": "b", "text": "六種類のプライマーを用いる。", "short": "b"}, {"id": "c", "text": "cDNAを合成したのち、RNaseHでmRNAを分解する。", "short": "c"}, {"id": "d", "text": "ミトコンドリア由来のDNAポリメラーゼγを用いる。", "short": "d"}, {"id": "e", "text": "リアルタイムPCRと組み合わせることで、転写量の評価が可能である。", "short": "e"}], "correct": ["c", "e"], "explanation": "逆転写PCRは逆転写酵素でmRNAからcDNAを合成後、RNase H活性でRNAを分解しDNAポリメラーゼで第二鎖合成、続いてPCR増幅する。RT-qPCR（リアルタイム逆転写PCR）によりmRNA転写量を定量可能。PCR後に逆転写は逆、六種プライマーはLAMP、ミトコンドリアPolγは無関係。"}, {"id": 210, "title": "肝炎ウイルスに関して正しい説明はどれか。2つ選べ。", "category": "肝炎ウイルス", "categoryShort": "肝炎ウイ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "A型肝炎ウイルスはピコルナウイルス科に属する。", "short": "a"}, {"id": "b", "text": "B型肝炎ウイルスはDNAウイルスである。", "short": "b"}, {"id": "c", "text": "C型肝炎ウイルスは宿主のゲノムDNAに挿入される。", "short": "c"}, {"id": "d", "text": "D型肝炎ウイルスは原核細胞に寄生する。", "short": "d"}, {"id": "e", "text": "E型肝炎ウイルスはエンベロープを有する。", "short": "e"}], "correct": ["a", "b"], "explanation": "A型肝炎はピコルナウイルス科ヘパトウイルス属のRNAウイルス、B型はヘパドナウイルス科のDNAウイルスで逆転写を経て複製しcccDNAを形成。C型はフラビウイルス科でRNAウイルス、宿主ゲノムに挿入されない。D型はサテライトウイルスでHBsAgが必要。E型はヘペウイルス科で非エンベロープ（血液中では準エンベロープ）。"}, {"id": 211, "title": "ウイルスに関して正しい説明はどれか。2つ選べ。", "category": "ウイルス", "categoryShort": "ウイルス", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "黄熱ウイルスはトガウイルス科に属する。", "short": "a"}, {"id": "b", "text": "ヘルペスウイルスはエンベロープを持たない。", "short": "b"}, {"id": "c", "text": "パルボウイルスB19は一本鎖DNAウイルスである。", "short": "c"}, {"id": "d", "text": "インフルエンザウイルスはモノネガウイルス目に属する。", "short": "d"}, {"id": "e", "text": "伝染性軟属腫の原因ウイルスはポックスウイルス科に属する。", "short": "e"}], "correct": ["c", "e"], "explanation": "パルボウイルスB19は一本鎖DNAウイルスで再生不良性クリーゼ、伝染性軟属腫はポックスウイルス科MCV。黄熱はフラビウイルス科、ヘルペスはエンベロープ有、インフルエンザはブニヤ目ではなくオルソミクソウイルス科（分節マイナスRNA）でモノネガ（非分節マイナスRNA）には属さない。"}, {"id": 212, "title": "ポックスウイルスに関して正しい説明はどれか。2つ選べ。", "category": "ポックスウイルス", "categoryShort": "ポックス", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ポックスウイルスはエーテルに耐性がある。", "short": "a"}, {"id": "b", "text": "水痘はポックスウイルスによって引き起こされる。", "short": "b"}, {"id": "c", "text": "ポックスウイルスは複製のために核に入る必要がある。", "short": "c"}, {"id": "d", "text": "ポックスウイルスはエンベロープを持たないウイルスである。", "short": "d"}, {"id": "e", "text": "ポックスウイルスは最も大きく、最も複雑なDNAウイルスの一つである。", "short": "e"}], "correct": ["a", "e"], "explanation": "ポックスウイルスはエーテル耐性（エンベロープありだが耐性）、細胞質で独自に複製し核に入る必要なし、エンベロープを有し、天然痘・ワクチニア・伝染性軟属腫を起こす最も大きく複雑なDNAウイルス。水痘はヘルペスウイルス科VZV。"}, {"id": 213, "title": "遺伝子に関して正しい説明はどれか。2つ選べ。", "category": "遺伝子", "categoryShort": "遺伝子", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "TGAはストップをコードする。", "short": "a"}, {"id": "b", "text": "ATGはメチオニンをコードする。", "short": "b"}, {"id": "c", "text": "真核生物はポリシストロニックである。", "short": "c"}, {"id": "d", "text": "シャイン-ダルガノ配列は+30に位置する。", "short": "d"}, {"id": "e", "text": "岡崎フラグメントは相補的DNA（cDNA）である。", "short": "e"}], "correct": ["a", "b"], "explanation": "TGAはストップコドンの一つ（TAA,TAG,TGA）、ATGはスタートコドンでメチオニンをコード。真核生物は通常モノシストロニック、原核生物がポリシストロニック。シャイン-ダルガノ配列は原核生物のリボソーム結合配列で開始コドン上流-10前後。岡崎フラグメントはラギング鎖の不連続複製断片でcDNAではない。"}, {"id": 214, "title": "正しい説明はどれか。2つ選べ。", "category": "遺伝子", "categoryShort": "遺伝子", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "レトロウイルスは宿主DNAに挿入される。", "short": "a"}, {"id": "b", "text": "ポリオウイルスはDNAポリメラーゼを持つ。", "short": "b"}, {"id": "c", "text": "インフルエンザウイルスは転写によってATPを得る。", "short": "c"}, {"id": "d", "text": "ほとんどのコドンは2つ以上のアミノ酸をコードする。", "short": "d"}, {"id": "e", "text": "ほとんどのアミノ酸は2つ以上のコドンによってコードされる。", "short": "e"}], "correct": ["a", "e"], "explanation": "レトロウイルスは逆転写後にプロウイルスとして宿主ゲノムに組み込まれる。ポリオはRNAウイルスでRNA依存性RNAポリメラーゼを持つがDNAポリは持たない。インフルは宿主細胞の代謝でATPを得る。コドンは縮重性があり1コドン1アミノ酸だが、ほとんどのアミノ酸は2つ以上のコドンにコードされる（例：ロイシン6コドン）。"}, {"id": 215, "title": "正しい説明はどれか。2つ選べ。", "category": "分子生物学", "categoryShort": "分子生物", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "逆転写酵素はRNAテンプレートからDNAを合成する。", "short": "a"}, {"id": "b", "text": "転移RNA（tRNA）はpre-mRNAのスプライシングに関与する。", "short": "b"}, {"id": "c", "text": "メッセンジャーRNA（mRNA）はリボソームで蛋白質に翻訳される。", "short": "c"}, {"id": "d", "text": "RNA依存性RNAポリメラーゼはDNAテンプレートからRNAを合成する。", "short": "d"}, {"id": "e", "text": "リボソームRNA（rRNA）はタンパク質合成のテンプレートとして機能する。", "short": "e"}], "correct": ["a", "c"], "explanation": "逆転写酵素はRNAからDNA合成、mRNAはリボソームで蛋白質に翻訳される。tRNAはアミノ酸運搬、スプライシングはsnRNA。RNA依存性RNAポリメラーゼはRNAからRNA合成、DNAからRNA合成はDNA依存性RNAポリメラーゼ。rRNAはリボソーム構成と触媒機能でテンプレートはmRNA。"}, {"id": 216, "title": "正しい説明はどれか。2つ選べ。", "category": "代謝", "categoryShort": "代謝", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "発酵には酸素が必要である。", "short": "a"}, {"id": "b", "text": "クレブス回路は嫌気的条件で行われる。", "short": "b"}, {"id": "c", "text": "ATPは細胞の主要なエネルギー通貨である。", "short": "c"}, {"id": "d", "text": "細菌の解糖系はペリプラズム内で行われる。", "short": "d"}, {"id": "e", "text": "偏性嫌気性菌は発酵によってエネルギーを得る。", "short": "e"}], "correct": ["c", "e"], "explanation": "ATPは主要エネルギー通貨。偏性嫌気性菌は酸素を利用できないため発酵や嫌気呼吸でエネルギーを得る。発酵は酸素不要、クレブス回路（TCA）は好気条件、解糖系は細胞質で行われる。"}, {"id": 217, "title": "正しい説明はどれか。2つ選べ。", "category": "核酸", "categoryShort": "核酸", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "DNAは3'側から5'側に合成される。", "short": "a"}, {"id": "b", "text": "アンチセンスはcDNAと同義である。", "short": "b"}, {"id": "c", "text": "アンビセンスはアンチセンスと同義である。", "short": "c"}, {"id": "d", "text": "一本鎖プラスRNA（ssRNA+）はmRNAに相当する。", "short": "d"}, {"id": "e", "text": "一本鎖マイナスRNA（ssRNA-）はRNA依存性RNAポリメラーゼを必要とする。", "short": "e"}], "correct": ["d", "e"], "explanation": "DNAは5'→3'方向に合成、ssRNA+はそのままmRNAとして機能しリボソームで翻訳可能、ssRNA-は相補鎖合成にRdRpが必要。アンチセンスはmRNA相補鎖、cDNAはmRNAから合成したDNAで同義ではない。アンビセンスは一部プラス一部マイナスの両義性ゲノム。"}, {"id": 218, "title": "正しい説明はどれか。2つ選べ。", "category": "細胞生物学", "categoryShort": "細胞生物", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "翻訳は細胞の核で行われる。", "short": "a"}, {"id": "b", "text": "リボソームはmRNA合成の場である。", "short": "b"}, {"id": "c", "text": "DNA複製は細胞周期のS期に行われる。", "short": "c"}, {"id": "d", "text": "有糸分裂は4つの娘細胞の形成をもたらす。", "short": "d"}, {"id": "e", "text": "転写はDNAテンプレートからmRNAを合成する過程である。", "short": "e"}], "correct": ["c", "e"], "explanation": "DNA複製は細胞周期S期、転写はDNAからmRNA合成。翻訳は細胞質のリボソーム、有糸分裂は2娘細胞、減数分裂が4娘細胞、mRNA合成は核のRNAポリメラーゼ。"}, {"id": 219, "title": "正しい説明はどれか。2つ選べ。", "category": "代謝", "categoryShort": "代謝", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "代謝は異化作用と発酵を指す。", "short": "a"}, {"id": "b", "text": "同化作用には酸素が必要である。", "short": "b"}, {"id": "c", "text": "異化作用は消費するよりも多くのATPを生成する。", "short": "c"}, {"id": "d", "text": "偏性嫌気性菌は呼吸によってのみエネルギーを得る。", "short": "d"}, {"id": "e", "text": "異化作用は大きな分子を小さな分子に分解することを指す。", "short": "e"}], "correct": ["c", "e"], "explanation": "代謝は同化と異化の総称、異化は大分子を小分子に分解し消費より多くのATPを生成。同化は小分子から大分子合成でATP消費、酸素必須ではない。偏性嫌気性菌は発酵主体で呼吸のみではない。"}, {"id": 220, "title": "発熱性好中球減少症で特に考慮すべき感染症はどれか。2つ選べ。", "category": "好中球減少症", "categoryShort": "好中球減", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "肺結核", "short": "a"}, {"id": "b", "text": "カンジダ血症", "short": "b"}, {"id": "c", "text": "伝染性単核症", "short": "c"}, {"id": "d", "text": "サイトメガロウイルス肺炎", "short": "d"}, {"id": "e", "text": "侵襲性肺アスペルギルス症", "short": "e"}], "correct": ["b", "e"], "explanation": "発熱性好中球減少症（FN）では好中球減少によりカンジダ血症、侵襲性肺アスペルギルス症、ムーコル症、緑膿菌菌血症等が重要。肺結核は好中球減少とは直接関係なく、伝染性単核症はEBVで健常若年、CMV肺炎は細胞性免疫低下でFNよりT細胞抑制で問題。"}, {"id": 221, "title": "正しい説明はどれか。2つ選べ。", "category": "ワクチン", "categoryShort": "ワクチン", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "生ワクチンは病原性の高い株を使用する。", "short": "a"}, {"id": "b", "text": "ワクチンは受動免疫を提供することで機能する。", "short": "b"}, {"id": "c", "text": "集団免疫は免疫を持っていない個人も保護する。", "short": "c"}, {"id": "d", "text": "ブースターとはワクチンの効果が弱まる現象である。", "short": "d"}, {"id": "e", "text": "ワクチンのアジュバントとして水酸化アルミニウムが知られている。", "short": "e"}], "correct": ["c", "e"], "explanation": "生ワクチンは弱毒株、ワクチンは能動免疫、集団免疫は接種率上昇で非免疫者も間接的に保護、ブースターは追加接種で免疫増強、効果減弱はwaning。アジュバントとして水酸化アルミニウムが古くから用いられる。"}, {"id": 222, "title": "正しい説明はどれか。2つ選べ。", "category": "グラム染色", "categoryShort": "グラム染", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "グラム陽性菌は外膜を持つ。", "short": "a"}, {"id": "b", "text": "芽胞は細菌が活発に増殖している形態である。", "short": "b"}, {"id": "c", "text": "抗酸菌染色はMycobacterium属の検出に使用される。", "short": "c"}, {"id": "d", "text": "Mycobacterium tuberculosisはグラム陰性菌である。", "short": "d"}, {"id": "e", "text": "グラム陽性菌はグラム陰性菌よりも厚いペプチドグリカン層を持つ。", "short": "e"}], "correct": ["c", "e"], "explanation": "グラム陽性は外膜なし・厚いペプチドグリカン、グラム陰性は外膜あり・薄いPG。芽胞は休眠形態、抗酸菌染色（Ziehl-Neelsen）はMycobacterium検出に用いるが、M.tuberculosisは抗酸菌でグラム陽性に近いが分類上はグラム不定。"}, {"id": 223, "title": "正しい説明はどれか。2つ選べ。", "category": "造血", "categoryShort": "造血", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "赤芽球は有核細胞である。", "short": "a"}, {"id": "b", "text": "リンパ球は主に脾臓で産生される。", "short": "b"}, {"id": "c", "text": "成人の造血は主に肝臓で行われる。", "short": "c"}, {"id": "d", "text": "播種性血管内凝固症候群では血小板減少が起こる。", "short": "d"}, {"id": "e", "text": "G-CSFはリンパ球の造血を促すサイトカインである。", "short": "e"}], "correct": ["a", "d"], "explanation": "赤芽球（erythroblast）は有核赤血球前駆細胞、成熟赤血球は脱核。リンパ球は骨髄・胸腺で産生、脾臓は二次リンパ組織。成人造血は骨髄、胎児期は肝臓。DICでは凝固因子・血小板消費で血小板減少。G-CSFは好中球系を促進、リンパ球はIL-7等。"}, {"id": 224, "title": "正しい説明はどれか。2つ選べ。", "category": "抗ウイルス薬", "categoryShort": "抗ウイル", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "オセルタミビルはDNAポリメラーゼを阻害する。", "short": "a"}, {"id": "b", "text": "D4T（スタブジン）はHIVのプロテアーゼを阻害する。", "short": "b"}, {"id": "c", "text": "ホスカルネットはウイルスのDNAポリメラーゼを阻害し、DNA複製を阻害する。", "short": "c"}, {"id": "d", "text": "ソホスブビルはC型肝炎ウイルス（HCV）感染症の治療に使用される非ヌクレオチドポリメラーゼ阻害剤である。", "short": "d"}, {"id": "e", "text": "バロキサビルマルボキシルはインフルエンザウイルスポリメラーゼのキャップ依存性エンドヌクレアーゼ活性を阻害する。", "short": "e"}], "correct": ["c", "e"], "explanation": "オセルタミビルはノイラミニダーゼ阻害、D4TはNRTI（逆転写酵素阻害）、ホスカルネットはピロリン酸類似体でヘルペス等のDNAポリメラーゼ阻害、ソホスブビルはヌクレオチド型NS5B阻害（非ヌクレオチドではない）、バロキサビルはキャップ依存性エンドヌクレアーゼ阻害でインフルmRNA合成阻害。"}, {"id": 225, "title": "正しい説明はどれか。2つ選べ。", "category": "遺伝子", "categoryShort": "遺伝子", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ストップコドンはスレオニンをコードする。", "short": "a"}, {"id": "b", "text": "スタートコドンはメチオニンをコードする。", "short": "b"}, {"id": "c", "text": "一つのコドンは3つのヌクレオチドで構成される。", "short": "c"}, {"id": "d", "text": "すべてのコドンはアミノ酸と1対1で対応している。", "short": "d"}, {"id": "e", "text": "コドンでコードされるアミノ酸の種類は30種類である。", "short": "e"}], "correct": ["b", "c"], "explanation": "スタートコドンATGはメチオニン、1コドンは3塩基、ストップコドン（TAA,TAG,TGA）はアミノ酸をコードせず、コドンは縮重性で1アミノ酸に複数コドン、コードされるアミノ酸は20種類（セレノシステイン含め21-22）。"}, {"id": 226, "title": "正しい説明はどれか。2つ選べ。", "category": "分子生物学", "categoryShort": "分子生物", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "mRNAはcDNAから合成される。", "short": "a"}, {"id": "b", "text": "tRNAは特定のアミノ酸を運搬する。", "short": "b"}, {"id": "c", "text": "mRNAはファゴソームで分解される。", "short": "c"}, {"id": "d", "text": "rRNAは異なる菌種間でも同一である。", "short": "d"}, {"id": "e", "text": "細菌のmRNAはキャップとポリAテールを持たない。", "short": "e"}], "correct": ["b", "e"], "explanation": "tRNAはアンチコドンとアミノ酸を運搬、細菌mRNAは真核と異なり5'キャップとポリAテールを持たずSD配列でリボソーム結合。mRNAはDNAから転写、分解はRNaseで細胞質、rRNAは菌種間で保存性高いが同一ではない（16S rRNAで菌種同定）。"}, {"id": 227, "title": "正しい説明はどれか。2つ選べ。", "category": "感染対策", "categoryShort": "感染対策", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "人工呼吸器はECMOの一種である。", "short": "a"}, {"id": "b", "text": "劇症感染症は遅発性の感染症を指す。", "short": "b"}, {"id": "c", "text": "血圧計のカフは個人防護具の一つである。", "short": "c"}, {"id": "d", "text": "潜伏期とは、発病前の期間であり、後で症状が現れることがある。", "short": "d"}, {"id": "e", "text let state = {
  tab: 'attack',
  count: 10,
  diff: 'normal',
  quiz: null, // {list, idx, answers, startTime, timeLeft}
  exportSel: new Set(),
  filterCat: 'all',
  search: ''
};

const DIFF_TIME = {easy:45, normal:30, hard:20};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a;}

function render(){
  const app = document.getElementById('app');
  document.getElementById('tabAttack').className = 'tab'+(state.tab==='attack'?' active':'');
  document.getElementById('tabExport').className = 'tab'+(state.tab==='export'?' active':'');
  if(state.tab==='attack'){
    if(!state.quiz){
      renderStart(app);
    } else {
      renderQuiz(app);
    }
  } else {
    renderExport(app);
  }
}

function renderStart(container){
  const saved = localStorage.getItem('mASTers_progress');
  let resume = null;
  try{resume = saved?JSON.parse(saved):null}catch(e){}
  container.innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 12px">タイムアタック</h2>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
        <div><div class="badge">問題数</div><div style="margin-top:6px;display:flex;gap:6px">${[5,10,20,50,100,150,200,230].map(n=>`<button class="btn ${state.count===n?'primary':''}" onclick="setCount(${n})">${n}</button>`).join('')}</div></div>
        <div><div class="badge">難易度</div><div style="margin-top:6px;display:flex;gap:6px">
          <button class="btn ${state.diff==='easy'?'primary':''}" onclick="setDiff('easy')">Easy 45s</button>
          <button class="btn ${state.diff==='normal'?'primary':''}" onclick="setDiff('normal')">Normal 30s</button>
          <button class="btn ${state.diff==='hard'?'primary':''}" onclick="setDiff('hard')">Hard 20s</button>
        </div></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn primary" onclick="startQuiz()">開始</button>
        ${resume?`<button class="btn" onclick="resumeQuiz()">続きから再開 (${resume.idx+1}/${resume.list.length})</button><button class="btn" onclick="discard()">破棄</button>`:''}
      </div>
      <div style="margin-top:12px;color:var(--muted);font-size:12px">全${QUESTIONS.length}問プールからランダム出題。2つ選べは部分点あり。</div>
    </div>
  `;
}

function renderQuiz(container){
  const q = state.quiz.list[state.quiz.idx];
  const sel = state.quiz.answers[state.quiz.idx]?.selected || [];
  const time = state.quiz.timeLeft;
  document.getElementById('headerRight').innerHTML = `
    <div style="display:flex;gap:12px;align-items:center">
      <div class="timer" style="color:${time<5? 'var(--ng)':''}">${time}s</div>
      <div style="width:80px"><div class="progress"><div style="width:${(state.quiz.idx/state.quiz.list.length)*100}%"></div></div></div>
      <div>${state.quiz.idx+1}/${state.quiz.list.length}</div>
      <button class="btn" onclick="interrupt()">中断</button>
    </div>
  `;
  container.innerHTML = `
    <div class="card">
      <div style="display:flex;gap:8px;margin-bottom:8px"><span class="badge">${q.category}</span><span class="badge">${q.hint}</span><span class="badge">正解 ${q.correct.join(',').toUpperCase()}</span></div>
      <h3 style="margin:8px 0;line-height:1.5">${q.id}. ${q.title}</h3>
      <div class="grid" style="margin-top:12px">
        ${q.options.map(o=>`
          <div class="q-option ${sel.includes(o.id)?'sel':''}" onclick="toggleOpt('${o.id}')">
            <div style="width:28px;height:28px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700">${o.id.toUpperCase()}</div>
            <div>${o.text}</div>
          </div>
        `).join('')}
      </div>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:space-between">
        <button class="btn" onclick="prevQ()" ${state.quiz.idx===0?'disabled':''}>前へ</button>
        <button class="btn primary" onclick="nextQ()">${state.quiz.idx===state.quiz.list.length-1?'結果へ':'次へ'}</button>
      </div>
      <div style="margin-top:12px;color:var(--muted);font-size:12px">選択: ${sel.join(', ') || 'なし'} | ${q.maxSelect}つ選べ</div>
    </div>
  `;
}

function renderExport(container){
  const cats = [...new Set(QUESTIONS.map(q=>q.category))];
  const filtered = QUESTIONS.filter(q=>{
    if(state.filterCat!=='all' && q.category!==state.filterCat) return false;
    if(state.search && !q.title.includes(state.search) && !String(q.id).includes(state.search)) return false;
    return true;
  });
  document.getElementById('headerRight').innerHTML = `<div style="color:var(--muted)">${state.exportSel.size}問選択</div>`;
  container.innerHTML = `
    <div class="card">
      <h3>エクスポート</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0">
        <select onchange="setFilterCat(this.value)"><option value="all">全カテゴリ</option>${cats.map(c=>`<option value="${c}" ${state.filterCat===c?'selected':''}>${c}</option>`).join('')}</select>
        <input placeholder="検索" value="${state.search}" oninput="setSearch(this.value)" style="padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text)">
        <button class="btn" onclick="selectAllFiltered()">全選択</button>
        <button class="btn" onclick="deselectAll()">全解除</button>
      </div>
      <div style="display:flex;gap:8px;margin:12px 0;flex-wrap:wrap">
        <!-- PDF removed -->
        <!-- PDF removed -->
        <button class="btn" onclick="exportHTML(false)">HTML保存（選択）</button>
        <button class="btn" onclick="exportHTML(true)">HTML保存（全件）</button>
      </div>
      <div style="max-height:60vh;overflow:auto;border:1px solid var(--border);border-radius:12px">
        ${filtered.map(q=>`
          <div style="display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--border);align-items:center">
            <input type="checkbox" ${state.exportSel.has(q.id)?'checked':''} onchange="toggleExport(${q.id}, this.checked)">
            <div style="flex:1"><b>${q.id}</b> ${q.title.slice(0,80)} <span class="badge">${q.category}</span> <span style="color:var(--muted)">正解:${q.correct.join(',')}</span></div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

window.setCount = n=>{state.count=n;render()}
window.setDiff = d=>{state.diff=d;render()}
window.setFilterCat = c=>{state.filterCat=c;render()}
window.setSearch = s=>{state.search=s;render()}
window.selectAllFiltered = ()=>{
  const filtered = QUESTIONS.filter(q=>{
    if(state.filterCat!=='all' && q.category!==state.filterCat) return false;
    if(state.search && !q.title.includes(state.search) && !String(q.id).includes(state.search)) return false;
    return true;
  });
  filtered.forEach(q=>state.exportSel.add(q.id));
  render();
}
window.deselectAll = ()=>{state.exportSel.clear();render();}
window.toggleExport = (id, checked)=>{if(checked) state.exportSel.add(id); else state.exportSel.delete(id); render();}

window.startQuiz = ()=>{
  const list = shuffle([...QUESTIONS]).slice(0, state.count);
  state.quiz = {list, idx:0, answers: list.map(()=>({selected:[]})), timeLeft: DIFF_TIME[state.diff], timer:null};
  startTimer();
  saveProgress();
  render();
}
window.resumeQuiz = ()=>{
  const saved = JSON.parse(localStorage.getItem('mASTers_progress'));
  state.quiz = saved;
  startTimer();
  render();
}
window.discard = ()=>{localStorage.removeItem('mASTers_progress');render();}

function startTimer(){
  if(state.quiz.timer) clearInterval(state.quiz.timer);
  state.quiz.timer = setInterval(()=>{
    state.quiz.timeLeft--;
    if(state.quiz.timeLeft<=0){
      nextQ(true);
    } else {
      const el = document.querySelector('.timer');
      if(el) el.textContent = state.quiz.timeLeft+'s';
    }
  },1000);
}

window.toggleOpt = (id)=>{
  const ans = state.quiz.answers[state.quiz.idx];
  if(ans.selected.includes(id)){
    ans.selected = ans.selected.filter(x=>x!==id);
  } else {
    if(ans.selected.length < state.quiz.list[state.quiz.idx].maxSelect){
      ans.selected.push(id);
    } else {
      ans.selected[ans.selected.length-1]=id;
    }
  }
  saveProgress();
  render();
}
window.prevQ = ()=>{if(state.quiz.idx>0){state.quiz.idx--; state.quiz.timeLeft=DIFF_TIME[state.diff]; saveProgress(); render();}}
window.nextQ = (timeout=false)=>{
  if(timeout){
    // mark timeout
  }
  if(state.quiz.idx < state.quiz.list.length-1){
    state.quiz.idx++;
    state.quiz.timeLeft=DIFF_TIME[state.diff];
    saveProgress();
    render();
  } else {
    finishQuiz();
  }
}
window.interrupt = ()=>{
  if(confirm('中断して結果を表示しますか？')){
    finishQuiz();
  }
}
function saveProgress(){
  if(state.quiz){
    const toSave = {list: state.quiz.list, idx: state.quiz.idx, answers: state.quiz.answers};
    localStorage.setItem('mASTers_progress', JSON.stringify(toSave));
  }
}
function finishQuiz(){
  if(state.quiz.timer) clearInterval(state.quiz.timer);
  const list = state.quiz.list;
  const answers = state.quiz.answers;
  let score=0;
  list.forEach((q,i)=>{
    const sel = answers[i].selected.sort();
    const cor = q.correct.slice().sort();
    if(JSON.stringify(sel)===JSON.stringify(cor)) score+=1;
  });
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <h2>結果</h2>
      <div style="font-size:32px;font-weight:800">${score} / ${list.length} <span style="font-size:16px;color:var(--muted)">${Math.round(score/list.length*100)}%</span></div>
      <div style="margin-top:16px">
        ${list.map((q,i)=>{
          const sel = answers[i].selected;
          const cor = q.correct;
          const ok = JSON.stringify(sel.slice().sort())===JSON.stringify(cor.slice().sort());
          return `<div style="padding:10px;border-bottom:1px solid var(--border)">
            <div><b>${q.id}</b> ${q.title} <span style="color:${ok?'var(--ok)':'var(--ng)'}">${ok?'○':'×'}</span></div>
            <div style="font-size:12px;color:var(--muted)">選択: ${sel.join(',')||'なし'} / 正解: ${cor.join(',')} - ${q.explanation}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn primary" onclick="restart()">もう一度</button>
        <!-- removed -->
      </div>
    </div>
  `;
  document.getElementById('headerRight').innerHTML='';
  localStorage.removeItem('mASTers_progress');
  state.quiz=null;
}
window.restart = ()=>{state.quiz=null;render();}

function getExportList(all){
  if(all) return QUESTIONS;
  return QUESTIONS.filter(q=>state.exportSel.has(q.id));
}
