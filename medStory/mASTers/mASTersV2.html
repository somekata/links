である。", "short": "a"}, {"id": "b", "text": "膜侵襲複合体（C5b〜C9）の成分が欠損していると、<i>Neisseria</i>属による感染症を繰り返しやすい。", "short": "b"}, {"id": "c", "text": "C3bはアナフィラトキシンとして肥満細胞を活性化する。", "short": "c"}, {"id": "d", "text": "古典経路は、抗原抗体複合体にC1qが結合して活性化される。", "short": "d"}, {"id": "e", "text": "補体は主にT細胞で産生される。", "short": "e"}], "correct": ["b", "d"], "explanation": "補体の古典経路は、IgGやIgMを含む抗原抗体複合体にC1qが結合して始まる。代替経路は抗体なしに微生物表面でC3が活性化されて始まる。C5b〜C9の膜侵襲複合体は特に<i>Neisseria</i>属の殺菌に重要で、欠損者は髄膜炎菌などの感染症を繰り返す。補体は主に肝臓で産生される。肥満細胞を活性化するアナフィラトキシンはC3a、C5aで、C3bは主にオプソニンとして働く。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 257, "title": "抗結核薬の作用機序について正しい説明はどれか。2つ選べ。", "category": "生化学｜抗結核薬の作用機序", "categoryShort": "抗結核薬の標的", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "リファンピシンは、RNAポリメラーゼのβサブユニットに結合して転写を阻害する。", "short": "a"}, {"id": "b", "text": "エタンブトールは、蛋白合成を阻害する。", "short": "b"}, {"id": "c", "text": "イソニアジドは、ミコール酸の合成を阻害する。", "short": "c"}, {"id": "d", "text": "ピラジナミドは、DNAジャイレースを阻害する。", "short": "d"}, {"id": "e", "text": "ストレプトマイシンは、細胞壁の合成を阻害する。", "short": "e"}], "correct": ["a", "c"], "explanation": "イソニアジドは結核菌のKatGで活性化され、細胞壁の主成分であるミコール酸の合成を阻害する。リファンピシンはRNAポリメラーゼのβサブユニット（rpoB遺伝子産物）に結合して転写を阻害し、rpoBの変異が耐性の主因となる。エタンブトールはアラビノガラクタンの合成を阻害して細胞壁の形成を妨げる。ピラジナミドはピラジン酸に変換されて作用する。ストレプトマイシンはアミノグリコシド系薬で、30Sリボソームサブユニットに結合して蛋白合成を阻害する。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 258, "title": "広域抗菌薬の長期投与後にプロトロンビン時間が延長することがある。ビタミンK依存性の凝固因子はどれか。2つ選べ。", "category": "生化学｜ビタミンK依存性凝固因子", "categoryShort": "ビタミンK", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "第XI因子", "short": "a"}, {"id": "b", "text": "第VIII因子", "short": "b"}, {"id": "c", "text": "第XIII因子", "short": "c"}, {"id": "d", "text": "第II因子（プロトロンビン）", "short": "d"}, {"id": "e", "text": "第VII因子", "short": "e"}], "correct": ["d", "e"], "explanation": "ビタミンKは、凝固因子のII、VII、IX、Xと、抗凝固蛋白のプロテインC、Sのγ-カルボキシル化に必要である。ビタミンKの一部は腸内細菌が産生するため、絶食や広域抗菌薬の長期投与で欠乏し、プロトロンビン時間（PT）が延長することがある（半減期の短い第VII因子の低下で、PTが最初に延長する）。ワルファリンはビタミンKの再利用に関わる酵素（VKORC1）を阻害する。第VIII、XI、XIII因子はビタミンK非依存性である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 259, "title": "CRISPR-Casについて正しい説明はどれか。2つ選べ。", "category": "遺伝子｜CRISPR-Cas", "categoryShort": "CRISPR-Cas", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Cas9は、RNAだけを切断し、DNAは切断しない。", "short": "a"}, {"id": "b", "text": "真核生物にのみ存在する。", "short": "b"}, {"id": "c", "text": "細菌が、ファージなどの外来DNA由来の配列（スペーサー）を保持し、再侵入時の防御に利用する。", "short": "c"}, {"id": "d", "text": "細菌のβ-ラクタム系薬への耐性の主な機序である。", "short": "d"}, {"id": "e", "text": "Cas9は、ガイドRNAに相補的な標的DNAを切断する。", "short": "e"}], "correct": ["c", "e"], "explanation": "CRISPR-Casは細菌や古細菌が持つ獲得免疫に似た防御機構で、ファージやプラスミド由来の配列をスペーサーとしてゲノムに記憶し、再侵入時にそのRNAをガイドとしてCas蛋白が標的DNAを切断する。Cas9はガイドRNAと相補的な配列（PAM配列に隣接）を認識してDNAを二本鎖切断するため、ゲノム編集に応用されている。耐性の機序ではなく、細菌に特有の機構である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 260, "title": "大腸菌の<i>lac</i>オペロンについて正しい説明はどれか。2つ選べ。", "category": "遺伝子｜lacオペロン", "categoryShort": "lacオペロン", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "構造遺伝子は、それぞれ別々のmRNAとして転写される。", "short": "a"}, {"id": "b", "text": "ラクトースがない場合は、リプレッサーがオペレーターに結合して転写を抑制する。", "short": "b"}, {"id": "c", "text": "オペロンは、真核生物の遺伝子発現調節の主要な様式である。", "short": "c"}, {"id": "d", "text": "ラクトースの代謝産物（アロラクトース）がリプレッサーに結合すると、リプレッサーがオペレーターから外れ、転写が可能となる。", "short": "d"}, {"id": "e", "text": "グルコースが豊富なときは、cAMPが増加してCAPが活性化し、転写が促進される。", "short": "e"}], "correct": ["b", "d"], "explanation": "<i>lac</i>オペロンはラクトース分解に関わる複数の構造遺伝子（lacZ、lacY、lacA）が1本のmRNA（ポリシストロニックmRNA）として転写される。ラクトースがないとリプレッサーがオペレーターに結合して転写を抑制し、ラクトースの異性体であるアロラクトースがリプレッサーに結合すると転写が起こる。グルコースが豊富だとcAMPが減少してCAPが働かず、転写は促進されない。オペロンは原核生物に特徴的な調節様式である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 261, "title": "<i>Neisseria</i>属について正しい説明はどれか。2つ選べ。", "category": "細菌学｜Neisseria属の特徴", "categoryShort": "Neisseriaの特徴", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "淋菌は莢膜多糖を持ち、莢膜多糖ワクチンで予防できる。", "short": "a"}, {"id": "b", "text": "グラム陰性の双球菌である。", "short": "b"}, {"id": "c", "text": "髄膜炎菌は普通寒天培地に良好に発育する。", "short": "c"}, {"id": "d", "text": "偏性嫌気性菌である。", "short": "d"}, {"id": "e", "text": "オキシダーゼ陽性である。", "short": "e"}], "correct": ["b", "e"], "explanation": "<i>Neisseria</i>属はグラム陰性の双球菌（腎臓形、コーヒー豆状）で、好気性、オキシダーゼ陽性、カタラーゼ陽性である。栄養要求性が高く、チョコレート寒天やThayer-Martin培地を用い、5%程度のCO₂存在下で培養する。莢膜多糖を持つのは髄膜炎菌で、莢膜多糖を抗原とするワクチンがある。淋菌には莢膜多糖ワクチンはない。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 262, "title": "<i>Mycoplasma pneumoniae</i>について正しい説明はどれか。2つ選べ。", "category": "細菌学｜Mycoplasma pneumoniae", "categoryShort": "マイコプラズマ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "グラム染色で、グラム陽性桿菌として明瞭に観察される。", "short": "a"}, {"id": "b", "text": "細胞壁を持たない。", "short": "b"}, {"id": "c", "text": "寒冷凝集反応は通常陰性である。", "short": "c"}, {"id": "d", "text": "国内では、マクロライド耐性株が問題となっている。", "short": "d"}, {"id": "e", "text": "β-ラクタム系薬が第一選択である。", "short": "e"}], "correct": ["b", "d"], "explanation": "<i>M. pneumoniae</i>は細胞壁を持たない小型の細菌で、グラム染色では染まらず、細胞壁合成を阻害するβ-ラクタム系薬は無効である。治療にはマクロライド系薬、テトラサイクリン系薬、キノロン系薬が用いられるが、国内ではマクロライド耐性株（23S rRNA遺伝子の変異）が問題となっている。乾性咳嗽が特徴の肺炎で、寒冷凝集反応は陽性となることが多い。診断には抗原検査、LAMP法、PCR、ペア血清などを用いる。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 263, "title": "<i>Staphylococcus aureus</i>の病原因子について正しい説明はどれか。2つ選べ。", "category": "細菌学｜黄色ブドウ球菌の病原因子", "categoryShort": "黄色ブドウ球菌の因子", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "エンテロトキシンによる食中毒の潜伏期は、通常1〜3日である。", "short": "a"}, {"id": "b", "text": "メチシリン耐性は、β-ラクタマーゼの産生のみで説明できる。", "short": "b"}, {"id": "c", "text": "エンテロトキシンは耐熱性で、食品中で産生された毒素により、数時間の短い潜伏期で嘔吐などの食中毒を起こす。", "short": "c"}, {"id": "d", "text": "Panton-Valentineロイコシジンは、赤血球のみを溶解し、白血球には作用しない。", "short": "d"}, {"id": "e", "text": "プロテインAは、IgGのFc領域に結合し、オプソニン化による貪食を妨げる。", "short": "e"}], "correct": ["c", "e"], "explanation": "プロテインAはIgGのFc領域に結合し、オプソニン化と貪食を妨げる。エンテロトキシンは耐熱性（100℃での加熱でも失活しにくい）で、食品中で産生された毒素の摂取により、1〜6時間程度の短い潜伏期で嘔吐を主症状とする食中毒を起こす。Panton-Valentineロイコシジンは白血球を破壊する毒素で、皮膚軟部組織感染症や壊死性肺炎に関与する。メチシリン耐性は、PBP2aをコードするmecA遺伝子の獲得による。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 264, "title": "ヒトパピローマウイルス（HPV）について正しい説明はどれか。2つ選べ。", "category": "ウイルス学｜ヒトパピローマウイルス", "categoryShort": "HPV", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "HPVワクチンは弱毒生ワクチンである。", "short": "a"}, {"id": "b", "text": "RNAウイルスである。", "short": "b"}, {"id": "c", "text": "E6蛋白はp53を、E7蛋白はRBを不活化する。", "short": "c"}, {"id": "d", "text": "子宮頸癌の主な原因は、ハイリスク型の16型と18型である。", "short": "d"}, {"id": "e", "text": "尖圭コンジローマの主な原因は、16型と18型である。", "short": "e"}], "correct": ["c", "d"], "explanation": "HPVは二本鎖DNAウイルスで、子宮頸癌の主な原因はハイリスク型の16型・18型である。E6蛋白がp53の分解を促し、E7蛋白がRBを不活化することで、細胞周期の制御が失われて発癌に寄与する。尖圭コンジローマの主な原因はローリスク型の6型・11型である。HPVワクチンはウイルス様粒子（VLP）を用いた不活化ワクチンで、弱毒生ワクチンではない。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 265, "title": "EBウイルスによる伝染性単核症について正しい説明はどれか。2つ選べ。", "category": "ウイルス学｜EBウイルスと伝染性単核症", "categoryShort": "伝染性単核症", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "末梢血の異型リンパ球は、主に感染したB細胞である。", "short": "a"}, {"id": "b", "text": "アンピシリンやアモキシシリンの投与により、発疹が生じやすい。", "short": "b"}, {"id": "c", "text": "発熱、咽頭炎、頸部リンパ節腫脹と、末梢血の異型リンパ球の増加を認める。", "short": "c"}, {"id": "d", "text": "主に吸血昆虫によって媒介される。", "short": "d"}, {"id": "e", "text": "治療の第一選択はアシクロビルである。", "short": "e"}], "correct": ["b", "c"], "explanation": "伝染性単核症は、発熱、咽頭炎、頸部リンパ節腫脹、異型リンパ球の増加を特徴とし、唾液を介して感染する（kissing disease）。アンピシリンやアモキシシリンを投与すると薬疹が高率に出現するため、咽頭炎に対する不用意な投与を避ける。治療は対症療法が基本で、アシクロビルは通常用いない。末梢血の異型リンパ球は、EBウイルスに感染したB細胞に反応して増殖した細胞傷害性T細胞（CD8陽性T細胞）が主体である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 266, "title": "サイトメガロウイルス（CMV）感染症について正しい説明はどれか。2つ選べ。", "category": "ウイルス学｜サイトメガロウイルス感染症", "categoryShort": "CMV", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "治療には、ガンシクロビルやバルガンシクロビルが用いられる。", "short": "a"}, {"id": "b", "text": "治療の第一選択はアシクロビルである。", "short": "b"}, {"id": "c", "text": "主に蚊によって媒介される。", "short": "c"}, {"id": "d", "text": "活動性感染の診断には、CMV IgG抗体の1回の測定で十分である。", "short": "d"}, {"id": "e", "text": "免疫不全患者では再活性化により、肺炎、腸炎、網膜炎などをきたす。", "short": "e"}], "correct": ["a", "e"], "explanation": "CMVは潜伏感染したウイルスが、臓器移植、造血幹細胞移植、HIV感染症などによる免疫不全で再活性化し、肺炎、腸炎、網膜炎などを起こす。治療にはガンシクロビルやバルガンシクロビルが用いられ、アシクロビルはCMVには効果が乏しい。診断では、血中のCMV抗原血症検査やPCRで活動性を評価する。IgG抗体は既感染を示すのみで、1回の測定では活動性感染の診断はできない。主な感染経路は体液、母子感染、移植などで、蚊媒介ではない。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 267, "title": "マラリアについて正しい説明はどれか。2つ選べ。", "category": "寄生虫学｜マラリア", "categoryShort": "マラリア", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "三日熱マラリアや卵形マラリアでは、肝細胞内の休眠体により再発することがある。", "short": "a"}, {"id": "b", "text": "熱帯熱マラリアは重症化しやすく、脳マラリアの原因となる。", "short": "b"}, {"id": "c", "text": "四日熱マラリアの発熱周期は約48時間である。", "short": "c"}, {"id": "d", "text": "媒介する蚊は、主にイエカである。", "short": "d"}, {"id": "e", "text": "診断には、糞便中の虫卵の検出が用いられる。", "short": "e"}], "correct": ["a", "b"], "explanation": "熱帯熱マラリア（<i>Plasmodium falciparum</i>）は感染赤血球が微小血管に付着して、脳症、腎不全、重症貧血などを起こし、緊急の治療を要する。三日熱（<i>P. vivax</i>）と卵形（<i>P. ovale</i>）は肝細胞内に休眠体（ヒプノゾイト）を形成し、数か月〜年余後に再発するため、根治には抗休眠体薬（プリマキンなど）が必要である。媒介蚊はハマダラカである。診断は血液のギムザ染色塗抹、迅速抗原検査、PCRで行う。四日熱の発熱周期は約72時間、三日熱と卵形は約48時間である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 268, "title": "蟯虫症（<i>Enterobius vermicularis</i>）について正しい説明はどれか。2つ選べ。", "category": "寄生虫学｜蟯虫症", "categoryShort": "蟯虫症", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "夜間の肛門周囲のそう痒が特徴である。", "short": "a"}, {"id": "b", "text": "糞便検査で虫卵が高率に検出される。", "short": "b"}, {"id": "c", "text": "幼虫の経皮侵入により感染する。", "short": "c"}, {"id": "d", "text": "淡水産の巻貝が中間宿主である。", "short": "d"}, {"id": "e", "text": "診断にはセロハンテープ法（肛囲検査）が用いられる。", "short": "e"}], "correct": ["a", "e"], "explanation": "成虫が夜間に肛門周囲へ移動して産卵するため、夜間の肛門周囲のそう痒が特徴である。虫卵は肛門周囲に産みつけられるため、診断には朝の排便前にセロハンテープを肛門周囲に貼って虫卵を検出するセロハンテープ法を用いる（便検査では検出率が低い）。感染は虫卵の経口摂取による直接感染で、中間宿主は不要である。家族内感染が多く、家族の同時治療が行われる。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 269, "title": "成人の細菌性髄膜炎の初期対応について正しい説明はどれか。2つ選べ。", "category": "臨床感染症｜細菌性髄膜炎の初期対応", "categoryShort": "髄膜炎の初期対応", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "抗菌薬の投与は、髄液検査の結果が出るまで待つ。", "short": "a"}, {"id": "b", "text": "項部硬直がなければ、髄膜炎は否定できる。", "short": "b"}, {"id": "c", "text": "意識障害や局所神経症状がある場合は、腰椎穿刺の前に頭部画像検査を考慮する。", "short": "c"}, {"id": "d", "text": "起因菌が不明な成人の市中髄膜炎の初期治療には、セフトリアキソンとバンコマイシンの併用が用いられる。", "short": "d"}, {"id": "e", "text": "デキサメタゾンは、抗菌薬投与の数日後に開始する。", "short": "e"}], "correct": ["c", "d"], "explanation": "意識障害、局所神経症状、うっ血乳頭、痙攣、免疫不全などがある場合は、脳ヘルニアの危険があるため、腰椎穿刺の前に頭部画像検査を考慮する。その場合も、血液培養を採取したうえで抗菌薬の投与を遅らせない。起因菌が不明な成人の市中髄膜炎では、肺炎球菌の耐性を考慮してセフトリアキソンとバンコマイシンを併用し、50歳以上や免疫不全ではリステリアに対してアンピシリンを追加する。項部硬直の感度は高くなく、陰性でも否定できない。デキサメタゾンは、抗菌薬の投与前または同時に開始する。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 270, "title": "中心静脈カテーテル関連血流感染症について正しい説明はどれか。2つ選べ。", "category": "臨床感染症｜カテーテル関連血流感染症", "categoryShort": "CRBSI", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "黄色ブドウ球菌やカンジダが検出された場合でも、原則としてカテーテルを温存して治療する。", "short": "a"}, {"id": "b", "text": "刺入部に発赤や排膿がなくても、否定できない。", "short": "b"}, {"id": "c", "text": "予防として、挿入時に全例で抗菌薬を全身投与する。", "short": "c"}, {"id": "d", "text": "診断にはカテーテル先端培養のみで十分であり、血液培養は不要である。", "short": "d"}, {"id": "e", "text": "カテーテルと末梢静脈から同時に血液培養を採取し、カテーテル採血が2時間以上早く陽性となれば、カテーテルが感染源であることを示唆する。", "short": "e"}], "correct": ["b", "e"], "explanation": "カテーテル関連血流感染症では、刺入部の炎症所見が乏しいことが多く、所見がなくても否定できない。カテーテル採血と末梢静脈採血を同時に培養し、カテーテル採血のほうが2時間以上早く陽性化した場合（differential time to positivity）は、カテーテルが感染源であることを示唆する。黄色ブドウ球菌やカンジダが原因の場合は、原則としてカテーテルを抜去する。挿入時の全身的な抗菌薬予防は推奨されず、手指衛生や最大限の無菌的バリアプリコーションが予防の基本である。診断には血液培養が必須で、カテーテル先端培養のみでは不十分である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 271, "title": "心臓の弁について正しい説明はどれか。2つ選べ。", "category": "解剖学｜心臓の弁", "categoryShort": "心臓の弁", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "三尖弁は、左心房と左心室の間にある。", "short": "a"}, {"id": "b", "text": "肺動脈弁は、左心室と大動脈の間にある。", "short": "b"}, {"id": "c", "text": "僧帽弁は左房室弁で、二尖弁である。", "short": "c"}, {"id": "d", "text": "大動脈弁は、右心房と右心室の間にある。", "short": "d"}, {"id": "e", "text": "静注薬物使用に関連した感染性心内膜炎では、三尖弁が侵されやすい。", "short": "e"}], "correct": ["c", "e"], "explanation": "僧帽弁は左心房と左心室の間にある二尖弁、三尖弁は右心房と右心室の間にある弁である。大動脈弁は左心室と大動脈の間、肺動脈弁は右心室と肺動脈の間にある。静注薬物使用者の感染性心内膜炎は、静脈血が最初に通る右心系の三尖弁に起こりやすく、<i>Staphylococcus aureus</i>が主な起因菌で、敗血症性肺塞栓を伴うことがある。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 272, "title": "脾臓について正しい説明はどれか。2つ選べ。", "category": "解剖学｜脾臓", "categoryShort": "脾臓", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "脾臓は胆汁を貯蔵する臓器である。", "short": "a"}, {"id": "b", "text": "脾臓摘出後は、莢膜を持つ細菌による重症感染症を起こしやすい。", "short": "b"}, {"id": "c", "text": "白脾髄はリンパ組織で免疫応答に関与し、赤脾髄は古い赤血球や、オプソニン化された細菌の除去に関与する。", "short": "c"}, {"id": "d", "text": "脾臓摘出後は、莢膜を持たない細菌による感染のみが問題となる。", "short": "d"}, {"id": "e", "text": "脾臓は右上腹部にあり、肝臓に接している。", "short": "e"}], "correct": ["b", "c"], "explanation": "脾臓は左上腹部にあり、白脾髄（リンパ球が集まる免疫応答の場）と赤脾髄（血液の濾過、老化赤血球やオプソニン化された細菌の除去）からなる。脾臓摘出後や無脾症では、<i>Streptococcus pneumoniae</i>、<i>Haemophilus influenzae</i>、<i>Neisseria meningitidis</i>などの莢膜を持つ細菌による電撃的な重症感染症（脾摘後重症感染症）を起こしやすく、肺炎球菌ワクチンなどの予防接種が推奨される。胆汁を貯蔵するのは胆嚢である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 273, "title": "海綿静脈洞について正しい説明はどれか。2つ選べ。", "category": "解剖学｜海綿静脈洞", "categoryShort": "海綿静脈洞", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "顔面静脈には多くの弁があり、血液の逆流は起こらない。", "short": "a"}, {"id": "b", "text": "脳神経は通っていない。", "short": "b"}, {"id": "c", "text": "眼静脈を介して顔面静脈と交通しており、顔面の感染が波及しうる。", "short": "c"}, {"id": "d", "text": "外頸動脈が通っている。", "short": "d"}, {"id": "e", "text": "内頸動脈や外転神経（第VI脳神経）が通っている。", "short": "e"}], "correct": ["c", "e"], "explanation": "海綿静脈洞は蝶形骨体の両側にある静脈洞で、内頸動脈と外転神経（第VI脳神経）が洞内を、動眼神経、滑車神経、三叉神経第1枝・第2枝が外側壁を通る。顔面静脈は弁が乏しく、眼静脈を介して海綿静脈洞と交通するため、鼻や口唇周囲（危険三角）の感染が海綿静脈洞血栓症を起こすことがある。外頸動脈は洞内を通らない。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 274, "title": "肝・胆道・膵臓の解剖について正しい説明はどれか。2つ選べ。", "category": "解剖学｜肝胆膵の解剖", "categoryShort": "肝胆膵", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "胆嚢は肝臓の下面に接している。", "short": "a"}, {"id": "b", "text": "総胆管と主膵管は合流または並走して、十二指腸のVater乳頭に開口する。", "short": "b"}, {"id": "c", "text": "胆汁は胆嚢で産生される。", "short": "c"}, {"id": "d", "text": "門脈は、肝臓から腸管へ血液を運ぶ。", "short": "d"}, {"id": "e", "text": "肝臓の血流の約75%は肝動脈からである。", "short": "e"}], "correct": ["a", "b"], "explanation": "総胆管と主膵管は十二指腸の大十二指腸乳頭（Vater乳頭）に開口するため、総胆管結石では胆管炎に加え胆石性膵炎も起こりうる。胆嚢は肝臓の下面に接し、胆汁を貯蔵・濃縮する。胆汁を産生するのは肝臓である。門脈は腸管などから肝臓へ血液を運び、肝臓の血流の約75%を占める（残りが肝動脈）。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 275, "title": "ヘルパーT細胞について正しい説明はどれか。2つ選べ。", "category": "生理学｜ヘルパーT細胞のサブセット", "categoryShort": "ヘルパーT細胞", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Th2細胞はIL-4、IL-5、IL-13を産生し、IgE産生や好酸球を介して寄生虫への防御に関与する。", "short": "a"}, {"id": "b", "text": "Th17細胞は主にIL-4を産生し、IgE産生を促す。", "short": "b"}, {"id": "c", "text": "Th1細胞はIFN-γを産生し、マクロファージを活性化して細胞内寄生菌の排除に働く。", "short": "c"}, {"id": "d", "text": "Th1細胞は主に好酸球を活性化し、蠕虫の排除に働く。", "short": "d"}, {"id": "e", "text": "制御性T細胞は、炎症反応を促進する。", "short": "e"}], "correct": ["a", "c"], "explanation": "Th1細胞はIFN-γでマクロファージを活性化し、結核菌などの細胞内寄生菌の排除に重要である。Th2細胞はIL-4（IgE産生）、IL-5（好酸球の増殖）、IL-13を産生し、蠕虫感染やアレルギーに関与する。Th17細胞はIL-17、IL-22を産生して好中球を動員し、細胞外細菌や真菌（<i>Candida</i>など）に対する粘膜防御に働く。制御性T細胞は免疫反応を抑制する。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 276, "title": "腎臓での薬物排泄について正しい説明はどれか。2つ選べ。", "category": "生理学｜腎臓での薬物排泄", "categoryShort": "腎排泄", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ドキシサイクリンは主に腎排泄であり、腎機能低下時には大幅な減量が必要である。", "short": "a"}, {"id": "b", "text": "バンコマイシンの大部分は、肝臓で代謝されて排泄される。", "short": "b"}, {"id": "c", "text": "腎機能が低下した患者では、腎排泄型の抗菌薬の投与量や投与間隔の調整が必要になる。", "short": "c"}, {"id": "d", "text": "糸球体濾過量が低下すると、血清クレアチニンは低下する。", "short": "d"}, {"id": "e", "text": "プロベネシドは、近位尿細管でのペニシリン系薬の分泌を競合的に阻害し、血中濃度を上昇させる。", "short": "e"}], "correct": ["c", "e"], "explanation": "ペニシリン系薬の多くは近位尿細管の有機アニオン輸送体を介して分泌され、プロベネシドはこの分泌を競合的に阻害して血中濃度を高める。βラクタム系薬、アミノグリコシド系薬、バンコマイシンなど、腎排泄型の抗菌薬は腎機能に応じた用量調整が必要である。バンコマイシンは大部分が未変化体で腎排泄される。糸球体濾過量が低下すると血清クレアチニンは上昇する。ドキシサイクリンは主に胆汁・糞便中に排泄され、腎機能による調整は通常不要である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 277, "title": "気道の生体防御機構について正しい説明はどれか。2つ選べ。", "category": "生理学｜気道の生体防御", "categoryShort": "気道の防御", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "咳嗽反射は、下気道感染の防御には関与しない。", "short": "a"}, {"id": "b", "text": "肺胞マクロファージが、肺胞に到達した細菌を貪食する。", "short": "b"}, {"id": "c", "text": "喫煙は線毛運動を促進して、感染を防ぐ。", "short": "c"}, {"id": "d", "text": "線毛上皮細胞と粘液による粘液線毛輸送が、異物や細菌を排除する。", "short": "d"}, {"id": "e", "text": "気道分泌液中の主要な抗体はIgGである。", "short": "e"}], "correct": ["b", "d"], "explanation": "気道では、粘液が異物や細菌を捕捉し、線毛運動で咽頭方向へ運ぶ粘液線毛輸送が最初の防御となる。肺胞に到達した細菌は肺胞マクロファージが貪食する。喫煙やインフルエンザウイルス感染は線毛上皮を傷害し、二次性の細菌性肺炎の危険因子となる。咳嗽反射も異物排除に重要である。気道粘膜の分泌液中の主要な抗体は分泌型IgAである。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 278, "title": "腸内細菌叢について正しい説明はどれか。2つ選べ。", "category": "生理学｜腸内細菌叢", "categoryShort": "腸内細菌叢", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "外来の病原体が腸管に定着することを妨げる（定着抵抗性）。", "short": "a"}, {"id": "b", "text": "食物繊維から短鎖脂肪酸を産生し、大腸上皮のエネルギー源となる。", "short": "b"}, {"id": "c", "text": "胃に最も多くの細菌が存在する。", "short": "c"}, {"id": "d", "text": "広域抗菌薬は、腸内細菌叢に影響しない。", "short": "d"}, {"id": "e", "text": "大部分は好気性菌である。", "short": "e"}], "correct": ["a", "b"], "explanation": "腸内細菌叢は、栄養素の競合や抗菌物質の産生により、病原体の定着を妨げる（定着抵抗性）。食物繊維を発酵して酪酸などの短鎖脂肪酸を産生し、酪酸は大腸上皮の主なエネルギー源となる。ビタミンKの一部も産生する。腸内細菌の大部分は偏性嫌気性菌で、菌数は大腸で最も多く、胃では胃酸のため少ない。広域抗菌薬は腸内細菌叢を乱し、<i>Clostridioides difficile</i>感染症などの原因となる。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 279, "title": "好中球の殺菌機構について正しい説明はどれか。2つ選べ。", "category": "生化学｜好中球の殺菌機構", "categoryShort": "好中球の殺菌", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ミエロペルオキシダーゼが、過酸化水素と塩化物イオンから次亜塩素酸を産生する。", "short": "a"}, {"id": "b", "text": "慢性肉芽腫症では、抗体産生が低下し、莢膜を持つ細菌による感染症を繰り返す。", "short": "b"}, {"id": "c", "text": "NADPHオキシダーゼが、酸素からスーパーオキシドを産生する。", "short": "c"}, {"id": "d", "text": "NADPHオキシダーゼが欠損しても、殺菌能は正常に保たれる。", "short": "d"}, {"id": "e", "text": "慢性肉芽腫症では、カタラーゼ陰性菌による感染症を繰り返す。", "short": "e"}], "correct": ["a", "c"], "explanation": "貪食された細菌は、NADPHオキシダーゼによるスーパーオキシドの産生（呼吸バースト）と、そこから生じる過酸化水素、さらにミエロペルオキシダーゼによる次亜塩素酸の産生で殺菌される。NADPHオキシダーゼの遺伝的な欠損による慢性肉芽腫症では、殺菌能が低下し、特にカタラーゼ陽性菌（<i>Staphylococcus aureus</i>、<i>Serratia marcescens</i>、<i>Burkholderia cepacia</i>複合体、<i>Nocardia</i>、<i>Aspergillus</i>など）による感染症を繰り返す。カタラーゼ陰性菌は自らの過酸化水素を利用して殺菌されるため、問題になりにくい。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 280, "title": "抗菌薬とシトクロムP450（CYP）による薬物相互作用について正しい説明はどれか。2つ選べ。", "category": "生化学｜薬物代謝酵素CYPと抗菌薬", "categoryShort": "CYPと相互作用", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "クラリスロマイシンはCYP3A4を阻害し、併用薬の血中濃度を上昇させうる。", "short": "a"}, {"id": "b", "text": "リファンピシンはCYP3Aを誘導し、併用薬の血中濃度を低下させる。", "short": "b"}, {"id": "c", "text": "ペニシリン系薬は、主に肝臓のCYPで代謝される。", "short": "c"}, {"id": "d", "text": "ボリコナゾールはCYP3Aを誘導する。", "short": "d"}, {"id": "e", "text": "アジスロマイシンは、クラリスロマイシンと同程度に強くCYP3A4を阻害する。", "short": "e"}], "correct": ["a", "b"], "explanation": "リファンピシンはCYP3A4などを強く誘導し、アゾール系抗真菌薬、抗HIV薬、経口避妊薬、ワルファリンなど多くの薬剤の血中濃度を下げる。クラリスロマイシンはCYP3A4を阻害し、スタチンやカルシウム拮抗薬などの血中濃度を上昇させる。ボリコナゾールはCYP2C19、CYP2C9、CYP3A4を基質とするとともに阻害する。アジスロマイシンはCYP3A4の阻害が弱い。ペニシリン系薬は主に腎排泄である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 281, "title": "グルコース-6-リン酸脱水素酵素（G6PD）欠損症について正しい説明はどれか。2つ選べ。", "category": "生化学｜G6PD欠損症", "categoryShort": "G6PD欠損症", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "赤血球が酸化ストレスに弱くなり、溶血を起こす。", "short": "a"}, {"id": "b", "text": "プリマキンやダプソンなどの酸化作用のある薬剤で、溶血発作が誘発される。", "short": "b"}, {"id": "c", "text": "赤血球内のNADPHの産生が増加する。", "short": "c"}, {"id": "d", "text": "常染色体優性遺伝形式をとる。", "short": "d"}, {"id": "e", "text": "ペニシリン系薬で溶血が起こりやすい。", "short": "e"}], "correct": ["a", "b"], "explanation": "G6PDはペントースリン酸経路の最初の酵素で、NADPHを産生する。NADPHは還元型グルタチオンの再生に必要で、赤血球を酸化ストレスから守る。G6PDが欠損すると、感染症、ソラマメ、薬剤（プリマキン、ダプソン、サルファ剤、ニトロフラントインなど）による酸化ストレスで溶血を起こす。X連鎖劣性遺伝の疾患である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 282, "title": "抗真菌薬と作用機序の組み合わせについて正しい説明はどれか。2つ選べ。", "category": "生化学｜抗真菌薬の標的", "categoryShort": "抗真菌薬の標的", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "フルシトシンは、細胞壁のキチン合成を阻害する。", "short": "a"}, {"id": "b", "text": "ミカファンギンは、β-1,3-D-グルカンの合成酵素を阻害する。", "short": "b"}, {"id": "c", "text": "アムホテリシンBは、β-1,3-D-グルカンの合成酵素を阻害する。", "short": "c"}, {"id": "d", "text": "ヒトの細胞膜の主要なステロールは、エルゴステロールである。", "short": "d"}, {"id": "e", "text": "アゾール系薬は、エルゴステロール合成に関わるラノステロール14α-脱メチル化酵素（CYP51）を阻害する。", "short": "e"}], "correct": ["b", "e"], "explanation": "エキノキャンディン系薬（ミカファンギンなど）は、真菌細胞壁のβ-1,3-D-グルカン合成酵素を阻害する。アゾール系薬は、ラノステロール14α-脱メチル化酵素（CYP51）を阻害してエルゴステロールの合成を妨げる。アムホテリシンBはエルゴステロールに結合して膜に孔を形成する。フルシトシンは真菌内で5-フルオロウラシルに変換され、RNA・DNA合成を阻害する。ヒトの細胞膜の主要なステロールはコレステロールであり、これが選択毒性の基礎になっている。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 283, "title": "点突然変異について正しい説明はどれか。2つ選べ。", "category": "遺伝子｜点突然変異の種類", "categoryShort": "点突然変異", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ナンセンス変異では、アミノ酸が別のアミノ酸に置換される。", "short": "a"}, {"id": "b", "text": "サイレント変異では、アミノ酸は変化しない。", "short": "b"}, {"id": "c", "text": "ミスセンス変異では、アミノ酸は変化しない。", "short": "c"}, {"id": "d", "text": "ナンセンス変異では、終止コドンが生じ、蛋白質の合成が途中で終わる。", "short": "d"}, {"id": "e", "text": "フレームシフト変異は、3の倍数の塩基の挿入や欠失で起こる。", "short": "e"}], "correct": ["b", "d"], "explanation": "サイレント変異は塩基が変化してもコドンが同じアミノ酸を指定するため、アミノ酸は変化しない。ミスセンス変異はアミノ酸が別のアミノ酸に置換される変異で、<i>gyrA</i>の83番目のアミノ酸の置換によるキノロン耐性がその例である。ナンセンス変異は終止コドンを生じ、短い蛋白質ができる。フレームシフト変異は3の倍数ではない塩基の挿入や欠失で読み枠がずれる変異で、3の倍数の場合は読み枠が保たれる（インフレーム変異）。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 284, "title": "原核生物と真核生物の遺伝子発現について正しい説明はどれか。2つ選べ。", "category": "遺伝子｜原核生物と真核生物の遺伝子発現", "categoryShort": "原核と真核", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "真核生物では、mRNA前駆体がスプライシングを受けてイントロンが除去される。", "short": "a"}, {"id": "b", "text": "細菌のmRNAは、一般にスプライシングを受けて成熟する。", "short": "b"}, {"id": "c", "text": "細菌の染色体は、核膜に包まれた線状DNAである。", "short": "c"}, {"id": "d", "text": "原核生物では、転写と翻訳が同時に進行する。", "short": "d"}, {"id": "e", "text": "真核生物のリボソームは70Sである。", "short": "e"}], "correct": ["a", "d"], "explanation": "原核生物には核膜がなく、転写中のmRNAにリボソームが結合して翻訳が始まる。真核生物ではmRNA前駆体にキャッピング、ポリアデニル化、スプライシングが起こり、成熟したmRNAが核外へ出て翻訳される。細菌の遺伝子は一般にイントロンを持たない。リボソームは、原核生物が70S（30Sと50S）、真核生物が80S（40Sと60S）で、この違いが抗菌薬の選択毒性の基礎となっている。細菌の染色体は核膜に包まれない環状DNAである。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 285, "title": "院内感染における菌株の分子疫学的解析について正しい説明はどれか。2つ選べ。", "category": "遺伝子｜分子疫学的解析", "categoryShort": "分子疫学", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "16S rRNA遺伝子解析は、同一菌種内の菌株の識別に最も適している。", "short": "a"}, {"id": "b", "text": "グラム染色の所見が同じであれば、同一株とみなせる。", "short": "b"}, {"id": "c", "text": "血清型が同じであれば、菌株の同一性は完全に証明できる。", "short": "c"}, {"id": "d", "text": "MLSTは、複数のハウスキーピング遺伝子の配列の組み合わせで菌株を型別する方法である。", "short": "d"}, {"id": "e", "text": "全ゲノムシークエンスにより、菌株間の遺伝的な近縁性を高い分解能で比較できる。", "short": "e"}], "correct": ["d", "e"], "explanation": "アウトブレイクの調査では、分離株が同一の株か、クローンの伝播かを判定するために分子疫学的解析を行う。全ゲノムシークエンスは、SNPの差などから菌株の近縁性を高い分解能で評価できる。MLST（multilocus sequence typing）は複数のハウスキーピング遺伝子の配列で型別する。PFGEも従来用いられてきた。16S rRNA遺伝子は菌種同定には有用だが、同一菌種内の株の識別には分解能が不足する。血清型やグラム染色では同一株の証明にならない。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 286, "title": "抗微生物薬の副作用や血中濃度に関連する遺伝子多型について正しい説明はどれか。2つ選べ。", "category": "遺伝子｜薬剤関連の遺伝子多型", "categoryShort": "薬剤と遺伝子多型", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "NAT2の遅いアセチル化型の患者では、イソニアジドの血中濃度が上昇し、末梢神経障害などが出やすい。", "short": "a"}, {"id": "b", "text": "CYP2C19の機能欠損型の患者では、ボリコナゾールの血中濃度が低下する。", "short": "b"}, {"id": "c", "text": "HLA-B*57:01を持つ患者では、アバカビルによる過敏反応を起こしやすい。", "short": "c"}, {"id": "d", "text": "HLA-B*27:05を持つ患者では、アバカビルによる過敏反応を起こしやすい。", "short": "d"}, {"id": "e", "text": "HLA-B*57:01を持つ患者にも、アバカビルを安全に使用できる。", "short": "e"}], "correct": ["a", "c"], "explanation": "HLA-B*57:01はアバカビルの重篤な過敏反応と強く関連し、投与前の検査で保有者には使用しない。NAT2遺伝子の多型により、イソニアジドのアセチル化が遅い人（遅いアセチル化型）では血中濃度が上昇し、末梢神経障害や肝障害が出やすい。CYP2C19の機能欠損型の人では、ボリコナゾールの代謝が低下して血中濃度が上昇する。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 287, "title": "<i>Listeria monocytogenes</i>について正しい説明はどれか。2つ選べ。", "category": "細菌学｜リステリア", "categoryShort": "リステリア", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ヒトからヒトへの飛沫感染が主な感染経路である。", "short": "a"}, {"id": "b", "text": "芽胞を形成する。", "short": "b"}, {"id": "c", "text": "妊婦、新生児、高齢者、免疫不全患者で、敗血症や髄膜炎などの侵襲性感染症を起こしやすい。", "short": "c"}, {"id": "d", "text": "4℃の低温でも増殖できるため、冷蔵食品が感染源として問題となる。", "short": "d"}, {"id": "e", "text": "グラム陰性桿菌である。", "short": "e"}], "correct": ["c", "d"], "explanation": "<i>L. monocytogenes</i>は通性嫌気性のグラム陽性短桿菌で、4℃でも増殖するため、ナチュラルチーズ、生ハム、スモークサーモンなどの非加熱の冷蔵食品を介した食中毒が問題となる。妊婦（胎児・新生児感染を含む）、高齢者、免疫不全患者で、菌血症や髄膜炎を起こす。感染経路は主に食品で、芽胞は形成しない。治療はアンピシリンが基本である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 288, "title": "<i>Bacillus anthracis</i>（炭疽菌）について正しい説明はどれか。2つ選べ。", "category": "細菌学｜炭疽菌", "categoryShort": "炭疽菌", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "皮膚炭疽では、無痛性の潰瘍と、黒色の痂皮（eschar）を認める。", "short": "a"}, {"id": "b", "text": "炭疽毒素の本体は、エンドトキシン（LPS）である。", "short": "b"}, {"id": "c", "text": "吸入炭疽は、ヒトからヒトへ飛沫感染しやすい。", "short": "c"}, {"id": "d", "text": "芽胞を形成するグラム陽性の大桿菌である。", "short": "d"}, {"id": "e", "text": "偏性嫌気性菌である。", "short": "e"}], "correct": ["a", "d"], "explanation": "<i>B. anthracis</i>は好気性の芽胞形成グラム陽性大桿菌で、動物（ウシ、ヒツジなど）との接触や汚染された畜産物から感染する。皮膚炭疽は、無痛性の潰瘍と黒色の痂皮が特徴である。吸入炭疽は重症で致死率が高いが、ヒトからヒトへの感染は通常ない。炭疽毒素は防御抗原、浮腫因子、致死因子からなる外毒素で、LPSではない。感染症法の4類感染症である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 289, "title": "<i>Stenotrophomonas maltophilia</i>について正しい説明はどれか。2つ選べ。", "category": "細菌学｜ステノトロホモナス", "categoryShort": "ステノトロホモナス", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ブドウ糖発酵菌である。", "short": "a"}, {"id": "b", "text": "メタロβ-ラクタマーゼ（L1）を産生し、カルバペネム系薬に自然耐性を示す。", "short": "b"}, {"id": "c", "text": "健常人の市中感染症の主な原因菌である。", "short": "c"}, {"id": "d", "text": "ST合剤が、治療の選択肢となる。", "short": "d"}, {"id": "e", "text": "グラム陽性球菌である。", "short": "e"}], "correct": ["b", "d"], "explanation": "<i>S. maltophilia</i>はグラム陰性のブドウ糖非発酵桿菌で、メタロβ-ラクタマーゼ（L1）を産生するため、カルバペネム系薬に自然耐性を示す。長期のカルバペネム系薬の使用、ICU、人工呼吸器、悪性腫瘍、嚢胞性線維症などが危険因子で、院内感染や日和見感染の原因となる。治療はST合剤が第一選択で、レボフロキサシンやミノサイクリンなども選択肢となる。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 290, "title": "<i>Actinomyces</i>属と<i>Nocardia</i>属について正しい説明はどれか。2つ選べ。", "category": "細菌学｜放線菌症とノカルジア症", "categoryShort": "ActinomycesとNocardia", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "<i>Nocardia</i>属は弱抗酸性を示す、グラム陽性の分枝状桿菌である。", "short": "a"}, {"id": "b", "text": "ノカルジア症では、中枢神経系への播種は起こらない。", "short": "b"}, {"id": "c", "text": "<i>Actinomyces</i>属は嫌気性のグラム陽性桿菌で、膿に硫黄顆粒を認めることがある。", "short": "c"}, {"id": "d", "text": "<i>Nocardia</i>属は偏性嫌気性菌である。", "short": "d"}, {"id": "e", "text": "放線菌症の第一選択薬は、ST合剤である。", "short": "e"}], "correct": ["a", "c"], "explanation": "<i>Actinomyces</i>属は口腔や腸管に常在する嫌気性のグラム陽性桿菌で、顔面・頸部、胸部、腹部、骨盤内などに慢性の膿瘍や瘻孔を形成し、膿に硫黄顆粒を認めることがある。治療はペニシリン系薬（アモキシシリンなど）を長期に用いる。<i>Nocardia</i>属は好気性の弱抗酸性（修飾抗酸染色で染まる）の分枝状桿菌で、免疫不全患者に肺炎を起こし、脳膿瘍などへ播種しやすい。治療はST合剤が第一選択である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 291, "title": "<i>SARS-CoV-2</i>について正しい説明はどれか。2つ選べ。", "category": "ウイルス学｜SARS-CoV-2", "categoryShort": "SARS-CoV-2", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ゲノムは二本鎖DNAである。", "short": "a"}, {"id": "b", "text": "一本鎖プラス鎖RNAをゲノムとする、エンベロープを持つウイルスである。", "short": "b"}, {"id": "c", "text": "スパイク蛋白質が、宿主細胞のACE2に結合して侵入する。", "short": "c"}, {"id": "d", "text": "エンベロープを持たないため、アルコール消毒が無効である。", "short": "d"}, {"id": "e", "text": "宿主細胞の受容体は、CD4分子である。", "short": "e"}], "correct": ["b", "c"], "explanation": "<i>SARS-CoV-2</i>はコロナウイルス科のウイルスで、ゲノムは一本鎖プラス鎖RNAである。表面のスパイク蛋白質が宿主細胞のACE2に結合して侵入する。エンベロープを持つため、アルコールによる消毒が有効である（エンベロープを持たないノロウイルスなどはアルコールが効きにくい）。CD4分子はHIVの受容体である。<br>この問題は AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。"}, {"id": 292, "title": "ポリオウイルスについて正しい説明はどれか。2つ選べ。", "category": "ウイルス学｜ポリオウイルス", "categoryShort": "ポリオウイルス", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "脊髄前角の運動神経細胞を侵し、急性弛緩性麻痺を起こす。", "short": "a"}, {"id": "b", "text": "日本の定期接種では、経口生ワクチンが使用されて const DIFF_TIME = {easy:45, normal:30, hard:20};

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a;}

function render(){
  const app = document.getElementById('app');
  document.getElementById('tabAttack').className = 'tab'+(state.tab==='attack'?' active':'');
  document.getElementById('tabExport').className = 'tab'+(state.tab==='export'?' active':'');
  if(state.tab==='attack'){
    if(!state.quiz){
      renderStart(app);
    } else {
      renderQuiz(app);
    }
  } else {
    renderExport(app);
  }
}

function renderStart(container){
  const saved = localStorage.getItem('mASTers_progress');
  let resume = null;
  try{resume = saved?JSON.parse(saved):null}catch(e){}
  container.innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 12px">タイムアタック</h2>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">

      <div style="margin-top:12px;color:var(--muted);font-size:12px">全${QUESTIONS.length}問プールからランダム出題。2つ選べは部分点あり。</div>

  `;
}

function renderQuiz(container){
  const q = state.quiz.list[state.quiz.idx];
  const sel = state.quiz.answers[state.quiz.idx]?.selected || [];
  const time = state.quiz.timeLeft;
  document.getElementById('headerRight').innerHTML = `
    <div style="display:flex;gap:12px;align-items:center">
      <div class="timer" style="color:${time<5? 'var(--ng)':''}">${time}s</div>
      <div style="width:80px"><div class="progress"><div style="width:${(state.quiz.idx/state.quiz.list.length)*100}%"></div></div></div>
      <div>${state.quiz.idx+1}/${state.quiz.list.length}</div>
      <button class="btn" onclick="interrupt()">中断</button>
    </div>
  `;
  container.innerHTML = `
    <div class="card">
      <div style="display:flex;gap:8px;margin-bottom:8px"><span class="badge">${q.category}</span><span class="badge">${q.hint}</span><span class="badge">正解 ${q.correct.join(',').toUpperCase()}</span></div>
      <h3 style="margin:8px 0;line-height:1.5">${q.id}. ${q.title}</h3>
      <div class="grid" style="margin-top:12px">
        ${q.options.map(o=>`
          <div class="q-option ${sel.includes(o.id)?'sel':''}" onclick="toggleOpt('${o.id}')">
            <div style="width:28px;height:28px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700">${o.id.toUpperCase()}</div>

          </div>
        `).join('')}
      </div>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:space-between">

        <button class="btn primary" onclick="nextQ()">${state.quiz.idx===state.quiz.list.length-1?'結果へ':'次へ'}</button>
      </div>
      <div style="margin-top:12px;color:var(--muted);font-size:12px">選択: ${sel.join(', ') || 'なし'} | ${q.maxSelect}つ選べ</div>
    </div>
  `;
}

function renderExport(container){
  const cats = [...new Set(QUESTIONS.map(q=>q.category))];
  const filtered = QUESTIONS.filter(q=>{
    if(state.filterCat!=='all' && q.category!==state.filterCat) return false;
    if(state.search && !q.title.includes(state.search) && !String(q.id).includes(state.search)) return false;
    return true;

  document.getElementById('headerRight').innerHTML = `<div style="color:var(--muted)">${state.exportSel.size}問選択</div>`;

      </div>
      <div style="max-height:60vh;overflow:auto;border:1px solid var(--border);border-radius:12px">

        `).join('')}
      </div>
    </div>
  `;
}

    return true;
  });
  filtered.forEach(q=>state.exportSel.add(q.id));
  render();
}
window.deselectAll = ()=>{state.exportSel.clear();render();}
window.toggleExport = (id, checked)=>{if(checked) state.exportSel.add(id); else state.exportSel.delete(id); render();}

window.startQuiz = ()=>{
  const list = shuffle([...QUESTIONS]).slice(0, state.count);
  state.quiz = {list, idx:0, answers: list.map(()=>({selected:[]})), timeLeft: DIFF_TIME[state.diff], timer:null};
  startTimer();
  saveProgress();
  render();
}
window.resumeQuiz = ()=>{
  const saved = JSON.parse(localStorage.getItem('mASTers_progress'));
  state.quiz = saved;
  startTimer();
  render();
}
window.discard = ()=>{localStorage.removeItem('mASTers_progress');render();}

function startTimer(){
  if(state.quiz.timer) clearInterval(state.quiz.timer);
  state.quiz.timer = setInterval(()=>{
    state.quiz.timeLeft--;
    if(state.quiz.timeLeft<=0){
      nextQ(true);
    } else {
      const el = document.querySelector('.timer');
      if(el) el.textContent = state.quiz.timeLeft+'s';
    }
  },1000);
}

window.toggleOpt = (id)=>{
  const ans = state.quiz.answers[state.quiz.idx];
  if(ans.selected.includes(id)){
    ans.selected = ans.selected.filter(x=>x!==id);
  } else {
    if(ans.selected.length < state.quiz.list[state.quiz.idx].maxSelect){
      ans.selected.push(id);
    } else {
      ans.selected[ans.selected.length-1]=id;
    }
  }
  saveProgress();
  render();
}
window.prevQ = ()=>{if(state.quiz.idx>0){state.quiz.idx--; state.quiz.timeLeft=DIFF_TIME[state.diff]; saveProgress(); render();}}
window.nextQ = (timeout=false)=>{
  if(timeout){
    // mark timeout
  }
  if(state.quiz.idx < state.quiz.list.length-1){
    state.quiz.idx++;
    state.quiz.timeLeft=DIFF_TIME[state.diff];
    saveProgress();
    render();
  } else {
    finishQuiz();
  }
}
window.interrupt = ()=>{
  if(confirm('中断して結果を表示しますか？')){
    finishQuiz();
  }
}
function saveProgress(){
  if(state.quiz){
    const toSave = {list: state.quiz.list, idx: state.quiz.idx, answers: state.quiz.answers};
    localStorage.setItem('mASTers_progress', JSON.stringify(toSave));
  }
}
function finishQuiz(){
  if(state.quiz.timer) clearInterval(state.quiz.timer);
  const list = state.quiz.list;
  const answers = state.quiz.answers;
  let score=0;
  list.forEach((q,i)=>{
    const sel = answers[i].selected.sort();
    const cor = q.correct.slice().sort();
    if(JSON.stringify(sel)===JSON.stringify(cor)) score+=1;
  });
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card">
      <h2>結果</h2>
      <div style="font-size:32px;font-weight:800">${score} / ${list.length} <span style="font-size:16px;color:var(--muted)">${Math.round(score/list.length*100)}%</span></div>
      <div style="margin-top:16px">
        ${list.map((q,i)=>{
          const sel = answers[i].selected;
          const cor = q.correct;
          const ok = JSON.stringify(sel.slice().sort())===JSON.stringify(cor.slice().sort());
          return `<div style="padding:10px;border-bottom:1px solid var(--border)">
            <div><b>${q.id}</b> ${q.title} <span style="color:${ok?'var(--ok)':'var(--ng)'}">${ok?'○':'×'}</span></div>
            <div style="font-size:12px;color:var(--muted)">選択: ${sel.join(',')||'なし'} / 正解: ${cor.join(',')} - ${q.explanation}</div>
          </div>`;
        }).join('')}
      </div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn primary" onclick="restart()">もう一度</button>
        <!-- removed -->
      </div>
    </div>
  `;
  document.getElementById('headerRight').innerHTML='';
  localStorage.removeItem('mASTers_progress');
  state.quiz=null;
}
window.restart = ()=>{state.quiz=null;render();}

function getExportList(all){
  if(all) return QUESTIONS;
  return QUESTIONS.filter(q=>state.exportSel.has(q.id));
}
