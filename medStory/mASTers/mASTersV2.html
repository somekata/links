.q-option.sel{border-color:var(--cyan);background:rgba(34,211,238,0.1)}
.progress{height:6px;background:var(--border);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--border);color:var(--muted)}
</style>

<script>
const QUESTIONS = [{"id": 1, "title": "腸内細菌科細菌はどれか。2つ選べ。", "category": "腸内細菌科", "categoryShort": "腸内細菌", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "緑膿菌（Pseudomonas aeruginosa）", "short": "a"}, {"id": "b", "text": "腸球菌（Enterococcus faecium）", "short": "b"}, {"id": "c", "text": "大腸菌（Escherichia coli）", "short": "c"}, {"id": "d", "text": "肺炎桿菌（Klebsiella pneumoniae）", "short": "d"}, {"id": "e", "text": "肺炎球菌（Streptococcus pneumoniae）", "short": "e"}], "correct": ["c", "d"], "explanation": "腸内細菌科（Enterobacteriaceae）はグラム陰性桿菌の大きな科で、Escherichia、Klebsiella、Salmonella、Shigella、Enterobacterなどの属を含む。大腸菌（E. coli）と肺炎桿菌（K. pneumoniae）はいずれもこの科に属する。緑膿菌はブドウ糖非発酵菌、腸球菌・肺炎球菌はグラム陽性球菌であり腸内細菌科には含まれない。"}, {"id": 2, "title": "グラム陰性ブドウ糖非発酵菌はどれか。2つ選べ。", "category": "非発酵菌", "categoryShort": "非発酵菌", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "緑膿菌（Pseudomonas aeruginosa）", "short": "a"}, {"id": "b", "text": "バクテロイデス・フラジリス（Bacteroides fragilis）", "short": "b"}, {"id": "c", "text": "大腸菌（Escherichia coli）", "short": "c"}, {"id": "d", "text": "アシネトバクター・バウマニ（Acinetobacter baumannii）", "short": "d"}, {"id": "e", "text": "霊菌（Serratia marcescens）", "short": "e"}], "correct": ["a", "d"], "explanation": "グラム陰性ブドウ糖非発酵菌（NFGNB）の代表は緑膿菌（Pseudomonas aeruginosa）とアシネトバクター・バウマニ（Acinetobacter baumannii）で、いずれも医療関連感染・多剤耐性化の観点から重要視される。大腸菌と霊菌（Serratia marcescens）は腸内細菌科（ブドウ糖発酵菌）、バクテロイデス・フラジリスは偏性嫌気性菌であり非発酵菌には該当しない。"}, {"id": 3, "title": "偏性嫌気性菌はどれか。2つ選べ。", "category": "嫌気性菌", "categoryShort": "嫌気性菌", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "炭疽菌（Bacillus anthracis）", "short": "a"}, {"id": "b", "text": "バクテロイデス・フラジリス（Bacteroides fragilis）", "short": "b"}, {"id": "c", "text": "カンピロバクター・ジェジュニ（Campylobacter jejuni）", "short": "c"}, {"id": "d", "text": "ウェルシュ菌（Clostridium perfringens）", "short": "d"}, {"id": "e", "text": "ジフテリア菌（Corynebacterium diphtheriae）", "short": "e"}], "correct": ["b", "d"], "explanation": "偏性嫌気性菌とは酸素存在下で生育できない細菌で、バクテロイデス・フラジリス（腸内常在菌で腹腔内膿瘍の主要起因菌）とウェルシュ菌（Clostridium perfringens）が該当する。炭疽菌とジフテリア菌は通性または好気性のグラム陽性桿菌、カンピロバクターは微好気性菌であり偏性嫌気性菌ではない。"}, {"id": 4, "title": "偏性細胞内増殖性の細菌はどれか。2つ選べ。", "category": "細胞内寄生", "categoryShort": "細胞内寄", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アシネトバクター・バウマニ（Acinetobacter baumannii）", "short": "a"}, {"id": "b", "text": "クラミジア・トラコマティス（Chlamydia trachomatis）", "short": "b"}, {"id": "c", "text": "インフルエンザ菌（Haemophilus influenzae）", "short": "c"}, {"id": "d", "text": "肺炎マイコプラズマ（Mycoplasma pneumoniae）", "short": "d"}, {"id": "e", "text": "リケッチア・リケッチ（Rickettsia rickettsii）", "short": "e"}], "correct": ["b", "e"], "explanation": "偏性細胞内増殖性細菌は宿主細胞内でしか増殖できない細菌で、クラミジア・トラコマティスとリケッチア・リケッチが該当する。両者とも遺伝子の縮小が特徴で、独自の代謝経路を欠き宿主からATPなどを輸送して利用する。インフルエンザ菌、アシネトバクターは細胞外で増殖可能な通常細菌、肺炎マイコプラズマは細胞壁を持たないが細胞外（培地上）でも増殖できる点で偏性細胞内寄生菌とは異なる。"}, {"id": 5, "title": "「薬剤耐性（AMR）対策アクションプラン（2023-2027）」において、使用量減が目標として定められている経口抗菌薬はどれか。2つ選べ。", "category": "AMR対策", "categoryShort": "AMR対", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "セファロスポリン系薬", "short": "a"}, {"id": "b", "text": "マクロライド系薬", "short": "b"}, {"id": "c", "text": "ペニシリン系薬", "short": "c"}, {"id": "d", "text": "テトラサイクリン系薬", "short": "d"}, {"id": "e", "text": "アミノグリコシド系薬", "short": "e"}], "correct": ["a", "b"], "explanation": "日本の「薬剤耐性（AMR）対策アクションプラン」では、経口セファロスポリン系薬・経口マクロライド系薬・経口フルオロキノロン系薬の使用量減少が数値目標として掲げられている。選択肢中ではセファロスポリン系薬とマクロライド系薬が該当する。"}, {"id": 6, "title": "WHOが定めるAWaRe分類のAccessに含まれる抗菌薬はどれか。2つ選べ。", "category": "AWaRe分類", "categoryShort": "AWaR", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "コリスチン", "short": "a"}, {"id": "b", "text": "アンピシリン", "short": "b"}, {"id": "c", "text": "アモキシシリン", "short": "c"}, {"id": "d", "text": "レボフロキサシン", "short": "d"}, {"id": "e", "text": "メロペネム", "short": "e"}], "correct": ["b", "c"], "explanation": "WHOのAWaRe分類のAccess群は、多くの一般的な感染症に対する第一選択・第二選択薬として常時利用可能であるべき抗菌薬群で、アンピシリンやアモキシシリンなどのペニシリン系薬が代表例として挙げられる。コリスチンはReserve群、レボフロキサシンとメロペネムはWatch群に分類される。"}, {"id": 7, "title": "接触予防策が必要な病原体はどれか。2つ選べ。", "category": "感染対策", "categoryShort": "感染対策", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "肺炎球菌（Streptococcus pneumoniae）", "short": "a"}, {"id": "b", "text": "セレウス菌（Bacillus cereus）", "short": "b"}, {"id": "c", "text": "ディフィシル菌（Clostridioides difficile）", "short": "c"}, {"id": "d", "text": "インフルエンザ菌（Haemophilus influenzae）", "short": "d"}, {"id": "e", "text": "メチシリン耐性黄色ブドウ球菌（MRSA）", "short": "e"}], "correct": ["c", "e"], "explanation": "接触予防策は、接触により伝播しやすい病原体（多剤耐性菌、芽胞形成菌の排泄物を介した伝播など）に対して適用される。ディフィシル菌（Clostridioides difficile）とメチシリン耐性黄色ブドウ球菌（MRSA）はいずれも接触感染が主要な伝播経路であり接触予防策の対象となる。"}, {"id": 8, "title": "緑膿菌の特徴として正しいのはどれか。2つ選べ。", "category": "緑膿菌", "categoryShort": "緑膿菌", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "栄養要求性が高く培養が難しい。", "short": "a"}, {"id": "b", "text": "流しなどの水回りからよく分離される。", "short": "b"}, {"id": "c", "text": "病原性が高く健常者にも容易に感染する。", "short": "c"}, {"id": "d", "text": "あらゆるペニシリン系薬に自然耐性を示す。", "short": "d"}, {"id": "e", "text": "人工呼吸器関連肺炎の主要な起因菌の一つである。", "short": "e"}], "correct": ["b", "e"], "explanation": "緑膿菌は栄養要求性が低く水回りなど湿潤環境でよく分離される環境常在菌であり、人工呼吸器関連肺炎（VAP）の主要起因菌の一つとして知られる。健常者への病原性は低く、主に易感染性宿主に日和見感染を起こす。"}, {"id": 9, "title": "Therapeutic drug monitoring（TDM）が必要な抗菌薬はどれか。2つ選べ。", "category": "TDM", "categoryShort": "TDM", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アジスロマイシン", "short": "a"}, {"id": "b", "text": "アモキシシリン", "short": "b"}, {"id": "c", "text": "アルベカシン", "short": "c"}, {"id": "d", "text": "バンコマイシン", "short": "d"}, {"id": "e", "text": "レボフロキサシン", "short": "e"}], "correct": ["c", "d"], "explanation": "アルベカシン（アミノグリコシド系）とバンコマイシン（グリコペプチド系）はいずれも治療域が狭く腎毒性・耳毒性のリスクがあるため、血中濃度モニタリング（TDM）による個別化投与が必須とされる薬剤である。"}, {"id": 10, "title": "細胞壁の合成を阻害する抗菌薬はどれか。2つ選べ。", "category": "作用機序", "categoryShort": "作用機序", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アミノグリコシド系薬", "short": "a"}, {"id": "b", "text": "グリコペプチド系薬", "short": "b"}, {"id": "c", "text": "フルオロキノロン系薬", "short": "c"}, {"id": "d", "text": "β-ラクタム系薬", "short": "d"}, {"id": "e", "text": "マクロライド系薬", "short": "e"}], "correct": ["b", "d"], "explanation": "細胞壁（ペプチドグリカン）合成阻害薬にはβ-ラクタム系薬とグリコペプチド系薬（バンコマイシンなど）が含まれる。アミノグリコシド系とマクロライド系はタンパク質合成阻害薬、フルオロキノロン系はDNAジャイレース・トポイソメラーゼIV阻害薬である。"}, {"id": 11, "title": "β-溶血性を示す細菌はどれか。2つ選べ。", "category": "β溶血", "categoryShort": "β溶血", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Streptococcus mitis", "short": "a"}, {"id": "b", "text": "Streptococcus mutans", "short": "b"}, {"id": "c", "text": "Streptococcus pyogenes", "short": "c"}, {"id": "d", "text": "Streptococcus pneumoniae", "short": "d"}, {"id": "e", "text": "Streptococcus dysgalactiae subsp. equisimilis", "short": "e"}], "correct": ["c", "e"], "explanation": "β溶血は血液寒天培地上で完全な溶血環を形成する性状で、Streptococcus pyogenes（A群）はストレプトリジンSなどにより典型的なβ溶血を示し、咽頭炎・壊死性筋膜炎などの病原因子として機能する。S. dysgalactiae subsp. equisimilis（C/G群）もβ溶血性レンサ球菌である。S. pneumoniae（α溶血）、S. mitis（α溶血）、S. mutans（非溶血〜α溶血）はβ溶血を示さない。"}, {"id": 12, "title": "コアグラーゼ陽性のブドウ球菌はどれか。2つ選べ。", "category": "ブドウ球菌", "categoryShort": "ブドウ球", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Staphylococcus aureus", "short": "a"}, {"id": "b", "text": "Staphylococcus intermedius", "short": "b"}, {"id": "c", "text": "Staphylococcus epidermidis", "short": "c"}, {"id": "d", "text": "Staphylococcus lugdunensis", "short": "d"}, {"id": "e", "text": "Staphylococcus saprophyticus", "short": "e"}], "correct": ["a", "b"], "explanation": "コアグラーゼはフィブリノゲンを凝固させる酵素で、Staphylococcus aureusとStaphylococcus intermediusはコアグラーゼ陽性ブドウ球菌に分類される。S. epidermidis、S. lugdunensis、S. saprophyticusはコアグラーゼ陰性ブドウ球菌（CNS）である。"}, {"id": 13, "title": "新生児の髄膜炎の原因菌として最も考慮すべき細菌はどれか。2つ選べ。", "category": "新生児", "categoryShort": "新生児", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Escherichia coli", "short": "a"}, {"id": "b", "text": "Staphylococcus aureus", "short": "b"}, {"id": "c", "text": "Pseudomonas aeruginosa", "short": "c"}, {"id": "d", "text": "Streptococcus agalactiae", "short": "d"}, {"id": "e", "text": "Streptococcus pneumoniae", "short": "e"}], "correct": ["a", "d"], "explanation": "新生児髄膜炎・早発型敗血症の二大起因菌はStreptococcus agalactiae（B群レンサ球菌、GBS）とEscherichia coliであり、両者で早発型敗血症の多くを占める。年齢が上がるにつれS. pneumoniaeへとシフトする。"}, {"id": 14, "title": "急性単純性膀胱炎の原因菌と第一選択薬の組み合わせとして正しいのはどれか。2つ選べ。", "category": "膀胱炎", "categoryShort": "膀胱炎", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Escherichia coli --- セファクロル", "short": "a"}, {"id": "b", "text": "Klebsiella pneumoniae --- コリスチン", "short": "b"}, {"id": "c", "text": "Enterococcus faecium --- セファゾリン", "short": "c"}, {"id": "d", "text": "Pseudomonas aeruginosa --- セフトリアキソン", "short": "d"}, {"id": "e", "text": "Staphylococcus saprophyticus --- レボフロキサシン", "short": "e"}], "correct": ["a", "e"], "explanation": "急性単純性膀胱炎の主な原因菌はE. coliやStaphylococcus saprophyticusで、セファクロルやレボフロキサシンなどが用いられる。Klebsiellaにコリスチンは不適切、腸球菌はセファロ自然耐性、P. aeruginosaにセフトリアキソンは抗緑膿菌活性なし。"}, {"id": 15, "title": "ステルス型CPEが保有するβ-ラクタマーゼはどれか。1つ選べ。", "category": "IMP-6", "categoryShort": "IMP-", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "KPC-1", "short": "a"}, {"id": "b", "text": "TEM-1", "short": "b"}, {"id": "c", "text": "IMP-6", "short": "c"}, {"id": "d", "text": "NDM-1", "short": "d"}, {"id": "e", "text": "CTX-M-1", "short": "e"}], "correct": ["c"], "explanation": "ステルス型CPEはイミペネム感受性・メロペネム耐性を示す特異な表現型で、日本で多く分離されるIMP-6型メタロβ-ラクタマーゼが代表。IMP-6はIMP-1のGly262Ser変異体で、メロペネムへの加水分解活性が高いため通常の感受性試験では見落とされやすい。"}, {"id": 16, "title": "Clostridioides difficileに有効な抗菌薬はどれか。2つ選べ。", "category": "C.diff", "categoryShort": "C.di", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "メロペネム", "short": "a"}, {"id": "b", "text": "バンコマイシン", "short": "b"}, {"id": "c", "text": "クリンダマイシン", "short": "c"}, {"id": "d", "text": "アジスロマイシン", "short": "d"}, {"id": "e", "text": "フィダキソマイシン", "short": "e"}], "correct": ["b", "e"], "explanation": "Clostridioides difficile感染症（CDI）の治療にはバンコマイシン（経口投与）とフィダキソマイシンが有効。広域βラクタムやクリンダマイシンはCDI発症の誘因となり得る。"}, {"id": 17, "title": "β-ラクタマーゼ非産生アンピシリン耐性インフルエンザ菌（BLNAR）に有効な抗菌薬はどれか。2つ選べ。", "category": "BLNAR", "categoryShort": "BLNA", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "テジゾリド", "short": "a"}, {"id": "b", "text": "レボフロキサシン", "short": "b"}, {"id": "c", "text": "トシル酸スルタミシリン", "short": "c"}, {"id": "d", "text": "タゾバクタム/ピペラシリン", "short": "d"}, {"id": "e", "text": "アモキシシリン/クラブラン酸", "short": "e"}], "correct": ["b", "d"], "explanation": "BLNARはPBP3をコードするftsI遺伝子変異による耐性で、β-ラクタマーゼ阻害薬配合剤は無効。レボフロキサシンとタゾバクタム/ピペラシリンは高い感受性を維持する。"}, {"id": 18, "title": "β-ラクタマーゼ産生アモキシシリン/クラブラン酸耐性インフルエンザ菌（BLPACR）の耐性因子として正しいのはどれか。2つ選べ。", "category": "BLPACR", "categoryShort": "BLPA", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ftsIの変異", "short": "a"}, {"id": "b", "text": "TEM型β-ラクタマーゼ", "short": "b"}, {"id": "c", "text": "CTX-M型β-ラクタマーゼ", "short": "c"}, {"id": "d", "text": "mecA遺伝子の獲得", "short": "d"}, {"id": "e", "text": "mcr-1遺伝子の獲得", "short": "e"}], "correct": ["a", "b"], "explanation": "BLPACRはTEM型β-ラクタマーゼ産生に加えてftsI遺伝子変異（PBP3変異）を併せ持つことで、クラブラン酸配合でも耐性を示す。CTX-MはESBL、mecAはMRSA、mcr-1はコリスチン耐性機序で無関係。"}, {"id": 19, "title": "メタロβ-ラクタマーゼについて正しいのはどれか。2つ選べ。", "category": "MBL", "categoryShort": "MBL", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ボロン酸で阻害される。", "short": "a"}, {"id": "b", "text": "Ambler分類のclass Bに属する。", "short": "b"}, {"id": "c", "text": "NDM-1型は腸内細菌目のみが保有する。", "short": "c"}, {"id": "d", "text": "緑膿菌が元来保有している耐性因子である。", "short": "d"}, {"id": "e", "text": "IMP-6産生大腸菌はしばしばカルバペネム系薬に感受性を示す。", "short": "e"}], "correct": ["b", "e"], "explanation": "メタロβ-ラクタマーゼ（MBL）は活性中心に亜鉛を必要とするAmbler分類class Bで、通常のβ-ラクタマーゼ阻害薬やボロン酸では阻害されない。IMP-6産生大腸菌はイミペネム感受性・メロペネム耐性のステルス型を示すことがある。"}, {"id": 20, "title": "デエスカレーションに相当するのはどれか。2つ選べ。", "category": "デエスカレーション", "categoryShort": "デエスカ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "メロペネムからセフタジジムに変更する。", "short": "a"}, {"id": "b", "text": "アンピシリンからセファゾリンに変更する。", "short": "b"}, {"id": "c", "text": "バンコマイシンからセファゾリンに変更する。", "short": "c"}, {"id": "d", "text": "アルベカシンからダプトマイシンに変更する。", "short": "d"}, {"id": "e", "text": "セフトリアキソンからセフタジジムに変更する。", "short": "e"}], "correct": ["a", "c"], "explanation": "デエスカレーションは広域抗菌薬から狭域・標的治療薬へ変更すること。メロペネム（超広域）→セフタジジム、バンコマイシン→セファゾリン（MSSA狭域）は該当。セフトリアキソン→セフタジジムは緑膿菌カバー拡大でエスカレーション方向。"}, {"id": 21, "title": "エスカレーションに相当するのはどれか。2つ選べ。", "category": "エスカレーション", "categoryShort": "エスカレ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "メロペネム1回0.5gから1回1gに増量する。", "short": "a"}, {"id": "b", "text": "メロペネム1日2回から1日4回に増量する。", "short": "b"}, {"id": "c", "text": "セフトリアキソンからメロペネムに変更する。", "short": "c"}, {"id": "d", "text": "アモキシシリンからセフトリアキソンに変更する。", "short": "d"}, {"id": "e", "text": "注射用シプロフロキサシンから内服のレボフロキサシンに切り替える。", "short": "e"}], "correct": ["c", "d"], "explanation": "エスカレーションは抗菌スペクトラムを広域へ拡大することを指す。セフトリアキソン（第3世代セフェム）からメロペネム（カルバペネム）へ、アモキシシリン（ペニシリン）からセフトリアキソンへはいずれもスペクトラム拡大でエスカレーションに該当する。同一薬剤の用量・投与回数増量はエスカレーションではなく、IVからPOへのスイッチはデエスカレーション/スイッチ療法の文脈である。"}, {"id": 22, "title": "核酸増幅法は次のうちどれか。2つ選べ。", "category": "核酸増幅", "categoryShort": "核酸増幅", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "PCR", "short": "a"}, {"id": "b", "text": "RIA", "short": "b"}, {"id": "c", "text": "LAMP", "short": "c"}, {"id": "d", "text": "TPHA", "short": "d"}, {"id": "e", "text": "ELISA", "short": "e"}], "correct": ["a", "c"], "explanation": "核酸増幅法（NAAT）は病原体等の核酸を増幅して検出する方法で、PCR（polymerase chain reaction）とLAMP（loop-mediated isothermal amplification）が代表。RIAは放射免疫測定、TPHAは梅毒の受身赤血球凝集試験、ELISAは酵素免疫測定で抗原抗体反応を原理とする。"}, {"id": 23, "title": "IGRAに用いられている結核特異的抗原はどれか。2つ選べ。", "category": "IGRA", "categoryShort": "IGRA", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "KatG", "short": "a"}, {"id": "b", "text": "MDP1", "short": "b"}, {"id": "c", "text": "Ag85B", "short": "c"}, {"id": "d", "text": "CFP-10", "short": "d"}, {"id": "e", "text": "ESAT-6", "short": "e"}], "correct": ["d", "e"], "explanation": "IGRA（インターフェロンγ遊離試験）のクォンティフェロンでは、結核菌特異的なRD1領域にコードされるCFP-10（culture filtrate protein 10）とESAT-6（early secreted antigenic target 6）を刺激抗原として用いる。KatG、MDP1、Ag85Bは結核菌抗原だがIGRAの特異抗原としては用いられない。BCGにはRD1が欠損しているためBCG接種の影響を受けない。"}, {"id": 24, "title": "qSOFAに用いられる項目はどれか。2つ選べ。", "category": "qSOFA", "categoryShort": "qSOF", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "血圧", "short": "a"}, {"id": "b", "text": "脈拍", "short": "b"}, {"id": "c", "text": "呼吸数", "short": "c"}, {"id": "d", "text": "SpO2", "short": "d"}, {"id": "e", "text": "白血球数", "short": "e"}], "correct": ["a", "c"], "explanation": "qSOFA（quick SOFA）は敗血症スクリーニングのベッドサイドスコアで、①収縮期血圧≤100mmHg、②呼吸数≥22/分、③意識レベルの変容（GCS<15）の3項目からなる。脈拍、SpO2、白血球数はqSOFAの項目には含まれない。"}, {"id": 25, "title": "eGFRの算出に必要な項目はどれか。2つ選べ。", "category": "eGFR", "categoryShort": "eGFR", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "K", "short": "a"}, {"id": "b", "text": "Na", "short": "b"}, {"id": "c", "text": "Cr", "short": "c"}, {"id": "d", "text": "年齢", "short": "d"}, {"id": "e", "text": "体重", "short": "e"}], "correct": ["c", "d"], "explanation": "日本人のeGFR推算式は血清Cr値、年齢、性別（女性は×0.739）から算出される。K、Na、体重はeGFR算出には不要。Cockcroft-Gault式のクレアチニンクリアランスでは体重が必要だが、eGFRでは不要。"}, {"id": 26, "title": "Child-Pugh分類に必要な項目はどれか。2つ選べ。", "category": "Child-Pugh", "categoryShort": "Chil", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "BUN", "short": "a"}, {"id": "b", "text": "GOT（AST）", "short": "b"}, {"id": "c", "text": "GPT（ALT）", "short": "c"}, {"id": "d", "text": "アルブミン", "short": "d"}, {"id": "e", "text": "ビリルビン", "short": "e"}], "correct": ["d", "e"], "explanation": "Child-Pugh分類は肝硬変の重症度分類で、①血清ビリルビン、②血清アルブミン、③プロトロンビン時間、④腹水、⑤肝性脳症の5項目で評価する。BUN、AST、ALTは含まれない。"}, {"id": 27, "title": "キノロン耐性に関連する遺伝子はどれか。2つ選べ。", "category": "耐性遺伝子", "categoryShort": "耐性遺伝", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "gyrA", "short": "a"}, {"id": "b", "text": "parC", "short": "b"}, {"id": "c", "text": "mcr1", "short": "c"}, {"id": "d", "text": "vanA", "short": "d"}, {"id": "e", "text": "blaIMP", "short": "e"}], "correct": ["a", "b"], "explanation": "キノロン耐性は標的酵素であるDNAジャイレース（gyrA）とトポイソメラーゼIV（parC）のQRDR領域変異が主要機序。mcr-1はコリスチン耐性、vanAはバンコマイシン耐性（VRE）、blaIMPはメタロβ-ラクタマーゼ遺伝子である。"}, {"id": 28, "title": "経口第三世代セファロスポリン系薬はどれか。2つ選べ。", "category": "経口セファロ", "categoryShort": "経口セフ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "セフジニル", "short": "a"}, {"id": "b", "text": "セファクロル", "short": "b"}, {"id": "c", "text": "セフタジジム", "short": "c"}, {"id": "d", "text": "セフトリアキソン", "short": "d"}, {"id": "e", "text": "セフジトレン-ピボキシル", "short": "e"}], "correct": ["a", "e"], "explanation": "経口第三世代セファロスポリンはセフジニル（セフゾン）、セフジトレン ピボキシル（メイアクト）、セフカペン ピボキシルなど。セファクロルは第二世代経口、セフタジジムとセフトリアキソンは注射用第三世代である。"}, {"id": 29, "title": "マクロライド系薬はどれか。2つ選べ。", "category": "マクロライド", "categoryShort": "マクロラ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アジスロマイシン", "short": "a"}, {"id": "b", "text": "クラリスロマイシン", "short": "b"}, {"id": "c", "text": "ゲンタマイシン", "short": "c"}, {"id": "d", "text": "テジゾリド", "short": "d"}, {"id": "e", "text": "ミノサイクリン", "short": "e"}], "correct": ["a", "b"], "explanation": "マクロライド系は14員環・15員環のラクトン環を持つタンパク合成阻害薬で、アジスロマイシン、クラリスロマイシン、エリスロマイシンが該当。ゲンタマイシンはアミノグリコシド、テジゾリドはオキサゾリジノン、ミノサイクリンはテトラサイクリン系である。"}, {"id": 30, "title": "内服できない抗菌薬はどれか。2つ選べ。", "category": "内服不可", "categoryShort": "内服不可", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アルベカシン", "short": "a"}, {"id": "b", "text": "セファクロル", "short": "b"}, {"id": "c", "text": "テイコプラニン", "short": "c"}, {"id": "d", "text": "テジゾリド", "short": "d"}, {"id": "e", "text": "リネゾリド", "short": "e"}], "correct": ["a", "c"], "explanation": "アルベカシン（アミノグリコシド系）とテイコプラニン（グリコペプチド系）は経口吸収されず注射薬のみ。セファクロルは経口セフェム、テジゾリドとリネゾリドはオキサゾリジノン系で経口バイオアベイラビリティが高く内服可能（テジゾリドは100%近い）。"}, {"id": 31, "title": "抗MRSA薬について、正しいのはどれか。2つ選べ。", "category": "抗MRSA薬", "categoryShort": "抗MRS", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "テジゾリドは内服が可能である。", "short": "a"}, {"id": "b", "text": "アルベカシンはバイオアベイラビリティが高い。", "short": "b"}, {"id": "c", "text": "リネゾリドは肺サーファクタントにより不活化される。", "short": "c"}, {"id": "d", "text": "ダプトマイシン投与中は骨髄抑制に注意が必要である。", "short": "d"}, {"id": "e", "text": "グリコペプチド系薬のTDMでは、トラフの測定が有用である。", "short": "e"}], "correct": ["a", "e"], "explanation": "テジゾリド（シベクトロ）は経口バイオアベイラビリティ約91%で内服可能。グリコペプチド系（バンコマイシン、テイコプラニン）のTDMはトラフ値がAUCの指標として有用。アルベカシンは注射薬のみで経口BAは低い。肺サーファクタントで不活化されるのはダプトマイシンでありリネゾリドは肺炎にも使用可能。ダプトマイシンで注意するのは横紋筋融解症・CPK上昇で、骨髄抑制が問題になるのはリネゾリドである。"}, {"id": 32, "title": "バンコマイシンについて正しいのはどれか。2つ選べ。", "category": "バンコマイシン", "categoryShort": "バンコマ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "バイオアベイラビリティが高い。", "short": "a"}, {"id": "b", "text": "TDMではピークの測定が必須である。", "short": "b"}, {"id": "c", "text": "副作用としてred man症候群が知られている。", "short": "c"}, {"id": "d", "text": "D-Ala-D-Alaに結合し、細胞壁の合成を阻害する。", "short": "d"}, {"id": "e", "text": "メチシリン感受性黄色ブドウ球菌（MSSA）に対しては無効である。", "short": "e"}], "correct": ["c", "d"], "explanation": "バンコマイシンは急速静注によりヒスタミン遊離によるred man症候群を起こす。作用機序は細胞壁前駆体のD-Ala-D-Alaに結合しトランスグリコシラーゼ・トランスペプチダーゼを阻害する。経口吸収はほとんどなくBAは低い。TDMはトラフ/AUCが指標でピークは不要。MSSAにも有効だが第一選択はセファゾリン等のβラクタムである。"}, {"id": 33, "title": "バンコマイシン耐性腸球菌（VRE）について正しいのはどれか。2つ選べ。", "category": "VRE", "categoryShort": "VRE", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "芽胞形成菌である。", "short": "a"}, {"id": "b", "text": "セファゾリンが有効である。", "short": "b"}, {"id": "c", "text": "バンコマイシン耐性はPBPの変異によるものである。", "short": "c"}, {"id": "d", "text": "VREによる感染症は、感染症法の5類全数報告の対象である。", "short": "d"}, {"id": "e", "text": "Enterococcus faecalisよりもEnterococcus faeciumの方が耐性化傾向にある。", "short": "e"}], "correct": ["d", "e"], "explanation": "VRE感染症は感染症法5類全数把握疾患である。腸球菌は芽胞を形成せず、セファロスポリン系に自然耐性を示すためセファゾリンは無効。バンコマイシン耐性はD-Ala-D-AlaがD-Ala-D-Lacに置換されるvanA/vanB遺伝子による。E. faeciumの方がE. faecalisよりVRE化しやすい。"}, {"id": 34, "title": "抗菌薬に関する以下の説明に関して正しいのはどれか。2つ選べ。", "category": "抗菌薬基礎", "categoryShort": "抗菌薬基", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "広域抗菌薬にはアンピシリンが含まれる。", "short": "a"}, {"id": "b", "text": "コリスチンはグラム陽性菌に無効である。", "short": "b"}, {"id": "c", "text": "メトロニダゾールは嫌気性菌に無効である。", "short": "c"}, {"id": "d", "text": "セファロスポリン系薬は腸球菌に無効である。", "short": "d"}, {"id": "e", "text": "フィダキソマイシンは抗MRSA薬の一つである。", "short": "e"}], "correct": ["b", "d"], "explanation": "コリスチン（ポリミキシン）はグラム陰性桿菌に特異的でグラム陽性菌には無効。セファロスポリン系は腸球菌に自然耐性（無効）。アンピシリンは広域ではなく中等域ペニシリン、メトロニダゾールは嫌気性菌に有効、フィダキソマイシンはC. difficile治療薬で抗MRSA薬ではない。"}, {"id": 35, "title": "検査に関する次の説明のうち、正しいのはどれか。2つ選べ。", "category": "検査", "categoryShort": "検査", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "喀痰の採取は日中が望ましい。", "short": "a"}, {"id": "b", "text": "喀痰の採取直前にうがいがすることが望ましい。", "short": "b"}, {"id": "c", "text": "百日咳菌の培養にはボルデ・ジャング培地が有用である。", "short": "c"}, {"id": "d", "text": "淋菌・クラミジア感染症を疑う場合には中間尿を採取する。", "short": "d"}, {"id": "e", "text": "抗体検査の方が、抗原検査（イムノクロマト法）よりも結果が早く判明する。", "short": "e"}], "correct": ["b", "c"], "explanation": "喀痰は口腔常在菌の混入を避けるため採取直前にうがいが推奨され、早朝痰が最も質が良い。百日咳菌（Bordetella pertussis）はボルデ・ジャング培地（BG培地）が選択培地。淋菌・クラミジアは初尿が推奨。抗原検査（イムノクロマト）は迅速で抗体検査より早く結果が出る。"}, {"id": 36, "title": "検査に関する次の説明のうち、正しいのはどれか。2つ選べ。", "category": "検査", "categoryShort": "検査", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "初尿とは出生後最初に採取した新生児の尿を指す。", "short": "a"}, {"id": "b", "text": "中間尿は食後2時間以上経過した後に採取した尿を指す。", "short": "b"}, {"id": "c", "text": "大腸菌による尿路感染症を疑う場合には中間尿を採取する。", "short": "c"}, {"id": "d", "text": "抗体検査の方が、抗原検査（イムノクロマト法）よりも結果が早く判明する。", "short": "d"}, {"id": "e", "text": "新生児早発型GBS感染予防対策のためのスクリーニング検査として、全妊婦に対してGBS培養検査が推奨されている。", "short": "e"}], "correct": ["c", "e"], "explanation": "尿路感染症（大腸菌等）を疑う際は外陰部を洗浄後の中間尿を採取する。新生児早発型GBS感染症予防のため、妊娠35-37週の全妊婦に腟・直腸のGBS培養スクリーニングが推奨されている。初尿は排尿開始直後の尿を指し、中間尿は排尿途中の尿を指す。抗原検査の方が抗体検査より迅速。"}, {"id": 37, "title": "結核の病理像の特徴として正しいのはどれか。2つ選べ。", "category": "結核", "categoryShort": "結核", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "乾酪壊死", "short": "a"}, {"id": "b", "text": "核内封入体", "short": "b"}, {"id": "c", "text": "半月体形成", "short": "c"}, {"id": "d", "text": "好中球の集簇", "short": "d"}, {"id": "e", "text": "ラングハンス型巨細胞", "short": "e"}], "correct": ["a", "e"], "explanation": "結核の病理組織学的特徴は乾酪壊死を伴う類上皮肉芽腫とラングハンス型巨細胞（馬蹄形に核が配列）である。核内封入体はウイルス感染、半月体形成は急速進行性糸球体腎炎、好中球集簇は化膿性炎症の特徴。"}, {"id": 38, "title": "Mycobacterium aviumによる非結核性抗酸菌症に用いる抗菌薬として正しいのはどれか。2つ選べ。", "category": "NTM", "categoryShort": "NTM", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "colistin", "short": "a"}, {"id": "b", "text": "isoniazid", "short": "b"}, {"id": "c", "text": "ethambutol", "short": "c"}, {"id": "d", "text": "minocycline", "short": "d"}, {"id": "e", "text": "clarithromycin", "short": "e"}], "correct": ["c", "e"], "explanation": "Mycobacterium avium complex（MAC）症の標準治療はクラリスロマイシン（またはアジスロマイシン）＋エタンブトール＋リファンピシンの3剤併用。イソニアジドはMACには無効、コリスチンはグラム陰性桿菌用、ミノサイクリンは非定型的抗酸菌には通常用いられない。"}, {"id": 39, "title": "日本で2010年よりも増加している薬剤耐性菌はどれか。2つ選べ。", "category": "疫学", "categoryShort": "疫学", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "多剤耐性緑膿菌", "short": "a"}, {"id": "b", "text": "キノロン耐性大腸菌", "short": "b"}, {"id": "c", "text": "多剤耐性アシネトバクター", "short": "c"}, {"id": "d", "text": "メチシリン耐性黄色ブドウ球菌", "short": "d"}, {"id": "e", "text": "第三世代セファロスポリン耐性大腸菌", "short": "e"}], "correct": ["b", "e"], "explanation": "JANIS等のサーベイランスでは、2010年以降に第三世代セファロスポリン耐性大腸菌（ESBL産生大腸菌）およびフルオロキノロン耐性大腸菌が増加傾向。一方、多剤耐性緑膿菌（MDRP）、多剤耐性アシネトバクター（MDRA）、MRSAは感染対策・AMR対策の進展により減少傾向にある。"}, {"id": 40, "title": "5類感染症として全数を届け出る必要がある薬剤耐性菌感染症はどれか。2つ選べ。", "category": "届出", "categoryShort": "届出", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "カルバペネム耐性腸内細菌目細菌感染症", "short": "a"}, {"id": "b", "text": "基質特異性拡張型β-ラクタマーゼ産生大腸菌感染症", "short": "b"}, {"id": "c", "text": "バンコマイシン耐性腸球菌感染症", "short": "c"}, {"id": "d", "text": "β-ラクタマーゼ非産生アンピシリン耐性インフルエンザ菌感染症", "short": "d"}, {"id": "e", "text": "ペニシリン耐性肺炎球菌感染症", "short": "e"}], "correct": ["a", "c"], "explanation": "感染症法で5類全数把握の薬剤耐性菌感染症は、①バンコマイシン耐性黄色ブドウ球菌感染症、②バンコマイシン耐性腸球菌感染症（VRE）、③カルバペネム耐性腸内細菌目細菌感染症（CRE）、④薬剤耐性アシネトバクター感染症、⑤薬剤耐性緑膿菌感染症である。ESBL産生大腸菌、BLNAR、PRSPは届出対象外。"}, {"id": 41, "title": "喀痰の検体として適しているのはどれか。2つ選べ。", "category": "喀痰", "categoryShort": "喀痰", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "唾液，完全な粘液性痰", "short": "a"}, {"id": "b", "text": "Geckler分類で1の検体", "short": "b"}, {"id": "c", "text": "Geckler分類で5の検体", "short": "c"}, {"id": "d", "text": "Miller-Jones分類でM1の検体", "short": "d"}, {"id": "e", "text": "Miller-Jones分類でP3の検体", "short": "e"}], "correct": ["c", "e"], "explanation": "喀痰の品質評価にはGeckler分類（扁平上皮と白血球の比率で1〜6）とMiller-Jones分類（M:粘液性、P:膿性、MとPの組み合わせで量を評価）が用いられる。Geckler分類5（白血球>25/低倍率、扁平上皮<10）は良質検体、Geckler1は唾液に近い不良検体。Miller-Jones分類P3は膿性成分が多く良質、M1（粘液のみ少量）は不良検体と判断される。唾液や完全な粘液性痰は口腔常在菌が主体で培養の価値が低い。"}, {"id": 42, "title": "尿路感染症の主な原因菌はどれか。1つ選べ。", "category": "尿路感染", "categoryShort": "尿路感染", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "Escherichia coli", "short": "a"}, {"id": "b", "text": "Bacteroides fragilis", "short": "b"}, {"id": "c", "text": "Staphylococcus aureus", "short": "c"}, {"id": "d", "text": "Streptococcus agalactiae", "short": "d"}, {"id": "e", "text": "Pseudomonas aeruginosa", "short": "e"}], "correct": ["a"], "explanation": "尿路感染症（急性膀胱炎、腎盂腎炎）は単純性・複雑性を問わずEscherichia coliが起因菌の70〜80%を占め最多である。Pseudomonas aeruginosaやEnterococcusは複雑性UTIやカテーテル関連で増加するが全体では少数。Bacteroides fragilisは腸内嫌気性菌で尿路感染の原因とはなりにくい。"}, {"id": 43, "title": "グラム染色による分類に関して正しい説明はどれか。2つ選べ。", "category": "グラム染色", "categoryShort": "グラム染", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "グラム陽性菌は外膜を持たない。", "short": "a"}, {"id": "b", "text": "グラム陽性菌は鞭毛を持たない。", "short": "b"}, {"id": "c", "text": "グラム陽性菌はO抗原を持たない。", "short": "c"}, {"id": "d", "text": "グラム陰性菌はK抗原を持たない。", "short": "d"}, {"id": "e", "text": "グラム陰性菌は排出ポンプを持たない。", "short": "e"}], "correct": ["a", "c"], "explanation": "グラム陽性菌は厚いペプチドグリカン層と細胞膜のみで外膜を欠く。グラム陰性菌は外膜（LPSを含む）を持つ。O抗原はLPSの多糖部分でグラム陰性菌特有のため、グラム陽性菌はO抗原を持たない。グラム陽性菌でも鞭毛（例：Bacillus、Listeria）や莢膜（K抗原相当）を持ちうる。グラム陰性菌もK抗原（莢膜）を持ちうるし、RND型などの排出ポンプを有する。"}, {"id": 44, "title": "細菌に関する説明として正しいのはどれか。2つ選べ。", "category": "細菌特性", "categoryShort": "細菌特性", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Salmonella Typhiは鞭毛を持たない。", "short": "a"}, {"id": "b", "text": "Shigella sonneiはシガ毒素を産生しない。", "short": "b"}, {"id": "c", "text": "Acinetobacter baumanniiは鞭毛を持たない。", "short": "c"}, {"id": "d", "text": "Corynebacterium diphtheriaeは芽胞を形成する。", "short": "d"}, {"id": "e", "text": "Neisseria meningitidisは厚い莢膜を有し、乾燥に強い。", "short": "e"}], "correct": ["b", "c"], "explanation": "Shigella sonneiは通常シガ毒素を産生せず、Shigella dysenteriae 1型がシガ毒素産生性。Acinetobacter baumanniiは非運動性のグラム陰性桿菌で鞭毛を持たない。Salmonella Typhiは周毛性鞭毛を持ち運動性。Corynebacterium diphtheriaeは芽胞を形成しないグラム陽性桿菌（異染小体あり）。Neisseria meningitidisは莢膜を有するが乾燥に極めて弱く、飛沫感染する。"}, {"id": 45, "title": "急性中耳炎の主な原因菌はどれか。2つ選べ。", "category": "中耳炎", "categoryShort": "中耳炎", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Escherichia coli", "short": "a"}, {"id": "b", "text": "Enterococcus faecium", "short": "b"}, {"id": "c", "text": "Staphylococcus aureus", "short": "c"}, {"id": "d", "text": "Haemophilus influenzae", "short": "d"}, {"id": "e", "text": "Streptococcus pneumoniae", "short": "e"}], "correct": ["d", "e"], "explanation": "急性中耳炎（小児・成人）の主な原因菌はStreptococcus pneumoniae、Haemophilus influenzae（無莢膜型が主体）、Moraxella catarrhalisの三者が多く、上気道炎に続発する。E. coliや腸球菌は中耳炎の主要起因菌ではない。"}, {"id": 46, "title": "菌血症の主な原因菌はどれか。2つ選べ。", "category": "菌血症", "categoryShort": "菌血症", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Escherichia coli", "short": "a"}, {"id": "b", "text": "Enterococcus faecium", "short": "b"}, {"id": "c", "text": "Staphylococcus aureus", "short": "c"}, {"id": "d", "text": "Haemophilus influenzae", "short": "d"}, {"id": "e", "text": "Streptococcus agalactiae", "short": "e"}], "correct": ["a", "c"], "explanation": "国内の血液培養サーベイランス（JANIS等）では菌血症の二大起因菌はEscherichia coliとStaphylococcus aureusであり、両者で全体の4割前後を占める。E. coliは尿路・胆道由来、S. aureusはカテーテル関連・皮膚軟部組織由来が多い。Enterococcus、H. influenzae、GBSも菌血症を起こすが頻度は二者に比べて低い。"}, {"id": 47, "title": "ワクチンで予防可能な感染症はどれか。2つ選べ。", "category": "ワクチン", "categoryShort": "ワクチン", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ガス壊疽", "short": "a"}, {"id": "b", "text": "侵襲性髄膜炎菌感染症", "short": "b"}, {"id": "c", "text": "侵襲性肺炎球菌感染症", "short": "c"}, {"id": "d", "text": "多剤耐性緑膿菌感染症", "short": "d"}, {"id": "e", "text": "侵襲性肺アスペルギルス症", "short": "e"}], "correct": ["b", "c"], "explanation": "侵襲性髄膜炎菌感染症はMenACWYワクチン（2024年から一部定期化の動き）、侵襲性肺炎球菌感染症はPCV13/15/20やPPSV23で予防可能である。ガス壊疽（Clostridium perfringens等）、多剤耐性緑膿菌感染症、侵襲性肺アスペルギルス症に対する実用化ワクチンはない。"}, {"id": 48, "title": "空気予防策が必要な感染症はどれか。2つ選べ。", "category": "空気予防策", "categoryShort": "空気予防", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "結核", "short": "a"}, {"id": "b", "text": "風疹", "short": "b"}, {"id": "c", "text": "水痘", "short": "c"}, {"id": "d", "text": "ジフテリア", "short": "d"}, {"id": "e", "text": "インフルエンザ", "short": "e"}], "correct": ["a", "c"], "explanation": "空気予防策（airborne precautions）は飛沫核（<5μm）で伝播し、空気中を長時間浮遊する病原体に対してN95マスクと陰圧室が必要。結核、麻疹、水痘が三大対象。風疹は飛沫予防策、ジフテリア（咽頭）は飛沫＋接触、インフルエンザは飛沫予防策が基本である。"}, {"id": 49, "title": "基質特異性拡張型β-ラクタマーゼによって分解される抗菌薬はどれか。2つ選べ。", "category": "ESBL", "categoryShort": "ESBL", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アンピシリン", "short": "a"}, {"id": "b", "text": "セフトリアキソン", "short": "b"}, {"id": "c", "text": "セフメタゾール", "short": "c"}, {"id": "d", "text": "ファロペネム", "short": "d"}, {"id": "e", "text": "メロペネム", "short": "e"}], "correct": ["a", "b"], "explanation": "ESBL（基質特異性拡張型β-ラクタマーゼ）はペニシリン系、アンピシリン、第1〜3世代セファロスポリン（セフトリアキソン、セフタジジム等）、アズトレオナムを加水分解する。セファマイシン系（セフメタゾール等）、カルバペネム系（メロペネム、ファロペネムはペネム系だがカルバペネムに準じてESBLに安定）は分解されにくい。"}, {"id": 50, "title": "CTX-M型β-ラクタマーゼの主要な産生菌はどれか。2つ選べ。", "category": "CTX-M", "categoryShort": "CTX-", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Escherichia coli", "short": "a"}, {"id": "b", "text": "Enterococcus faecium", "short": "b"}, {"id": "c", "text": "Staphylococcus aureus", "short": "c"}, {"id": "d", "text": "Klebsiella pneumoniae", "short": "d"}, {"id": "e", "text": "Streptococcus pneumoniae", "short": "e"}], "correct": ["a", "d"], "explanation": "CTX-M型は現在世界で最も優勢なESBL遺伝子型で、主にEscherichia coliとKlebsiella pneumoniaeが保有し、プラスミドを介して市中・院内で拡散している。腸球菌、黄色ブドウ球菌、肺炎球菌はβ-ラクタマーゼの産生機序が異なりCTX-Mの主要宿主ではない。"}, {"id": 51, "title": "β-ラクタマーゼについて正しい説明はどれか。2つ選べ。", "category": "復習セット6", "categoryShort": "Set6", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "KPCはセリン型である。", "short": "a"}, {"id": "b", "text": "IMP-6はメタロ型である。", "short": "b"}, {"id": "c", "text": "OXA型はAmbler分類class Aに分類される。", "short": "c"}, {"id": "d", "text": "CTX-M型はAmbler分類class Bに分類される。", "short": "d"}, {"id": "e", "text": "メタロ型はセファマイシン系薬を分解できない。", "short": "e"}], "correct": ["a", "b"], "explanation": "正解は a, b"}, {"id": 52, "title": "コリスチンについて正しい説明はどれか。2つ選べ。", "category": "復習セット6", "categoryShort": "Set6", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "静菌的な作用を示す。", "short": "a"}, {"id": "b", "text": "主に肝臓で代謝される。", "short": "b"}, {"id": "c", "text": "グラム陽性菌に有効である。", "short": "c"}, {"id": "d", "text": "外膜のLPSが標的となっている。", "short": "d"}, {"id": "e", "text": "伝達性の耐性遺伝子としてmcr1が知られている。", "short": "e"}], "correct": ["d", "e"], "explanation": "正解は d, e"}, {"id": 53, "title": "バンコマイシンについて正しいのはどれか。2つ選べ。", "category": "復習セット6", "categoryShort": "Set6", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "TDMではピークの測定が必要である。", "short": "a"}, {"id": "b", "text": "黄色ブドウ球菌の10%が耐性を示す。", "short": "b"}, {"id": "c", "text": "耐性機構として分解酵素が知られている。", "short": "c"}, {"id": "d", "text": "耐性遺伝子のvanAは伝達性がある。", "short": "d"}, {"id": "e", "text": "Lactobacillus属は一次耐性を示す。", "short": "e"}], "correct": ["d", "e"], "explanation": "正解は d, e"}, {"id": 54, "title": "肺炎球菌のマクロライド耐性遺伝子はどれか。2つ選べ。", "category": "復習セット6", "categoryShort": "Set6", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ermB", "short": "a"}, {"id": "b", "text": "ftsI", "short": "b"}, {"id": "c", "text": "mcr1", "short": "c"}, {"id": "d", "text": "mecA", "short": "d"}, {"id": "e", "text": "mefA", "short": "e"}], "correct": ["a", "e"], "explanation": "正解は a, e"}, {"id": 55, "title": "β-ラクタム系薬について正しい説明はどれか。2つ選べ。", "category": "復習セット6", "categoryShort": "Set6", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Time above MICが有効性と関連する。", "short": "a"}, {"id": "b", "text": "セフトリアキソンは半減期が長いので、1日1回の投与が推奨される。", "short": "b"}, {"id": "c", "text": "セファロスポリン系薬のβ-ラクタム環に隣接するのは5員環である。", "short": "c"}, {"id": "d", "text": "カルバペネム系薬のβ-ラクタム環に隣接する5員環には硫黄が含まれる。", "short": "d"}, {"id": "e", "text": "ペニシリン系薬はβ-ラクタム環に隣接する5員環の1つが2重結合になっている。", "short": "e"}], "correct": ["a", "b"], "explanation": "正解は a, b"}, {"id": 56, "title": "フルオロキノロン系薬について正しい説明はどれか。2つ選べ。", "category": "復習セット6", "categoryShort": "Set6", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "非定型菌にも有効である。", "short": "a"}, {"id": "b", "text": "Time above MICが有効性と関連する。", "short": "b"}, {"id": "c", "text": "シプロフロキサシンの半減期は約12時間である。", "short": "c"}, {"id": "d", "text": "結核は元来フルオロキノロン系薬に自然耐性を示す。", "short": "d"}, {"id": "e", "text": "耐性変異しやすい遺伝子領域はQRDRとして知られている。", "short": "e"}], "correct": ["a", "e"], "explanation": "正解は a, e"}, {"id": 57, "title": "マクロライド系薬について正しい説明はどれか。2つ選べ。", "category": "復習セット6", "categoryShort": "Set6", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "細胞壁合成を阻害する。", "short": "a"}, {"id": "b", "text": "非定型菌には無効である。", "short": "b"}, {"id": "c", "text": "肺炎球菌の耐性は知られていない。", "short": "c"}, {"id": "d", "text": "クラリスロマイシンは14員環である。", "short": "d"}, {"id": "e", "text": "アジスロマイシンは半減期が長いので、3日間の内服で有効な組織内濃度が約7日間持続する。", "short": "e"}], "correct": ["d", "e"], "explanation": "正解は d, e"}, {"id": 58, "title": "Campylobacter jejuni/coliについて正しい説明はどれか。2つ選べ。", "category": "復習セット6", "categoryShort": "Set6", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "芽胞を形成する。", "short": "a"}, {"id": "b", "text": "らせん状の細菌である。", "short": "b"}, {"id": "c", "text": "100℃でも殺菌されない。", "short": "c"}, {"id": "d", "text": "鳥類の腸管内に常在する。", "short": "d"}, {"id": "e", "text": "マクロライド系薬に自然耐性を示す。", "short": "e"}], "correct": ["b", "d"], "explanation": "正解は b, d"}, {"id": 59, "title": "ディフィシル菌感染症の治療薬として誤っているのはどれか。2つ選べ。", "category": "復習セット6", "categoryShort": "Set6", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ST合剤", "short": "a"}, {"id": "b", "text": "ペンタミジン", "short": "b"}, {"id": "c", "text": "バンコマイシン", "short": "c"}, {"id": "d", "text": "メトロニダゾール", "short": "d"}, {"id": "e", "text": "フィダキソマイシン", "short": "e"}], "correct": ["a", "b"], "explanation": "正解は a, b"}, {"id": 60, "title": "腸管出血性大腸菌感染症について正しい説明はどれか。2つ選べ", "category": "復習セット6", "categoryShort": "Set6", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "5類感染症に定められている。", "short": "a"}, {"id": "b", "text": "ベロ毒素が病態に関与している。", "short": "b"}, {"id": "c", "text": "溶血性尿毒症症候群の原因となる。", "short": "c"}, {"id": "d", "text": "無症候であっても入院措置が必要である。", "short": "d"}, {"id": "e", "text": "感染予防にはアルコール消毒が使用できない。", "short": "e"}], "correct": ["b", "c"], "explanation": "正解は b, c"}, {"id": 61, "title": "肺炎の原因菌で尿中抗原検査が診断に有用なのはどれか。2つ選べ。", "category": "尿中抗原", "categoryShort": "尿中抗原", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Haemophilus influenzae", "short": "a"}, {"id": "b", "text": "Legionella pneumophila", "short": "b"}, {"id": "c", "text": "Mycoplasma pneumoniae", "short": "c"}, {"id": "d", "text": "Pseudomonas aeruginosa", "short": "d"}, {"id": "e", "text": "Streptococcus pneumoniae", "short": "e"}], "correct": ["b", "e"], "explanation": "肺炎における尿中抗原検査はLegionella pneumophila（血清群1）とStreptococcus pneumoniaeが保険適用で有用。H. influenzae、Mycoplasma、P. aeruginosaには尿中抗原検査は存在しない。レジオネラは温泉・冷却塔関連肺炎、肺炎球菌は市中肺炎の最多起因菌として迅速診断の意義が高い。"}, {"id": 62, "title": "生後2か月から開始可能なワクチンはどれか。2つ選べ。", "category": "ワクチン", "categoryShort": "ワクチン", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ヒブワクチン", "short": "a"}, {"id": "b", "text": "MRワクチン", "short": "b"}, {"id": "c", "text": "水痘ワクチン", "short": "c"}, {"id": "d", "text": "日本脳炎ワクチン", "short": "d"}, {"id": "e", "text": "小児用肺炎球菌ワクチン", "short": "e"}], "correct": ["a", "e"], "explanation": "生後2か月から接種可能な定期接種はヒブワクチンと小児用肺炎球菌ワクチン（PCV）で、同時接種が推奨される。MR（麻しん風しん）は1歳から、水痘は1歳から、日本脳炎は6か月（標準3歳）から開始。"}, {"id": 63, "title": "結核の発病リスクとなる状態はどれか。2つ選べ。", "category": "結核リスク", "categoryShort": "結核リス", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "BCG接種後である。", "short": "a"}, {"id": "b", "text": "肺炎球菌ワクチン接種後である。", "short": "b"}, {"id": "c", "text": "コントロール不良の糖尿病がある。", "short": "c"}, {"id": "d", "text": "イソニアジドによる治療中である。", "short": "d"}, {"id": "e", "text": "インフリキシマブ（抗TNFα抗体）による治療中である。", "short": "e"}], "correct": ["c", "e"], "explanation": "結核発病リスクはコントロール不良の糖尿病、TNFα阻害薬（インフリキシマブ等）、HIV、透析、ステロイド・免疫抑制薬、喫煙などが挙げられる。BCG接種、肺炎球菌ワクチンはリスクを下げ、イソニアジドはLTBI治療薬であり発病を抑制する。"}, {"id": 64, "title": "病原体とその培養に用いる培地の組み合わせとして正しいのはどれか。2つ選べ。", "category": "培地", "categoryShort": "培地", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Campylobacter jejuni/coli --- Skirrow培地", "short": "a"}, {"id": "b", "text": "Neisseria gonorrhoeae --- 小川培地", "short": "b"}, {"id": "c", "text": "Haemophilus influenzae --- 羊血液寒天培地", "short": "c"}, {"id": "d", "text": "Bordetella pertussis --- ボルデ-ジャング培地", "short": "d"}, {"id": "e", "text": "Chlamydia pneumoniae --- BCYE α培地", "short": "e"}], "correct": ["a", "d"], "explanation": "Campylobacter jejuni/coliはSkirrow培地（微好気培養）、Bordetella pertussisはボルデ・ジャング培地（BG培地）が選択培地として正しい。N. gonorrhoeaeはチョコレート寒天/Thayer-Martin培地、小川培地は結核菌、羊血液寒天はH. influenzaeは発育不良（チョコレート寒天が必要）、BCYEαはLegionella用培地である。"}, {"id": 65, "title": "耐性菌とその原因遺伝子の組み合わせとして正しいのはどれか。2つ選べ。", "category": "耐性遺伝子", "categoryShort": "耐性遺伝", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "キノロン耐性大腸菌 --- gyrA変異", "short": "a"}, {"id": "b", "text": "コリスチン耐性アシネトバクター --- ftsI変異", "short": "b"}, {"id": "c", "text": "β-ラクタマーゼ非産生アンピシリン耐性インフルエンザ菌 --- mcr1", "short": "c"}, {"id": "d", "text": "ペニシリン耐性肺炎球菌 --- blaIMP", "short": "d"}, {"id": "e", "text": "メチシリン耐性黄色ブドウ球菌 --- mecA", "short": "e"}], "correct": ["a", "e"], "explanation": "キノロン耐性はgyrA/parC変異が主要機序、MRSAはPBP2aをコードするmecA獲得による。mcr-1はコリスチン耐性プラスミド遺伝子、ftsI変異はBLNAR（PBP3変異）、blaIMPはメタロβ-ラクタマーゼでPRSPとは無関係。"}, {"id": 66, "title": "qSOFAの基準に含まれる項目はどれか。全て選べ。", "category": "qSOFA", "categoryShort": "qSOF", "maxSelect": 3, "hint": "3つ選択", "options": [{"id": "a", "text": "血圧", "short": "a"}, {"id": "b", "text": "体温", "short": "b"}, {"id": "c", "text": "脈拍", "short": "c"}, {"id": "d", "text": "呼吸数", "short": "d"}, {"id": "e", "text": "意識障害", "short": "e"}], "correct": ["a", "d", "e"], "explanation": "qSOFA（quick SOFA）は①収縮期血圧≤100mmHg、②呼吸数≥22/分、③意識レベル変容（GCS<15）の3項目。体温・脈拍は含まれない。Sepsis-3で敗血症スクリーニングとして提唱されたベッドサイドスコア。"}, {"id": 67, "title": "抗菌薬とその作用標的の組み合わせとして誤っているのはどれか。2つ選べ。", "category": "作用標的", "categoryShort": "作用標的", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アジスロマイシン --- DNAジャイレース", "short": "a"}, {"id": "b", "text": "アミカシン --- リボソーム30Sサブユニット", "short": "b"}, {"id": "c", "text": "ドキシサイクリン --- リボソーム30Sサブユニット", "short": "c"}, {"id": "d", "text": "メロペネム --- ペニシリン結合蛋白", "short": "d"}, {"id": "e", "text": "レボフロキサシン --- シトクロムP450", "short": "e"}], "correct": ["a", "e"], "explanation": "アジスロマイシン（マクロライド）は50Sリボソーム阻害、レボフロキサシン（キノロン）はDNAジャイレース/トポイソメラーゼIV阻害であり、記載は誤り。アミカシン（アミノグリコシド）とドキシサイクリン（テトラサイクリン）は30S阻害、メロペネム（カルバペネム）はPBP阻害で正しい。"}, {"id": 68, "title": "バイオアベイラビリティの高い抗真菌薬はどれか。2つ選べ。", "category": "抗真菌薬", "categoryShort": "抗真菌薬", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アムホテリシンB", "short": "a"}, {"id": "b", "text": "カスポファンギン", "short": "b"}, {"id": "c", "text": "フルコナゾール", "short": "c"}, {"id": "d", "text": "ボリコナゾール", "short": "d"}, {"id": "e", "text": "ミカファンギン", "short": "e"}], "correct": ["c", "d"], "explanation": "バイオアベイラビリティが高い（経口吸収良好）抗真菌薬はフルコナゾール（BA>90%）とボリコナゾール（BA>90%）で、経口へのスイッチが容易。アムホテリシンB、カスポファンギン、ミカファンギンは注射薬のみで経口吸収なし。"}, {"id": 69, "title": "急性糸球体腎炎について正しい説明はどれか。2つ選べ。", "category": "糸球体腎炎", "categoryShort": "糸球体腎", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "腰部叩打痛や細菌尿が見られる。", "short": "a"}, {"id": "b", "text": "通常は一過性であり、予後良好である。", "short": "b"}, {"id": "c", "text": "ペニシリン系薬による治療が必要である。", "short": "c"}, {"id": "d", "text": "高齢者での主な発症契機は肺炎球菌性肺炎である。", "short": "d"}, {"id": "e", "text": "A群溶連菌感染による場合にはASO・ASK抗体価が上昇する。", "short": "e"}], "correct": ["b", "e"], "explanation": "急性溶連菌感染後糸球体腎炎（PSGN）は通常一過性で予後良好、小児に多く浮腫・高血圧・血尿を呈する。A群溶連菌感染ではASO・ASK上昇がみられる。腰部叩打痛・細菌尿は腎盂腎炎、ペニシリン治療は咽頭炎自体には必要だがGN自体は免疫学的機序で抗菌薬は不要。高齢者の主因はブドウ球菌関連が多い。"}, {"id": 70, "title": "結核に関する説明文として正しい説明はどれか。2つ選べ。", "category": "結核", "categoryShort": "結核", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "高齢者のLTBIの発見動機としてコッホ現象が多い。", "short": "a"}, {"id": "b", "text": "BCGはESAT-6とCFP-10を持つウシ型結核菌である。", "short": "b"}, {"id": "c", "text": "コッホ現象が見られた場合には、結核感染を調べる検査を実施する。", "short": "c"}, {"id": "d", "text": "IGRAの陽性コントロールとしてフィトヘマグルチニン（PHA）が用いられる。", "short": "d"}, {"id": "e", "text": "コッホ現象とはツベルクリン反応を複数回実施することによって誘導される追加免疫効果のことである。", "short": "e"}], "correct": ["c", "d"], "explanation": "コッホ現象（BCG接種後早期に発赤・膿疱形成）は結核感染を示唆し、IGRAや画像等の精査が必要。IGRA（QFT）では陽性コントロールとしてPHAによる非特異的IFN-γ産生を確認する。LTBIの発見動機として高齢者でコッホ現象はまれ、BCGはRD1領域（ESAT-6/CFP-10）を欠損しており持たない。eはブースター現象の説明でコッホ現象ではない。"}, {"id": 71, "title": "真菌症について正しい説明はどれか。2つ選べ。", "category": "真菌症", "categoryShort": "真菌症", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "肺結核後遺症は慢性肺アスペルギルス症の基礎疾患である。", "short": "a"}, {"id": "b", "text": "夏型過敏性肺炎は播種性トリコスポロン症の危険因子である。", "short": "b"}, {"id": "c", "text": "カンジダ血症の基礎疾患として後天性免疫不全症候群が最も多い。", "short": "c"}, {"id": "d", "text": "侵襲性肺ムーコル症の診断には血清ガラクトマンナン抗原が有用である。", "short": "d"}, {"id": "e", "text": "肺クリプトコックス症の診断には血清グルクロノキシロマンナン抗原が有用である。", "short": "e"}], "correct": ["a", "e"], "explanation": "肺結核後遺症の空洞は慢性肺アスペルギルス症（CPA）の主要基礎疾患。肺クリプトコックス症診断には莢膜抗原であるグルクロノキシロマンナン抗原が有用。夏型過敏性肺炎はトリコスポロン・ムコイデスの胞子吸入によるIII型アレルギーで、播種性トリコスポロン症とは別疾患。カンジダ血症の最多基礎は腹部手術・中心静脈カテーテル・広域抗菌薬。ムーコル症でガラクトマンナンは陰性。"}, {"id": 72, "title": "真菌について正しい説明はどれか。2つ選べ。", "category": "真菌", "categoryShort": "真菌", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Cryptococcus neoformansの莢膜の主成分はグルクロノキシロマンナンである。", "short": "a"}, {"id": "b", "text": "Aspergillus fumigatusは消化管の常在真菌である。", "short": "b"}, {"id": "c", "text": "Candida tropicalisは鵞口瘡の原因として最も多い。", "short": "c"}, {"id": "d", "text": "肺結核後遺症は慢性肺アスペルギルス症の基礎疾患である。", "short": "d"}, {"id": "e", "text": "Rhizopus oryzaeは夏型過敏性肺炎の原因として最も多い。", "short": "e"}], "correct": ["a", "d"], "explanation": "Cryptococcus neoformans莢膜主成分はグルクロノキシロマンナンで、ラテックス凝集・LFAで検出。肺結核後遺症空洞はCPAの基礎。A. fumigatusは環境常在で消化管常在ではない、C. albicansが鵞口瘡最多、夏型過敏性肺炎はTrichosporon mucoidesが最多でRhizopusはムーコル症原因。"}, {"id": 73, "title": "ニューモシスチス肺炎の治療薬として誤っているのはどれか。2つ選べ。", "category": "PJP", "categoryShort": "PJP", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アトバコン", "short": "a"}, {"id": "b", "text": "ペンタミジン", "short": "b"}, {"id": "c", "text": "ボリコナゾール", "short": "c"}, {"id": "d", "text": "アムホテリシンB", "short": "d"}, {"id": "e", "text": "スルファメトキサゾール/トリメトプリム", "short": "e"}], "correct": ["c", "d"], "explanation": "ニューモシスチス肺炎（PJP/PCP）の治療はST合剤（TMP-SMX）が第一選択、アトバコン、ペンタミジンが代替。ボリコナゾールやアムホテリシンBはPneumocystis jiroveciiに無効であり誤り。"}, {"id": 74, "title": "抗真菌薬の説明として誤っているのはどれか。2つ選べ。", "category": "抗真菌薬", "categoryShort": "抗真菌薬", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ミカファンギンはβ-D-グルカンの合成を阻害する。", "short": "a"}, {"id": "b", "text": "フルコナゾールはカンジダ属に対しては静菌的に作用する。", "short": "b"}, {"id": "c", "text": "5-FCは5-FUに変換されることで真菌の核酸合成を阻害する。", "short": "c"}, {"id": "d", "text": "リポソーマルアムホテリシンは可溶性を改善したプロドラッグである。", "short": "d"}, {"id": "e", "text": "ホスフルコナゾールはバイオアベイラビリティを改善したプロドラッグである。", "short": "e"}], "correct": ["d", "e"], "explanation": "ミカファンギン（エキノキャンディン）はβ-D-グルカン合成阻害、フルコナゾールはカンジダに静菌的、5-FC（フルシトシン）は真菌内で5-FUに変換され核酸合成阻害で正しい。リポソーマルAmBは脂質製剤でプロドラッグではない。ホスフルコナゾールは溶解性を改善したプロドラッグで、BA改善ではなく注射用水溶性改善が目的。"}, {"id": 75, "title": "バンコマイシンが無効な細菌はどれか。2つ選べ。", "category": "VCM無効", "categoryShort": "VCM無", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Escherichia coli", "short": "a"}, {"id": "b", "text": "Clostridioides difficile", "short": "b"}, {"id": "c", "text": "Pseudomonas aeruginosa", "short": "c"}, {"id": "d", "text": "Staphylococcus epidermidis", "short": "d"}, {"id": "e", "text": "Streptococcus pneumoniae", "short": "e"}], "correct": ["a", "c"], "explanation": "バンコマイシンはグラム陽性菌にのみ有効で、グラム陰性桿菌（E. coli、P. aeruginosa）は外膜のため無効。C. difficile（経口）、S. epidermidis（コアグラーゼ陰性ブドウ球菌）、S. pneumoniaeはいずれもグラム陽性で有効。"}, {"id": 76, "title": "髄膜炎の鑑別において、ウイルス性よりも細菌性を強く疑う所見として正しいのはどれか。2つ選べ。", "category": "髄膜炎", "categoryShort": "髄膜炎", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "項部硬直", "short": "a"}, {"id": "b", "text": "体温 38度", "short": "b"}, {"id": "c", "text": "髄液中の糖 8 mg/dL", "short": "c"}, {"id": "d", "text": "jolt accentuation陽性", "short": "d"}, {"id": "e", "text": "好中球優位の髄液中細胞数増加", "short": "e"}], "correct": ["c", "e"], "explanation": "細菌性髄膜炎を強く疑う髄液所見は糖の著明低下（髄液糖/血糖比<0.4、8mg/dLは極低）と好中球優位の細胞数増多（通常1000/μL以上）。項部硬直、発熱、jolt accentuationはウイルス性・細菌性いずれでもみられる非特異的所見。"}, {"id": 77, "title": "細菌性髄膜炎で低下する値はどれか。", "category": "髄膜炎", "categoryShort": "髄膜炎", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "ADA", "short": "a"}, {"id": "b", "text": "髄液糖", "short": "b"}, {"id": "c", "text": "髄液蛋白", "short": "c"}, {"id": "d", "text": "髄液細胞数", "short": "d"}, {"id": "e", "text": "髄液圧（初圧）", "short": "e"}], "correct": ["b"], "explanation": "細菌性髄膜炎では細菌による糖消費と炎症による輸送障害で髄液糖が低下（髄液糖/血糖比低下）。蛋白、細胞数、髄液圧は上昇。ADAは結核性髄膜炎で上昇する指標。"}, {"id": 78, "title": "性感染症の主要な病原体はどれか。2つ選べ。", "category": "性感染症", "categoryShort": "性感染症", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Plasmodium vivax", "short": "a"}, {"id": "b", "text": "Neisseria meningitidis", "short": "b"}, {"id": "c", "text": "Chlamydia trachomatis", "short": "c"}, {"id": "d", "text": "Human papilloma virus", "short": "d"}, {"id": "e", "text": "Cryptococcus neoformans", "short": "e"}], "correct": ["c", "d"], "explanation": "性感染症（STI）の主要病原体はChlamydia trachomatis（クラミジア）、Human papilloma virus（HPV）、Neisseria gonorrhoeae（淋菌）、Treponema pallidum（梅毒）など。P. vivaxはマラリア、N. meningitidisは髄膜炎菌、C. neoformansは真菌でSTIではない。"}, {"id": 79, "title": "蚊によって媒介される感染症はどれか。2つ選べ。", "category": "蚊媒介", "categoryShort": "蚊媒介", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Rabies", "short": "a"}, {"id": "b", "text": "Malaria", "short": "b"}, {"id": "c", "text": "Smallpox", "short": "c"}, {"id": "d", "text": "Chickenpox", "short": "d"}, {"id": "e", "text": "West Nile fever", "short": "e"}], "correct": ["b", "e"], "explanation": "蚊媒介感染症（Mosquito-borne）はマラリア（ハマダラカ）、ウエストナイル熱（アカイエカ等）、デング熱、ジカ熱、日本脳炎など。狂犬病（Rabies）はイヌ・コウモリ咬傷、天然痘（Smallpox）は飛沫・接触、水痘（Chickenpox）は空気・接触感染。"}, {"id": 80, "title": "TORCH症候群の病原体はどれか。2つ選べ。", "category": "TORCH", "categoryShort": "TORC", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Cryptococcus gattii", "short": "a"}, {"id": "b", "text": "Toxoplasma gondii", "short": "b"}, {"id": "c", "text": "Treponema pallidum", "short": "c"}, {"id": "d", "text": "Orientia tsutsugamuchi", "short": "d"}, {"id": "e", "text": "Haemophilus parainfluenzae", "short": "e"}], "correct": ["b", "c"], "explanation": "TORCH症候群は先天性感染症の総称で、T: Toxoplasma gondii、O: Others（Treponema pallidum梅毒など）、R: Rubella（風疹）、C: Cytomegalovirus、H: Herpes simplex virus。C. gattiiは真菌、O. tsutsugamushiはツツガムシ病、H. parainfluenzaeは常在菌。"}, {"id": 81, "title": "Streptococcus pneumoniaeについて正しいのはどれか。2つ選べ。", "category": "肺炎球菌", "categoryShort": "肺炎球菌", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "外膜を有する。", "short": "a"}, {"id": "b", "text": "完全溶血性を示す。", "short": "b"}, {"id": "c", "text": "普通寒天培地で良好に発育する。", "short": "c"}, {"id": "d", "text": "健常児からもしばしば分離される。", "short": "d"}, {"id": "e", "text": "5%の二酸化炭素によって発育が促進される。", "short": "e"}], "correct": ["d", "e"], "explanation": "Streptococcus pneumoniaeはα溶血性（不完全溶血）のグラム陽性双球菌で莢膜を有するが外膜はない。普通寒天では発育不良で血液寒天やチョコレート寒天で良好、5%CO2で発育が促進される。健常児の鼻咽頭からもしばしば分離される常在・病原性の両面を持つ菌で、完全溶血（β溶血）は示さずS. pyogenesがβ溶血である。"}, {"id": 82, "title": "糞便の塗抹染色を行って感染性下痢症の原因菌の診断が可能な菌はどれか。", "category": "糞便塗抹", "categoryShort": "糞便塗抹", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "Shigella sonnei", "short": "a"}, {"id": "b", "text": "Anisakis simplex", "short": "b"}, {"id": "c", "text": "Salmonella Typhi", "short": "c"}, {"id": "d", "text": "Campylobacter jejuni/coli", "short": "d"}, {"id": "e", "text": "enterohaemorrhagic Escherichia coli", "short": "e"}], "correct": ["d"], "explanation": "糞便のグラム染色（塗抹）で診断可能な細菌性下痢症はCampylobacter jejuni/coliで、グラム陰性のらせん状・カモメ状桿菌として観察される。運動性がありSkirrow培地で微好気培養する。Shigella、Salmonella Typhi、EHECは塗抹では形態診断困難、Anisakisは寄生虫で染色対象ではない。"}, {"id": 83, "title": "喀痰検査に関する説明として誤っているのはどれか。2つ選べ。", "category": "喀痰検査", "categoryShort": "喀痰検査", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Geckler分類では、G5が最も診断価値が高い。", "short": "a"}, {"id": "b", "text": "Miller-Jones分類は、喀痰の肉眼的分類である。", "short": "b"}, {"id": "c", "text": "Miller-Jones分類で、M1が最も診断価値が高い。", "short": "c"}, {"id": "d", "text": "顕微鏡で貪食像が見られた場合には、コンタミネーションが疑われる。", "short": "d"}, {"id": "e", "text": "Geckler分類のG5は、顕微鏡下で扁平上皮が少なく好中球が多いのが特徴である。", "short": "e"}], "correct": ["c", "d"], "explanation": "Geckler分類ではG5（白血球>25・扁平上皮<10/低倍率）が最も診断価値が高い良質検体。Miller-Jones分類は肉眼的にM（粘液性）とP（膿性）の量で評価する分類で、P3（膿性多量）が最も診断価値が高い。M1は粘液少量で不良検体。顕微鏡で貪食像（好中球が細菌を貪食）は感染を示唆する所見で、コンタミネーションを示唆する所見ではない。コンタミは扁平上皮多数が指標。"}, {"id": 84, "title": "人工培地での培養が可能な細菌はどれか。2つ選べ。", "category": "人工培地", "categoryShort": "人工培地", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Pneumocystis jirovecii", "short": "a"}, {"id": "b", "text": "Orientia tsutsugamushi", "short": "b"}, {"id": "c", "text": "Chlamydia trachomatis", "short": "c"}, {"id": "d", "text": "Legionella pneumophila", "short": "d"}, {"id": "e", "text": "Mycobacterium tuberculosis", "short": "e"}], "correct": ["d", "e"], "explanation": "人工培地で培養可能なのはLegionella pneumophila（BCYEα培地）とMycobacterium tuberculosis（小川培地・MGIT）。Pneumocystis jirovecii、Orientia tsutsugamushi（ツツガムシ病リケッチア）、Chlamydia trachomatisはいずれも偏性細胞内寄生性で人工培地では培養不能、細胞培養が必要。"}, {"id": 85, "title": "アルコールが無効な病原体はどれか。", "category": "消毒", "categoryShort": "消毒", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "Candida albicans", "short": "a"}, {"id": "b", "text": "Clostridioides difficile", "short": "b"}, {"id": "c", "text": "Pseudomonas aeruginosa", "short": "c"}, {"id": "d", "text": "enterohemorrhagic Escherichia coli", "short": "d"}, {"id": "e", "text": "methicillin-resistant Staphylococcus aureus", "short": "e"}], "correct": ["b"], "explanation": "アルコール（エタノール）は芽胞に対して無効であり、Clostridioides difficileは芽胞形成菌のためアルコール消毒では不活化できない。Candida albicans、Pseudomonas aeruginosa、EHEC、MRSAはいずれも栄養型細菌・真菌でアルコールが有効。"}, {"id": 86, "title": "結核および結核菌について正しいものはどれか。2つ選べ。", "category": "結核", "categoryShort": "結核", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "芽胞形成菌である。", "short": "a"}, {"id": "b", "text": "倍加時間は2〜5時間である。", "short": "b"}, {"id": "c", "text": "感染症法では2類感染症に定められている。", "short": "c"}, {"id": "d", "text": "第2種病原体であり、取り扱いには大臣の許可が必要である。", "short": "d"}, {"id": "e", "text": "検査室内での感染を防ぐため、取り扱い時にはN95マスクを着用する。", "short": "e"}], "correct": ["c", "e"], "explanation": "結核は感染症法2類感染症で、検査室内感染防止にN95マスクと陰圧・BSL3対応が推奨される。結核菌は芽胞を形成せず抗酸菌で、倍加時間は約18〜20時間と遅い（2〜5時間は大腸菌等）。第3種病原体であり第2種ではないが、結核菌は特に厳重管理が求められる。"}, {"id": 87, "title": "血液培養から分離された場合、汚染菌の可能性が高い菌はどれか。2つ選べ。", "category": "血液培養汚染", "categoryShort": "血液培養", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Escherichia coli", "short": "a"}, {"id": "b", "text": "Bacillus subtilis", "short": "b"}, {"id": "c", "text": "Cutibacterium acnes", "short": "c"}, {"id": "d", "text": "Staphylococcus aureus", "short": "d"}, {"id": "e", "text": "Pseudomonas aeruginosa", "short": "e"}], "correct": ["b", "c"], "explanation": "血液培養で汚染菌として頻度が高いのはBacillus subtilis（環境・皮膚常在の芽胞形成グラム陽性桿菌）とCutibacterium acnes（旧Propionibacterium acnes、嫌気性グラム陽性桿菌、皮膚常在で肩関節等で問題）。E. coli、S. aureus、P. aeruginosaは真の菌血症起因菌として臨床的意義が高い。"}, {"id": 88, "title": "インターフェロンγ遊離検査（IGRA）の基準値を設定するために使用される陰性および陽性コントロールはどれか。2つ選べ。", "category": "IGRA", "categoryShort": "IGRA", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "無刺激", "short": "a"}, {"id": "b", "text": "CFP-10", "short": "b"}, {"id": "c", "text": "ESAT-6", "short": "c"}, {"id": "d", "text": "インターフェロンγ", "short": "d"}, {"id": "e", "text": "マイトジェン（PHA）", "short": "e"}], "correct": ["a", "e"], "explanation": "IGRA（QFT）では、陰性コントロールとして無刺激（Nil）のIFN-γ産生、陽性コントロールとしてマイトジェンPHA刺激による非特異的IFN-γ産生を測定し、被験者の免疫能とバックグラウンドを確認する。CFP-10とESAT-6は結核特異抗原でありコントロールではない。"}, {"id": 89, "title": "ツベルクリン反応に用いられる抗原はどれか。", "category": "ツ反", "categoryShort": "ツ反", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "Galactomannan (GM)", "short": "a"}, {"id": "b", "text": "Glucuronoxylomannan (GXM)", "short": "b"}, {"id": "c", "text": "Rapid plasma reagin (RPR)", "short": "c"}, {"id": "d", "text": "Phytohemagglutinin (PHA)", "short": "d"}, {"id": "e", "text": "Purified protein derivative (PPD)", "short": "e"}], "correct": ["e"], "explanation": "ツベルクリン反応は結核菌の培養濾液から精製したPurified protein derivative (PPD)を皮内注射し、48〜72時間後の硬結で遅延型過敏反応を判定する。GMはアスペルギルス抗原、GXMはクリプトコックス莢膜抗原、RPRは梅毒脂質抗原、PHAはIGRA陽性対照のマイトジェンである。"}, {"id": 90, "title": "Streptococcus pyogenesについて正しいのはどれか。2つ選べ。", "category": "S.pyogenes", "categoryShort": "S.py", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "β溶血性を示す。", "short": "a"}, {"id": "b", "text": "コロナ禍で大流行が報告された。", "short": "b"}, {"id": "c", "text": "ペニシリン系薬に自然耐性を示す。", "short": "c"}, {"id": "d", "text": "Lancefield分類のA群に分類される。", "short": "d"}, {"id": "e", "text": "emm1はマクロライド耐性遺伝子である。", "short": "e"}], "correct": ["a", "d"], "explanation": "Streptococcus pyogenesはβ溶血性（完全溶血）レンサ球菌でLancefield A群（GAS）。ペニシリン感受性で自然耐性はなく第一選択。emm1はM蛋白遺伝子の型別でマクロライド耐性遺伝子（erm/mef）ではない。コロナ禍明けに侵襲性GASの増加が報告されたが、コロナ禍中ではない。"}, {"id": 91, "title": "アルコールが効きにくい病原体はどれか。2つ選べ。", "category": "消毒耐性", "categoryShort": "消毒耐性", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ノロウイルス", "short": "a"}, {"id": "b", "text": "インフルエンザウイルス", "short": "b"}, {"id": "c", "text": "カルバペネム耐性大腸菌", "short": "c"}, {"id": "d", "text": "メチシリン耐性黄色ブドウ球菌", "short": "d"}, {"id": "e", "text": "ディフィシル菌（Clostridioides difficile）", "short": "e"}], "correct": ["a", "e"], "explanation": "アルコールが効きにくい病原体はノンエンベロープウイルスのノロウイルスと芽胞形成菌のClostridioides difficile芽胞である。インフルエンザ（エンベロープあり）、CRE大腸菌、MRSAはいずれもアルコールが有効。ノロとC.diff対策は次亜塩素酸ナトリウムと流水手洗いが重要。"}, {"id": 92, "title": "潜伏期間が最も長い感染症はどれか。", "category": "潜伏期間", "categoryShort": "潜伏期間", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "カンピロバクター腸炎", "short": "a"}, {"id": "b", "text": "コレラ", "short": "b"}, {"id": "c", "text": "結核", "short": "c"}, {"id": "d", "text": "細菌性赤痢", "short": "d"}, {"id": "e", "text": "腸管出血性大腸菌感染症", "short": "e"}], "correct": ["c"], "explanation": "潜伏期間が最も長いのは結核で、感染後2〜3か月で初感染巣を形成し、発病は数か月〜数年〜数十年後と極めて長い。カンピロ（2〜5日）、コレラ（数時間〜5日）、細菌性赤痢（1〜5日）、EHEC（3〜5日）はいずれも短い。"}, {"id": 93, "title": "空気感染する病原体はどれか。2つ選べ。", "category": "空気感染", "categoryShort": "空気感染", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "結核菌", "short": "a"}, {"id": "b", "text": "緑膿菌", "short": "b"}, {"id": "c", "text": "麻疹ウイルス", "short": "c"}, {"id": "d", "text": "SARSコロナウイルス", "short": "d"}, {"id": "e", "text": "インフルエンザウイルス", "short": "e"}], "correct": ["a", "c"], "explanation": "空気感染（飛沫核感染）は結核菌、麻疹ウイルス、水痘帯状疱疹ウイルスが代表で、N95マスクと陰圧管理が必要。緑膿菌は接触・環境、SARSコロナウイルスとインフルエンザウイルスは主に飛沫・接触感染とされる（空気予防策が必要な場面もあるが定義上の空気感染病原体の三大は結核・麻疹・水痘）。"}, {"id": 94, "title": "標準予防策〈standard precautions〉について正しいのはどれか。", "category": "標準予防策", "categoryShort": "標準予防", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "患者を隔離する。", "short": "a"}, {"id": "b", "text": "医療者の手指衛生を徹底する。", "short": "b"}, {"id": "c", "text": "感染症と診断してから開始する。", "short": "c"}, {"id": "d", "text": "感染症の治療が済んだら終了する。", "short": "d"}, {"id": "e", "text": "特定の感染症への対策として実施する。", "short": "e"}], "correct": ["b"], "explanation": "標準予防策（standard precautions）は全ての患者・全ての場面で、血液・体液・排泄物等は感染性があるとみなして手指衛生・個人防護具・呼吸器衛生等を徹底する概念。感染症診断前から開始し治療後も継続、隔離は感染経路別予防策であり標準予防策ではない。"}, {"id": 95, "title": "最も感染力（基本再生産数）の高い感染症はどれか。", "category": "感染力", "categoryShort": "感染力", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "結核", "short": "a"}, {"id": "b", "text": "麻疹", "short": "b"}, {"id": "c", "text": "SARS", "short": "c"}, {"id": "d", "text": "COVID-19", "short": "d"}, {"id": "e", "text": "インフルエンザ", "short": "e"}], "correct": ["b"], "explanation": "基本再生産数R0が最も高いのは麻疹で12〜18と極めて高い。結核（R0 1〜2程度）、SARS（2〜3）、COVID-19（初期2〜3、デルタ5〜6）、インフルエンザ（1〜2）よりはるかに高く、集団免疫閾値は95%以上が必要。"}, {"id": 96, "title": "エンベロープを持たないウイルスはどれか。2つ選べ。", "category": "エンベロープ", "categoryShort": "エンベロ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "ノロウイルス", "short": "a"}, {"id": "b", "text": "風疹ウイルス", "short": "b"}, {"id": "c", "text": "麻疹ウイルス", "short": "c"}, {"id": "d", "text": "A型肝炎ウイルス", "short": "d"}, {"id": "e", "text": "B型肝炎ウイルス", "short": "e"}], "correct": ["a", "d"], "explanation": "エンベロープを持たない（ノンエンベロープ）ウイルスはノロウイルス（カリシウイルス）、A型肝炎ウイルス（ピコルナウイルス）、ロタウイルス、アデノウイルス等で、アルコール・乾燥に比較的強い。風疹、麻疹、B型肝炎はいずれもエンベロープを有しアルコールで失活しやすい。"}, {"id": 97, "title": "感染症と原因病原体の組合せとして正しいのはどれか。2つ選べ。", "category": "病原体組合せ", "categoryShort": "病原体組", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "野兎病 --- Brucella melitensis", "short": "a"}, {"id": "b", "text": "百日咳 --- Bordetella pertussis", "short": "b"}, {"id": "c", "text": "猫ひっかき病 --- Bartonella henselae", "short": "c"}, {"id": "d", "text": "特発性器質化肺炎 --- Haemophilus influenzae", "short": "d"}, {"id": "e", "text": "人工呼吸器関連肺炎 --- Streptococcus pneumoniae", "short": "e"}], "correct": ["b", "c"], "explanation": "百日咳はBordetella pertussis（ボルデ-ジャング培地）、猫ひっかき病はBartonella henselaeが正しい。野兎病はFrancisella tularensis、Brucellaはブルセラ症。特発性器質化肺炎（COP）は感染症ではなく間質性肺炎。VAPの主要起因菌はPseudomonas aeruginosaやMRSA等でS. pneumoniaeは市中肺炎主体。"}, {"id": 98, "title": "偏性細胞内増殖菌はどれか。", "category": "細胞内寄生", "categoryShort": "細胞内寄", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "Bordetella pertussis", "short": "a"}, {"id": "b", "text": "Chlamydia trachomatis", "short": "b"}, {"id": "c", "text": "Haemophilus influenzae", "short": "c"}, {"id": "d", "text": "Mycoplasma pneumoniae", "short": "d"}, {"id": "e", "text": "Streptococcus pneumoniae", "short": "e"}], "correct": ["b"], "explanation": "偏性細胞内増殖菌は宿主細胞内でしか増殖できない細菌で、Chlamydia trachomatis、Rickettsia、Orientia等が該当。Bordetella pertussis、Haemophilus influenzae、Streptococcus pneumoniaeはいずれも細胞外でも増殖可能。Mycoplasma pneumoniaeは細胞壁なしだが人工培地（PPLO）で増殖可能。"}, {"id": 99, "title": "培地と病原体の組み合わせのうち正しいのはどれか。2つ選べ。", "category": "培地", "categoryShort": "培地", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "小川培地 --- Mycobacterium tuberculosis", "short": "a"}, {"id": "b", "text": "血液寒天培地 --- Haemophilus influenzae", "short": "b"}, {"id": "c", "text": "Skirrow培地 --- Pseudomonas aeruginosa", "short": "c"}, {"id": "d", "text": "BCYE-α培地 --- Candida albicans", "short": "d"}, {"id": "e", "text": "PPLO培地 --- Mycoplasma pneumoniae", "short": "e"}], "correct": ["a", "e"], "explanation": "小川培地は結核菌（Mycobacterium tuberculosis）用、PPLO培地はマイコプラズマ（Mycoplasma pneumoniae）用が正しい。Haemophilus influenzaeは血液寒天では発育不良でチョコレート寒天が必要、Skirrow培地はCampylobacter jejuni/coli用、BCYE-αはLegionella pneumophila用でありCandida用ではない。"}, {"id": 100, "title": "インフルエンザ菌による感染症として誤っているのはどれか。2つ選べ。", "category": "インフルエンザ菌", "categoryShort": "インフル", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "急性胆嚢炎", "short": "a"}, {"id": "b", "text": "急性中耳炎", "short": "b"}, {"id": "c", "text": "急性副鼻腔炎", "short": "c"}, {"id": "d", "text": "急性膀胱炎", "short": "d"}, {"id": "e", "text": "細菌性髄膜炎", "short": "e"}], "correct": ["a", "d"], "explanation": "Haemophilus influenzae（特に無莢膜型NTHi）は急性中耳炎、急性副鼻腔炎、肺炎、細菌性髄膜炎（Hibワクチン前は小児髄膜炎の主因）の起因菌である。急性胆嚢炎は腸内細菌・嫌気性菌主体、急性膀胱炎はE. coli主体で、H. influenzaeが原因となることは極めて稀で誤りとなる。"}, {"id": 101, "title": "このときのBristol Stool Scaleは何点か。", "category": "CDI症例", "categoryShort": "CDI症", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "1点", "short": "a"}, {"id": "b", "text": "2点", "short": "b"}, {"id": "c", "text": "4点", "short": "c"}, {"id": "d", "text": "5点", "short": "d"}, {"id": "e", "text": "7点", "short": "e"}], "correct": ["e"], "explanation": "Bristol Stool Scaleは便の形状を7段階で評価する。水様性で固形部分が全くない下痢はType 7（7点）に該当する。ABPC/SBT投与8-9日目の抗菌薬関連下痢で1日8回水様便は典型的なType 7である。1点は硬い塊、2点はソーセージ状だが硬い、4点は正常、5点は柔らかい塊で境界不明瞭。"}, {"id": 102, "title": "本症の診断に有用な検査はどれか。2つ選べ。", "category": "CDI診断", "categoryShort": "CDI診", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "便のグラム染色", "short": "a"}, {"id": "b", "text": "便中のGDHの測定", "short": "b"}, {"id": "c", "text": "血中のバイナリトキシンの測定", "short": "c"}, {"id": "d", "text": "便中のトキシンA・トキシンBの測定", "short": "d"}, {"id": "e", "text": "血中のトキシンA・トキシンBの測定", "short": "e"}], "correct": ["b", "d"], "explanation": "Clostridioides difficile感染症（CDI）の診断は便中のGDH（グルタミン酸脱水素酵素）抗原スクリーニングと便中トキシンA・B検出（EIAまたはNAAT）の2ステップが有用。GDHは感度が高く、トキシンが特異度を担保する。バイナリトキシンは高病原性株で補助的、血液中のトキシン測定は行われない。便グラム染色では診断できない。"}, {"id": 103, "title": "本症に対する感染予防策として正しいのはどれか。", "category": "CDI対策", "categoryShort": "CDI対", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "標準予防策を解除する。", "short": "a"}, {"id": "b", "text": "標準予防策のみを行う。", "short": "b"}, {"id": "c", "text": "飛沫予防策を行う。", "short": "c"}, {"id": "d", "text": "空気予防策を行う。", "short": "d"}, {"id": "e", "text": "接触予防策を行う。", "short": "e"}], "correct": ["e"], "explanation": "Clostridioides difficileは芽胞を形成し環境に残存、糞口・接触伝播するため接触予防策（手袋・エプロン、個室、環境消毒は次亜塩素酸ナトリウム、手指衛生は流水と石鹸）が必須。標準予防策は常時継続しつつ追加する。飛沫・空気予防策は不要。アルコール手指消毒は芽胞に無効。"}, {"id": 104, "title": "本症に対する治療薬として誤っているのはどれか。2つ選べ。", "category": "CDI治療", "categoryShort": "CDI治", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "クリンダマイシン", "short": "a"}, {"id": "b", "text": "バンコマイシン", "short": "b"}, {"id": "c", "text": "フィダキソマイシン", "short": "c"}, {"id": "d", "text": "メトロニダゾール", "short": "d"}, {"id": "e", "text": "メロペネム", "short": "e"}], "correct": ["a", "e"], "explanation": "CDIの治療は経口バンコマイシンまたはフィダキソマイシンが第一選択、メトロニダゾールは軽症代替だがガイドラインでは位置づけ低下。クリンダマイシンはCDI発症の最大リスク薬剤で治療には用いない（誤り）。メロペネムは広域カルバペネムでCDIを増悪させ治療薬ではない（誤り）。"}, {"id": 105, "title": "セファロスポリン系薬が無効な細菌はどれか。2つ選べ。", "category": "セファロ耐性", "categoryShort": "セファロ", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Acinetobacter baumannii", "short": "a"}, {"id": "b", "text": "Enterococcus faecium", "short": "b"}, {"id": "c", "text": "Escherichia coli", "short": "c"}, {"id": "d", "text": "Listeria monocytogenes", "short": "d"}, {"id": "e", "text": "Pseudomonas aeruginosa", "short": "e"}], "correct": ["b", "d"], "explanation": "セファロスポリン系はEnterococcus faecium（PBP5の親和性低）とListeria monocytogenes（セファロ自然耐性、第一選択アンピシリン）に無効（自然耐性）。A. baumanniiは一部セフェム（セフタジジム等）が感受性、E. coliはESBLでなければ有効、P. aeruginosaは抗緑膿菌セフェム（セフタジジム、セフェピム）が有効。"}, {"id": 106, "title": "β-ラクタマーゼ阻害薬はどれか。2つ選べ。", "category": "BLI", "categoryShort": "BLI", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "クラブラン酸", "short": "a"}, {"id": "b", "text": "シラスタチン", "short": "b"}, {"id": "c", "text": "タゾバクタム", "short": "c"}, {"id": "d", "text": "ピボキシル", "short": "d"}, {"id": "e", "text": "ベタミプロン", "short": "e"}], "correct": ["a", "c"], "explanation": "β-ラクタマーゼ阻害薬はクラブラン酸（アモキシシリン/クラブラン酸）、タゾバクタム（ピペラシリン/タゾバクタム）、スルバクタム、アビバクタム、バボルバクタム等。シラスタチンはデヒドロペプチダーゼ阻害薬（イミペネムの腎代謝抑制）、ピボキシルはプロドラッグ化エステル、ベタミプロンは腎保護薬（パニペネム併用）。"}, {"id": 107, "title": "抗微生物薬と副作用の組み合わせとして適切なのはどれか。2つ選べ。", "category": "副作用", "categoryShort": "副作用", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アンピシリン　－　悪性症候群（Syndrome malin）", "short": "a"}, {"id": "b", "text": "イソニアジド　－　乳酸アシドーシス", "short": "b"}, {"id": "c", "text": "オセルタミビル　－　gray baby症候群", "short": "c"}, {"id": "d", "text": "ピラジナマイド　－　高尿酸血症", "short": "d"}, {"id": "e", "text": "ミノサイクリン　－　歯牙着色", "short": "e"}], "correct": ["d", "e"], "explanation": "ピラジナマイド（PZA）の代表的副作用は高尿酸血症・肝障害・関節痛。ミノサイクリン（テトラサイクリン系）は歯牙着色・骨発育抑制で小児・妊婦禁忌。アンピシリンは発疹・薬疹、悪性症候群は抗精神病薬。イソニアジドは末梢神経障害・肝障害、乳酸アシドーシスはNRTI（核酸系逆転写酵素阻害薬）。gray baby症候群はクロラムフェニコール。オセルタミビルは異常行動・嘔吐。"}, {"id": 108, "title": "メチシリン感受性黄色ブドウ球菌による蜂窩織炎の第一選択薬はどれか。", "category": "MSSA蜂窩織炎", "categoryShort": "MSSA", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "セファゾリン", "short": "a"}, {"id": "b", "text": "バンコマイシン", "short": "b"}, {"id": "c", "text": "アジスロマイシン", "short": "c"}, {"id": "d", "text": "クリンダマイシン", "short": "d"}, {"id": "e", "text": "テトラサイクリン", "short": "e"}], "correct": ["a"], "explanation": "MSSAによる蜂窩織炎・菌血症の第一選択はセファゾリン（第1世代セフェム）またはオキサシリン系（クロキサシリン等）。バンコマイシンはMRSA用でMSSAではβラクタムより劣る。アジスロ、クリンダ、テトラサイクリンは代替または補助的だが第一選択ではない。"}, {"id": 109, "title": "Ambler分類class Aのβ-ラクタマーゼはどれか。2つ選べ。", "category": "Ambler A", "categoryShort": "Ambl", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "CTX-M-9", "short": "a"}, {"id": "b", "text": "IMP-6", "short": "b"}, {"id": "c", "text": "KPC1", "short": "c"}, {"id": "d", "text": "Mcr1", "short": "d"}, {"id": "e", "text": "NDM1", "short": "e"}], "correct": ["a", "c"], "explanation": "Ambler分類class Aはセリンを活性中心とするβ-ラクタマーゼで、CTX-M型（ESBLの主流）とKPC型（Klebsiella pneumoniae carbapenemase）が代表。class Bはメタロβ-ラクタマーゼでIMP-6、NDM-1が該当。Mcr-1はコリスチン耐性のホスホエタノールアミン転移酵素でβ-ラクタマーゼではない。"}, {"id": 110, "title": "多剤耐性緑膿菌の基準となる抗菌薬はどれか。全て選べ。", "category": "MDRP基準", "categoryShort": "MDRP", "maxSelect": 3, "hint": "3つ選択", "options": [{"id": "a", "text": "アミカシン", "short": "a"}, {"id": "b", "text": "イミペネム", "short": "b"}, {"id": "c", "text": "クラリスロマイシン", "short": "c"}, {"id": "d", "text": "シプロフロキサシン", "short": "d"}, {"id": "e", "text": "セフタジジム", "short": "e"}], "correct": ["a", "b", "d"], "explanation": "多剤耐性緑膿菌（MDRP）の定義は、カルバペネム系（イミペネム）、アミノグリコシド系（アミカシン）、フルオロキノロン系（シプロフロキサシン）に耐性。厳密には抗緑膿菌ペニシリン・セフェム・モノバクタム等も含めた3系統以上耐性で定義されるが、届出基準は上記3系統。クラリスロマイシンは緑膿菌に無効。本問は設問の正解指定に準拠しa,b,dを正解とする。セフタジジムも本来はMDRP判定に含まれるが、本問では除外指定。2026年4月からMDRP感染症は五類全数届出化。"}, {"id": 111, "title": "基質特異性拡張型β-ラクタマーゼについて正しいのはどれか。2つ選べ。", "category": "ESBL", "categoryShort": "ESBL", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "CTX-M型が主流である。", "short": "a"}, {"id": "b", "text": "染色体性で伝達性がない。", "short": "b"}, {"id": "c", "text": "Ambler分類のClass Aに属する。", "short": "c"}, {"id": "d", "text": "カルバペネム系薬まで分解できる。", "short": "d"}, {"id": "e", "text": "主にEnterococcus属の細菌が保有する。", "short": "e"}], "correct": ["a", "c"], "explanation": "ESBLは近年増加している耐性因子で、主な産生菌は腸内細菌目細菌（大腸菌・肺炎桿菌）。Ambler分類class A、CTX-M型が世界的に主流で、大腸菌ではST131との関連が知られる。プラスミド性で伝達性があり問題。セファロスポリン系を分解するがセファマイシン系（セフメタゾール）やカルバペネム系は分解しない。Enterococcusは保有しない。"}, {"id": 112, "title": "バンコマイシン耐性腸球菌（VRE）について正しいのはどれか。2つ選べ。", "category": "VRE", "categoryShort": "VRE", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "VanA型はバンコマイシンにのみ耐性化する。", "short": "a"}, {"id": "b", "text": "VanB型はテイコプラニンにのみ耐性化する。", "short": "b"}, {"id": "c", "text": "VanA型の多くはプラスミド性であり、伝達性がある。", "short": "c"}, {"id": "d", "text": "便や尿から分離された場合、7日以内に最寄りの保健所に届け出る必要がある。", "short": "d"}, {"id": "e", "text": "Enterococcus faeciumの方が、Enterococcus faecalisよりもVREとして分離されやすい。", "short": "e"}], "correct": ["c", "e"], "explanation": "VRE感染症は感染症法5類全数だが、届出は感染症の基準で定着（便・尿保菌）のみでは届出対象外。VanAはバンコマイシンとテイコプラニン両方に耐性、プラスミド性で伝達性あり。VanBはバンコマイシンのみに耐性（テイコプラニン感受性）、染色体性。VREとして分離されるのはE. faeciumが多い。拡散防止に接触予防策が必要。"}, {"id": 113, "title": "AMR対策アクションプラン（2023-2027）で示されている2027年までの数値目標に関する説明として正しいのはどれか。", "category": "AMR数値目標", "categoryShort": "AMR数", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "ヒトに関して、肺炎球菌のマクロライド耐性率を10%以下にすることが示されている。", "short": "a"}, {"id": "b", "text": "ヒトに関して、黄色ブドウ球菌のメチシリン耐性率を20%以下にすることが示されている。", "short": "b"}, {"id": "c", "text": "大腸菌のテトラサイクリン耐性率は、ヒトと動物の両方に関する数値目標が示されている。", "short": "c"}, {"id": "d", "text": "ヒトに関して、注射用ペニシリン系薬の人口千人当たりの一日使用量を2020年比で20%増にすることが示されている。", "short": "d"}, {"id": "e", "text": "ヒトに関して、経口第一世代セファロスポリン系薬の人口千人当たりの一日使用量を2020年比で40%減にすることが示されている。", "short": "e"}], "correct": ["b"], "explanation": "AMRアクションプラン2023-2027のヒトに関する数値目標は、VRE感染症、黄色ブドウ球菌のメチシリン耐性率20%以下、大腸菌のフルオロキノロン耐性率、緑膿菌のカルバペネム耐性率、大腸菌・肺炎桿菌のカルバペネム耐性率、人口千人当たり一日抗菌薬使用量、経口第三世代セファロ・経口フルオロキノロン・経口マクロライド・静注カルバペネムの使用量削減が掲げられている。テトラサイクリンや経口第一世代セファロ、注射ペニシリン増は目標ではない。"}, {"id": 114, "title": "尿路感染症の主な原因菌はどれか。", "category": "尿路感染", "categoryShort": "尿路感染", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "Escherichia coli", "short": "a"}, {"id": "b", "text": "Bacteroides fragilis", "short": "b"}, {"id": "c", "text": "Staphylococcus aureus", "short": "c"}, {"id": "d", "text": "Pseudomonas aeruginosa", "short": "d"}, {"id": "e", "text": "Streptococcus agalactiae", "short": "e"}], "correct": ["a"], "explanation": "尿路感染症は単純性・複雑性を問わずEscherichia coliが70-80%で最多。Bacteroidesは嫌気性で尿路では稀、S. aureusは菌血症やカテーテル関連、P. aeruginosaは複雑性・院内、GBSは新生児・妊婦で関連するが全体の最多はE.coli。"}, {"id": 115, "title": "2セット採取した血液培養のうち、好気ボトルのみグラム陰性桿菌が検出された場合に、最も考えられる原因菌はどれか。2つ選べ。", "category": "血液培養", "categoryShort": "血液培養", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Escherichia coli", "short": "a"}, {"id": "b", "text": "Staphylococcus aureus", "short": "b"}, {"id": "c", "text": "Haemophilus influenzae", "short": "c"}, {"id": "d", "text": "Pseudomonas aeruginosa", "short": "d"}, {"id": "e", "text": "Acinetobacter baumannii", "short": "e"}], "correct": ["d", "e"], "explanation": "2セット中好気ボトルのみでグラム陰性桿菌が検出された場合、偏性好気性のブドウ糖非発酵菌であるPseudomonas aeruginosaやAcinetobacter baumanniiが最も考えられる。E. coliは通性嫌気性で好気・嫌気両ボトルで発育、S. aureusはグラム陽性球菌、H. influenzaeは通性嫌気性だが血液培養では両ボトルに発育しやすい。"}, {"id": 116, "title": "蛋白合成を阻害する抗菌薬はどれか。2つ選べ。", "category": "蛋白合成阻害", "categoryShort": "蛋白合成", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "アモキシシリン", "short": "a"}, {"id": "b", "text": "クラリスロマイシン", "short": "b"}, {"id": "c", "text": "シプロフロキサシン", "short": "c"}, {"id": "d", "text": "ミノサイクリン", "short": "d"}, {"id": "e", "text": "リファンピシン", "short": "e"}], "correct": ["b", "d"], "explanation": "蛋白合成阻害薬はマクロライド（クラリスロマイシン、アジスロマイシン）は50S、テトラサイクリン（ミノサイクリン、ドキシサイクリン）は30Sを阻害。アモキシシリンは細胞壁合成（PBP）、シプロフロキサシンはDNAジャイレース、リファンピシンはRNAポリメラーゼ阻害。"}, {"id": 117, "title": "真菌症と検査の組み合わせとして正しいのはどれか。2つ選べ。", "category": "真菌検査", "categoryShort": "真菌検査", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "カンジダ症　－　β-Dグルカン", "short": "a"}, {"id": "b", "text": "肺クリプトコックス症　－　血清グルクロノキシロマンナン抗原", "short": "b"}, {"id": "c", "text": "侵襲性肺アスペルギルス症　－　血清アスペルギルス抗体", "short": "c"}, {"id": "d", "text": "播種性トリコスポロン症　－　血清ガラクトマンナン抗原", "short": "d"}, {"id": "e", "text": "ニューモシスチス肺炎　－　インターフェロンγ遊離検査", "short": "e"}], "correct": ["a", "b"], "explanation": "カンジダ血症はβ-Dグルカンがスクリーニングに有用、肺クリプトコックス症は莢膜抗原であるグルクロノキシロマンナン抗原（LFA）が有用。侵襲性肺アスペルギルス症はガラクトマンナン抗原・β-Dグルカンが有用で抗体は慢性型で用いる。播種性トリコスポロン症はβ-Dグルカン、PJPはβ-DグルカンとPCR、IGRAは結核。"}, {"id": 118, "title": "抗菌薬と投与回数の組み合わせとして正しいのはどれか。2つ選べ。", "category": "投与回数", "categoryShort": "投与回数", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "セフトリアキソン --- 1日1回", "short": "a"}, {"id": "b", "text": "レボフロキサシン --- 1日1回", "short": "b"}, {"id": "c", "text": "メロペネム --- 1日1回", "short": "c"}, {"id": "d", "text": "アルベカシン --- 1日4回", "short": "d"}, {"id": "e", "text": "セファゾリン --- 1日1回", "short": "e"}], "correct": ["a", "b"], "explanation": "β-ラクタムは時間依存性で通常1日3-4回投与だが、セフトリアキソンは半減期が長く1日1-2回で可能。フルオロキノロンは濃度依存性で1日1回が原則（レボフロキサシン1日1回）。メロペネムは1日3回、アルベカシン（アミノグリコシド）は1日1-2回、セファゾリンは1日3回が標準。"}, {"id": 119, "title": "静菌的な作用を示す抗菌薬はどれか。2つ選べ。", "category": "静菌的作用", "categoryShort": "静菌的作", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "クラリスロマイシン", "short": "a"}, {"id": "b", "text": "バンコマイシン", "short": "b"}, {"id": "c", "text": "メロペネム", "short": "c"}, {"id": "d", "text": "リネゾリド", "short": "d"}, {"id": "e", "text": "レボフロキサシン", "short": "e"}], "correct": ["a", "d"], "explanation": "静菌的（bacteriostatic）な抗菌薬はクラリスロマイシン（マクロライド）、リネゾリド（オキサゾリジノン）、テトラサイクリン、クロラムフェニコール等。殺菌的（bactericidal）はバンコマイシン（グリコペプチド）、メロペネム（βラクタム）、レボフロキサシン（キノロン）、アミノグリコシド等。"}, {"id": 120, "title": "血液培養の採取について正しいのはどれか。2つ選べ。", "category": "血液培養採取", "categoryShort": "血液培養", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "好気ボトルよりも嫌気ボトルに先に入れる。", "short": "a"}, {"id": "b", "text": "好気用と嫌気用はそれぞれ別の部位から採血する。", "short": "b"}, {"id": "c", "text": "血液培養のボトルのゴム栓部分はアルコールで消毒する。", "short": "c"}, {"id": "d", "text": "採血部位はアルコールで消毒してはならない。", "short": "d"}, {"id": "e", "text": "黄色ブドウ球菌が培養されたら汚染菌と判断する。", "short": "e"}], "correct": ["a", "c"], "explanation": "血液培養採取では嫌気ボトルを先に充填する（翼状針の空気混入を避けるため）。ボトルのゴム栓はアルコール消毒する。好気・嫌気は同一部位から連続採取（別部位は2セット目の意味）、採血部位はクロルヘキシジン・アルコールまたはポビドンヨードで消毒する。黄色ブドウ球菌は真の菌血症起因菌で汚染ではない。汚染の代表はCNS、バチルス、Cutibacterium acnes等。"}, {"id": 121, "title": "B細胞を標的とする生物学的製剤はどれか。", "category": "B細胞標的", "categoryShort": "B細胞標", "maxSelect": 1, "hint": "1つ選択", "options": [{"id": "a", "text": "ゲフィチニブ", "short": "a"}, {"id": "b", "text": "フィルグラスチム", "short": "b"}, {"id": "c", "text": "ベズロトクスマブ", "short": "c"}, {"id": "d", "text": "リツキシマブ", "short": "d"}, {"id": "e", "text": "レカネマブ", "short": "e"}], "correct": ["d"], "explanation": "リツキシマブはCD20陽性B細胞を標的とするキメラ型モノクローナル抗体。悪性リンパ腫や自己免疫疾患で用いられ、B細胞枯渇によりHBV再活性化リスクがあるためHBs抗原・HBc抗体のスクリーニングが必須。ゲフィチニブはEGFR阻害、フィルグラスチムはG-CSF、ベズロトクスマブはC.difficileトキシンB抗体、レカネマブは抗アミロイドβ抗体。"}, {"id": 122, "title": "病原体に関する説明として正しいのはどれか。2つ選べ。", "category": "病原体", "categoryShort": "病原体", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Streptococcus pneumoniaeはβ溶血性を示す。", "short": "a"}, {"id": "b", "text": "Enterococcus faeciumは腸内細菌科細菌である。", "short": "b"}, {"id": "c", "text": "Legionella pneumophilaは鳥類に寄生している。", "short": "c"}, {"id": "d", "text": "Haemophilus influenzaeは発育にX因子とV因子を必要とする。", "short": "d"}, {"id": "e", "text": "Helicobacter pyloriは尿素を加水分解してアンモニアと二酸化炭素を発生する。", "short": "e"}], "correct": ["d", "e"], "explanation": "Haemophilus influenzaeは発育にX因子（ヘミン）とV因子（NAD）を要しチョコレート寒天で発育。Helicobacter pyloriは強力なウレアーゼを持ち尿素をアンモニアとCO2に分解し胃酸を中和。S.pneumoniaeはα溶血、E.faeciumは腸球菌科（腸内細菌科ではない）、L.pneumophilaは環境水中・土壌のアメーバ内で増殖する。"}, {"id": 123, "title": "疾患と病原体の組み合わせとして正しいのはどれか。2つ選べ。", "category": "疾患-病原体", "categoryShort": "疾患-病", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "Creutzfeldt-Jakob disease --- JC virus", "short": "a"}, {"id": "b", "text": "epidemic typhus --- Salmonella Typhi", "short": "b"}, {"id": "c", "text": "gas gangrene --- Clostridium perfringens", "short": "c"}, {"id": "d", "text": "amoebic dysentery --- Acanthamoeba castellanii", "short": "d"}, {"id": "e", "text": "Lemierre syndrome --- Fusobacterium necrophorum", "short": "e"}], "correct": ["c", "e"], "explanation": "ガス壊疽はClostridium perfringens（ウェルシュ菌）のα毒素等による。Lemierre症候群はFusobacterium necrophorumによる化膿性頸部静脈血栓性静脈炎と敗血症性塞栓。CJDはプリオン、epidemic typhusはRickettsia prowazekii、amoebic dysenteryはEntamoeba histolytica、Acanthamoebaは角膜炎・脳炎原因。"}, {"id": 124, "title": "検査とその原理の組み合わせとして正しいのはどれか。2つ選べ。", "category": "検査原理", "categoryShort": "検査原理", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "LAMP --- 核酸増幅", "short": "a"}, {"id": "b", "text": "TPHA --- 赤血球凝集", "short": "b"}, {"id": "c", "text": "RT-QUIC --- RNAの増幅", "short": "c"}, {"id": "d", "text": "ELISA --- 放射性同位元素を用いたIgEの検出", "short": "d"}, {"id": "e", "text": "IGRA --- 血清によるマクロファージの分化誘導", "short": "e"}], "correct": ["a", "b"], "explanation": "LAMPは等温核酸増幅法、TPHAは梅毒トレポネーマに対する受身赤血球凝集試験で正しい。RT-QUICはプリオン増幅試験でRNA増幅ではない。ELISAは酵素免疫測定で放射性同位元素を用いるのはRAST/RIA。IGRAは結核特異抗原刺激によるIFN-γ遊離を測定するT細胞機能試験。"}, {"id": 125, "title": "疾患に関する説明として正しいのはどれか。2つ選べ。", "category": "疾患", "categoryShort": "疾患", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "腸チフスでは比較的徐脈が見られる。", "short": "a"}, {"id": "b", "text": "マイコプラズマ肺炎では高IgEが見られる。", "short": "b"}, {"id": "c", "text": "マイコプラズマ肺炎では尿のPCRが診断に有用である。", "short": "c"}, {"id": "d", "text": "三日熱マラリアは約48時間おきに発熱が繰り返される。", "short": "d"}, {"id": "e", "text": "梅毒の発病予防として暴露後のペニシリン内服が推奨される。", "short": "e"}], "correct": ["a", "d"], "explanation": "腸チフスは高熱にもかかわらず脈拍上昇が少ない比較的徐脈が特徴。三日熱マラリア（P.vivax, P.ovale）は48時間周期、四日熱マラリアは72時間周期。マイコプラズマ肺炎でIgE高値は誤り（アレルギーとは別）、尿PCRは有用でなく咽頭拭いLAMP/PCR。梅毒の暴露後予防はドキシサイクリンのPEPが議論されるがペニシリン内服推奨ではない。"}, {"id": 126, "title": "腎機能の指標となる検査値はどれか。2つ選べ。", "category": "腎機能", "categoryShort": "腎機能", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "尿酸", "short": "a"}, {"id": "b", "text": "LDH", "short": "b"}, {"id": "c", "text": "eGFR", "short": "c"}, {"id": "d", "text": "HbA1c", "short": "d"}, {"id": "e", "text": "クレアチニン", "short": "e"}], "correct": ["c", "e"], "explanation": "腎機能指標は血清クレアチニンとそれから算出されるeGFR、またBUN、シスタチンC等。尿酸は高尿酸血症指標、LDHは組織障害、HbA1cは糖尿病コントロール指標。"}, {"id": 127, "title": "肝障害の指標となる検査値はどれか。2つ選べ。", "category": "肝障害", "categoryShort": "肝障害", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "尿酸", "short": "a"}, {"id": "b", "text": "HbA1c", "short": "b"}, {"id": "c", "text": "クレアチニン", "short": "c"}, {"id": "d", "text": "ALT（GPT）", "short": "d"}, {"id": "e", "text": "AST（GOT）", "short": "e"}], "correct": ["d", "e"], "explanation": "肝細胞障害の指標はALT（GPT）とAST（GOT）、胆道系はALP、γ-GTP、ビリルビン。尿酸は痛風、HbA1cは糖尿病、クレアチニンは腎機能指標。"}, {"id": 128, "title": "糖尿病コントロールの指標となる検査値はどれか。2つ選べ。", "category": "糖尿病", "categoryShort": "糖尿病", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "LDH", "short": "a"}, {"id": "b", "text": "HbA1c", "short": "b"}, {"id": "c", "text": "クレアチニン", "short": "c"}, {"id": "d", "text": "ALT（GPT）", "short": "d"}, {"id": "e", "text": "血糖値（食後2時間）", "short": "e"}], "correct": ["b", "e"], "explanation": "糖尿病コントロール指標はHbA1c（1-2か月平均）、血糖値（空腹時・食後2時間）、グリコアルブミン。LDHは組織障害、クレアチニンは腎、ALTは肝指標。"}, {"id": 129, "title": "樹状細胞について正しい説明はどれか。2つ選べ。", "category": "樹状細胞", "categoryShort": "樹状細胞", "maxSelect": 2, "hint": "2つ選択", "options": [{"id": "a", "text": "粘膜には樹状細胞がない。", "short": "a"}, {"id": "b", "text": "樹状細胞はT細胞から抗原提示を受ける。", "short": "b"}, {"id": "c", "text": "樹状細胞は皮内よりも筋肉内に多く存在する。", "short": "c"}, {"id": "d", "text": "樹状細胞は皮下組織よりも皮内に多く存在する。", "short": "d"}, {"id": "e", "text": "樹状細胞は皮下組織よりも筋肉内に多く存在する。", "short": "e"}], "correct": ["d", "e"], "explanation": "樹状細胞は粘膜・皮膚に豊富な抗原提示細胞で、抗原を取り込みT細胞に提示する（逆ではない）。皮内・筋肉内は皮下より樹状細胞が豊富でワクチンの免疫原性が高い。指示により本問はd,eを正解とする（cも皮内より筋肉多いが設問指示ではd,e）。"}, {"id": 130, "title": "主要組織適合性複合体（MHC）について正しい説明はどれか。2つ
