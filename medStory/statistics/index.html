<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サンプルコード</title>
  <style>
    /* 全体のリセットと背景設定 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f4f7f6; /* 目に優しい薄いグレー */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: left;
      min-height: 100vh;
    }

    /* メインのコンテナ（カード風） */
    .container {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05); /* 柔らかい影 */
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* タイトルの装飾 */
    h1 {
      color: #2c3e50; /* 深みのある紺色 */
      font-size: 1.8rem;
      margin-bottom: 2rem;
      position: relative;
      padding-bottom: 10px;
    }

    /* タイトルの下のアクセント線 */
    h1::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 3px;
      background: #3498db; /* スッキリしたブルー */
      border-radius: 2px;
    }

    /* リンクボタンの共通スタイル */
    .btn-link {
      display: block;
      margin-bottom: 1rem;
      padding: 0.8rem 1.5rem;
      color: #34495e;
      text-decoration: none;
      background-color: #fafbfc;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      font-weight: 500;
      transition: all 0.2s ease-in-out;
    }

    /* マウスホバー時のエフェクト */
    .btn-link:hover {
      background-color: #3498db;
      color: #ffffff;
      border-color: #3498db;
      transform: translateY(-2px); /* 少し上に浮き上がる */
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
    }

    /* 最後のボタンのマージンをリセット */
    .btn-link:last-child {
      margin-bottom: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>サンプルコード</h1>
    <a href="beginner.html" class="btn-link">プログラミングって難しい？？</a>
    <a href="r_statistics_text.html" class="btn-link">テキストを読む</a>
    <a href="sample001" class="btn-link">サンプルコード 001：増殖曲線</a>
  </div>

</body>
</html>
