<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>対義語・類義語道場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Serif+JP:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F1E6;
    --paper-2:#EFE7D6;
    --ink:#2B2620;
    --ink-soft:#5B5346;
    --line:#D9CFB8;
    --shu:#A6332B;
    --shu-deep:#7E2620;
    --ai:#2B5F73;
    --ai-deep:#1F4756;
    --gold:#B08D3F;
    --ok:#3E6B4B;
    --ng:#A6332B;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(43,38,32,0.05) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:'Noto Sans JP', sans-serif;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:840px;margin:0 auto;padding:28px 18px 80px;}

  header{
    text-align:center;
    padding:18px 0 22px;
    border-bottom:3px double var(--ink);
    margin-bottom:18px;
    position:relative;
  }
  header .kan{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:2.05rem;
    letter-spacing:.1em;
  }
  header .sub{
    font-size:.78rem;
    color:var(--ink-soft);
    letter-spacing:.15em;
    margin-top:6px;
  }
  header .seal{
    position:absolute;
    top:8px; right:6px;
    width:46px;height:46px;
    border:2.5px solid var(--shu);
    border-radius:3px;
    color:var(--shu);
    display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:1.15rem;
    transform:rotate(-4deg);
    opacity:.85;
  }
  .legend{
    display:flex;
    justify-content:center;
    gap:18px;
    font-size:.76rem;
    color:var(--ink-soft);
    margin-bottom:24px;
  }
  .legend span.dot{
    display:inline-block;
    width:10px;height:10px;
    border-radius:50%;
    margin-right:5px;
    vertical-align:middle;
  }
  .legend .anto .dot{background:var(--shu);}
  .legend .syn .dot{background:var(--ai);}

  nav{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    margin-bottom:26px;
  }
  nav button{
    font-family:'Noto Serif JP', serif;
    font-size:.88rem;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:9px 16px;
    border-radius:var(--radius);
    cursor:pointer;
    transition:.15s;
  }
  nav button:hover{border-color:var(--gold); color:var(--ink);}
  nav button.active{background:var(--ink); color:var(--paper); border-color:var(--ink);}

  section.view{display:none;}
  section.view.active{display:block;}

  /* --- list/search --- */
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; align-items:center;}
  #searchBox{
    flex:1 1 220px;
    padding:10px 12px;
    font-size:.95rem;
    border:1px solid var(--line);
    background:#fff;
    border-radius:var(--radius);
    font-family:inherit;
  }
  #searchBox:focus{outline:2px solid var(--gold); outline-offset:1px;}
  #toggleAllBtn{
    font-family:'Noto Serif JP', serif;
    font-size:.82rem;
    background:var(--ink);
    color:var(--paper);
    border:1px solid var(--ink);
    padding:9px 16px;
    border-radius:var(--radius);
    cursor:pointer;
    white-space:nowrap;
  }
  #toggleAllBtn:hover{background:var(--shu-deep); border-color:var(--shu-deep);}

  .type-filter{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:16px;}
  .type-filter button{
    font-family:'Noto Serif JP',serif;
    font-size:.82rem;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    padding:5px 13px;
    border-radius:14px;
    cursor:pointer;
  }
  .type-filter button.active{background:var(--gold); border-color:var(--gold); color:#fff;}

  .count-line{font-size:.8rem; color:var(--ink-soft); margin-bottom:10px;}

  .card-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
  }
  @media(max-width:700px){ .card-grid{grid-template-columns:repeat(2,1fr);} }
  @media(max-width:460px){ .card-grid{grid-template-columns:1fr;} }

  .pair-card{
    background:#fff;
    border:1px solid var(--line);
    border-left:4px solid var(--ink-soft);
    border-radius:var(--radius);
    padding:12px 14px;
    cursor:pointer;
  }
  .pair-card.antonym{border-left-color:var(--shu);}
  .pair-card.synonym{border-left-color:var(--ai);}
  .pair-card .chip{
    display:inline-block;
    font-size:.68rem;
    padding:1px 8px;
    border-radius:10px;
    margin-bottom:6px;
    letter-spacing:.05em;
  }
  .pair-card.antonym .chip{background:#F3E1DF; color:var(--shu-deep);}
  .pair-card.synonym .chip{background:#DFEBF0; color:var(--ai-deep);}
  .pair-card .pair-line{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:1.2rem;
    letter-spacing:.03em;
  }
  .pair-card .sym{
    color:var(--gold);
    margin:0 4px;
    font-weight:400;
  }
  .pair-card .reading-line{
    font-size:.7rem;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .pair-card .meanings{display:none; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
  .pair-card.open .meanings{display:block;}
  .pair-card .m-item{font-size:.76rem; color:var(--ink); margin-bottom:5px; line-height:1.6;}
  .pair-card .m-item b{font-family:'Shippori Mincho',serif; font-weight:700; margin-right:4px;}

  /* --- quiz --- */
  .quiz-box{
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 24px;
    text-align:center;
    position:relative;
    min-height:280px;
  }
  .quiz-score{font-size:.78rem; color:var(--ink-soft); margin-bottom:14px; letter-spacing:.05em;}
  .quiz-prompt-label{font-size:.8rem; color:var(--gold); letter-spacing:.1em; margin-bottom:14px;}
  .quiz-word{
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:2.4rem;
    letter-spacing:.1em;
    margin-bottom:24px;
  }
  .choices{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .choices button{
    font-family:'Shippori Mincho',serif;
    font-size:1.35rem;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    cursor:pointer;
    text-align:center;
    transition:.12s;
  }
  .choices button:hover:not(:disabled){border-color:var(--gold); background:#fff;}
  .choices button.correct{background:#E4EEE6; border-color:var(--ok); color:var(--ok);}
  .choices button.wrong{background:#F3E1DF; border-color:var(--ng); color:var(--ng);}
  .choices button:disabled{cursor:default;}
  .stamp{
    position:absolute; top:20px; right:26px;
    font-family:'Shippori Mincho',serif; font-weight:700; font-size:1.6rem;
    border:3px solid; border-radius:6px; padding:2px 10px;
    transform:rotate(-8deg); opacity:0; transition:opacity .15s, transform .15s;
  }
  .stamp.show{opacity:.9;}
  .stamp.ok{color:var(--ok); border-color:var(--ok);}
  .stamp.ng{color:var(--ng); border-color:var(--ng);}
  .quiz-next{
    margin-top:20px;
    font-family:'Noto Serif JP',serif;
    background:var(--ink); color:var(--paper); border:none;
    padding:10px 26px; border-radius:var(--radius); cursor:pointer;
    font-size:.85rem; letter-spacing:.1em; display:none;
  }
  .quiz-next.show{display:inline-block;}

  /* --- match game --- */
  .match-status{font-size:.85rem; color:var(--ink-soft); margin-bottom:14px; text-align:center;}
  .match-cols{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  .match-col h3{
    font-family:'Noto Serif JP',serif; font-size:.82rem; color:var(--gold);
    letter-spacing:.15em; text-align:center; margin:0 0 10px;
  }
  .half-btn{
    display:block; width:100%;
    font-family:'Shippori Mincho',serif; font-size:1.15rem;
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:10px; margin-bottom:8px; cursor:pointer; letter-spacing:.05em;
  }
  .half-btn:hover:not(:disabled){border-color:var(--gold);}
  .half-btn.selected{border-color:var(--shu); background:#FBEFEC; color:var(--shu);}
  .half-btn.locked{background:#E4EEE6; border-color:var(--ok); color:var(--ok); cursor:default;}
  .half-btn.shake{border-color:var(--ng); background:#F3E1DF;}
  .new-set-btn{
    display:block; margin:20px auto 0;
    font-family:'Noto Serif JP',serif;
    background:var(--ink); color:var(--paper); border:none;
    padding:10px 26px; border-radius:var(--radius); cursor:pointer;
    font-size:.85rem; letter-spacing:.1em;
  }

  footer{
    max-width:840px; margin:50px auto 0; padding:16px 18px 0;
    border-top:1px solid var(--line); font-size:.68rem; color:var(--ink-soft); line-height:1.8;
  }

  @media(max-width:520px){
    .choices{grid-template-columns:1fr;}
    .quiz-word{font-size:1.9rem;}
    header .kan{font-size:1.6rem;}
  }

  @media print{
    body{background:#fff; color:#000;}
    nav, .toolbar, .type-filter, .count-line, .stamp, .legend{display:none !important;}
    header .seal{display:none;}
    section.view{display:none !important;}
    #view-list{display:block !important;}
    .card-grid{display:grid !important; grid-template-columns:repeat(3,1fr) !important; gap:8px;}
    .pair-card{break-inside:avoid; page-break-inside:avoid; border:1px solid #999; background:#fff; margin-bottom:12px; padding:10px 12px;}
    .pair-card .meanings{display:block !important;}
    .pair-card .m-item{color:#000;}
    footer{break-inside:avoid; page-break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="seal">対類</div>
    <div class="kan">対義語・類義語道場</div>
    <div class="sub">TAIGIGO / RUIGIGO DOJO ・ 全142組</div>
  </header>
  <div class="legend">
    <span class="anto"><span class="dot"></span>対義語（⇔）</span>
    <span class="syn"><span class="dot"></span>類義語（＝）</span>
  </div>

  <nav>
    <button data-view="list" class="active">一覧・検索</button>
    <button data-view="quiz1">クイズ</button>
    <button data-view="match">組み合わせゲーム</button>
  </nav>

  <!-- LIST / SEARCH -->
  <section class="view active" id="view-list">
    <div class="toolbar">
      <input id="searchBox" type="text" placeholder="語句・読み・意味で検索…">
      <button id="toggleAllBtn" type="button">すべて開く</button>
    </div>
    <div class="type-filter" id="typeFilter"></div>
    <div class="count-line" id="countLine"></div>
    <div class="card-grid" id="cardGrid"></div>
  </section>

  <!-- QUIZ -->
  <section class="view" id="view-quiz1">
    <div class="quiz-box">
      <div class="stamp" id="stamp1"></div>
      <div class="quiz-score" id="score1"></div>
      <div class="quiz-prompt-label" id="quizLabel1"></div>
      <div class="quiz-word" id="quizWord1"></div>
      <div class="choices" id="choices1"></div>
      <button class="quiz-next" id="next1">次の問題 →</button>
    </div>
  </section>

  <!-- MATCH GAME -->
  <section class="view" id="view-match">
    <div class="match-status" id="matchStatus"></div>
    <div class="match-cols">
      <div class="match-col">
        <h3>左の語句</h3>
        <div id="leftCol"></div>
      </div>
      <div class="match-col">
        <h3>右の語句</h3>
        <div id="rightCol"></div>
      </div>
    </div>
    <button class="new-set-btn" id="newSetBtn">新しい問題セット</button>
  </section>

  <footer>
    掲載の語句・分類（対義語／類義語）はユーザー指定のリストに基づき、読み仮名・意味は AI（Claude, Anthropic）が作成しました。内容には誤りが含まれる可能性があります。学習・受験対策としてご利用の際は、必ず市販の国語辞典等で正確性をご確認ください。二次利用・再配布は自己責任のもとで可能です。その際、本注記の保持を推奨します。
  </footer>
</div>

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function sample(arr, n){ return shuffle(arr).slice(0,n); }

    document.querySelectorAll('section.view').forEach(s=>s.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-'+btn.dataset.view).classList.add('active');
  });
});

/* ---------- LIST / SEARCH / FILTER ---------- */
let activeType = null;
const typeFilterEl = document.getElementById('typeFilter');
const allTypeBtn = document.createElement('button');
allTypeBtn.textContent = 'すべて';
allTypeBtn.className = 'active';
allTypeBtn.addEventListener('click', ()=>{ activeType=null; syncTypeButtons(allTypeBtn); renderList(); });
typeFilterEl.appendChild(allTypeBtn);
[['antonym','対義語（⇔）'],['synonym','類義語（＝）']].forEach(([val,label])=>{
  const b = document.createElement('button');
  b.textContent = label;
  b.addEventListener('click', ()=>{ activeType=val; syncTypeButtons(b); renderList(); });
  typeFilterEl.appendChild(b);
});
function syncTypeButtons(active){
  typeFilterEl.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
  active.classList.add('active');
}

const searchBox = document.getElementById('searchBox');
searchBox.addEventListener('input', renderList);

let allOpen = false;
const toggleAllBtn = document.getElementById('toggleAllBtn');
toggleAllBtn.addEventListener('click', ()=>{
  allOpen = !allOpen;
  toggleAllBtn.textContent = allOpen ? 'すべて閉じる' : 'すべて開く';
  document.querySelectorAll('.pair-card').forEach(c=>c.classList.toggle('open', allOpen));
});

function renderList(){
  const q = searchBox.value.trim();
  let list = DATA;
  if(activeType) list = list.filter(d=>d.type===activeType);
  if(q) list = list.filter(d=>
    d.word1.includes(q) || d.word2.includes(q) ||
    d.reading1.includes(q) || d.reading2.includes(q) ||
    d.meaning1.includes(q) || d.meaning2.includes(q));

  document.getElementById('countLine').textContent = list.length + ' 組 / 全' + DATA.length + '組';
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  list.forEach(d=>{
    const card = document.createElement('div');
    card.className = 'pair-card ' + d.type + (allOpen ? ' open' : '');
    card.innerHTML = `
      <div class="chip">${labelOf(d.type)}</div>
      <div class="pair-line">${d.word1}<span class="sym">${symbolOf(d.type)}</span>${d.word2}</div>
      <div class="reading-line">${d.reading1} ${symbolOf(d.type)} ${d.reading2}</div>
      <div class="meanings">
        <div class="m-item"><b>${d.word1}</b>${d.meaning1}</div>
        <div class="m-item"><b>${d.word2}</b>${d.meaning2}</div>
      </div>`;
    card.addEventListener('click', ()=>card.classList.toggle('open'));
    grid.appendChild(card);
  });
}
renderList();

/* ---------- QUIZ ---------- */
// flat pool of {word, type, pairId} for distractor sampling
const WORD_POOL = [];
DATA.forEach((d,i)=>{
  WORD_POOL.push({word:d.word1, type:d.type, pairId:i});
  WORD_POOL.push({word:d.word2, type:d.type, pairId:i});
});

let score1 = {correct:0, total:0};
let currentQ1 = null;
function newQuiz1(){
  document.getElementById('stamp1').className = 'stamp';
  document.getElementById('next1').classList.remove('show');
  const idx = Math.floor(Math.random()*DATA.length);
  const d = DATA[idx];
  const showFirst = Math.random() < 0.5;
  const promptWord = showFirst ? d.word1 : d.word2;
  const answerWord = showFirst ? d.word2 : d.word1;
  currentQ1 = {answerWord};

  document.getElementById('quizLabel1').textContent =
    `「${promptWord}」の${labelOf(d.type)}は？`;
  document.getElementById('quizWord1').textContent = promptWord;
  document.getElementById('score1').textContent = `正解 ${score1.correct} / ${score1.total} 問`;

  const distractorPool = WORD_POOL.filter(w => w.type===d.type && w.pairId!==idx && w.word!==answerWord);
  const distractors = sample(distractorPool, 3).map(w=>w.word);
  const options = shuffle([answerWord, ...distractors]);

  const box = document.getElementById('choices1');
  box.innerHTML='';
  options.forEach(opt=>{
    const b = document.createElement('button');
    b.textContent = opt;
    b.addEventListener('click', ()=>answerQ1(b, opt===answerWord));
    box.appendChild(b);
  });
}
function answerQ1(btn, isCorrect){
  document.querySelectorAll('#choices1 button').forEach(b=>b.disabled=true);
  const stamp = document.getElementById('stamp1');
  score1.total++;
  if(isCorrect){
    btn.classList.add('correct');
    stamp.textContent='正解'; stamp.className='stamp show ok';
    score1.correct++;
  }else{
    btn.classList.add('wrong');
    stamp.textContent='不正解'; stamp.className='stamp show ng';
    document.querySelectorAll('#choices1 button').forEach(b=>{ if(b.textContent===currentQ1.answerWord) b.classList.add('correct'); });
  }
  document.getElementById('score1').textContent = `正解 ${score1.correct} / ${score1.total} 問`;
  document.getElementById('next1').classList.add('show');
}
document.getElementById('next1').addEventListener('click', newQuiz1);

/* ---------- MATCH GAME ---------- */
const MATCH_SET_SIZE = 6;
let matchPairs = [];
let matchedCount = 0;
let selLeft = null, selRight = null;

function newMatchSet(){
  matchPairs = sample(DATA, MATCH_SET_SIZE);
  matchedCount = 0;
  selLeft = null; selRight = null;

  const lefts = shuffle(matchPairs.map((d,i)=>({id:i, word:d.word1})));
  const rights = shuffle(matchPairs.map((d,i)=>({id:i, word:d.word2})));

  const leftCol = document.getElementById('leftCol');
  const rightCol = document.getElementById('rightCol');
  leftCol.innerHTML=''; rightCol.innerHTML='';

  lefts.forEach(l=>{
    const b = document.createElement('button');
    b.className='half-btn';
    b.textContent = l.word;
    b.dataset.id = l.id;
    b.addEventListener('click', ()=>selectHalf(b,'left'));
    leftCol.appendChild(b);
  });
  rights.forEach(r=>{
    const b = document.createElement('button');
    b.className='half-btn';
    b.textContent = r.word;
    b.dataset.id = r.id;
    b.addEventListener('click', ()=>selectHalf(b,'right'));
    rightCol.appendChild(b);
  });
  updateMatchStatus();
}
function updateMatchStatus(){
  document.getElementById('matchStatus').textContent = `${matchedCount} / ${matchPairs.length} 組 完成`;
}
function selectHalf(btn, side){
  if(btn.classList.contains('locked')) return;
  if(side==='left'){
    if(selLeft) selLeft.classList.remove('selected');
    selLeft = btn; btn.classList.add('selected');
  }else{
    if(selRight) selRight.classList.remove('selected');
    selRight = btn; btn.classList.add('selected');
  }
  if(selLeft && selRight){
    if(selLeft.dataset.id === selRight.dataset.id){
      selLeft.classList.remove('selected'); selRight.classList.remove('selected');
      selLeft.classList.add('locked'); selRight.classList.add('locked');
      selLeft.disabled = true; selRight.disabled = true;
      matchedCount++;
      selLeft=null; selRight=null;
      updateMatchStatus();
      if(matchedCount === matchPairs.length){
        document.getElementById('matchStatus').textContent = `🎉 全${matchPairs.length}組 完成！「新しい問題セット」で次へ`;
      }
    }else{
      const l=selLeft, r=selRight;
      l.classList.add('shake'); r.classList.add('shake');
      setTimeout(()=>{
        l.classList.remove('selected','shake');
        r.classList.remove('selected','shake');
      }, 420);
      selLeft=null; selRight=null;
    }
  }
}
document.getElementById('newSetBtn').addEventListener('click', newMatchSet);

/* ---------- init ---------- */
newQuiz1();
newMatchSet();
</script>
