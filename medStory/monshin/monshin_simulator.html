<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初めての問診シミュレーター</title>
<style>
  :root{
    --ink:#1c2b22;
    --paper:#f3efe4;
    --paper-deep:#eae3d2;
    --moss:#1f4d3a;
    --moss-deep:#123626;
    --moss-soft:#e4ece5;
    --gold:#b9852f;
    --gold-soft:#f6ecd6;
    --wrong:#8a3b32;
    --wrong-soft:#f3e3df;
    --line:#d8cfba;
    --white:#fffdf8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% -10%, rgba(31,77,58,0.07), transparent 45%),
      radial-gradient(circle at 100% 0%, rgba(185,133,47,0.08), transparent 40%),
      var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
    line-height:1.75;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .shell{
    width:100%;
    max-width:720px;
    padding:0 18px 40px;
  }
  header.top{
    width:100%;
    background:var(--moss-deep);
    color:var(--white);
    padding:22px 18px 20px;
    text-align:center;
    box-shadow:0 4px 18px rgba(18,54,38,0.25);
    position:relative;
  }
  header.top .kicker{
    font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;
    letter-spacing:0.4em;
    font-size:12px;
    color:#cfe3d5;
    margin:0 0 6px;
  }
  header.top h1{
    font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;
    font-size:24px;
    margin:0;
    font-weight:700;
    letter-spacing:0.05em;
  }
  nav.top-nav{
    width:100%;
    max-width:720px;
    display:flex;
    gap:6px;
    padding:10px 18px 0;
    justify-content:center;
  }
  nav.top-nav button.nav-btn{
    flex:1;
    max-width:180px;
    background:var(--white);
    border:1px solid var(--line);
    color:#6b6250;
    padding:9px 8px;
    border-radius:20px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
    letter-spacing:.03em;
  }
  nav.top-nav button.nav-btn.active{
    background:var(--moss-deep);
    border-color:var(--moss-deep);
    color:#fff;
    font-weight:700;
  }
  div.sub-nav{
    width:100%;
    max-width:720px;
    display:flex;
    gap:8px;
    padding:8px 18px 0;
    justify-content:center;
  }
  div.sub-nav button.subnav-btn{
    background:var(--white);
    border:1px solid var(--line);
    color:var(--moss-deep);
    padding:6px 14px;
    border-radius:20px;
    font-size:12.5px;
    font-family:inherit;
    cursor:pointer;
  }
  div.sub-nav button.subnav-btn:disabled{
    color:#c7c0ab;
    cursor:not-allowed;
  }
  .case-list-menu{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-top:14px;
  }
  button.case-list-btn{
    display:flex;
    align-items:center;
    gap:10px;
    text-align:left;
    border:1px solid var(--line);
    background:var(--white);
    border-radius:10px;
    padding:11px 14px;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    color:var(--ink);
  }
  button.case-list-btn:hover{border-color:var(--moss);}
  button.case-list-btn.clb-done{
    background:var(--moss-soft);
    border-color:var(--moss);
  }
  .clb-num{
    flex:0 0 auto;
    min-width:26px;
    height:26px;
    border-radius:50%;
    background:var(--paper-deep);
    color:var(--moss-deep);
    font-size:11px;
    font-weight:700;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .clb-title{flex:1;}
  .clb-check{color:var(--moss-deep);font-weight:700;}
  button.case-list-btn.clb-epilogue{
    background:var(--gold-soft);
    border-color:var(--gold);
  }
  button.case-list-btn.clb-epilogue .clb-num{
    background:var(--gold);
    color:#fff;
  }
  .vignette-card{
    background:var(--paper-deep);
    border-radius:10px;
    padding:14px 16px;
    margin:12px 0 4px;
    font-size:14.5px;
    line-height:1.8;
  }
  .field-label{
    font-size:13px;
    font-weight:700;
    color:var(--moss-deep);
    margin:16px 0 6px;
  }
  input.input-field, textarea.input-field{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    background:var(--white);
    color:var(--ink);
  }
  input.input-field:focus, textarea.input-field:focus{
    outline:none;
    border-color:var(--moss);
  }
  input.input-field:disabled, textarea.input-field:disabled{
    background:var(--paper-deep);
    color:#6b6250;
  }
  textarea.input-field{resize:vertical;min-height:72px;}
  .diagnosis-result{
    font-size:14px;
    margin-top:14px;
    padding:10px 14px;
    border-radius:8px;
  }
  .diagnosis-result.correct{background:var(--moss-soft);color:var(--moss-deep);}
  .diagnosis-result.wrong{background:var(--wrong-soft);color:var(--wrong);}
  ul.keypoint-list{
    margin:6px 0 0;
    padding:0;
    list-style:none;
  }
  ul.keypoint-list li{
    font-size:13.5px;
    padding:5px 0;
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .kp-icon{flex:0 0 auto;font-weight:700;width:16px;}
  .kp-icon.hit{color:var(--moss);}
  .kp-icon.miss{color:#a39c86;}
  .progress-wrap{
    width:100%;
    max-width:720px;
    padding:16px 18px 0;
  }
  .progress-track{
    display:flex;
    gap:6px;
  }
  .progress-seg{
    flex:1;
    height:6px;
    border-radius:4px;
    background:var(--line);
    overflow:hidden;
  }
  .progress-seg > i{
    display:block;
    height:100%;
    width:0%;
    background:var(--moss);
    transition:width .4s ease;
  }
  .progress-label{
    margin:8px 2px 0;
    font-size:12px;
    color:#6b6250;
    display:flex;
    justify-content:space-between;
  }
  .stage{
    margin-top:18px;
  }
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 20px;
    margin-bottom:16px;
    box-shadow:0 2px 10px rgba(28,43,34,0.05);
  }
  .speaker{
    display:flex;
    align-items:flex-start;
    gap:12px;
  }
  .avatar{
    flex:0 0 auto;
    width:46px;height:46px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;
    font-weight:700;
    font-size:18px;
    color:var(--white);
  }
  .avatar.master{background:var(--moss);}
  .avatar.patient{background:#4a5a8a;}
  .name-tag{
    font-size:11px;
    color:#8a8168;
    margin:0 0 3px;
    letter-spacing:.05em;
  }
  .bubble{
    background:var(--paper-deep);
    border-radius:2px 14px 14px 14px;
    padding:12px 14px;
    font-size:15px;
    flex:1;
  }
  .bubble.patient-bubble{background:#eceef6;}
  h2.section-title{
    font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;
    font-size:19px;
    margin:0 0 10px;
    color:var(--moss-deep);
    display:flex;
    align-items:center;
    gap:8px;
  }
  h2.section-title .tag{
    font-size:11px;
    background:var(--moss-soft);
    color:var(--moss-deep);
    padding:3px 9px;
    border-radius:20px;
    font-family:inherit;
    letter-spacing:.05em;
  }
  .patient-info{
    font-size:14px;
    color:#4b4738;
    background:var(--paper-deep);
    border-radius:10px;
    padding:10px 14px;
    margin:12px 0;
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:14px;
  }
  button.choice{
    text-align:left;
    border:1px solid var(--line);
    background:var(--white);
    border-radius:10px;
    padding:12px 14px;
    font-size:14.5px;
    cursor:pointer;
    color:var(--ink);
    display:flex;
    gap:10px;
    align-items:flex-start;
    transition:border-color .15s, background .15s, transform .1s;
    font-family:inherit;
  }
  button.choice .letter{
    flex:0 0 auto;
    width:22px;height:22px;
    border-radius:50%;
    background:var(--paper-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    font-weight:700;
    color:var(--moss-deep);
  }
  button.choice:hover:not(:disabled){
    border-color:var(--moss);
    transform:translateY(-1px);
  }
  button.choice:disabled{cursor:default;}
  button.choice.correct{
    background:var(--moss-soft);
    border-color:var(--moss);
  }
  button.choice.correct .letter{background:var(--moss);color:#fff;}
  button.choice.wrong{
    background:var(--wrong-soft);
    border-color:var(--wrong);
    opacity:.85;
  }
  button.choice.wrong .letter{background:var(--wrong);color:#fff;}
  button.choice.dim{opacity:.45;}
  .reply-block{
    margin-top:16px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .feedback{
    padding:12px 14px;
    border-radius:10px;
    font-size:14px;
    background:var(--gold-soft);
    border-left:4px solid var(--gold);
  }
  .feedback.negative{
    background:var(--wrong-soft);
    border-left:4px solid var(--wrong);
  }
  .feedback .label{
    font-weight:700;
    font-size:12px;
    letter-spacing:.05em;
    color:var(--moss-deep);
    margin-bottom:4px;
    display:block;
  }
  .btn-row{
    margin-top:18px;
    display:flex;
    justify-content:flex-end;
  }
  button.primary{
    background:var(--moss-deep);
    color:#fff;
    border:none;
    padding:11px 22px;
    border-radius:30px;
    font-size:14.5px;
    cursor:pointer;
    font-family:inherit;
    letter-spacing:.03em;
    box-shadow:0 3px 10px rgba(18,54,38,0.25);
  }
  button.primary:hover{background:var(--moss);}
  button.primary:disabled{
    background:#cfc9b8;
    box-shadow:none;
    cursor:not-allowed;
  }
  ul.review-list{
    margin:10px 0 0;
    padding-left:20px;
  }
  ul.review-list li{
    margin-bottom:8px;
    font-size:14.5px;
  }
  .score-pill{
    display:inline-block;
    font-size:12px;
    background:var(--moss-soft);
    color:var(--moss-deep);
    padding:4px 12px;
    border-radius:20px;
    margin-bottom:12px;
  }
  .bonus-badge{
    display:inline-block;
    font-size:11px;
    letter-spacing:.08em;
    background:var(--gold);
    color:#fff;
    padding:3px 10px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .case-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin:14px 0 4px;
  }
  .case-chip{
    font-size:12px;
    background:var(--paper-deep);
    padding:5px 10px;
    border-radius:20px;
    color:#6b6250;
  }
  .case-chip.done{
    background:var(--moss-soft);
    color:var(--moss-deep);
  }
  .final-score{
    text-align:center;
    padding:10px 0 4px;
  }
  .final-score .num{
    font-family:"Hiragino Mincho ProN","Noto Serif JP",serif;
    font-size:44px;
    color:var(--moss-deep);
  }
  .final-score .den{
    font-size:15px;
    color:#7c7460;
  }
  i.taxon{font-style:italic;}
  .explainer-list{
    margin:14px 0 0;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .explainer-item{
    border-left:3px solid var(--moss);
    padding:2px 0 2px 12px;
  }
  .explainer-item .ex-label{
    font-size:12px;
    font-weight:700;
    color:var(--moss-deep);
    letter-spacing:.04em;
    margin:0 0 3px;
  }
  .explainer-item .ex-text{
    font-size:14.5px;
    margin:0;
  }
  .form-meta{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px 18px;
    font-size:13.5px;
    margin:12px 0 4px;
    background:var(--paper-deep);
    border-radius:10px;
    padding:12px 14px;
  }
  .form-meta div{display:flex;justify-content:space-between;gap:8px;}
  .form-meta .k{color:#8a8168;flex:0 0 auto;}
  .form-meta .v{text-align:right;font-weight:600;}
  .form-note{
    font-size:12px;
    color:#8a8168;
    margin:10px 2px 0;
  }
  .form-section{margin-top:18px;}
  .form-section-title{
    font-size:13px;
    font-weight:700;
    color:var(--moss-deep);
    margin-bottom:7px;
    letter-spacing:.02em;
  }
  .form-section-title .hint{
    font-weight:400;
    color:#8a8168;
    font-size:11.5px;
    margin-left:4px;
  }
  .chk-row{display:flex;flex-wrap:wrap;gap:6px 8px;}
  .chk{
    font-size:12.5px;
    padding:4px 9px;
    border-radius:6px;
    background:var(--white);
    border:1px solid var(--line);
    color:#a39c86;
  }
  .chk.checked{
    background:var(--moss-soft);
    border-color:var(--moss);
    color:var(--moss-deep);
    font-weight:700;
  }
  .quote-box{
    margin-top:8px;
    font-size:13.5px;
    background:var(--white);
    border:1px dashed var(--line);
    border-radius:8px;
    padding:9px 11px;
    color:#4b4738;
  }
  .form-inline{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    font-size:13px;
    color:#4b4738;
    margin-bottom:8px;
  }
  .form-inline b{color:var(--moss-deep);}
  .link-card{
    display:block;
    text-decoration:none;
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:12px;
    background:var(--paper-deep);
  }
  .link-card .lc-title{
    font-weight:700;
    color:var(--moss-deep);
    font-size:15px;
    margin:0 0 4px;
  }
  .link-card .lc-desc{
    font-size:13px;
    color:#5a5443;
    margin:0;
  }
  .link-card .lc-url{
    font-size:11.5px;
    color:#a39c86;
    margin:6px 0 0;
  }
  .about-steps{
    margin:10px 0 0;
    padding-left:20px;
  }
  .about-steps li{margin-bottom:8px;font-size:14.5px;}
  footer.disclaimer{
    max-width:720px;
    width:100%;
    margin:10px auto 0;
    padding:16px 18px 30px;
    font-size:11.5px;
    color:#8a8168;
    line-height:1.8;
    text-align:center;
    border-top:1px solid var(--line);
  }
  footer.disclaimer .counter{
    margin:10px 0 0;
    font-size:11px;
    color:#a39c86;
    letter-spacing:.03em;
  }
  @media (max-width:480px){
    header.top h1{font-size:20px;}
    .card{padding:18px 14px;}
  }
</style>
</head>
<body>

<header class="top">
  <p class="kicker">問 診 道 場</p>
  <h1>初めての問診シミュレーター</h1>
</header>

<nav class="top-nav">
  <button class="nav-btn active" data-view="main" onclick="switchView('main')">メイン画面</button>
  <button class="nav-btn" data-view="about" onclick="switchView('about')">解説</button>
  <button class="nav-btn" data-view="links" onclick="switchView('links')">リンク</button>
</nav>

<div class="sub-nav" id="subNav">
  <button class="subnav-btn" id="backBtn" onclick="goBack()">← 戻る</button>
  <button class="subnav-btn" onclick="openCaseList()">📋 症例一覧</button>
</div>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-track" id="progressTrack"></div>
  <div class="progress-label">
    <span id="progressLabel">師匠の指南</span>
    <span id="progressScore"></span>
  </div>
</div>

<div class="shell">
  <div class="stage" id="stage"></div>
</div>

<footer class="disclaimer">
  本テキストは AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。<br>
  二次利用・再配布は自己責任のもとで可能です。その際、本注記の保持を推奨します。
  <p class="counter" id="accessCounter">アクセス数を読み込み中…</p>
</footer>

<script>
/* ---------------------------------------------------------
   データ定義
   各症例は steps（5段階）を持つ：
   0: 主訴の聞き方（開放型 vs 閉鎖型 vs 決めつけ）
   1: 症状の性状・経過
   2: 曝露歴・生活歴（広く尋ねる）
   3: 曝露歴の絞り込み（具体的な項目を挙げて尋ねる）
   4: 既往歴・家族歴
   各選択肢には 患者の返答(patientReply) と 師匠の講評(feedback) を持たせる。
--------------------------------------------------------- */
const FAMILY_OPTIONS = ["高血圧","糖尿病","がん","心臓病","喘息・アレルギー","感染症","特になし"];
const PAST_OPTIONS = ["高血圧","糖尿病","喘息","心臓病","腎臓病","肝臓病","手術歴","感染症","特になし"];
const ALLERGY_OPTIONS = ["薬","食べ物","金属","ラテックス","なし"];
const CONTRA_OPTIONS = ["妊娠中・可能性あり","授乳中","腎臓の病気","肝臓の病気","使えないと言われた治療がある","特になし"];

const lecture = {
  title:"問診の基本 〜師匠より〜",
  lines:[
    "よく来たな。今日から問診の稽古を始めよう。まずは基本の型を三つだけ覚えてほしい。",
    "一つ目。主訴はまず開放型（オープンエンド）の質問で聞く。ただし、受付で問診票にすでに主訴を書いてもらっている場合、「今日はどうされましたか」とまっさらに聞き直すのは不自然だ。「〇〇がおつらいのですね。もう少し詳しく教えてください」というように、すでに分かっている情報をふまえたうえで、開いた形で聞くとよい。決めつけず、患者さん自身の言葉で語ってもらうのが出発点だ。",
    "二つ目。聞き方には流れがある。①開放的傾聴（自由に話してもらう）→②誘導的傾聴（気になる点を絞って聞く）→③仮説検証的傾聴（鑑別を絞るための質問）という三段階を、行ったり来たりしながら進める。広く尋ねても患者さんがうまく思い出せないことは多い。そのときは「この1週間で〇〇は?」というように、具体的な項目を一つずつ挙げて絞り込んでいくのがコツだ。",
    "三つ目。既往歴や家族歴も欠かさず確認すること。基礎疾患や続発症のリスク、周囲での流行状況を知る手がかりになる。「なぜ今日受診したのか」という受診理由の深掘りや、患者さんの解釈・不安（解釈モデル）を尋ねる姿勢、うなずきなどの態度も、信頼関係づくりの大切な技だ。",
    "さて、口で言うのは簡単だが、実際にやってみないと身につかん。これから九人の患者さんが訪れる。一緒に問診してみよう。"
  ],
  cta:"稽古を始める"
};

const cases = [
  {
    key:"mycoplasma",
    title:"症例１：マイコプラズマ肺炎",
    patient:"22歳・男性（大学生）",
    complaint:"5日前からの乾いた咳と微熱（37.8℃）",
    intro:"すみません…咳がずっと続いていて、しんどくて来ました。",
    form:{
      name:"田中 大輔", furigana:"たなか だいすけ",
      dob:"2004年3月14日", age:22, gender:"男性",
      address:"大阪府大阪市阿倍野区旭町1-2-3", phone:"090-1234-5601",
      informant:null,
      complaintOptions:["せき","発熱","のどの痛み","息苦しさ","痰がからむ"],
      complaintChecked:["せき","発熱"],
      complaintFree:"5日前から咳が続いています。",

/* ---------------------------------------------------------
   選択肢シャッフル（正解が常にAにならないようにする）
--------------------------------------------------------- */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
cases.forEach(c=>{
  c.steps.forEach(s=>{
    if(s.options) s.options = shuffle(s.options);
  });
  c.bonus.options = shuffle(c.bonus.options);
  c._answered = {};
  c._bonusAnswered = null;
  c._diagnosisAnswer = null;
});

/* ---------------------------------------------------------
   状態管理
   subPhase: "intro" -> "step0".."step4" -> "review" -> "bonus"
--------------------------------------------------------- */
let phase = "lecture";
let caseIndex = 0;
let subPhase = "intro";
let score = 0;
let maxScore = 0;
let historyStack = [];

const totalCases = cases.length;
const STEP_ORDER_CHOICE = ["form","intro","step0","step1","step2","step3","step4","review","explainer","altphrase","bonus","done"];
const STEP_ORDER_INPUT  = ["form","intro","step0","step1","step2","step3","step4","workup","diagnosis","review","explainer","altphrase","bonus","done"];
const stageEl = document.getElementById("stage");
const progressTrack = document.getElementById("progressTrack");
const progressLabel = document.getElementById("progressLabel");
const progressScore = document.getElementById("progressScore");
const backBtn = document.getElementById("backBtn");

function currentStepOrder(){
  const c = cases[caseIndex];
  return (c && c.mode === "input") ? STEP_ORDER_INPUT : STEP_ORDER_CHOICE;
}

function pushHistory(){
  historyStack.push({phase, caseIndex, subPhase});
}

function goBack(){
  if(historyStack.length === 0) return;
  const prev = historyStack.pop();
  phase = prev.phase;
  caseIndex = prev.caseIndex;
  subPhase = prev.subPhase;
  render();
}

function updateNavButtons(){
  if(backBtn) backBtn.disabled = historyStack.length === 0;
}

function buildProgressTrack(){
  progressTrack.innerHTML = "";
  for(let i=0;i<totalCases;i++){
    const seg = document.createElement("div");
    seg.className = "progress-seg";
    const bar = document.createElement("i");
    seg.appendChild(bar);
    progressTrack.appendChild(seg);
  }
}
buildProgressTrack();

function updateProgress(){
  const segs = progressTrack.querySelectorAll(".progress-seg > i");
  segs.forEach((bar, idx) => {
    if(phase === "lecture" || phase === "caselist" || phase === "epilogue"){
      bar.style.width = "0%";
    } else {
      if(idx < caseIndex) bar.style.width = "100%";
      else if(idx === caseIndex){
        const order = currentStepOrder();
        const denom = order.indexOf("done");
        const p = order.indexOf(subPhase);
        bar.style.width = Math.min(100, (p/denom)*100) + "%";
      } else {
        bar.style.width = "0%";
      }
    }
  });
  if(phase === "lecture"){
    progressLabel.textContent = "師匠の指南";
  } else if(phase === "caselist"){
    progressLabel.textContent = "症例一覧";
  } else if(phase === "epilogue"){
    progressLabel.textContent = "師匠からの言葉";
  } else if(phase === "complete"){
    progressLabel.textContent = "全症例修了";
  } else {
    progressLabel.textContent = `症例 ${caseIndex+1} / ${totalCases}　${caseDisplayLabel(cases[caseIndex])}`;
  }
  progressScore.textContent = maxScore > 0 ? `習熟度 ${score} / ${maxScore}` : "";
}

function render(){
  updateProgress();
  updateNavButtons();
  if(phase === "lecture"){
    renderLecture();
  } else if(phase === "caselist"){
    renderCaseList();
  } else if(phase === "epilogue"){
    renderEpilogue();
  } else if(phase === "complete"){
    renderComplete();
  } else {
    const c = cases[caseIndex];
    if(subPhase === "form") renderForm(c);
    else if(subPhase === "intro") renderCaseIntro(c);
    else if(subPhase.startsWith("step")){
      const si = parseInt(subPhase.replace("step",""));
      if(c.mode === "input") renderInputStep(c, si);
      else renderStep(c, si);
    }
    else if(subPhase === "workup") renderWorkup(c);
    else if(subPhase === "diagnosis") renderDiagnosisInput(c);
    else if(subPhase === "review") renderReview(c);
    else if(subPhase === "explainer") renderExplainer(c);
    else if(subPhase === "altphrase") renderAltPhrase(c);
    else if(subPhase === "bonus") renderBonus(c);
  }
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderLecture(){
  let html = `<div class="card">
    <h2 class="section-title"><span class="tag">指南</span>${lecture.title}</h2>`;
  lecture.lines.forEach(line=>{
    html += `<div class="speaker" style="margin-bottom:14px;">
      <div class="avatar master">師</div>
      <div class="bubble">${line}</div>
    </div>`;
  });
  html += `<div class="btn-row"><button class="primary" onclick="startCases()">${lecture.cta}</button></div>
  </div>`;
  stageEl.innerHTML = html;
}

function renderCaseList(){
  let items = `<button class="case-list-btn" onclick="jumpToLecture()">
      <span class="clb-num">指南</span>
      <span class="clb-title">師匠の指南（最初のページ）</span>
    </button>`;
  cases.forEach((c,i)=>{
    const stepsDone = c._answered && Object.keys(c._answered).length >= c.steps.length;
    const diagDone = c.mode !== "input" || !!c._diagnosisAnswer;
    const done = stepsDone && diagDone && c._bonusAnswered !== null;
    items += `<button class="case-list-btn ${done ? "clb-done" : ""}" onclick="jumpToCase(${i})">
      <span class="clb-num">${i+1}</span>
      <span class="clb-title">${caseDisplayLabel(c).split("：")[1] || caseDisplayLabel(c)}</span>
      ${done ? `<span class="clb-check">✓</span>` : ""}
    </button>`;
  });
  if(allCasesDone()){
    items += `<button class="case-list-btn clb-epilogue" onclick="openEpilogue()">
      <span class="clb-num">🎓</span>
      <span class="clb-title">師匠からの言葉</span>
    </button>`;
  }
  stageEl.innerHTML = `
  <div class="card">
    <h2 class="section-title"><span class="tag">症例一覧</span>移動先を選んでください</h2>
    <p style="color:#8a8168;font-size:12.5px;margin-top:2px;">選んだ症例は、問診票の画面から始まります。すでに回答した設問は、選んだ内容のまま振り返りとして表示されます。</p>
    <div class="case-list-menu">${items}</div>
  </div>`;
}

function jumpToLecture(){
  pushHistory();
  phase = "lecture";
  render();
}

function jumpToCase(i){
  pushHistory();
  phase = "case";
  caseIndex = i;
  subPhase = "form";
  render();
}

function openCaseList(){
  pushHistory();
  phase = "caselist";
  render();
}

function renderStep(c, si){
  const s = c.steps[si];

  s.options.forEach((o,i)=>{

    let disabledAttr = "";
    if(answeredIdx !== undefined){
      disabledAttr = "disabled";
      if(i === answeredIdx) cls = o.correct ? "correct" : "wrong";
      else if(o.correct) cls = "correct";
      else cls = "dim";
    }
    opts += `<button class="choice ${cls}" data-idx="${i}" ${disabledAttr} onclick="selectOption(${si},${i})">
      <span class="letter">${String.fromCharCode(65+i)}</span>
      <span>${o.text}</span>

function selectOption(si, idx){
  const c = cases[caseIndex];
  if(c._answered[si] !== undefined) return;
  const s = c.steps[si];
  const opt = s.options[idx];
  const group = document.getElementById("choiceGroup");
  const buttons = group.querySelectorAll("button.choice");
  buttons.forEach((b,i)=>{
    b.disabled = true;
    if(i === idx){
      b.classList.add(opt.correct ? "correct" : "wrong");
    } else if(s.options[i].correct){
      b.classList.add("correct");
    } else {
      b.classList.add("dim");
    }
  });
  c._answered[si] = idx;
  maxScore += 3;
  score += opt.correct ? 3 : 1;
  const area = document.getElementById("replyArea");
  area.innerHTML = replyBlockHtml(opt);
  document.getElementById("nextBtn").disabled = false;
  updateProgress();
}

/* ---------------------------------------------------------
   入力式の問診ステップ（症例９：夏型過敏性肺炎 用）
   ・選択式ではなく、自由記述の質問を入力してもらう。
   ・入力後、模範的な質問例とそれに対する患者の返答を提示し、
     自分の質問と見比べて振り返れるようにする（自動採点はしない）。
--------------------------------------------------------- */
/* ---------------------------------------------------------
   診断名を当てるタイプの症例（mode:"input"）では、
   最終診断に答えるまでタイトルに病名を出さない。
   （症例一覧・進捗バー・各画面ヘッダーで共通利用）
--------------------------------------------------------- */
function caseDisplayLabel(c){
  if(c.mode === "input" && !c._diagnosisAnswer){
    return c.displayTitle || c.title;
  }
  return c.title;
}

/* ---------------------------------------------------------
   師匠からの言葉（エピローグ）
   全9症例（問診・診断・もうひと頑張りまで）を終えたときだけ、
   症例一覧に表示される特別なページ。
   ねぎらいの言葉に加えて、各症例で「決め手」となった問診情報を
   一枚の総まとめ表として渡し、学びに直結させる。
--------------------------------------------------------- */
function allCasesDone(){
  return cases.every(c=>{
    const stepsDone = c._answered && Object.keys(c._answered).length >= c.steps.length;
    const diagDone = c.mode !== "input" || !!c._diagnosisAnswer;
    return stepsDone && diagDone && c._bonusAnswered !== null;
  });
}

    <textarea class="input-field" id="stepInput" rows="3" placeholder="自分の言葉で質問文を書いてみましょう" ${disabledAttr}>${val}</textarea>
    ${revealHtml}
    <div class="btn-row">
      ${answered
        ? `<button class="primary" onclick="afterStep(${si})">次へ</button>`
        : `<button class="primary" onclick="submitInputStep(${si})">聞いてみる</button>`
      }
    </div>
  </div>`;
}

function submitInputStep(si){
  const c = cases[caseIndex];
  if(c._answered[si] !== undefined) return;
  const val = document.getElementById("stepInput").value;
  c._answered[si] = { userInput: val };
  render();
}

function renderWorkup(c){
  const w = c.workup;
  const items = w.items.map(it=>`
    <div class="explainer-item">
      <p class="ex-label">${it.label}</p>
      <p class="ex-text">${it.text}</p>
    </div>`).join("");
  stageEl.innerHTML = `
  <div class="card">
    <h2 class="section-title"><span class="tag">検査・診断への道筋</span>${caseDisplayLabel(c)}</h2>
    <div class="speaker">
      <div class="avatar master">師</div>
      <div class="bubble">問診で得られた手がかりをもとに、実際にはこのような検査が行われた。</div>
    </div>
    <div class="explainer-list" style="margin-top:14px;">${items}</div>
    <div class="feedback" style="margin-top:14px;">
      <span class="label">師匠：診断の考え方</span>
      ${w.conclusion}
    </div>
    <div class="btn-row"><button class="primary" onclick="goTo('diagnosis')">診断名を入力する</button></div>
  </div>`;
}

function renderDiagnosisInput(c){
  const d = c.diagnosisChallenge;
  const answered = c._diagnosisAnswer;
  const val = answered ? answered.input : "";
  const disabledAttr = answered ? "disabled" : "";
  let resultHtml = "";
  if(answered){
    const label = answered.result === "correct" ? "正解です。" : answered.result === "partial" ? "△ 惜しい。" : "不正解。";
    const cls = answered.result === "correct" ? "correct" : "wrong";
    resultHtml = `
      <div class="diagnosis-result ${cls}">
        ${label}正式な診断名は「<strong>${d.correctLabel}</strong>」でした。
        ${answered.result === "partial" ? `<br>${d.partialNote}` : ""}
      </div>`;
  }
  stageEl.innerHTML = `
  <div class="card">
    <h2 class="section-title"><span class="tag">最終診断</span>${caseDisplayLabel(c)}</h2>
    <p style="font-weight:600;">${d.prompt}</p>
    <input type="text" class="input-field" id="diagFinalInput" placeholder="例：〇〇（疾患名）" value="${val}" ${disabledAttr}>
    ${resultHtml}
    <div class="btn-row">
      ${answered
        ? `<button class="primary" onclick="goTo('review')">師匠と振り返る</button>`
        : `<button class="primary" onclick="submitDiagnosisChallenge()">判定する</button>`
      }
    </div>
  </div>`;
}

function submitDiagnosisChallenge(){
  const c = cases[caseIndex];
  if(c._diagnosisAnswer) return;
  const d = c.diagnosisChallenge;
  const val = document.getElementById("diagFinalInput").value;
  const norm = normalizeText(val);
  let result = "wrong";
  if(norm && d.acceptedFull.some(a=>{
    const na = normalizeText(a);
    return norm === na || norm.includes(na);
  })){
    result = "correct";
  } else if(norm && d.acceptedPartial.some(a=>norm.includes(normalizeText(a)))){
    result = "partial";
  }
  c._diagnosisAnswer = { input: val, result };
  render();
}

function goTo(sp){
  pushHistory();
  subPhase = sp;
  render();
}

function startCases(){
  pushHistory();
  phase = "case";
  caseIndex = 0;
  subPhase = "form";
  render();
}

function restart(){
  historyStack = [];
  cases.forEach(c=>{ c._answered = {}; c._bonusAnswered = null; c._diagnosisAnswer = null; });
  phase = "lecture";
  caseIndex = 0;
  subPhase = "form";
  score = 0;
  maxScore = 0;
  render();
}

/* ---------------------------------------------------------
   アクセスカウンター
   ・Claudeのアーティファクトとして開いている場合は window.storage を使用（共有カウンター）
   ・GitHub Pages等、単体のHTMLとして外部公開している場合は
     hits.sh のバッジ型カウンターにフォールバック
     （公開URL固定: https://somekata.github.io/links/medStory/monshin/monshin_simulator.html）
--------------------------------------------------------- */
const COUNTER_KEY = "visits";
const DEPLOYED_URL = "https://somekata.github.io/links/medStory/monshin/monshin_simulator.html";

async function initAccessCounter(){
  const el = document.getElementById("accessCounter");
  if(!el) return;
  try{
    if(window.storage && typeof window.storage.get === "function"){
      let current = 0;
      try{
        const existing = await window.storage.get(COUNTER_KEY, true);
        current = existing && existing.value ? parseInt(existing.value, 10) || 0 : 0;
      } catch(e){
        current = 0;
      }
      current += 1;
      await window.storage.set(COUNTER_KEY, String(current), true);
      el.textContent = `アクセス数：${current.toLocaleString()} 回`;
    } else {
      // ページ自身のURLを使う（別の場所に複製・移転しても自動でそのURL用のカウンターになる）
      const pageUrl = window.location.href.split("#")[0].split("?")[0];
      const targetUrl = (pageUrl.startsWith("http")) ? pageUrl : DEPLOYED_URL;
      // hits.sh はプロトコルを含めず "ドメイン/パス.svg" の形式を取る
      const hitsPath = targetUrl.replace(/^https?:\/\//, "").replace(/\.html$/, "");
      el.innerHTML = "アクセス数：";
      const img = document.createElement("img");
      img.src = `https://hits.sh/${hitsPath}.svg?label=views&color=1f4d3a&labelColor=555555&style=flat`;
      img.alt = "アクセスカウンター";
      img.style.verticalAlign = "middle";
      el.appendChild(img);
    }
  } catch(err){
    el.textContent = "";
  }
}
initAccessCounter();
