<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FunFection バイキンズ® 群体・全種デモ</title>
<style>
  :root{
    --washi:#f5f1e8;
    --ink:#2b2620;
    --accent:#b23a2e;
    --accent-blue:#2e5fa3;
    --gold:#c9a54a;
    --card-bg:#fffdf7;
    --line:#d8cfba;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--washi);
    color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Sans",sans-serif;
    padding:12px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    max-width:480px;
    margin:0 auto;
  }
  h1{font-size:1.05rem;text-align:center;margin:4px 0 2px;}
  .subtitle{text-align:center;font-size:.72rem;color:#6b6150;margin-bottom:10px;}
  .panel{
    background:var(--card-bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:8px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .statrow{display:flex;gap:8px;align-items:center;margin-bottom:5px;font-size:.75rem;}
  .statrow .label{width:74px;flex-shrink:0;color:#6b6150;}
  .bar{flex:1;height:11px;background:#eee5d0;border-radius:6px;overflow:hidden;border:1px solid var(--line);}
  .bar-fill{height:100%;transition:width .2s;}
  .bar-fill.hp{background:linear-gradient(90deg,#4a8f4a,#7cbf7c);}
  .bar-fill.amr{background:linear-gradient(90deg,#9c6b1f,var(--gold));}
  .bar-fill.pop{background:linear-gradient(90deg,#6a4fa0,#c0473b);}
  .bar-fill.gianthp{background:linear-gradient(90deg,var(--accent),#e07a6d);}
  .num{font-family:"JetBrains Mono",monospace;font-size:.68rem;width:56px;text-align:right;color:#4a4030;}

  /* マップ */
  .trail{padding:6px 2px;}
  .node{
    display:flex;align-items:center;gap:12px;padding:9px;border-radius:12px;margin-bottom:2px;
    position:relative;cursor:pointer;border:2px solid var(--line);background:#fffefb;
  }
  .node.locked{opacity:.45;cursor:not-allowed;}
  .node.cleared{border-color:#7cbf7c;background:#f2f8f0;cursor:default;}
  .node.current{border-color:var(--accent-blue);box-shadow:0 0 0 2px var(--accent-blue) inset;}
  .node .icon{
    width:38px;height:38px;border-radius:50%;background:#efe8d6;
    display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;border:1px solid var(--line);
  }
  .node.cleared .icon{background:#dcefd8;}
  .node .info{flex:1;}
  .node .name{font-weight:700;font-size:.82rem;}
  .node .desc{font-size:.65rem;color:#6b6150;margin-top:2px;}
  .connector{width:2px;height:12px;background:var(--line);margin-left:29px;}

  #canvasWrap{
    position:relative;border-radius:12px;overflow:hidden;
    border:1px solid var(--line);background:#e9e2cd;margin-bottom:8px;
  }
  canvas{display:block;width:100%;height:auto;touch-action:none;}

  .weaponRow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px;}
  .wbtn{
    background:#fffefb;border:2px solid var(--accent-blue);border-radius:10px;
    padding:8px 4px;text-align:center;cursor:pointer;min-height:48px;
    display:flex;flex-direction:column;justify-content:center;user-select:none;
  }
  .wbtn .name{font-weight:700;font-size:.9rem;}
  .wbtn .desc{font-size:.6rem;color:#6b6150;}
  .wbtn.active{background:#eaf1ff;box-shadow:0 0 0 2px var(--accent-blue) inset;}
  .wbtn.disabled{opacity:.35;pointer-events:none;}

  .hint{font-size:.68rem;color:#8a7f66;text-align:center;margin:2px 0 8px;}

  .log{
    background:#fbf8f0;border:1px solid var(--line);border-radius:10px;
    padding:6px 10px;height:78px;overflow-y:auto;font-size:.72rem;line-height:1.5;
  }
  .log div{margin-bottom:2px;}
  .log .hit{color:var(--accent);font-weight:700;}
  .log .miss{color:#888;}
  .log .info{color:var(--accent-blue);}
  .log .warn{color:#b2662e;font-weight:700;}
  .log .fire{color:#d9531e;font-weight:700;}

  .zukan{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
  .zukan .chip{font-size:.65rem;padding:3px 7px;border-radius:10px;background:#efe8d6;border:1px solid var(--line);}

  button.primary{
    display:block;margin:10px auto 4px;background:var(--accent-blue);color:#fff;border:none;
    padding:10px 20px;border-radius:20px;font-size:.85rem;cursor:pointer;
  }
  button.reset{
    display:block;margin:12px auto 4px;background:var(--accent);color:#fff;border:none;
    padding:10px 18px;border-radius:20px;font-size:.85rem;cursor:pointer;
  }
  .gameover, .clearScreen{text-align:center;padding:16px;}
  .gameover h2{color:var(--accent);margin:4px 0;}
  .clearScreen h2{color:#4a8f4a;margin:4px 0;}

  footer{
    margin-top:16px;font-size:.6rem;color:#8a7f66;line-height:1.6;
    border-top:1px solid var(--line);padding-top:10px;text-align:center;
  }
  .hidden{display:none;}
</style>
</head>
<body>

<h1>FunFection バイキンズ® 群体・全種デモ</h1>
<div class="subtitle">6種すべてで「小さく増えて、閾値で巨大化」を体験</div>

<div class="panel">
  <div class="statrow">
    <span class="label">プレイヤーHP</span>
    <div class="bar"><div class="bar-fill hp" id="hpBar" style="width:100%"></div></div>
    <span class="num" id="hpNum">100/100</span>
  </div>
  <div class="statrow">
    <span class="label">AMRゲージ</span>
    <div class="bar"><div class="bar-fill amr" id="amrBar" style="width:0%"></div></div>
    <span class="num" id="amrNum">0/100</span>
  </div>
  <div class="statrow">
    <span class="label">制圧ステージ</span>
    <span class="num" id="progressNum" style="width:auto;">0/6</span>
  </div>
</div>

<!-- マップ -->
<div class="panel" id="mapScreen">
  <div style="font-size:.8rem;font-weight:700;margin-bottom:6px;">ステージ選択</div>
  <div class="trail" id="trail"></div>
</div>

<!-- ステージ画面 -->
<div class="panel hidden" id="stageScreen">
  <div class="statrow" id="popRow">
    <span class="label">個体数</span>
    <div class="bar"><div class="bar-fill pop" id="popBar" style="width:0%"></div></div>
    <span class="num" id="popNum" style="width:auto;">0/14</span>
  </div>
  <div class="statrow hidden" id="giantRow">
    <span class="label">巨大化HP</span>
    <div class="bar"><div class="bar-fill gianthp" id="giantHpBar" style="width:100%"></div></div>
    <span class="num" id="giantHpNum">150/150</span>
  </div>
  <div id="canvasWrap">
    <canvas id="gameCanvas" width="360" height="280"></canvas>
  </div>
  <div class="hint" id="hintText"></div>
  <div class="weaponRow" id="weaponRow"></div>
</div>

<div class="panel hidden" id="logPanel">
  <div class="log" id="log"></div>
</div>

<div class="panel">
  <div style="font-size:.75rem;color:#6b6150;margin-bottom:4px;">図鑑（同定済みフォーム）</div>
  <div class="zukan" id="zukan"></div>
</div>

<div id="victoryArea"></div>
<div id="gameoverArea"></div>
<div id="clearArea"></div>
<button class="reset" onclick="resetRun()">はじめから</button>

<footer>
本テキスト・本プログラムは AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。<br>
二次利用・再配布は自己責任のもとで可能です。その際、本注記の保持を推奨します。
</footer>

  pixelSize = pixelSize || 4;
  ctx.imageSmoothingEnabled = false;
  for (let row = 0; row < PIXEL_DATA_chara15.length; row++) {
    const cols = PIXEL_DATA_chara15[row];
    for (let col = 0; col < cols.length; col++) {
      const idx = cols[col];
      if (idx === -1) continue; // 透明ピクセル
      ctx.fillStyle = PIXEL_PALETTE_chara15[idx];
      ctx.fillRect(x + col * pixelSize, y + row * pixelSize, pixelSize, pixelSize);
    }
  }
}

const SPRITE_CACHE = {};
function getSprite(charaKey){
  if(SPRITE_CACHE[charaKey]) return SPRITE_CACHE[charaKey];
  const size = CHARA_SIZE[charaKey];
  const off = document.createElement('canvas');
  off.width = size.w; off.height = size.h;
  const octx = off.getContext('2d');
  const fn = window['drawPixelSprite_' + charaKey];
  if(fn) fn(octx, 0, 0, 1);
  SPRITE_CACHE[charaKey] = off;
  return off;
}

function renderTrail(){
  const trail = document.getElementById('trail');

  STAGES.forEach((s,i)=>{
    if(i>0){
      const conn = document.createElement('div');
      conn.className = 'connector';
      trail.appendChild(conn);
    }
    const el = document.createElement('div');
    let cls = 'node';
    let status = '⚔️';
    if(run.cleared.has(s.id)){ cls += ' cleared'; status = '✅'; }
    else if(i === run.currentNodeIndex){ cls += ' current'; status = '⚔️'; }
    else if(i > run.currentNodeIndex){ cls += ' locked'; status = '🔒'; }
    el.className = cls;
    el.innerHTML = `
      <div class="icon">${s.icon}</div>
      <div class="info">
        <div class="name">${status} ${s.name}</div>
        <div class="desc">有効：${s.smallDrugs.join(' / ')}　特殊攻撃：${s.breathEmoji} ${s.breathName}</div>

    if(i === run.currentNodeIndex && !run.cleared.has(s.id)){
      el.onclick = ()=> startStage(s);
    }
    trail.appendChild(el);
  });
}

function refreshHand(){
  const fixed = stage.def.smallDrugs;
  const rest = DRUG_KEYS.filter(k => !fixed.includes(k));
  const need = 3 - fixed.length;
  const shuffledRest = [...rest].sort(()=>Math.random()-0.5).slice(0, need);
  stage.hand = [...fixed, ...shuffledRest].sort(()=>Math.random()-0.5);
  if(!stage.hand.includes(stage.currentWeapon)){
    stage.currentWeapon = stage.hand[0];
  }
  stage.handTimer = 0;
  renderWeapons();
}

  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

    if(n <= SAFE_LEVEL && stage.containmentTime > 0){
      const remain = Math.max(0, Math.ceil((CONTAINMENT_GOAL - stage.containmentTime)/1000));
      document.getElementById('popNum').textContent = `${n}/${THRESHOLD}（封じ込めまで${remain}秒）`;
    } else {
      document.getElementById('popNum').textContent = `${n}/${THRESHOLD}`;
    }
  }
}

function renderWeapons(){
  const row = document.getElementById('weaponRow');
  row.innerHTML = '';
  if(!stage) return;
  stage.hand.forEach(key=>{
    const d = DRUGS[key];
    const btn = document.createElement('div');
    btn.className = 'wbtn' + (key===stage.currentWeapon?' active':'');
    btn.innerHTML = `<div class="name">${d.name}</div><div class="desc">${d.desc}${d.broad?'（広域）':''}</div>`;
    btn.onclick = ()=>{ stage.currentWeapon = key; renderWeapons(); };
    row.appendChild(btn);
  });
}

function renderZukan(){
  const el = document.getElementById('zukan');
  el.innerHTML = '';
  if(run.zukan.size===0){
    el.innerHTML = '<span style="font-size:.7rem;color:#aaa;">まだ図鑑に登録されたキャラはいません</span>';
    return;
  }
  run.zukan.forEach(key=>{
    const [stageId, phenoId] = key.split('::');
    const s = STAGES.find(x=>x.id===stageId);
    const p = s.phenotypes.find(x=>x.id===phenoId);
    const chip = document.createElement('span');
    chip.className='chip';
    chip.textContent = `${p.name}（${p.phenotype||'非定型'}）`;
    el.appendChild(chip);
  });
}

/* ==================== スポーン・成長ロジック ==================== */
function spawnSmall(){
  const r = 8;
  stage.population.push({
    x: r + Math.random()*(CW-2*r),
    y: r + Math.random()*(CH-2*r),
    vx: (Math.random()-0.5)*18,
    vy: (Math.random()-0.5)*18,
    r,
  });
}

function transformIntoGiant(){
  stage.population = [];
  const s = stage.def;
  const forceR = run.amr >= 100;
  const pool = forceR ? s.phenotypes.filter(p=>p.resistant) : s.phenotypes;
  const candidates = pool.length ? pool : s.phenotypes;
  const def = candidates[Math.floor(Math.random()*candidates.length)];
  if(forceR) run.amr = 40;
  // 巨大化前にどれだけ間引いたかでHPが変わる（放置するほど手強く育つ）
  const baseHp = 150;
  const reduction = stage.totalKills * 5;
  const maxHp = Math.max(60, baseHp - reduction);
  stage.giant = {
    def, hp:maxHp, maxHp,
    fireTimer:0, fireInterval:3500,
    flashUntil:0,
  };
  if(reduction > 0){
    log(`<span class="warn">個体数が閾値に達した！${s.breathEmoji} 巨大化した…！（事前に${stage.totalKills}体間引いていたのでHPは${maxHp}に抑えられている）</span>`);
  } else {
    log(`<span class="warn">個体数が閾値に達した！${s.breathEmoji} 巨大化した…！（間引きゼロのため最大HP${maxHp}）</span>`);
  }
  renderStats();
}

/* ==================== 攻撃ロジック ==================== */
const NARROW_COOLDOWN_MS = 500;
const BROAD_COOLDOWN_MS = 1050;
function cooldownFor(key){
  return DRUGS[key].broad ? BROAD_COOLDOWN_MS : NARROW_COOLDOWN_MS;
}

function killSmall(index){
  if(!stage || stage.giant) return;
  if(stage.actionCooldown > 0) return;
  const item = stage.population[index];
  if(!item) return;
  const key = stage.currentWeapon;
  const s = stage.def;
  stage.actionCooldown = cooldownFor(key);
  if(s.smallDrugs.includes(key)){
    stage.population.splice(index,1);
    stage.totalKills++;
    run.amr = Math.min(100, run.amr + 2);
    // 倒すたびに生き残った個体の増殖が加速する（間引くほど次の出現が早まる）
    stage.spawnInterval = Math.max(420, stage.spawnInterval - 90);
    log(`<span class="hit">${DRUGS[key].name} 命中！ 小さな個体を1体倒した（通算${stage.totalKills}体／次の出現間隔${stage.spawnInterval}ms）</span>`);
  } else {
    log(`<span class="miss">${DRUGS[key].name} は効かない…${s.smallDrugs.join('か')}を選ぼう</span>`);
  }
  renderStats();
}

function attackGiant(){
  if(!stage || !stage.giant) return;
  if(stage.actionCooldown > 0) return;
  const g = stage.giant;
  const key = stage.currentWeapon;
  const drug = DRUGS[key];
  const result = g.def.eff[key];
  let hit = false;
  if(result==='O'){ hit = true; }
  else if(result==='D'){ hit = Math.random() < 0.5; }
  if(drug.broad) run.amr = Math.min(100, run.amr + 8);
  stage.actionCooldown = cooldownFor(key);

  if(hit){
    const dmg = 45;
    g.hp = Math.max(0, g.hp - dmg);
    log(`<span class="hit">${drug.name} 命中！ ${dmg}ダメージ</span>`);
  } else {
    log(`<span class="miss">${drug.name} は効かなかった…</span>`);
  }
  renderStats();
  if(g.hp<=0) onGiantDefeated();
}

function onGiantDefeated(){
  const s = stage.def;
  const g = stage.giant;
  run.zukan.add(s.id + '::' + g.def.id);
  const note = g.def.note;
  const name = g.def.name, pheno = g.def.phenotype||'非定型';
  completeStage(s, `${name}（${pheno}）を撃破した。${note}`, `最後の${name}（${pheno}）を撃破し、6種すべてを制圧した。${note}`);
}

function onContainmentSuccess(){
  const s = stage.def;
  log(`<span class="hit">個体数を${SAFE_LEVEL}以下に${Math.round(CONTAINMENT_GOAL/1000)}秒間抑え続け、巨大化させずに封じ込め成功！</span>`);
  completeStage(s,
    `巨大化させる前に封じ込めに成功した。感受性・耐性のどちらだったかは分からずじまいだが、被害は最小限に抑えられた。`,
    `最後のステージも、巨大化させる前に封じ込めに成功した。`);
}

function completeStage(s, victoryNote, clearNote){
  run.cleared.add(s.id);
  run.currentNodeIndex = Math.min(STAGES.length, run.currentNodeIndex + 1);
  run.hp = Math.min(run.maxHp, run.hp + 15);
  const stageName = s.name;
  if(rafId) cancelAnimationFrame(rafId);
  stage = null;
  renderStats();

  document.getElementById('stageScreen').classList.add('hidden');
  document.getElementById('logPanel').classList.add('hidden');

  const allCleared = run.cleared.size >= STAGES.length;
  if(allCleared){
    document.getElementById('clearArea').innerHTML = `
      <div class="panel clearScreen">
        <h2>全ステージ制圧！</h2>
        <p>${clearNote}</p>
      </div>`;
    document.getElementById('mapScreen').classList.remove('hidden');
    renderTrail();
    renderZukan();
  } else {
    document.getElementById('victoryArea').innerHTML = `
      <div class="panel">
        <div style="font-weight:700;color:#4a8f4a;margin-bottom:4px;">${stageName} 制圧！</div>
        <div style="font-size:.78rem;">${victoryNote}</div>
        <div style="font-size:.72rem;color:#6b6150;margin-top:4px;">HPが少し回復した（+15）。</div>
        <button class="primary" onclick="showMap()">次のステージへ</button>
      </div>`;
  }
}

function endGame(){
  document.getElementById('stageScreen').classList.add('hidden');
  document.getElementById('logPanel').classList.add('hidden');
  if(rafId) cancelAnimationFrame(rafId);
  document.getElementById('gameoverArea').innerHTML = `
    <div class="panel gameover">
      <h2>力尽きた…</h2>
      <p>制圧ステージ：${run.cleared.size}/${STAGES.length}</p>
      <p style="font-size:.72rem;color:#6b6150;">個体を放置すると数が増え、閾値を超えると巨大化して特殊攻撃を放ちます。早めの間引きがカギです。</p>
    </div>`;
}

/* ==================== メインループ ==================== */
function loop(ts){
  const dt = Math.min(ts - lastTs, 100);
  lastTs = ts;
  if(stage){
    update(dt);
    draw();
    rafId = requestAnimationFrame(loop);
  }
}

function update(dt){
  stage.handTimer += dt;
  if(stage.handTimer >= stage.handInterval) refreshHand();
  if(stage.actionCooldown > 0) stage.actionCooldown = Math.max(0, stage.actionCooldown - dt);

  if(!stage.giant){
    stage.spawnTimer += dt;
    if(stage.spawnTimer >= stage.spawnInterval && stage.population.length < THRESHOLD + 4){
      stage.spawnTimer = 0;
      spawnSmall();
    }
    stage.population.forEach(p=>{
      p.x += p.vx * dt/1000;
      p.y += p.vy * dt/1000;
      if(p.x < p.r || p.x > CW-p.r) p.vx *= -1;
      if(p.y < p.r || p.y > CH-p.r) p.vy *= -1;
    });
    stage.biteTimer += dt;
    if(stage.biteTimer >= 2500){
      stage.biteTimer = 0;
      const n = stage.population.length;
      if(n > 0){
        const dmg = Math.min(5, Math.ceil(n/4));
        run.hp = Math.max(0, run.hp - dmg);
        log(`小さな個体たちにじわじわとダメージを受けた… -${dmg}HP`);
        renderStats();
        if(run.hp<=0){ endGame(); return; }
      }
    }
    if(stage.population.length >= THRESHOLD){
      transformIntoGiant();
      return;
    }
    // 封じ込め判定：個体数を一定以下に保ち続けられれば巨大化前にクリア
    if(stage.population.length <= SAFE_LEVEL){
      stage.containmentTime += dt;
      if(stage.containmentTime >= CONTAINMENT_GOAL){
        onContainmentSuccess();
        return;
      }
    } else {
      stage.containmentTime = 0;
    }
    renderStats();
  } else {
    const g = stage.giant;
    g.fireTimer += dt;
    if(g.fireTimer >= g.fireInterval){
      g.fireTimer = 0;
      const dmg = 22;
      run.hp = Math.max(0, run.hp - dmg);
      g.flashUntil = performance.now() + 400;
      log(`<span class="fire">${stage.def.breathEmoji} ${stage.def.breathName}！ -${dmg}HP</span>`);
      renderStats();
      if(run.hp<=0){ endGame(); return; }
    }
  }
}

/* ==================== 描画 ==================== */
function draw(){
  ctx.clearRect(0,0,CW,CH);
  ctx.fillStyle = '#efe8d6';
  ctx.fillRect(0,0,CW,CH);

  const s = stage.def;
  if(!stage.giant){
    const sprite = getSprite(s.chara);
    const smallH = 26;
    const smallScale = smallH / sprite.height;
    const smallW = sprite.width * smallScale;
    ctx.imageSmoothingEnabled = false;
    stage.population.forEach(p=>{
      ctx.drawImage(sprite, p.x - smallW/2, p.y - smallH/2, smallW, smallH);
    });
  } else {
    const g = stage.giant;
    const cx = CW/2, cy = CH/2 + 10;
    const flashing = performance.now() < g.flashUntil;
    if(flashing){
      ctx.beginPath();
      ctx.fillStyle = s.breathColor;
      ctx.arc(cx, cy-20, 140, 0, Math.PI*2);
      ctx.fill();
    }
    const sprite = getSprite(s.chara);
    const targetH = 190;
    const scale = targetH / sprite.height;
    const w = sprite.width * scale;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(sprite, cx - w/2, cy - targetH/2, w, targetH);

    ctx.beginPath();
    ctx.fillStyle = g.def.resistant ? '#e33a2e' : '#8fc98f';
    ctx.arc(cx + w/2 - 10, cy - targetH/2 + 14, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

    if(g.def.plasmid){
      ctx.beginPath();
      ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 4;
      ctx.arc(cx - w/2 + 12, cy + targetH/2 - 14, 12, 0, Math.PI*2);
      ctx.stroke();
    }

    ctx.fillStyle = '#3a3428';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`${g.def.name}（${g.def.phenotype||'非定型'}）`, cx, cy - targetH/2 - 10);
  }

  if(stage.actionCooldown > 0){
    ctx.fillStyle = 'rgba(43,38,32,0.12)';
    ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle = 'rgba(43,38,32,0.55)';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('⏳ クールタイム中…', CW/2, 18);
  }
}

/* ==================== 入力 ==================== */
function getCanvasPos(evt){
  const rect = canvas.getBoundingClientRect();
  const scaleX = CW / rect.width;
  const scaleY = CH / rect.height;
  const cx = (evt.clientX !== undefined ? evt.clientX : evt.touches[0].clientX) - rect.left;
  const cy = (evt.clientY !== undefined ? evt.clientY : evt.touches[0].clientY) - rect.top;
  return { x: cx*scaleX, y: cy*scaleY };
}

function onCanvasClick(evt){
  if(!stage) return;
  if(stage.giant){ attackGiant(); return; }
  const pos = getCanvasPos(evt);
  let nearestIdx = -1, nearestDist = 22;
  stage.population.forEach((p,i)=>{
    const d = Math.hypot(p.x-pos.x, p.y-pos.y);
    if(d < nearestDist){ nearestIdx = i; nearestDist = d; }
  });
  if(nearestIdx >= 0) killSmall(nearestIdx);
}

/* ==================== 初期化 ==================== */
function initGame(){
  const c = document.getElementById('gameCanvas');
  c.addEventListener('click', onCanvasClick);
  c.addEventListener('touchstart', function(e){ e.preventDefault(); onCanvasClick(e); }, {passive:false});
  resetRun();
}
initGame();
</script>
