<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>これっきり細菌楽</title>
<style>
/* =========================================================================
   0. リセット & ルート変数
   ========================================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; }

:root{
  /* --- 培地/検体カードをモチーフにした配色 --- */
  --paper:      #F5F1E6;
  --paper-raise:#FBF8F1;
  --ink:        #232219;
  --ink-soft:   #5B584C;
  --ink-faint:  #8C8874;
  --line:       #CBC0A4;
  --line-soft:  #E1D9C4;
  --gram-pos:   #6A3E82;   /* クリスタルバイオレット(Gram陽性) */
  --gram-pos-bg:#EEE5F3;
  --gram-neg:   #B23A48;   /* サフラニン(Gram陰性) */
  --gram-neg-bg:#F7E4E4;
  --agar:       #5E7A46;   /* 培地グリーン: 機能色/結論ボックス */
  --agar-bg:    #E7EEDD;
  --warn:       #A85B22;
  --warn-bg:    #F5E4D2;
  --shadow:     0 2px 10px rgba(35,34,25,0.14);
  --radius-s:   3px;
  --radius-m:   6px;
  --font-serif: "Yu Mincho","YuMincho","Hiragino Mincho ProN","游明朝",serif;
  --font-sans:  "Yu Gothic","YuGothic","Hiragino Kaku Gothic ProN","游ゴシック体","Noto Sans JP",sans-serif;
  --font-mono:  "Courier New", ui-monospace, monospace;
}
[data-theme="dark"]{
  --paper:      #16181A;
  --paper-raise:#1D2023;
  --ink:        #E9E4D6;
  --ink-soft:   #B4AE9B;
  --ink-faint:  #837E6C;
  --line:       #3C4038;
  --line-soft:  #2A2D27;
  --gram-pos:   #B98FD4;
  --gram-pos-bg:#2E2436;
  --gram-neg:   #E08A93;
  --gram-neg-bg:#3A2224;
  --agar:       #9CC17B;
  --agar-bg:    #29331F;
  --warn:       #E0A165;
  --warn-bg:    #3A2C1B;
  --shadow:     0 2px 14px rgba(0,0,0,0.5);
}

body{
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--line-soft);
  font-size: 16px;
  line-height: 1.8;
}
#app.fs-small  { font-size: 14px; }
#app.fs-medium { font-size: 16px; }
#app.fs-large  { font-size: 19px; }

a { color: inherit; }
button{
  font-family: inherit; font-size: 0.9em; cursor: pointer;
  background: var(--paper-raise); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius-s);
  padding: 6px 10px; transition: background .15s, border-color .15s;
}
button:hover{ border-color: var(--ink-faint); }
button:focus-visible, [tabindex]:focus-visible, a:focus-visible{
  outline: 2px solid var(--agar); outline-offset: 2px;
}
button.primary{ background: var(--agar); color:#fff; border-color: var(--agar); }
button.ghost{ background: transparent; border-color: transparent; }
input[type="text"], input[type="search"], textarea, select{
  font-family: inherit; font-size: 0.95em; color: var(--ink);
  background: var(--paper-raise); border: 1px solid var(--line);
  border-radius: var(--radius-s); padding: 6px 8px;
}
h1,h2,h3,h4{ font-family: var(--font-serif); margin: 0 0 .5em; }

/* =========================================================================
   1. 全体レイアウト
   ========================================================================= */
#app{
  height: 100vh; display: grid;
  grid-template-columns: 300px 1fr;
  grid-template-rows: 58px 1fr;
  grid-template-areas: "topbar topbar" "sidebar main";
  background: var(--line-soft);
}
#topbar{
  grid-area: topbar; display:flex; align-items:center; gap:14px;
  padding: 0 16px; background: var(--paper); border-bottom: 1px solid var(--line);
  z-index: 30;
}
#topbar .brand{ font-family: var(--font-serif); font-size:1.15em; font-weight:bold; white-space:nowrap;}
#topbar .pagecount{
  font-family: var(--font-mono); font-size:.85em; color: var(--ink-soft);
  border:1px solid var(--line); border-radius: var(--radius-s); padding:3px 8px; white-space:nowrap;
}
#topbar .search-wrap{ flex:1; max-width:360px; position:relative; }
#topbar .search-wrap input{ width:100%; }
#topbar .spacer{ flex:1; }
#topbar .topbtns{ display:flex; gap:6px; align-items:center; }
#menuToggle{ display:none; }

#sidebar{
  grid-area: sidebar; background: var(--paper); border-right:1px solid var(--line);
  overflow-y:auto; display:flex; flex-direction:column;
}
#sidebar nav.tabs{ display:flex; border-bottom:1px solid var(--line); flex-wrap:wrap; }
#sidebar nav.tabs button{
  flex:1; border:none; border-radius:0; background:transparent; padding:10px 4px; font-size:.8em;
  border-bottom: 2px solid transparent;
}
#sidebar nav.tabs button.active{ border-bottom-color: var(--agar); color: var(--agar); font-weight:bold; }
#sidebar .tabpanel{ display:none; padding: 12px; }
#sidebar .tabpanel.active{ display:block; }

#main{
  grid-area: main; overflow-y:auto; display:flex; flex-direction:column; align-items:center;
  padding: 26px 16px 60px;
}

/* =========================================================================
   2. サイドバー: 目次 / 一覧 / 検索 / お気に入り / 復習
   ========================================================================= */
.toc-chapter{ margin-bottom: 6px; }
.toc-chapter > summary{
  cursor:pointer; font-weight:bold; padding:6px 4px; list-style:none; display:flex; justify-content:space-between;
}
.toc-chapter > summary::-webkit-details-marker{ display:none; }
.toc-chapter > summary::after{ content:"▾"; color:var(--ink-faint); }
.toc-chapter[open] > summary::after{ content:"▴"; }
.toc-page-item, .list-item, .fav-item{
  display:block; width:100%; text-align:left; padding:8px 8px; margin:3px 0;
  background: var(--paper-raise); border:1px solid var(--line-soft); border-radius: var(--radius-s);
}
.toc-page-item:hover, .list-item:hover, .fav-item:hover{ border-color: var(--ink-faint); }
.toc-page-item .num, .list-item .num{
  font-family: var(--font-mono); font-size:.75em; color: var(--ink-faint); margin-right:6px;
}
.toc-page-item.unread::before{ content:"○ "; color: var(--gram-neg); }
.toc-page-item.read::before{ content:"● "; color: var(--agar); }
.list-item .concl, .fav-item .concl{ font-size:.82em; color: var(--ink-soft); margin-top:3px; }
.list-filter{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.list-filter select, .list-filter input{ width:100%; }
.empty-note{ color: var(--ink-faint); font-size:.85em; padding: 10px 4px; }
.continue-card{
  background: var(--agar-bg); border:1px solid var(--agar); border-radius: var(--radius-m);
  padding: 12px 14px; margin-bottom:18px;
}
.continue-card .label{ font-size:.75em; color: var(--agar); font-weight:bold; margin-bottom:4px; }
.continue-card .title{ font-weight:bold; margin-bottom:8px; }
.progress-item{ margin-bottom:10px; }
.progress-item .row{ display:flex; justify-content:space-between; font-size:.82em; margin-bottom:3px; }
.progress-item .row .pct{ font-family: var(--font-mono); color: var(--ink-soft); }
.progress-bar-track{ background: var(--line-soft); border-radius:4px; height:7px; overflow:hidden; }
.progress-bar-fill{ background: var(--agar); height:100%; border-radius:4px; transition: width .3s; }
.recommend-item{ display:block; width:100%; text-align:left; padding:9px 10px; margin:5px 0;
  background: var(--paper-raise); border:1px solid var(--line-soft); border-radius: var(--radius-s); }
.recommend-item:hover{ border-color: var(--ink-faint); }
.recommend-item .reason{ font-size:.72em; color: var(--agar); font-weight:bold; margin-bottom:2px; }
.recommend-item .concl{ font-size:.8em; color: var(--ink-soft); margin-top:3px; }
.settings-section{ margin-bottom:20px; padding-bottom:16px; border-bottom:1px solid var(--line-soft); }
.settings-section:last-child{ border-bottom:none; }
.settings-section h4{ font-size:.85em; color: var(--ink-faint); margin-bottom:8px; }
.settings-section p.desc{ font-size:.82em; color: var(--ink-soft); margin:0 0 8px; }
.settings-btnrow{ display:flex; gap:8px; flex-wrap:wrap; }
.settings-stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; font-size:.85em; }
.settings-stat-grid .num{ font-family: var(--font-mono); font-weight:bold; color: var(--agar); }
.settings-status{ font-size:.82em; margin-top:8px; padding:6px 8px; border-radius: var(--radius-s); }
.settings-status.ok{ background: var(--agar-bg); color: var(--agar); }
.settings-status.ng{ background: var(--gram-neg-bg); color: var(--gram-neg); }
#importFileInput{ display:none; }

.search-result{ border-bottom:1px dashed var(--line-soft); padding:8px 2px; cursor:pointer; }
.search-result:hover{ background: var(--paper-raise); }
.search-result .title{ font-weight:bold; }
.search-result .hitloc{ font-size:.78em; color: var(--agar); }
mark.hit{ background: var(--gram-pos-bg); color: var(--gram-pos); padding:0 2px; border-radius:2px; }

/* =========================================================================
   3. A4ページ本体
   ========================================================================= */
.page-shell{ width:100%; max-width: 800px; display:flex; flex-direction:column; gap: 14px; }
.a4-page{
  background: var(--paper-raise); border:1px solid var(--line);
  border-radius: var(--radius-m); box-shadow: var(--shadow);
  padding: 40px 46px 30px; min-height: 1050px; position:relative;
}
.page-meta-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 4px; }
.page-chapter{ font-size:.8em; color: var(--ink-faint); letter-spacing:.03em; }
.page-idlabel{ font-family: var(--font-mono); font-size:.75em; color: var(--ink-faint); }
.page-title{ font-size:1.6em; border-bottom: 2px solid var(--ink); padding-bottom:8px; margin-bottom:16px; }
.page-actions{ position:absolute; top:34px; right:40px; display:flex; gap:4px; }
.page-actions button{ padding:4px 8px; font-size:1em; }
.page-actions button.on{ background: var(--gram-pos-bg); border-color: var(--gram-pos); color: var(--gram-pos); }

.conclusion-box{
  background: var(--agar-bg); border-left: 4px solid var(--agar);
  border-radius: var(--radius-s); padding: 10px 14px; margin: 0 0 22px;
}
.conclusion-box .label{ font-size:.75em; color: var(--agar); font-weight:bold; margin-bottom:2px; }
.conclusion-box .text{ font-weight: bold; }

.page-body{ font-size:1em; }
.page-body p{ margin: 0 0 1em; }
.page-body i{ font-style: italic; }

.term{ color: var(--agar); border-bottom: 1px dotted var(--agar); cursor:pointer; }
.bac{ color: var(--gram-pos); border-bottom: 1px dotted var(--gram-pos); cursor:pointer; font-style: italic; }
.bac.noitalic{ font-style:normal; }
.drug{ color: var(--gram-neg); border-bottom: 1px dotted var(--gram-neg); cursor:pointer; }

.compare-box, .warn-box, .aside-box{
  border:1px solid var(--line); border-radius: var(--radius-s); padding:12px 14px; margin: 16px 0;
}
.compare-box{ background: var(--paper); }
.compare-box h4{ font-size:.95em; }
.warn-box{ background: var(--warn-bg); border-color: var(--warn); }
.warn-box h4{ color: var(--warn); font-size:.95em; }
.aside-box{ background: var(--paper); border-left:3px solid var(--ink-faint); font-size:.92em; }

table.summary-table{ width:100%; border-collapse: collapse; margin: 16px 0; font-size:.92em; }
table.summary-table th, table.summary-table td{
  border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top;
}
table.summary-table th{ background: var(--paper); }

.fig-box{ margin: 18px 0; text-align:center; }
.fig-box svg{ max-width:100%; background: var(--paper); border:1px solid var(--line-soft); border-radius: var(--radius-s); cursor: zoom-in; }
.fig-caption{ font-size:.82em; color: var(--ink-soft); margin-top:6px; }

.widget-box{
  border:1px solid var(--line); border-radius: var(--radius-m); padding:16px; margin: 18px 0; background: var(--paper);
}
.widget-box h4{ font-size:.95em; margin-bottom:10px; }
.widget-steps{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
.widget-steps button{ font-size:.85em; }
.widget-steps button.done{ background: var(--agar-bg); border-color: var(--agar); }
.widget-steps button.current{ background: var(--agar); color:#fff; }
.widget-stage{ display:flex; gap:20px; align-items:center; flex-wrap:wrap; }
.widget-info{ flex:1; min-width:220px; font-size:.9em; background: var(--paper-raise); border:1px solid var(--line-soft); border-radius: var(--radius-s); padding:10px 12px; min-height:70px; }
.gram-dish{ width:120px; height:120px; border-radius:50%; border:3px solid var(--line); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition: background .3s; }
.mech-svg-wrap{ display:flex; gap:18px; flex-wrap:wrap; align-items:flex-start; }
.mech-svg-wrap svg{ background: var(--paper-raise); border:1px solid var(--line-soft); border-radius: var(--radius-s); }
.mech-target{ cursor:pointer; }
.mech-target:hover{ opacity:.75; }

.memo-box{ margin-top: 18px; }
.memo-box textarea{ width:100%; min-height:70px; resize:vertical; }
.memo-saved{ font-size:.75em; color: var(--agar); margin-left:8px; }

.quiz-block{ border:1px solid var(--line); border-radius: var(--radius-m); padding:16px; margin:18px 0; background: var(--paper); }
.quiz-block .q-vignette{ font-size:.92em; color: var(--ink-soft); margin-bottom:10px; }
.quiz-block .q-prompt{ font-weight:bold; margin-bottom:10px; }
.quiz-choices{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.quiz-choice{ text-align:left; padding:8px 10px; }
.quiz-choice.correct{ background: var(--agar-bg); border-color: var(--agar); }
.quiz-choice.incorrect{ background: var(--gram-neg-bg); border-color: var(--gram-neg); }
.quiz-choice.disabled{ pointer-events:none; opacity:.85; }
.quiz-feedback{ font-size:.9em; margin-top:8px; }
.quiz-feedback .verdict{ font-weight:bold; }
.quiz-feedback .verdict.ok{ color: var(--agar); }
.quiz-feedback .verdict.ng{ color: var(--gram-neg); }
.quiz-explanations{ margin-top:6px; font-size:.88em; color: var(--ink-soft); }
.quiz-perspectives{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:.88em; }
.quiz-perspectives ul{ margin:6px 0 0; padding-left: 1.2em; }
.quiz-actions{ margin-top:10px; display:flex; gap:8px; }

.related-block{ display:flex; gap:18px; flex-wrap:wrap; margin-top:26px; padding-top:14px; border-top:1px solid var(--line-soft); font-size:.88em; }
.related-col strong{ display:block; font-size:.8em; color: var(--ink-faint); margin-bottom:4px; }
.related-col a{ display:block; color: var(--agar); cursor:pointer; margin-bottom:2px; }

.page-footer-note{
  margin-top: 28px; padding-top: 10px; border-top: 1px solid var(--line-soft);
  font-size: .68em; color: var(--ink-faint); line-height:1.6;
}

.nav-controls{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.nav-controls .pageno-jump{ display:flex; align-items:center; gap:6px; font-size:.85em; color: var(--ink-soft); }
.nav-controls .pageno-jump select{ font-family: var(--font-mono); }

/* =========================================================================
   4. モーダル(用語/菌カード/薬剤カード/図拡大)
   ========================================================================= */
#modalRoot{ position:fixed; inset:0; z-index:150; display:none; }
#modalRoot.open{ display:flex; align-items:flex-start; justify-content:center; padding: 6vh 16px; background: rgba(20,18,10,0.45); overflow-y:auto; }
.modal-card{
  background: var(--paper-raise); border-radius: var(--radius-m); box-shadow: var(--shadow);
  max-width: 520px; width:100%; padding: 24px 26px; position:relative; border:1px solid var(--line);
}
.modal-card .close-btn{ position:absolute; top:10px; right:10px; }
.modal-kicker{ font-size:.72em; color: var(--ink-faint); text-transform:none; margin-bottom:2px; }
.modal-title{ font-size:1.3em; margin-bottom:10px; }
.modal-title.bac{ font-style: italic; color: var(--gram-pos); }
.modal-title.drug{ color: var(--gram-neg); font-style: normal; }
.modal-section{ margin-bottom:14px; }
.modal-section h5{ font-size:.78em; color: var(--ink-faint); margin:0 0 5px; }
.modal-section ul{ margin:0; padding-left:1.2em; }
.chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ background: var(--paper); border:1px solid var(--line); border-radius: 14px; padding:2px 10px; font-size:.82em; }
.modal-links a{ display:inline-block; margin-right:12px; color: var(--agar); cursor:pointer; }
.figure-modal-img{ text-align:center; }
.figure-modal-img svg{ max-width:100%; }

/* --- 細菌推理チャレンジ（自動採点モード） --- */
#challengeRoot{ position:fixed; inset:0; z-index:120; display:none; }
#challengeRoot.open{ display:flex; align-items:flex-start; justify-content:center; padding: 5vh 16px; background: rgba(20,18,10,0.55); overflow-y:auto; }
.challenge-card{
  background: var(--paper-raise); border-radius: var(--radius-m); box-shadow: var(--shadow);
  max-width: 680px; width:100%; padding: 28px 30px; position:relative; border:1px solid var(--line);
}
.challenge-card .close-btn{ position:absolute; top:12px; right:12px; }
.challenge-progress-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.challenge-progress-row .qcount{ font-family: var(--font-mono); font-size:.85em; color: var(--ink-soft); }
.level-badge{ font-size:.72em; font-weight:bold; padding:2px 10px; border-radius:12px; }
.level-badge.lv1{ background: var(--agar-bg); color: var(--agar); }
.level-badge.lv2{ background: var(--warn-bg); color: var(--warn); }
.level-badge.lv3{ background: var(--gram-neg-bg); color: var(--gram-neg); }
.challenge-progress-track{ background: var(--line-soft); border-radius:4px; height:6px; overflow:hidden; margin-bottom:20px; }
.challenge-progress-fill{ background: var(--agar); height:100%; transition: width .3s; }
.challenge-summary-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:10px; margin: 16px 0 20px; }
.challenge-summary-cell{ text-align:center; background: var(--paper); border:1px solid var(--line-soft); border-radius: var(--radius-s); padding:12px 6px; }
.challenge-summary-cell .big{ font-family: var(--font-mono); font-size:1.4em; font-weight:bold; color: var(--agar); }
.challenge-summary-cell .lbl{ font-size:.72em; color: var(--ink-faint); margin-top:2px; }
.challenge-weakpoint{ background: var(--warn-bg); border-left:4px solid var(--warn); border-radius: var(--radius-s); padding:10px 14px; margin-bottom:16px; font-size:.9em; }
.challenge-review-list a{ display:block; color: var(--agar); cursor:pointer; padding:6px 0; border-bottom:1px dashed var(--line-soft); }

/* --- 菌鑑別ミニゲーム --- */
#gameRoot{ position:fixed; inset:0; z-index:120; display:none; }
#gameRoot.open{ display:flex; align-items:flex-start; justify-content:center; padding: 5vh 16px; background: rgba(20,18,10,0.55); overflow-y:auto; }
.game-card{
  background: var(--paper-raise); border-radius: var(--radius-m); box-shadow: var(--shadow);
  max-width: 720px; width:100%; padding: 28px 30px; position:relative; border:1px solid var(--line);
}
.game-card .close-btn{ position:absolute; top:12px; right:12px; }
.game-count-banner{
  text-align:center; background: var(--agar-bg); border-radius: var(--radius-s); padding:10px;
  margin-bottom:18px; font-size:1.05em;
}
.game-count-banner .num{ font-family: var(--font-mono); font-weight:bold; color: var(--agar); font-size:1.3em; }
.game-axis{ margin-bottom:14px; }
.game-axis .axis-label{ font-size:.8em; color: var(--ink-faint); margin-bottom:5px; }
.game-axis .axis-btns{ display:flex; flex-wrap:wrap; gap:6px; }
.game-axis button{ font-size:.85em; }
.game-axis button.active{ background: var(--agar); color:#fff; border-color: var(--agar); }
.game-candidates{ margin-top:18px; padding-top:14px; border-top:1px solid var(--line-soft); }
.game-candidates h4{ font-size:.85em; color: var(--ink-faint); margin-bottom:8px; }
.game-candidate-chip{
  display:inline-block; margin:3px 4px 3px 0; padding:5px 12px; border-radius:14px;
  background: var(--gram-pos-bg); color: var(--gram-pos); font-style:italic; cursor:pointer; border:1px solid transparent;
}
.game-candidate-chip:hover{ border-color: var(--gram-pos); }
.game-solved-banner{
  background: var(--agar-bg); border:1px solid var(--agar); border-radius: var(--radius-s);
  padding:14px; text-align:center; margin-top:14px;
}
.game-solved-banner .name{ font-style:italic; font-weight:bold; color: var(--agar); font-size:1.15em; }
.game-empty-banner{ background: var(--gram-neg-bg); color: var(--gram-neg); border-radius: var(--radius-s); padding:12px; text-align:center; margin-top:14px; font-size:.9em; }

/* =========================================================================
   5. モバイル対応
   ========================================================================= */
@media (max-width: 860px){
  #app{ grid-template-columns: 1fr; grid-template-areas: "topbar" "main"; }
  #menuToggle{ display:inline-block; }
  #sidebar{
    position:fixed; top:58px; left:0; bottom:0; width: 82vw; max-width:320px;
    transform: translateX(-100%); transition: transform .2s ease; z-index:40;
  }
  #sidebar.open{ transform: translateX(0); box-shadow: var(--shadow); }
  #topbar .brand{ font-size:1em; }
  #topbar .pagecount{ display:none; }
  .a4-page{ padding: 26px 20px 22px; min-height:auto; }
  .page-title{ font-size:1.3em; }
  .page-actions{ position:static; margin-bottom:12px; justify-content:flex-end; }
}

/* =========================================================================
   6. 印刷

@media print{
  body *{ visibility:hidden; }
  #printArea, #printArea *{ visibility:visible; }
  #printArea{ position:absolute; top:0; left:0; width:100%; }
  .a4-page{ box-shadow:none; border:none; width:210mm; min-height:297mm; page-break-after: always; margin:0 auto; }
  .page-actions, .memo-box, .quiz-actions button, .nav-controls{ display:none !important; }
}
#printArea{ display:none; }

<script>
/* =========================================================================
   1. データ層： PAGES / TERMS / BACTERIA / DRUGS
   -------------------------------------------------------------------------
   ★拡張のポイント★
   ・新しいページを増やす → PAGES 配列に要素を push するだけ。
   ・新しい用語 → TERMS に id をキーとして追加。本文中は
       <span class="term" data-term="ID">表示テキスト</span>
     と書けば自動でポップアップ対応になる。
   ・新しい菌 → BACTERIA に追加。本文中は
       <span class="bac" data-bac="ID"><i>Genus species</i></span>
     血清型など斜体にしない部分がある場合は、斜体にしたい部分だけ <i> で囲む。
   ・新しい抗菌薬 → DRUGS に追加。本文中は
       <span class="drug" data-drug="ID">薬剤名</span>
   ========================================================================= */

const TERMS = {
  gram_stain: { term:"Gram染色", type:"検査法", desc:"細胞壁の構造の違いを利用して細菌を大きく2群（Gram陽性・Gram陰性）に分ける染色法。クリスタルバイオレット→ヨウ素→脱色→サフラニンの順に処理する。", pages:[6,10] },
  peptidoglycan: { term:"ペプチドグリカン", type:"構造", desc:"細菌の細胞壁を構成する網目状の高分子。Gram陽性菌では厚い層として細胞表面を覆い、クリスタルバイオレット‐ヨウ素複合体を保持しやすいため紫色に染まる。", pages:[6,10] },
  cell_wall: { term:"細胞壁", type:"構造", desc:"細菌の形を保ち、浸透圧から菌体を守る構造。Gram陽性・陰性で厚さと構成が大きく異なり、これがGram染色や多くの抗菌薬（β-ラクタム系など）の標的の基盤になる。", pages:[6,10,35] },
  catalase: { term:"catalase試験", type:"検査法", desc:"過酸化水素水を滴下し、酸素の泡が発生するかを見る検査。Staphylococcus属は陽性、Streptococcus属は陰性であり、Gram陽性球菌の初期鑑別に用いる。", pages:[42] },
  coagulase: { term:"coagulase試験", type:"検査法", desc:"ウサギ血漿を凝固させる酵素（コアグラーゼ）の有無を見る検査。Staphylococcus aureusは陽性、その他のブドウ球菌（CNS）は基本的に陰性で、両者の鑑別に用いられる。", pages:[42] },
  mrsa_mecA: { term:"mecA遺伝子 / PBP2a", type:"耐性機構", desc:"mecA遺伝子がコードする変異型ペニシリン結合蛋白PBP2aは、β-ラクタム系抗菌薬への親和性が低く、細胞壁合成を止められない。これがMRSA（メチシリン耐性黄色ブドウ球菌）の主な耐性機構であり、ほぼ全てのβ-ラクタム系が無効となる。", pages:[43] },
  mic: { term:"MIC（最小発育阻止濃度）", type:"検査用語", desc:"薬剤が細菌の目に見える発育を阻止できる最小濃度。感受性検査の基本指標であり、耐性機構が働くとMICは上昇（＝効きにくくなる）する。", pages:[43] },
  antibiotic_terms: { term:"抗菌薬と抗生物質", type:"用語", desc:"「抗菌薬」は細菌の増殖を抑える薬剤全般（合成薬を含む）を指す広い用語。「抗生物質」は本来、微生物が産生する天然由来の物質（半合成品を含む）を指す語で、フルオロキノロン系やST合剤のような完全合成薬は「抗生物質」に含めない。臨床で治療を語る際は原則として「抗菌薬」を用いる。", pages:[35] },
  capsule: { term:"莢膜", type:"構造", desc:"細胞壁のさらに外側を覆う多糖体などの層。貪食を受けにくくする免疫回避の役割を持ち、莢膜の有無・血清型が病原性や検査（莢膜血清型別など）に関わる菌がある。", pages:[11] },
  spore: { term:"芽胞（内生胞子）", type:"構造", desc:"一部のGram陽性桿菌（Bacillus属・Clostridium属など）が、栄養枯渇などの環境ストレス下で形成する休眠構造。熱・乾燥・多くの消毒薬に極めて強い抵抗性を持ち、通常の消毒では死滅しないため滅菌の可否判断で重要になる。", pages:[11] },
  flagella: { term:"鞭毛", type:"構造", desc:"細菌の運動を担う糸状の構造。本数・配置（単毛・周毛など）は菌種により異なり、運動性の有無自体が鑑別の手がかりになることがある。", pages:[11] },
  pili: { term:"線毛", type:"構造", desc:"細胞表面の毛状構造。付着（宿主細胞や粘膜への接着）や、性線毛のように遺伝子伝達（接合）に関わるものがある。鞭毛より細く短い。", pages:[11] },
  sterilization: { term:"滅菌", type:"感染制御", desc:"芽胞を含む全ての微生物を完全に死滅・除去すること。オートクレーブ（高圧蒸気）、乾熱、酸化エチレンガス、放射線などの方法がある。", pages:[24] },
  disinfection: { term:"消毒", type:"感染制御", desc:"病原性が問題にならない水準まで微生物の数を減らす操作。対象物に応じて高水準・中水準・低水準の消毒レベルを使い分ける。滅菌とは異なり、芽胞などを完全には死滅させない場合がある。", pages:[25] },
  biofilm: { term:"バイオフィルム", type:"病原因子/構造", desc:"細菌が産生する細胞外多糖などのマトリックスに覆われた集合体。抗菌薬や宿主免疫が届きにくくなり、カテーテル・人工弁など人工物表面での感染を難治化させる。", pages:[29] },
  opsonization: { term:"オプソニン化", type:"免疫", desc:"抗体や補体成分（C3bなど）が病原体表面に結合し、貪食細胞による認識・貪食を促進する現象。莢膜を持つ菌に対する防御で特に重要となる。", pages:[31] },
  plasmid: { term:"プラスミド", type:"遺伝学", desc:"染色体とは別に存在する環状の可動性DNA因子。薬剤耐性遺伝子を含むことが多く、接合によって菌種を超えて伝播しうる、薬剤耐性拡散の重要な担い手である。", pages:[33,34] },
  antibiogram: { term:"アンチバイオグラム", type:"検査/疫学", desc:"施設・地域ごとに集計した、菌種別の抗菌薬感受性率の一覧。経験的治療の抗菌薬選択において、その施設の耐性状況を反映した重要な参考資料になる。", pages:[37] },
  exo_endotoxin: { term:"外毒素と内毒素", type:"病原因子", desc:"外毒素は細菌が分泌する蛋白質毒素で、Gram陽性・陰性を問わず産生されうる。内毒素（エンドトキシン）はGram陰性菌の外膜に存在するリポ多糖（LPS）そのもの、特にその脂質部分（リピドA）を指し、菌の生死にかかわらず存在し、菌が破壊された際にも遊離しうる。", pages:[9,32] },
  hemolysis: { term:"溶血性（α/β/γ）", type:"検査法", desc:"血液寒天培地上でのコロニー周囲の溶血の性状。β溶血は完全溶血（透明帯）、α溶血は不完全溶血（緑色化）、γ溶血は溶血なしを指す。Streptococcus属の初期鑑別に用いる。", pages:[45] },
  oxidase: { term:"oxidase試験", type:"検査法", desc:"チトクロムオキシダーゼの有無を見る検査。Enterobacteralesは基本的に陰性、Neisseria属やPseudomonas属などは陽性であり、Gram陰性菌の初期鑑別に用いる。", pages:[48] },
  optochin_bile: { term:"optochin感受性・胆汁溶解性", type:"検査法", desc:"Streptococcus pneumoniaeを他のα溶血性レンサ球菌から鑑別するための検査。肺炎球菌はoptochinに感受性を示し、胆汁（またはその成分）により自己融解する性質を持つ。", pages:[46] },
  pbp_altered: { term:"PBP変異による低感受性", type:"耐性機構", desc:"Streptococcus pneumoniaeなどで見られる、ペニシリン結合蛋白（PBP）遺伝子自体が別菌種由来の断片と組み換わることで生じる、β-ラクタム系への感受性低下機構。MRSAのように新たな遺伝子（mecA）を獲得するのではなく、既存のPBP遺伝子が段階的に変化する点が異なる。", pages:[46] },
  lactose_fermentation: { term:"乳糖分解能", type:"検査法", desc:"MacConkey寒天培地などの鑑別培地上で、乳糖を分解する菌はコロニーが赤〜ピンク色に、分解しない菌は無色に見える。Enterobacterales内の属・菌種を絞り込む際の基本的な手がかりの一つ。", pages:[53] },
  urease_test: { term:"urease試験", type:"検査法", desc:"尿素をアンモニアと二酸化炭素に分解する酵素（ウレアーゼ）の有無を見る検査。Proteus属などウレアーゼ産生菌は、尿のpHを上昇させ、ストルバイト（リン酸マグネシウムアンモニウム）結石の形成に関与しうる。", pages:[57] },
  nonfermenter: { term:"ブドウ糖非発酵菌", type:"分類（操作的）", desc:"ブドウ糖を発酵的に分解しないGram陰性桿菌を指す、生化学的性状（OF試験など）に基づく操作的な分類。Pseudomonas属・Acinetobacter属・Stenotrophomonas属などが含まれるが、これらは単一の系統群ではなく、あくまで代謝様式が似ているというだけの寄せ集めである。多くは好気性だが、これは分類の定義そのものではなく傾向にすぎず、「非発酵菌＝好気性」と単純に対応づけるのは誤りである（p13参照）。", pages:[61] },
  acid_fast: { term:"抗酸染色・抗酸性", type:"検査法/構造", desc:"抗酸菌の細胞壁は、ミコール酸という脂質に富む特殊な構造を持ち、通常のGram染色ではうまく染まらない。石炭酸フクシンなどで加温しながら一次染色したのち、酸性アルコールで脱色されにくい（抗酸性）という性質を利用して検出する染色法（Ziehl-Neelsen法など）を抗酸染色と呼ぶ。", pages:[70] },
  oxygen_sensitivity: { term:"偏性嫌気性菌の酸素感受性", type:"生理", desc:"酸素呼吸の過程で生じる活性酸素種（過酸化水素など）を分解する酵素（catalaseやスーパーオキシドディスムターゼなど）を欠く、または乏しい偏性嫌気性菌は、酸素存在下でこれらの毒性物質を分解できず増殖が妨げられる。これが偏性嫌気性菌が酸素のある環境で増殖できない理由の一つとされる。", pages:[74] },
  atypical_pathogens: { term:"非定型病原体（非定型肺炎）", type:"臨床的分類（操作的）", desc:"Mycoplasma・Chlamydia・Legionellaなど、通常のGram染色でうまく可視化できない、あるいは細胞壁の性質が特殊であるために、β-ラクタム系抗菌薬が効きにくいという臨床上の特徴を共有する病原体をまとめた、臨床的な便宜上の分類。これらは系統分類上は互いに近縁ではなく、あくまで臨床像・治療方針が似ているために一括りにされている点に注意する。", pages:[82] },
};

    body:`
      <p><b>どんな菌？</b> <span class="bac" data-bac="s_aureus">Staphylococcus aureus</span>は、ブドウの房状に配列するGram陽性球菌であり、<span class="term" data-term="catalase">catalase試験</span>陽性・<span class="term" data-term="coagulase">coagulase試験</span>陽性という組み合わせで他のブドウ球菌（<span class="bac" data-bac="cns">CNS</span>）と鑑別される。</p>
      <p><b>どこにいる？</b> 鼻腔や皮膚に常在する一方で、皮膚のバリアが破綻すると容易に感染を起こす。</p>
      <p><b>何を起こす？</b> 皮膚軟部組織感染症（癤・蜂窩織炎・膿瘍）を代表として、菌血症、感染性心内膜炎、骨髄炎、食中毒（エンテロトキシンによる毒素型）まで多彩な病態を起こす。</p>

      <h4 style="font-size:1em; margin-bottom:6px;">Neisseria gonorrhoeae（淋菌）</h4>
      <p><span class="bac" data-bac="n_gonorrhoeae">Neisseria gonorrhoeae</span>は性感染症としての尿道炎・子宮頸管炎の代表的起因菌である。<span class="bac" data-bac="n_meningitidis">髄膜炎菌</span>と同じ属・同じGram染色所見（Gram陰性双球菌）を示すが、莢膜を基本的に持たず、定着部位・起こす病態は大きく異なる。</p>
      <div class="warn-box">
        <h4>進行する薬剤耐性化</h4>
        <p>淋菌は世界的に薬剤耐性化が進行していることで知られる菌であり、かつて広く使われていた薬剤の多くが現在では推奨されなくなっている。治療薬の選択は各時点の感受性動向・ガイドラインに大きく依存するため、本書では「耐性化が進行しやすい菌である」という考え方の提示にとどめ、具体的な現行の推奨薬は最新のガイドラインを確認してほしい。現時点では<span class="drug" data-drug="ceftriaxone">セフトリアキソン</span>を中心とした治療が行われることが多い。</p>
      </div>
      <h4 style="font-size:1em; margin: 18px 0 6px;">Moraxella catarrhalis</h4>
      <p><span class="bac" data-bac="moraxella">Moraxella catarrhalis</span>はGram陰性球菌で、上気道の常在菌でもありながら、小児の中耳炎・副鼻腔炎や、慢性閉塞性肺疾患（COPD）の急性増悪の原因菌にもなる日和見的な性格を持つ。多くの株がβ-ラクタマーゼを産生するため、<span class="drug" data-drug="amoxicillin">アモキシシリン</span>単剤では無効となることが多く、β-ラクタマーゼ阻害薬との配合剤などが必要になる。</p>
      <div class="aside-box">ここまででPart2各論の最初のまとまり（Staphylococcus属・Streptococcus属・Neisseria属など）を終える。次のPhaseでは、Haemophilus属やEnterobacterales（Escherichia coliを含む腸内細菌目）を扱う。</div>
    `,

    conclusion:"Haemophilus influenzaeは莢膜型（特にb型）の有無によって、侵襲性感染を起こす株と日和見的な気道感染を起こす株とに大きく性格が分かれる。",
    importance:"required",
    body:`
      <p><b>どんな菌？</b> <span class="bac" data-bac="h_influenzae">Haemophilus influenzae</span>は、Gram陰性の多形性小桿菌で、培養には血液成分に含まれるX因子（ヘミン）とV因子（NAD）を必要とするため、これらをあらかじめ含むチョコレート寒天培地で発育させる。</p>
      <p><b>どこにいる？</b> 上気道に常在することが多い。</p>
      <p><b>何を起こす？</b> 莢膜型b（Hib）は、ワクチンが普及する以前は小児の細菌性髄膜炎・喉頭蓋炎の主要な原因菌であった。一方、莢膜を持たない非莢膜株（無莢膜株）は、現在も中耳炎・副鼻腔炎・COPD急性増悪など、上気道〜下気道の日和見的な感染の代表的原因菌として重要である。</p>
      <div class="aside-box">同じ菌種の中でも莢膜の有無で臨床像が大きく異なる、という構図は、p49・p50で見たNeisseria属の2菌種の関係とよく似ている。「莢膜の有無」という物差しは、属や菌種をまたいで繰り返し登場する重要な視点である。</div>
      <p><b>どうやって見つける？</b> 特殊な発育因子要求性（X・V因子）を確認することが、他のGram陰性小桿菌との鑑別の手がかりになる。</p>
      <p><b>どう治療する？</b> 多くの株はβ-ラクタマーゼを産生しうるため、単純なアモキシシリン単剤では無効な場合があり、β-ラクタマーゼ阻害薬配合剤やセフォタキシム／<span class="drug" data-drug="ceftriaxone">セフトリアキソン</span>などが用いられる。</p>
    `,

    conclusion:"EnterobacteralesはGram陰性桿菌の大きな分類群で、乳糖分解能などの生化学的性状の違いにより、多数の属・菌種に細分される。",
    importance:"required",
    body:`
      <p>Enterobacterales（腸内細菌目）は、p14で触れた通り、かつて「腸内細菌科（Enterobacteriaceae）」と呼ばれていた分類群を含む、より上位の系統分類群である。<span class="bac" data-bac="e_coli">Escherichia coli</span>をはじめ、臨床的に重要な多数の属を含む。</p>
      <table class="summary-table">

        <tr><td>主な生息場所</td><td>ヒト・動物の腸管（常在菌）</td></tr>
      </table>
      <p>Enterobacterales内の属・菌種を絞り込む代表的な手がかりが、MacConkey寒天培地上での<span class="term" data-term="lactose_fermentation">乳糖分解能</span>である。次のページ以降、代表的な属を順に見ていく。</p>
      <div class="warn-box">
        <h4>「腸内細菌＝下痢の原因菌」ではない</h4>
        <p>Enterobacteralesの多くは腸管の正常な常在菌叢の一部であり、それ自体は病気を起こさない。むしろ臨床的に問題になるのは、常在部位である腸管から尿路・血流など本来無菌の部位へ移動した場合（内因性感染）や、p55で扱うような特定の病原因子を獲得した特殊な株による腸管感染（外因性・病原型による感染）である。</p>
      </div>
    `,

    importance:"required",
    body:`
      <p><b>どんな菌？</b> <span class="bac" data-bac="klebsiella">Klebsiella pneumoniae</span>は、Enterobacteralesに属する<span class="term" data-term="lactose_fermentation">乳糖分解</span>陽性のGram陰性桿菌で、厚い<span class="term" data-term="capsule">莢膜</span>を持つため粘稠なコロニーを形成する。</p>
      <p><b>どこにいる？</b> ヒトの腸管に常在するほか、環境中にも広く分布する。</p>
      <p><b>何を起こす？</b> 尿路感染症・肺炎・菌血症など、医療関連感染の代表的原因菌の一つ。近年はカルバペネム系抗菌薬に耐性を持つ株（カルバペネム耐性腸内細菌目、CRE）が世界的に問題となっており、感染制御上も重要視されている。</p>
      <div class="aside-box">
        <b>Enterobacter属・Citrobacter属など</b><br>
        Enterobacter属やCitrobacter属の一部の菌種は、治療中に特定のセファロスポリン系抗菌薬に対する耐性を新たに発現することがある、という特徴的な現象が知られている（染色体上に誘導型の酵素をもともと持っているため）。この現象は「治療開始時は感受性でも、治療経過中に耐性化しうる」という点で、p22で扱った感受性検査の解釈に注意を促す代表例になる。この機構の詳細は発展的な内容であり、本書では現象の紹介にとどめる。
      </div>
      <p><b>どう治療する？</b> 耐性化しやすい菌群であるため、感受性検査結果に基づいた治療選択と、必要に応じたde-escalation（p37）が特に重要になる。</p>
    `,

    importance:"important",
    body:`
      <p><b>どんな菌？</b> <span class="bac" data-bac="vibrio">Vibrio cholerae</span>は、彎曲したGram陰性桿菌である。</p>
      <p><b>どこにいる？</b> 汽水域・沿岸の水環境に生息し、汚染された水や食物を介して感染する。</p>
      <p><b>何を起こす？</b> コレラ毒素がアデニル酸シクラーゼを持続的に活性化し、腸管上皮からの水・電解質の大量分泌を引き起こすことで、「米のとぎ汁様」と表現される大量の水様性下痢（コレラ）を起こす。治療の中心は輸液（経口・経静脈での水分・電解質補充）であり、抗菌薬は病悩期間の短縮などの補助的な位置づけになる。</p>
      <div class="aside-box">
        <b>近縁菌</b><br>
        同じVibrio属には、魚介類を介した食中毒の原因となる<i>Vibrio parahaemolyticus</i>（腸炎ビブリオ）や、海水との接触による創部感染や、肝疾患を持つ患者での重症菌血症で知られる<i>Vibrio vulnificus</i>など、生態も病態も異なる近縁菌が含まれる。
      </div>
    `,

    body:`

      <p><b>どうやって見つける？</b> Gram染色・oxidase試験陰性・ブドウ糖非発酵という組み合わせで、Pseudomonas属など他の非発酵菌との鑑別を進める。</p>

      <div class="compare-box">

        <p>p19・p44で扱った通り、検出菌がコンタミネーションか真の菌血症かをまず判断する。<span class="bac" data-bac="cns">CNS</span>は複数セット中の一部のみ陽性であればコンタミネーションを疑うが、<span class="bac" data-bac="s_aureus">Staphylococcus aureus</span>が血液培養から検出された場合は、1セットのみの陽性であっても、コンタミネーションとして扱わず、必ず真の菌血症として精査・治療する、という原則が広く共有されている。</p>

const STORAGE_KEY = "korekiri_saikingaku_state_v1";
const DEFAULT_STATE = {

  fontSize:"medium", darkMode:false, quizHistory:{}, scrollPositions:{}, challengeHistory:[],

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return structuredClone(DEFAULT_STATE);
    const parsed = JSON.parse(raw);
    return Object.assign(structuredClone(DEFAULT_STATE), parsed);
  }catch(e){ console.warn("学習履歴の読み込みに失敗しました。初期状態を使用します。", e); return structuredClone(DEFAULT_STATE); }
}
function saveState(){

function pageById(id){ return PAGES.find(p=>p.id===id); }
function pageIndex(id){ return PAGES.findIndex(p=>p.id===id); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function stripHtml(html){
  const d = document.createElement("div"); d.innerHTML = html; return d.textContent || "";
}
function chaptersInOrder(){
  const seen = []; PAGES.forEach(p=>{ if(!seen.includes(p.chapter)) seen.push(p.chapter); }); return seen;

function computeChapterProgress(){
  return chaptersInOrder().map(ch=>{
    const pages = PAGES.filter(p=>p.chapter===ch);
    const readCount = pages.filter(p=>STATE.read.includes(p.id)).length;
    const pct = pages.length ? Math.round((readCount/pages.length)*100) : 0;
    return { chapter:ch, readCount, total:pages.length, pct };
  });
}

/* 「今日のおすすめ復習」の選定ロジック：
   ①間違えたままのミニ問題があるページ → ②未読ページ → ③お気に入り → ④あとで復習
   の優先順で、重複を除きながら最大5件を集める。 */
function getTodayRecommendations(maxItems){
  maxItems = maxItems || 5;
  const picked = [];
  const pickedIds = new Set();
  function addPage(pageId, reason){
    if(pickedIds.has(pageId)) return;
    const p = pageById(pageId);
    if(!p) return;
    pickedIds.add(pageId);
    picked.push({ page:p, reason });
  }

  // ①間違えたまま（最後の解答が不正解）のミニ問題を含むページ
  Object.keys(STATE.quizHistory||{}).forEach(quizId=>{
    const hist = STATE.quizHistory[quizId];
    if(hist && hist.lastCorrect === false){
      const owner = PAGES.find(p => (p.quizzes||[]).some(q=>q.id===quizId));
      if(owner) addPage(owner.id, "間違えたままの問題があります");
    }
  });

  // ②未読ページ（本文の先頭に近い方から）
  if(picked.length < maxItems){
    PAGES.forEach(p=>{
      if(picked.length>=maxItems) return;
      if(!STATE.read.includes(p.id)) addPage(p.id, "まだ読んでいないページです");
    });
  }

  // ③お気に入り
  if(picked.length < maxItems){
    STATE.favorites.forEach(id=>{ if(picked.length<maxItems) addPage(id, "お気に入りに登録したページです"); });
  }

  // ④あとで復習
  if(picked.length < maxItems){
    STATE.review.forEach(id=>{ if(picked.length<maxItems) addPage(id, "あとで復習に登録したページです"); });
  }

  return picked.slice(0, maxItems);
}

function computeStats(){
  const memoCount = Object.keys(STATE.memos||{}).filter(k=>(STATE.memos[k]||"").trim().length>0).length;
  const quizIds = Object.keys(STATE.quizHistory||{});
  const totalAttempts = quizIds.reduce((s,id)=>s+(STATE.quizHistory[id].attempts||0), 0);
  const correctNow = quizIds.filter(id=>STATE.quizHistory[id].lastCorrect).length;
  const challenges = STATE.challengeHistory||[];
  const bestChallenge = challenges.reduce((best,c)=> (!best || c.correct/c.total > best.correct/best.total) ? c : best, null);
  return {
    read: STATE.read.length,
    totalPages: PAGES.length,
    favorites: STATE.favorites.length,
    review: STATE.review.length,
    memos: memoCount,
    quizAnswered: quizIds.length,
    quizAttempts: totalAttempts,
    quizCorrectNow: correctNow,
    challengeCount: challenges.length,
    bestChallenge,
  };
}

function exportState(){
  try{
    const payload = {
      app: "korekiri_saikingaku",
      exportedAt: new Date().toISOString(),
      version: STATE.version,
      state: STATE,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const dateStr = new Date().toISOString().slice(0,10).replace(/-/g,"");
    const a = document.createElement("a");
    a.href = url;
    a.download = `korekiri_saikingaku_backup_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showSettingsStatus("学習履歴をエクスポートしました。ダウンロードフォルダをご確認ください。", true);
  }catch(e){
    console.warn("エクスポートに失敗しました。", e);
    showSettingsStatus("エクスポートに失敗しました。", false);
  }
}

function importStateFromFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      const incoming = (parsed && parsed.app === "korekiri_saikingaku" && parsed.state) ? parsed.state : parsed;
      if(!incoming || typeof incoming !== "object" || !("read" in incoming || "favorites" in incoming)){
        showSettingsStatus("このファイルは学習履歴のバックアップとして認識できませんでした。", false);
        return;
      }
      const confirmed = confirm("現在この端末に保存されている学習履歴は、インポートした内容で上書きされます。よろしいですか？");
      if(!confirmed) return;
      STATE = Object.assign(structuredClone(DEFAULT_STATE), incoming);
      saveState();
      applyFontSize();
      applyDarkMode();
      renderPage(pageById(STATE.lastPage) ? STATE.lastPage : PAGES[0].id);
      renderSettingsPanel();
      showSettingsStatus("学習履歴をインポートしました。", true);
    }catch(e){
      console.warn("インポートに失敗しました。", e);
      showSettingsStatus("ファイルの読み込みに失敗しました。JSON形式のバックアップファイルを選択してください。", false);
    }
  };
  reader.onerror = ()=> showSettingsStatus("ファイルの読み込みに失敗しました。", false);
  reader.readAsText(file);
}

function resetState(){
  const confirmed = confirm("学習履歴（既読・お気に入り・復習・メモ・ミニ問題履歴・設定）をすべて削除します。この操作は元に戻せません。よろしいですか？");
  if(!confirmed) return;
  STATE = structuredClone(DEFAULT_STATE);
  saveState();
  applyFontSize();
  applyDarkMode();
  renderPage(PAGES[0].id);
  renderSettingsPanel();
  showSettingsStatus("学習履歴を削除しました。", true);
}

   9. 検索
   ========================================================================= */
function buildSearchIndex(){
  return PAGES.map(p=>{
    const bodyText = stripHtml(p.body);
    return { page:p, bodyText, titleText:p.title, conclText:p.conclusion };
  });
}
const SEARCH_INDEX = buildSearchIndex();

function runSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const results = [];
  SEARCH_INDEX.forEach(entry=>{
    const hits = [];
    if(entry.titleText.toLowerCase().includes(q)) hits.push("タイトル");
    if(entry.conclText.toLowerCase().includes(q)) hits.push("結論");
    if(entry.bodyText.toLowerCase().includes(q)) hits.push("本文");
    (entry.page.bacteriaRefs||[]).forEach(id=>{ if(BACTERIA[id].name.toLowerCase().includes(q) && !hits.includes("菌名")) hits.push("菌名"); });
    (entry.page.drugRefs||[]).forEach(id=>{ if(DRUGS[id].name.toLowerCase().includes(q) && !hits.includes("抗菌薬")) hits.push("抗菌薬"); });
    (entry.page.termRefs||[]).forEach(id=>{ if(TERMS[id].term.toLowerCase().includes(q) && !hits.includes("用語DB")) hits.push("用語DB"); });
    if(hits.length) results.push({ page:entry.page, hits });
  });
  // 用語/菌/薬DB自体からも、まだ本文に現れていない一致を拾う
  Object.entries(TERMS).forEach(([id,t])=>{
    if(t.term.toLowerCase().includes(q)){
      t.pages.forEach(pid=>{
        const p = pageById(pid); if(!p) return;
        let r = results.find(r=>r.page.id===pid);
        if(!r){ r={page:p, hits:[]}; results.push(r); }
        if(!r.hits.includes("用語DB")) r.hits.push("用語DB");
      });
    }
  });
  return results;
}

function renderSearchResults(container, query){
  const results = runSearch(query);
  if(!query.trim()){ container.innerHTML = `<p class="empty-note">検索語を入力してください。</p>`; return; }
  if(!results.length){ container.innerHTML = `<p class="empty-note">「${escapeHtml(query)}」に一致するページは見つかりませんでした。</p>`; return; }
  container.innerHTML = results.map(r=>`
    <div class="search-result" data-goto="${r.page.id}" data-searchq="${escapeHtml(query)}">
      <div class="title">p${r.page.id}｜${escapeHtml(r.page.title)}</div>
      <div class="hitloc">ヒット：${r.hits.join(" / ")}</div>
    </div>
  `).join("");
}

function goToPage(id, opts){

function goToRelative(delta){
  const idx = pageIndex(currentPageId);

function highlightAndScroll(query){
  const q = query.trim(); if(!q) return;
  const body = document.querySelector(".page-body");
  if(!body) return;
  const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null);
  let node; const targets = [];
  while(node = walker.nextNode()){
    if(node.nodeValue.toLowerCase().includes(q.toLowerCase())) targets.push(node);
  }
  targets.forEach(node=>{
    const idx = node.nodeValue.toLowerCase().indexOf(q.toLowerCase());
    if(idx<0) return;
    const before = node.nodeValue.slice(0, idx);
    const match = node.nodeValue.slice(idx, idx+q.length);
    const after = node.nodeValue.slice(idx+q.length);
    const mark = document.createElement("mark"); mark.className="hit"; mark.textContent = match;
    const frag = document.createDocumentFragment();
    frag.appendChild(document.createTextNode(before)); frag.appendChild(mark); frag.appendChild(document.createTextNode(after));
    node.parentNode.replaceChild(frag, node);
  });
  const firstMark = document.querySelector("mark.hit");
  if(firstMark) firstMark.scrollIntoView({ behavior:"smooth", block:"center" });
}

function renderQuiz(container, quiz){
  let revealedPerspectives = 0;
  let answered = false;

  function draw(){
    container.innerHTML = `
      ${quiz.vignette ? `<div class="q-vignette">${escapeHtml(quiz.vignette)}</div>` : ""}
      <div class="q-prompt">${escapeHtml(quiz.prompt)}</div>

      <div class="quiz-feedback" id="qfeedback"></div>

    `;
    container.querySelectorAll(".quiz-choice").forEach(btn=>{
      btn.addEventListener("click", ()=> onAnswer(Number(btn.dataset.idx)));
    });
  }

  function onAnswer(idx){
    if(answered) return;
    answered = true;
    const chosen = quiz.choices[idx];
    recordQuizAttempt(quiz.id, chosen.correct);
    container.querySelectorAll(".quiz-choice").forEach((btn,i)=>{
      btn.classList.add("disabled");
      if(quiz.choices[i].correct) btn.classList.add("correct");
      else if(i===idx) btn.classList.add("incorrect");
    });
    const fb = document.getElementById("qfeedback");
    fb.innerHTML = `
      <div class="verdict ${chosen.correct?"ok":"ng"}">${chosen.correct?"正解":"不正解"}</div>
      <div class="quiz-explanations">
        ${quiz.choices.map(c=>`<div>${c.correct?"◎":"×"} ${escapeHtml(c.text)}：${escapeHtml(c.explanation)}</div>`).join("")}
      </div>
      ${(!chosen.correct && quiz.perspectives) ? `<div class="quiz-perspectives" id="qperspectives"></div>` : ""}

    const actions = document.getElementById("qactions");
    actions.innerHTML = `<button id="qretry">もう一度挑戦する</button>`;
    document.getElementById("qretry").addEventListener("click", ()=>{ answered=false; revealedPerspectives=0; draw(); });

    if(!chosen.correct && quiz.perspectives){
      renderPerspectiveHint();
    }
  }

  function renderPerspectiveHint(){
    const box = document.getElementById("qperspectives");
    if(!box) return;
    box.innerHTML = `
      <div><b>考える視点</b>（不正解の場合は答えを覚えるより、まずこの視点で考え直してみよう）</div>
      <ul>${quiz.perspectives.slice(0, revealedPerspectives).map(p=>`<li>${escapeHtml(p)}</li>`).join("")}</ul>
      ${revealedPerspectives < quiz.perspectives.length ? `<button id="qmorehint" class="ghost">＋ 視点を一つ見る</button>` : ""}
    `;
    document.getElementById("qmorehint")?.addEventListener("click", ()=>{ revealedPerspectives++; renderPerspectiveHint(); });
  }

  draw();
}

   13-B. 細菌推理チャレンジ（複数問を通しで解き、レベル別に自動採点する）

const LEVEL_LABEL = { 1:"初級", 2:"中級", 3:"上級" };

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

let challengeSession = null;

function startChallenge(){
  const pool = Object.values(QUIZZES).filter(q=>q.level); // levelタグ付きの問題のみ出題対象
  challengeSession = {
    questions: shuffleArray(pool),
    index: 0,
    results: [], // { quizId, level, correct }
  };
  openChallenge();
  renderChallengeQuestion();
}

function openChallenge(){
  document.getElementById("challengeRoot").classList.add("open");
}
function closeChallenge(){
  document.getElementById("challengeRoot").classList.remove("open");
  document.getElementById("challengeRoot").innerHTML = "";
  challengeSession = null;
}

function renderChallengeQuestion(){
  const root = document.getElementById("challengeRoot");
  const session = challengeSession;
  const total = session.questions.length;
  const q = session.questions[session.index];
  const pct = Math.round((session.index/total)*100);

  root.innerHTML = `
    <div class="challenge-card">
      <button class="close-btn ghost" id="challengeCloseBtn">✕</button>
      <div class="challenge-progress-row">
        <span class="qcount">問題 ${session.index+1} / ${total}</span>
        <span class="level-badge lv${q.level}">${LEVEL_LABEL[q.level]}</span>
      </div>
      <div class="challenge-progress-track"><div class="challenge-progress-fill" style="width:${pct}%;"></div></div>
      <div class="quiz-block" id="challengeQuizMount" style="border:none; padding:0; margin:0; background:none;"></div>
    </div>
  `;
  document.getElementById("challengeCloseBtn").addEventListener("click", ()=>{
    if(confirm("チャレンジを中断します。ここまでの結果は保存されません。よろしいですか？")) closeChallenge();
  });

  // 個々の問題はミニ問題エンジン（renderQuiz）を流用しつつ、
  // 回答結果をチャレンジのセッションにも記録する。
  const mount = document.getElementById("challengeQuizMount");
  renderQuizForChallenge(mount, q);
}

/* renderQuizと基本構造は共通だが、回答後に「次へ」でセッションを進める点が異なるため専用に実装する */
function renderQuizForChallenge(container, quiz){
  let answered = false;
  function draw(){
    container.innerHTML = `
      ${quiz.vignette ? `<div class="q-vignette">${escapeHtml(quiz.vignette)}</div>` : ""}
      <div class="q-prompt">${escapeHtml(quiz.prompt)}</div>
      <div class="quiz-choices">
        ${quiz.choices.map((c,i)=>`<button class="quiz-choice" data-idx="${i}">${escapeHtml(c.text)}</button>`).join("")}
      </div>
      <div class="quiz-feedback" id="cqfeedback"></div>
      <div class="quiz-actions" id="cqactions"></div>
    `;
    container.querySelectorAll(".quiz-choice").forEach(btn=>{
      btn.addEventListener("click", ()=> onAnswer(Number(btn.dataset.idx)));
    });
  }
  function onAnswer(idx){
    if(answered) return;
    answered = true;
    const chosen = quiz.choices[idx];
    recordQuizAttempt(quiz.id, chosen.correct);
    challengeSession.results.push({ quizId:quiz.id, level:quiz.level, correct: !!chosen.correct });
    container.querySelectorAll(".quiz-choice").forEach((btn,i)=>{
      btn.classList.add("disabled");
      if(quiz.choices[i].correct) btn.classList.add("correct");
      else if(i===idx) btn.classList.add("incorrect");
    });
    document.getElementById("cqfeedback").innerHTML = `
      <div class="verdict ${chosen.correct?"ok":"ng"}">${chosen.correct?"正解":"不正解"}</div>
      <div class="quiz-explanations">
        ${quiz.choices.map(c=>`<div>${c.correct?"◎":"×"} ${escapeHtml(c.text)}：${escapeHtml(c.explanation)}</div>`).join("")}
      </div>
    `;
    const isLast = challengeSession.index >= challengeSession.questions.length-1;
    document.getElementById("cqactions").innerHTML =
      `<button class="primary" id="cqnext">${isLast ? "結果を見る" : "次の問題へ →"}</button>`;
    document.getElementById("cqnext").addEventListener("click", ()=>{
      if(isLast){ finishChallenge(); }
      else{ challengeSession.index++; renderChallengeQuestion(); }
    });
  }
  draw();
}

function finishChallenge(){
  const results = challengeSession.results;
  const total = results.length;
  const correct = results.filter(r=>r.correct).length;

  const byLevel = {1:{correct:0,total:0}, 2:{correct:0,total:0}, 3:{correct:0,total:0}};
  results.forEach(r=>{
    byLevel[r.level].total++;
    if(r.correct) byLevel[r.level].correct++;
  });

  // 苦手分野：不正解だった問題が属するページの keywords を集計し、最頻出のものを挙げる
  const wrongPages = results.filter(r=>!r.correct).map(r=>QUIZ_PAGE_MAP[r.quizId]).filter(Boolean);
  const uniqueWrongPages = [...new Set(wrongPages)];
  const keywordCount = {};
  uniqueWrongPages.forEach(pid=>{
    const p = pageById(pid);
    if(!p) return;
    (p.keywords||[]).forEach(k=>{ keywordCount[k] = (keywordCount[k]||0)+1; });
  });
  const weakKeywords = Object.entries(keywordCount).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>k);

  const record = {
    date: new Date().toISOString(),
    total, correct,
    byLevel: { 1: {...byLevel[1]}, 2: {...byLevel[2]}, 3: {...byLevel[3]} },
    weakKeywords, reviewPages: uniqueWrongPages,
  };
  STATE.challengeHistory = STATE.challengeHistory || [];
  STATE.challengeHistory.unshift(record);
  STATE.challengeHistory = STATE.challengeHistory.slice(0, 10);
  saveState();

  renderChallengeResults(record);
  if(document.getElementById("homePanel")) renderHomePanel();
  if(document.getElementById("settingsPanel")) renderSettingsPanel();
}

function renderChallengeResults(record){
  const root = document.getElementById("challengeRoot");
  const pct = record.total ? Math.round((record.correct/record.total)*100) : 0;
  const levelCell = (lv)=>{
    const d = record.byLevel[lv];
    const p = d.total ? Math.round((d.correct/d.total)*100) : 0;
    return `<div class="challenge-summary-cell"><div class="big">${d.correct}/${d.total}</div><div class="lbl">${LEVEL_LABEL[lv]}（${p}%）</div></div>`;
  };
  root.innerHTML = `
    <div class="challenge-card">
      <button class="close-btn ghost" id="challengeCloseBtn2">✕</button>
      <h3 style="margin-bottom:4px;">細菌推理チャレンジ 結果</h3>
      <p style="color:var(--ink-soft); font-size:.9em; margin-top:0;">総合スコア：<b style="color:var(--agar); font-size:1.2em;">${record.correct} / ${record.total}</b>（正答率 ${pct}%）</p>
      <div class="challenge-summary-grid">
        <div class="challenge-summary-cell"><div class="big">${pct}%</div><div class="lbl">総合正答率</div></div>
        ${levelCell(1)}${levelCell(2)}${levelCell(3)}
      </div>
      ${record.weakKeywords.length ? `
        <div class="challenge-weakpoint">
          <b>苦手分野の傾向：</b>${record.weakKeywords.map(k=>escapeHtml(k)).join("／")}
        </div>` : `
        <div class="challenge-weakpoint" style="background:var(--agar-bg); border-left-color:var(--agar); color:var(--agar);">
          明確な苦手分野は見つかりませんでした。よくできています。
        </div>`}
      <h4 style="font-size:.85em; color:var(--ink-faint); margin-bottom:6px;">復習推奨ページ</h4>
      <div class="challenge-review-list">
        ${record.reviewPages.length ? record.reviewPages.map(pid=>{
          const p = pageById(pid); if(!p) return "";
          return `<a data-goto="${pid}">p${pid}｜${escapeHtml(p.title)}</a>`;
        }).join("") : `<p class="empty-note">復習が必要なページはありません。</p>`}
      </div>
      <div class="settings-btnrow" style="margin-top:18px;">
        <button class="primary" id="challengeRetryBtn">もう一度挑戦する</button>
        <button id="challengeCloseBtn3">閉じる</button>
      </div>
    </div>
  `;
  const close = ()=> closeChallenge();
  document.getElementById("challengeCloseBtn2").addEventListener("click", close);
  document.getElementById("challengeCloseBtn3").addEventListener("click", close);
  document.getElementById("challengeRetryBtn").addEventListener("click", startChallenge);
  root.querySelectorAll("[data-goto]").forEach(el=>{
    el.addEventListener("click", ()=>{ closeChallenge(); goToPage(Number(el.dataset.goto)); });
  });
}

/* =========================================================================
   13-C. 菌鑑別ミニゲーム
   -------------------------------------------------------------------------
   「菌名を当てる」のではなく、検査結果を一つずつ選んでいくことで
   候補が絞り込まれていく過程そのものを体験させることが目的。
   ========================================================================= */
let gameFilters = {};

function resetGameFilters(){
  gameFilters = {};
  GAME_AXES.forEach(axis=>{ gameFilters[axis.key] = null; });
}

function computeGameCandidates(){
  return GAME_BACTERIA.filter(entry=>{
    return GAME_AXES.every(axis=>{
      const selected = gameFilters[axis.key];
      if(selected === null) return true; // このフィルタは未選択
      const val = entry[axis.key];
      if(val === null) return true; // この菌ではその検査を鑑別に使わない → 除外しない
      return val === selected;
    });
  });
}

function openGame(){
  resetGameFilters();
  document.getElementById("gameRoot").classList.add("open");
  renderGame();
}
function closeGame(){
  document.getElementById("gameRoot").classList.remove("open");
  document.getElementById("gameRoot").innerHTML = "";
}

function toggleGameFilter(axisKey, value){
  gameFilters[axisKey] = (gameFilters[axisKey] === value) ? null : value;
  renderGame();
}

function renderGame(){
  const root = document.getElementById("gameRoot");
  const candidates = computeGameCandidates();

  const axesHTML = GAME_AXES.map(axis=>`
    <div class="game-axis">
      <div class="axis-label">${escapeHtml(axis.label)}</div>
      <div class="axis-btns">
        ${axis.options.map(([val,label])=>`
          <button data-axis="${axis.key}" data-val="${val}" class="${gameFilters[axis.key]===val?"active":""}">${escapeHtml(label)}</button>
        `).join("")}
      </div>
    </div>
  `).join("");

  let resultHTML = "";
  if(candidates.length === 0){
    resultHTML = `<div class="game-empty-banner">この組み合わせに一致する菌は登録されていません。どれか一つ選択を外してみましょう。</div>`;
  }else if(candidates.length === 1){
    const b = BACTERIA[candidates[0].bacId];
    resultHTML = `
      <div class="game-solved-banner">
        <div style="font-size:.8em; color:var(--agar); margin-bottom:4px;">候補が1つに絞られました</div>
        <div class="name">${b.nameHTML}</div>
        <button style="margin-top:10px;" data-openbac="${candidates[0].bacId}">菌カードを見る</button>
      </div>
    `;
  }else{
    resultHTML = `
      <div class="game-candidates">
        <h4>現在の候補（クリックで菌カードを表示）</h4>
        ${candidates.map(c=>{
          const b = BACTERIA[c.bacId];
          return `<span class="game-candidate-chip" data-openbac="${c.bacId}">${b.nameHTML}</span>`;
        }).join("")}
      </div>
    `;
  }

  root.innerHTML = `
    <div class="game-card">
      <button class="close-btn ghost" id="gameCloseBtn">✕</button>
      <h3 style="margin-bottom:6px;">菌鑑別ミニゲーム</h3>
      <p style="color:var(--ink-soft); font-size:.88em; margin-top:0;">Gram染色・形態・catalase・coagulase・oxidase・酸素要求性・芽胞の情報を選んでいくと、候補の菌が絞り込まれていきます。菌名を覚えるのではなく、検査結果から推理する練習として使ってください。</p>
      <div class="game-count-banner">現在の候補：<span class="num">${candidates.length}</span> 種</div>
      ${axesHTML}
      <div class="settings-btnrow" style="margin-top:10px;">
        <button id="gameResetBtn">選択をリセット</button>
      </div>
      ${resultHTML}
    </div>
  `;
  document.getElementById("gameCloseBtn").addEventListener("click", closeGame);
  document.getElementById("gameResetBtn").addEventListener("click", ()=>{ resetGameFilters(); renderGame(); });
  root.querySelectorAll("[data-axis]").forEach(btn=>{
    btn.addEventListener("click", ()=> toggleGameFilter(btn.dataset.axis, btn.dataset.val));
  });
  root.querySelectorAll("[data-openbac]").forEach(el=>{
    el.addEventListener("click", ()=> openBacteriaModal(el.dataset.openbac));
  });
}

function mountWidgets(page){
  (page.widgets||[]).forEach(w=>{
    if(w==="gramSim") initGramSim(document.getElementById("gramSimRoot"));
    if(w==="growthCurve") initGrowthCurve(document.getElementById("growthCurveRoot"));
    if(w==="mechDiagram") initMechDiagram(document.getElementById("mechDiagramRoot"));
  });
}

/* --- 14-A. Gram染色シミュレーション --- */
function initGramSim(root){
  if(!root) return;
  const steps = [
    { key:"fix", label:"① 固定", info:"菌をスライドガラスに塗抹し、加熱またはアルコールで固定する。菌の形態を保持し、洗い流されないようにする準備段階。" },
    { key:"cv",  label:"② クリスタルバイオレット染色", info:"クリスタルバイオレット（一次染色液）で全ての細菌がいったん紫色に染まる。" },
    { key:"iodine", label:"③ ヨウ素処理（媒染）", info:"ヨウ素がクリスタルバイオレットと複合体を作り、色素を細胞内に固定する。" },
    { key:"decolor", label:"④ 脱色（アルコール/アセトン）", info:"ここが分かれ道。ペプチドグリカン層が厚いGram陽性菌は複合体を保持して紫のままだが、層が薄く外膜を持つGram陰性菌は複合体が流出し脱色される。" },
    { key:"safranin", label:"⑤ 対比染色（サフラニン）", info:"脱色されたGram陰性菌はサフラニンで赤〜桃色に染め直される。すでに紫に染まっているGram陽性菌はサフラニンの影響をほとんど受けない。" },
  ];
  let doneCount = 0;

  function draw(){
    const dishColor = doneCount < 4 ? "#C9B3DE" : (doneCount===4 ? "#C9B3DE" : "linear-gradient(90deg,#8B5A9E 50%, #C2555F 50%)");
    root.innerHTML = `
      <div class="widget-steps">
        ${steps.map((s,i)=>`<button data-step="${i}" class="${i<doneCount?"done":(i===doneCount?"current":"")}">${escapeHtml(s.label)}</button>`).join("")}
      </div>
      <div class="widget-stage">
        <div class="gram-dish" id="gramDish" style="background:${doneCount>4? "":"var(--paper)"}"></div>
        <div class="widget-info" id="gramInfo">${doneCount<steps.length ? "操作したい工程のボタンを、①から順番に押してください。" : "完了：Gram陽性菌（左）は紫、Gram陰性菌（右）は赤〜桃色に染まる。"}</div>
      </div>
    `;
    const dish = document.getElementById("gramDish");
    if(doneCount===0) dish.style.background = "var(--paper)";
    else if(doneCount>=1 && doneCount<=3) dish.style.background = "#8B5A9E";
    else if(doneCount===4) dish.style.background = "linear-gradient(90deg,#8B5A9E 50%, #C9C0AE 50%)";
    else dish.style.background = "linear-gradient(90deg,#8B5A9E 50%, #C2555F 50%)";

    root.querySelectorAll("[data-step]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const i = Number(btn.dataset.step);
        const info = document.getElementById("gramInfo");
        if(i===doneCount){
          info.textContent = steps[i].info;
          doneCount++;
          draw();
        }else if(i<doneCount){
          info.textContent = `この工程（${steps[i].label}）はすでに完了しています。`;
        }else{
          info.textContent = `工程は順番に行う必要がある。先に「${steps[doneCount].label}」を行ってほしい。`;
        }
      });
    });
  }
  draw();
}

/* --- 14-B. 増殖曲線 --- */
function initGrowthCurve(root){
  if(!root) return;
  const phases = {
    lag:{ label:"lag phase（誘導期）", info:"新しい環境への適応期間。菌数はほとんど増えないが、代謝は活発化している。" },
    log:{ label:"log phase（対数増殖期）", info:"最も活発に分裂する時期。多くの抗菌薬（特に細胞壁合成阻害薬）はこの時期の菌に最も効果的。" },
    stationary:{ label:"stationary phase（静止期）", info:"栄養枯渇・老廃物蓄積により増殖速度と死滅速度が釣り合う時期。" },
    death:{ label:"death phase（死滅期）", info:"生存に必要な条件が維持できず、生菌数が減少していく時期。" },
  };
  root.innerHTML = `
    <div class="widget-stage">
      <svg width="260" height="150" viewBox="0 0 260 150">
        <polyline points="10,120 60,115 60,120" fill="none" stroke="var(--ink-faint)" stroke-width="1"/>
        <path class="mech-target" data-phase="lag" d="M10,120 C 30,120 45,118 65,110 L65,140 L10,140 Z" fill="var(--gram-neg-bg)"/>
        <path class="mech-target" data-phase="log" d="M65,110 C 100,60 120,25 150,20 L150,140 L65,140 Z" fill="var(--agar-bg)"/>
        <path class="mech-target" data-phase="stationary" d="M150,20 C 175,18 190,18 200,20 L200,140 L150,140 Z" fill="var(--gram-pos-bg)"/>
        <path class="mech-target" data-phase="death" d="M200,20 C 220,25 240,50 250,90 L250,140 L200,140 Z" fill="var(--paper)"/>
        <path d="M10,120 C 30,120 45,118 65,110 C 100,60 120,25 150,20 C 175,18 190,18 200,20 C 220,25 240,50 250,90" fill="none" stroke="var(--ink)" stroke-width="2"/>
        <line x1="10" y1="140" x2="255" y2="140" stroke="var(--ink-faint)" stroke-width="1"/>
      </svg>
      <div class="widget-info" id="growthInfo">曲線上の各区間（色分けされた部分）をクリックしてください。</div>
    </div>
  `;
  root.querySelectorAll(".mech-target").forEach(el=>{
    el.addEventListener("click", ()=>{
      const key = el.dataset.phase;
      document.getElementById("growthInfo").innerHTML = `<b>${escapeHtml(phases[key].label)}</b><br>${escapeHtml(phases[key].info)}`;
    });
  });
}

/* --- 14-C. 抗菌薬作用機序の模式図 --- */
function initMechDiagram(root){
  if(!root) return;
  const targets = {
    wall:{ label:"細胞壁", info:"β-ラクタム系（ペニシリン・セファロスポリン系など）やグリコペプチド系（バンコマイシン）が、ペプチドグリカン合成を阻害する。" },
    membrane:{ label:"細胞膜", info:"ポリミキシン系などが細胞膜を直接障害し、内容物の漏出を招く。" },
    ribosome:{ label:"リボソーム", info:"アミノグリコシド系・マクロライド系・テトラサイクリン系などが、細菌のリボソーム（30Sまたは50S）に結合し蛋白合成を阻害する。" },
    dna:{ label:"DNA/RNA", info:"フルオロキノロン系はDNAジャイレース・トポイソメラーゼIVを、リファンピシンはRNAポリメラーゼを阻害する。" },
    folate:{ label:"葉酸代謝", info:"ST合剤（スルファメトキサゾール/トリメトプリム）は葉酸合成経路を阻害する。ヒトは葉酸を食事から摂取するため、この経路を持たず選択毒性が成立する。" },
  };
  root.innerHTML = `
    <div class="mech-svg-wrap">
      <svg width="220" height="200" viewBox="0 0 220 200">
        <rect class="mech-target" data-t="wall" x="10" y="10" width="200" height="180" rx="18" fill="none" stroke="var(--gram-pos)" stroke-width="6"/>
        <rect class="mech-target" data-t="membrane" x="24" y="24" width="172" height="152" rx="14" fill="var(--paper)" stroke="var(--gram-neg)" stroke-width="4"/>
        <circle class="mech-target" data-t="ribosome" cx="70" cy="130" r="18" fill="var(--agar-bg)" stroke="var(--agar)" stroke-width="2"/>
        <circle class="mech-target" data-t="ribosome" cx="105" cy="150" r="14" fill="var(--agar-bg)" stroke="var(--agar)" stroke-width="2"/>
        <ellipse class="mech-target" data-t="dna" cx="110" cy="80" rx="45" ry="24" fill="var(--gram-pos-bg)" stroke="var(--gram-pos)" stroke-width="2"/>
        <rect class="mech-target" data-t="folate" x="150" y="120" width="34" height="20" rx="4" fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="2"/>
      </svg>
      <div class="widget-info" id="mechInfo">模式図の各構造（外側の枠＝細胞壁、内側の枠＝細胞膜、丸＝リボソーム、楕円＝DNA、小さな四角＝葉酸代謝経路）をクリックしてください。</div>
    </div>
  `;
  root.querySelectorAll(".mech-target").forEach(el=>{
    el.addEventListener("click", (e)=>{
      e.stopPropagation();
      const key = el.dataset.t;
      document.getElementById("mechInfo").innerHTML = `<b>${escapeHtml(targets[key].label)}</b><br>${escapeHtml(targets[key].info)}`;
    });
  });
}

   15. 図拡大モーダル（Phase1では簡易対応）

function openFigureModal(svgHTML, title, understand){

    <button class="close-btn ghost">✕</button>

    <div class="figure-modal-img">${svgHTML}</div>

  `);

/* =========================================================================
   16. 文字サイズ / ダークモード / 印刷
   ========================================================================= */
const FONT_SIZES = ["small","medium","large"];
function applyFontSize(){
  const app = document.getElementById("app");
  FONT_SIZES.forEach(s=> app.classList.remove(`fs-${s}`));
  app.classList.add(`fs-${STATE.fontSize}`);
}
function cycleFontSize(){
  const i = FONT_SIZES.indexOf(STATE.fontSize);
  STATE.fontSize = FONT_SIZES[(i+1)%FONT_SIZES.length];
  saveState(); applyFontSize();
}
function applyDarkMode(){
  document.documentElement.setAttribute("data-theme", STATE.darkMode ? "dark" : "light");
  document.getElementById("darkModeBtn").textContent = STATE.darkMode ? "☀" : "🌙";
}
function toggleDarkMode(){ STATE.darkMode = !STATE.darkMode; saveState(); applyDarkMode(); }

function printCurrentPage(){
  const p = pageById(currentPageId);
  document.getElementById("printArea").innerHTML = document.getElementById("a4page").outerHTML;
  window.print();
}

/* =========================================================================
   17. モバイル：サイドバー開閉・スワイプ
   ========================================================================= */
function closeSidebarOnMobile(){
  if(window.innerWidth<=860) document.getElementById("sidebar").classList.remove("open");
}
function setupSwipe(){
  let startX=null, startY=null;
  const main = document.getElementById("main");
  main.addEventListener("touchstart", (e)=>{ startX=e.touches[0].clientX; startY=e.touches[0].clientY; }, {passive:true});
  main.addEventListener("touchend", (e)=>{
    if(startX===null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){
      if(dx<0) goToRelative(1); else goToRelative(-1);
    }
    startX=null; startY=null;
  }, {passive:true});
}

/* =========================================================================
   18. 初期化
   ========================================================================= */
function initTabs(){
  document.querySelectorAll("#sidebar nav.tabs button").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll("#sidebar nav.tabs button").forEach(b=>b.classList.remove("active"));
      document.querySelectorAll("#sidebar .tabpanel").forEach(p=>p.classList.remove("active"));
      btn.classList.add("active");
      document.querySelector(`.tabpanel[data-panel="${btn.dataset.tab}"]`).classList.add("active");
    });
  });
}

function initGlobalControls(){
  document.getElementById("prevBtn").addEventListener("click", ()=>goToRelative(-1));
  document.getElementById("nextBtn").addEventListener("click", ()=>goToRelative(1));
  document.getElementById("pageJumpSelect").addEventListener("change", (e)=> goToPage(Number(e.target.value)));
  document.getElementById("fontSizeBtn").addEventListener("click", cycleFontSize);
  document.getElementById("darkModeBtn").addEventListener("click", toggleDarkMode);
  document.getElementById("printBtn").addEventListener("click", printCurrentPage);
  document.getElementById("menuToggle").addEventListener("click", ()=> document.getElementById("sidebar").classList.toggle("open"));
  document.getElementById("importFileInput").addEventListener("change", (e)=>{
    const file = e.target.files && e.target.files[0];
    importStateFromFile(file);
    e.target.value = ""; // 同じファイルを連続で選択しても change が発火するようにリセット
  });

  document.addEventListener("keydown", (e)=>{
    if(document.activeElement && ["TEXTAREA","INPUT","SELECT"].includes(document.activeElement.tagName)) return;
    if(document.getElementById("modalRoot").classList.contains("open")){
      if(e.key==="Escape") closeModal();
      return;
    }
    if(document.getElementById("challengeRoot").classList.contains("open")){
      return; // チャレンジ中は左右キーでのページ送りを無効化する（誤操作防止）
    }
    if(document.getElementById("gameRoot").classList.contains("open")){
      if(e.key==="Escape") closeGame();
      return; // ゲーム中も左右キーでのページ送りを無効化する
    }
    if(e.key==="ArrowLeft") goToRelative(-1);
    if(e.key==="ArrowRight") goToRelative(1);
  });

  const doTopSearch = (q)=>{
    document.querySelectorAll('#sidebar nav.tabs button').forEach(b=>b.classList.remove("active"));
    document.querySelectorAll('#sidebar .tabpanel').forEach(p=>p.classList.remove("active"));
    document.querySelector('[data-tab="search"]').classList.add("active");
    document.querySelector('[data-panel="search"]').classList.add("active");
    document.getElementById("sideSearchInput").value = q;
    renderSearchResults(document.getElementById("searchResults"), q);
    if(window.innerWidth<=860) document.getElementById("sidebar").classList.add("open");
    attachSearchResultHandlers();
  };
  document.getElementById("topSearchInput").addEventListener("input", (e)=> doTopSearch(e.target.value));
  document.getElementById("sideSearchInput").addEventListener("input", (e)=>{
    renderSearchResults(document.getElementById("searchResults"), e.target.value);
    attachSearchResultHandlers();
  });
}

function attachSearchResultHandlers(){
  document.querySelectorAll(".search-result").forEach(el=>{
    el.addEventListener("click", ()=>{
      const id = Number(el.dataset.goto);
      const q = el.dataset.searchq || "";
      goToPage(id, { highlightQuery:q });
    });
  });
}

/* サイドバー内のホーム・目次・一覧・ふせんのボタンは動的に再生成されるため、
   イベント委譲でクリックを拾う（renderPage 内で都度再描画されるため） */
document.getElementById("sidebar").addEventListener("click", (e)=>{
  const btn = e.target.closest("[data-goto]");
  if(btn && btn.closest("#homePanel, #tocPanel, #listPanel, #favPanel")){
    goToPage(Number(btn.dataset.goto));
  }
});

function initApp(){
  applyFontSize();
  applyDarkMode();
  initTabs();
  initGlobalControls();
  setupSwipe();
  renderPage(currentPageId);
}
initApp();
</script>
