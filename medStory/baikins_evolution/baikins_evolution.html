<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>バイキンズの逆襲 β版 — 5ミッション通し</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zen+Antique&family=Noto+Sans+JP:wght@400;700&display=swap');
:root{--wa-bg:#f5f1e8;--wa-panel:#fdfaf3;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{margin:0;padding:0;height:100dvh;overflow:hidden;background:var(--wa-bg);font-family:'Noto Sans JP',sans-serif;}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;justify-content:space-between;align-items:flex-start;z-index:10;pointer-events:none;}
#hud h1{font-family:'Zen Antique',serif;font-size:14px;margin:0;color:#3c3428;font-weight:400;}
#hud h1 span{display:block;font-size:11px;color:#8a8272;font-family:'Noto Sans JP',sans-serif;margin-top:2px;max-width:230px;}
#hudRight{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
#counter{font-weight:700;background:var(--wa-panel);border:1px solid #d8cfb8;border-radius:20px;padding:5px 14px;font-size:13px;color:#3c3428;}
#popularity{font-weight:700;background:#FBEAF0;border:1px solid #ED93B1;border-radius:20px;padding:4px 12px;font-size:12px;color:#72243E;display:none;}
canvas{display:block;touch-action:none;}
#actionBtn{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);transform:translateX(-50%);width:88px;height:88px;border-radius:50%;background:#fdfaf3;border:2px solid #712b13;color:#712b13;font-family:'Noto Sans JP',sans-serif;font-weight:700;font-size:13px;z-index:15;display:none;align-items:center;justify-content:center;touch-action:none;box-shadow:0 3px 10px rgba(0,0,0,0.15);}
#actionBtn.visible{display:flex;}
#actionBtn.active{background:#F0997B;transform:translateX(-50%) scale(0.92);}
#missionBanner{position:fixed;left:0;right:0;top:44%;text-align:center;z-index:18;pointer-events:none;opacity:0;transition:opacity .4s;}
#missionBanner.show{opacity:1;}
#missionBanner .line1{font-family:'Zen Antique',serif;font-size:15px;color:#3c3428;background:rgba(253,250,243,0.9);display:inline-block;padding:8px 18px;border-radius:10px;}
#clearPanel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(60,52,40,0.55);z-index:20;padding:20px;}
#clearCard{background:var(--wa-panel);border-radius:16px;padding:28px 24px;max-width:320px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,0.2);}
#clearCard h2{font-family:'Zen Antique',serif;font-size:20px;margin:0 0 10px;color:#3c3428;font-weight:400;}
#clearCard p{font-size:14px;line-height:1.7;color:#5a5142;margin:0 0 18px;}
#clearCard button{font-family:'Noto Sans JP',sans-serif;font-size:14px;font-weight:700;background:#0f6e56;color:#fff;border:none;border-radius:24px;padding:10px 24px;}
footer{position:fixed;bottom:0;left:0;right:0;font-size:10px;line-height:1.5;color:#8a8272;text-align:center;padding:4px 10px calc(env(safe-area-inset-bottom,0px) + 4px);background:rgba(245,241,232,0.85);z-index:5;}
</style>
</head>
<body>
<div id="hud"><h1 id="hudTitle">ミッション1　合体せよ<span>H2O2を避けながら、合体せよ。</span></h1>
<div id="hudRight"><div id="counter">団子 0 / 6</div><div id="popularity">人気 0</div></div></div>
<canvas id="game"></canvas>
<button id="actionBtn">PVL攻撃</button>
<div id="missionBanner"><div class="line1" id="bannerText"></div></div>
<div id="clearPanel"><div id="clearCard">
<h2>ミッション成功　上がり</h2>
<p>カタラーゼ・コアグラーゼ・PC1・mecA・PVL、すべての力を使い切って好中球を突破した。USA300、完成。</p>
<button id="retryBtn">もう一度あそぶ</button>
</div></div>
<footer>本コンテンツは AI（Claude, Anthropic）を用いて作成されたゲームβ版試作です。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。二次利用・再配布は自己責任のもとで可能です。その際、本注記の保持を推奨します。</footer>

<script>
(function(){
 const canvas=document.getElementById('game');
 const ctx=canvas.getContext('2d');
 const counterEl=document.getElementById('counter');
 const popEl=document.getElementById('popularity');
 const hudTitle=document.getElementById('hudTitle');
 const clearPanel=document.getElementById('clearPanel');
 const retryBtn=document.getElementById('retryBtn');
 const actionBtn=document.getElementById('actionBtn');
 const banner=document.getElementById('missionBanner');
 const bannerText=document.getElementById('bannerText');

 let W,H,DPR;
 function resize(){
   DPR=Math.min(window.devicePixelRatio||1,2);
   W=window.innerWidth; H=window.innerHeight;
   canvas.width=W*DPR; canvas.height=H*DPR;
   canvas.style.width=W+'px'; canvas.style.height=H+'px';
   ctx.setTransform(DPR,0,0,DPR,0,0);
 }
 window.addEventListener('resize',resize);
 resize();

 const M1_TARGET=6, M3_TARGET=5, M5_TARGET=5;
 const COL_PALE='#e6e2d8', COL_GOLD='#EF9F27', COL_DEEPGOLD='#D9A441';

 let mission, player, tail, pointer, actionHeld;
 let hitFlash, invuln, speech, particles;
 let pendingTransition, transitioning, transformT, colorFrom, colorTo;
 let gameFinished;

 // mission1
 let npcs, h2o2zones, m1count;
 // mission2
 let penRain, strepList, h2oDroplets, m2progress, m2SpawnTimer, popularity, spawnDropTimer;
 // mission3
 let allies, penZonesSafe, dangerZones, m3count;
 // mission4
 let cefRain, vanRain4, leuko, m4progress, m4SpawnTimer;
 // mission5
 let boss, vanRain5, pvlShots, m5hits, m5SpawnTimer;

 function reset(){
   mission=1; gameFinished=false;
   player={x:W/2,y:H/2,r:22,color:COL_PALE};
   tail=[]; pointer=null; actionHeld=false;
   hitFlash=0; invuln=0; speech=null; particles=[];
   pendingTransition=null; transitioning=false; transformT=0;
   popularity=0; popEl.style.display='none'; popEl.textContent='人気 0';
   actionBtn.classList.remove('visible');
   clearPanel.style.display='none';
   enterMission1();
 }

 function toLocal(clientX,clientY){ const rect=canvas.getBoundingClientRect(); return {x:clientX-rect.left, y:clientY-rect.top}; }
 canvas.addEventListener('pointerdown',e=>{pointer=toLocal(e.clientX,e.clientY);});
 canvas.addEventListener('pointermove',e=>{if(pointer) pointer=toLocal(e.clientX,e.clientY);});
 window.addEventListener('pointerup',()=>{pointer=null;});
 window.addEventListener('pointercancel',()=>{pointer=null;});
 actionBtn.addEventListener('pointerdown',e=>{e.preventDefault();actionHeld=true;actionBtn.classList.add('active');});
 function releaseAction(){actionHeld=false;actionBtn.classList.remove('active');}
 actionBtn.addEventListener('pointerup',releaseAction);
 actionBtn.addEventListener('pointercancel',releaseAction);
 actionBtn.addEventListener('pointerleave',releaseAction);

 function showLine(text,x,y){ speech={text,x,y,life:110}; }
 function showBanner(text){
   bannerText.textContent=text; banner.classList.add('show');
   setTimeout(()=>{ banner.classList.remove('show'); }, 1600);
 }
 function burst(x,y,color,n){
   n=n||8;
   for(let i=0;i<n;i++) particles.push({x,y,a:Math.random()*Math.PI*2,sp:1+Math.random()*2,life:30+Math.random()*20,color});
 }

 function queueTransition(fn, opts){
   opts=opts||{};
   pendingTransition=fn; transitioning=true; transformT=0;
   colorFrom=opts.from||player.color; colorTo=opts.to||player.color;
 }

 /* ---------------- Mission 1: 合体せよ ---------------- */
 function enterMission1(){
   mission=1;
   npcs=[]; for(let i=0;i<M1_TARGET+3;i++) npcs.push({x:40+Math.random()*(W-80), y:130+Math.random()*(H-280), r:14, wobble:Math.random()*Math.PI*2});
   h2o2zones=[]; for(let i=0;i<3;i++) h2o2zones.push({x:50+Math.random()*(W-100), y:160+Math.random()*(H-320), r:24, wobble:Math.random()*Math.PI*2, cooldown:0});
   m1count=0;
   player.x=W/2; player.y=H/2; tail=[];
   hudTitle.innerHTML='ミッション1　合体せよ<span>H2O2を避けながら、合体せよ。</span>';
   counterEl.textContent='団子 0 / '+M1_TARGET;
   actionBtn.classList.remove('visible');
   showLine('指で押さえて動かし、仲間と合体しよう',player.x,player.y-60);
 }
 function updateMission1(){
   for(let i=npcs.length-1;i>=0;i--){
     const n=npcs[i]; n.wobble+=0.05;
     const d=Math.hypot(player.x-n.x, player.y-n.y);
     if(d<player.r+n.r){
       npcs.splice(i,1); tail.push({x:n.x,y:n.y});
       burst(n.x,n.y,'#ffffff',6);
     }
   }
   for(const z of h2o2zones){
     z.wobble+=0.04; if(z.cooldown>0) z.cooldown--;
     const d=Math.hypot(player.x-z.x, player.y-z.y);
     if(d<player.r+z.r && z.cooldown<=0 && invuln<=0){
       z.cooldown=60; invuln=40; hitFlash=14;
       showLine('H2O2だ、危ない！',player.x,player.y-40);
       const ang=Math.atan2(player.y-z.y,player.x-z.x);
       player.x+=Math.cos(ang)*20; player.y+=Math.sin(ang)*20;
     }
   }
 }
 function checkMission1Complete(){
   const captured = (M1_TARGET+3) - npcs.length;
   if(captured>=M1_TARGET && !transitioning){
     counterEl.textContent='団子 '+M1_TARGET+' / '+M1_TARGET;
     showBanner('ミッション成功　カタラーゼを手に入れた');
     queueTransition(enterMission2, {from:COL_PALE, to:COL_GOLD});
   }
 }

 /* ---------------- Mission 2: 酸素と水を作り出せ ---------------- */
 function enterMission2(){
   mission=2;
   player.color=COL_GOLD;
   player.x=W/2; player.y=110;
   tail.forEach((seg,i)=>{ seg.x=W/2; seg.y=110+(i+1)*4; });
   penRain=[]; h2oDroplets=[]; m2SpawnTimer=20; spawnDropTimer=90;
   strepList=[];
   for(let i=0;i<3;i++) strepList.push({x:60+i*((W-120)/2), y:220+Math.random()*(H-500), shake:0});
   m2progress=0; popularity=0;
   popEl.style.display='block'; popEl.textContent='人気 0';
   hudTitle.innerHTML='ミッション2　酸素と水を作り出せ<span>ペニシリンを避けながら、酸素と水を作り出せ。</span>';
   counterEl.textContent='突破 0%';
   actionBtn.classList.remove('visible');
   showLine('カタラーゼでH2O2は平気。ペニシリンだけ避けよう',player.x,player.y-60);
 }
 function updateMission2(){
   m2progress=Math.max(0,Math.min(1,(player.y-90)/(H-90-140)));
   counterEl.textContent='突破 '+Math.round(m2progress*100)+'%';

   m2SpawnTimer--;
   if(m2SpawnTimer<=0){
     penRain.push({x:20+Math.random()*(W-40), y:-20, r:9, vy:2+Math.random()*1.6});
     m2SpawnTimer=40+Math.random()*20;
   }
   for(let i=penRain.length-1;i>=0;i--){
     const b=penRain[i]; b.y+=b.vy;
     if(b.y>H+30){ penRain.splice(i,1); continue; }
     const d=Math.hypot(player.x-b.x, player.y-b.y);
     if(d<player.r+b.r && invuln<=0){
       penRain.splice(i,1); invuln=40; hitFlash=14;
       showLine('ペニシリンに当たった！',player.x,player.y-40);
       player.y=Math.max(90,player.y-22);
     }
   }

   spawnDropTimer--;
   if(spawnDropTimer<=0 && strepList.length){
     const target=strepList[Math.floor(Math.random()*strepList.length)];
     h2oDroplets.push({x:target.x, y:-20, r:8, vy:2.4, target});
     spawnDropTimer=110+Math.random()*60;
   }
   for(let i=h2oDroplets.length-1;i>=0;i--){
     const d=h2oDroplets[i]; d.y+=d.vy;
     if(d.y>=d.target.y){
       const near=Math.hypot(player.x-d.target.x, player.y-d.target.y)<110;
       if(near){
         popularity++; popEl.textContent='人気 '+popularity;
         burst(d.target.x,d.target.y,'#85B7EB',8);
         showLine('レンサ球菌に感謝された！人気+1',d.target.x,d.target.y-30);
       } else {
         d.target.shake=12;
       }
       h2oDroplets.splice(i,1);
     }
   }
   for(const s of strepList){ if(s.shake>0) s.shake--; }
 }
 function checkMission2Complete(){
   if(player.y>=H-140 && !transitioning){
     showBanner('ミッション成功　PC1を手に入れた');
     queueTransition(enterMission3, {});
   }
 }

 /* ---------------- Mission 3: 仲間を救出せよ ---------------- */
 function enterMission3(){
   mission=3;
   player.x=W/2; player.y=120; tail.forEach((seg,i)=>{ seg.x=W/2; seg.y=120+(i+1)*4; });
   allies=[]; for(let i=0;i<M3_TARGET;i++) allies.push({x:50+Math.random()*(W-100), y:200+Math.random()*(H-420), r:14, wobble:Math.random()*Math.PI*2});
   penZonesSafe=[]; for(let i=0;i<4;i++) penZonesSafe.push({x:40+Math.random()*(W-80), y:170+Math.random()*(H-380), r:20, wobble:Math.random()*Math.PI*2});
   dangerZones=[]; for(let i=0;i<4;i++) dangerZones.push({x:40+Math.random()*(W-80), y:170+Math.random()*(H-380), r:22, wobble:Math.random()*Math.PI*2, cooldown:0, label:(i%2===0?'メチシリン':'セファゾリン')});
   m3count=0; popEl.style.display='none';
   hudTitle.innerHTML='ミッション3　仲間を救出せよ<span>メチシリンとセファゾリンを避けながら、仲間を救出せよ。</span>';
   counterEl.textContent='救出 0 / '+M3_TARGET;
   actionBtn.classList.remove('visible');
   showLine('ペニシリンはPC1で平気。メチシリン・セファゾリンは避けろ',player.x,player.y-60);
 }
 function updateMission3(){
   for(let i=allies.length-1;i>=0;i--){
     const a=allies[i]; a.wobble+=0.05;
     const d=Math.hypot(player.x-a.x, player.y-a.y);
     if(d<player.r+a.r){
       allies.splice(i,1); m3count++;
       counterEl.textContent='救出 '+m3count+' / '+M3_TARGET;
       burst(a.x,a.y,'#7F77DD',7);
       showLine('仲間を救出した！',a.x,a.y-25);
     }
   }
   for(const z of penZonesSafe){
     z.wobble+=0.04;
     const d=Math.hypot(player.x-z.x, player.y-z.y);
     if(d<player.r+z.r){ if(Math.random()<0.15) burst(z.x,z.y,'#378ADD',3); }
   }
   for(const z of dangerZones){
     z.wobble+=0.04; if(z.cooldown>0) z.cooldown--;
     const d=Math.hypot(player.x-z.x, player.y-z.y);
     if(d<player.r+z.r && z.cooldown<=0 && invuln<=0){
       z.cooldown=60; invuln=40; hitFlash=14;
       showLine(z.label+'には耐性がない！',player.x,player.y-40);
       const ang=Math.atan2(player.y-z.y,player.x-z.x);
       player.x+=Math.cos(ang)*22; player.y+=Math.sin(ang)*22;
     }
   }
 }
 function checkMission3Complete(){
   if(m3count>=M3_TARGET && !transitioning){
     showBanner('ミッション成功　mecA進化した');
     queueTransition(enterMission4, {});
   }
 }

 /* ---------------- Mission 4: 雨を進め ---------------- */
 function enterMission4(){
   mission=4;
   player.x=W/2; player.y=110; tail.forEach((seg,i)=>{ seg.x=W/2; seg.y=110+(i+1)*4; });
   cefRain=[]; vanRain4=[]; leuko=[];
   for(let i=0;i<3;i++) leuko.push({x:40+Math.random()*(W-80), y:180+Math.random()*(H-380), r:16, ang:Math.random()*Math.PI*2, wanderT:0, cooldown:0, wob:Math.random()*10});
   m4progress=0; m4SpawnTimer=15;
   hudTitle.innerHTML='ミッション4　雨を進め<span>バンコマイシンと白血球を避けながら、セファゾリンの雨にも負けず進め。</span>';
   counterEl.textContent='突破 0%';
   actionBtn.classList.remove('visible');
   showLine('セファゾリンの雨はmecAで平気。バンコマイシンと白血球は避けろ',player.x,player.y-60);
 }
 function updateMission4(){
   m4progress=Math.max(0,Math.min(1,(player.y-90)/(H-90-140)));
   counterEl.textContent='突破 '+Math.round(m4progress*100)+'%';

   m4SpawnTimer--;
   if(m4SpawnTimer<=0){
     const kind=Math.random()<0.5?'cef':'van';
     const b={x:20+Math.random()*(W-40), y:-20, r:9, vy:2+Math.random()*1.6, kind};
     if(kind==='cef') cefRain.push(b); else vanRain4.push(b);
     m4SpawnTimer=26+Math.random()*16;
   }
   for(let i=cefRain.length-1;i>=0;i--){
     const b=cefRain[i]; b.y+=b.vy;
     if(b.y>H+30){ cefRain.splice(i,1); continue; }
     const d=Math.hypot(player.x-b.x, player.y-b.y);
     if(d<player.r+b.r){ cefRain.splice(i,1); if(Math.random()<0.4) burst(b.x,b.y,'#378ADD',4); }
   }
   for(let i=vanRain4.length-1;i>=0;i--){
     const b=vanRain4[i]; b.y+=b.vy;
     if(b.y>H+30){ vanRain4.splice(i,1); continue; }
     const d=Math.hypot(player.x-b.x, player.y-b.y);
     if(d<player.r+b.r && invuln<=0){
       vanRain4.splice(i,1); invuln=40; hitFlash=14;
       showLine('バンコマイシンには勝てない、避けろ！',player.x,player.y-40);
       player.y=Math.max(90,player.y-22);
     }
   }
   for(const en of leuko){
     if(en.cooldown>0) en.cooldown--;
     en.wanderT--;
     const dp=Math.hypot(player.x-en.x, player.y-en.y);
     if(dp<150){ en.ang=Math.atan2(player.y-en.y,player.x-en.x); en.x+=Math.cos(en.ang)*1.3; en.y+=Math.sin(en.ang)*1.3; }
     else { if(en.wanderT<=0){ en.ang=Math.random()*Math.PI*2; en.wanderT=70+Math.random()*40; } en.x+=Math.cos(en.ang)*0.6; en.y+=Math.sin(en.ang)*0.6; }
     en.x=Math.max(20,Math.min(W-20,en.x)); en.y=Math.max(100,Math.min(H-100,en.y)); en.wob+=0.15;
     const d=Math.hypot(player.x-en.x, player.y-en.y);
     if(d<player.r+en.r && en.cooldown<=0 && invuln<=0){
       en.cooldown=50; invuln=40; hitFlash=14;
       showLine('白血球だ…コアグラーゼのおかげで大事には至らない',player.x,player.y-40);
       const ang=Math.atan2(player.y-en.y,player.x-en.x);
       player.x+=Math.cos(ang)*16; player.y+=Math.sin(ang)*16;
     }
   }
 }
 function checkMission4Complete(){
   if(player.y>=H-140 && !transitioning){
     showBanner('ミッション成功　PVLを手に入れた');
     queueTransition(enterMission5, {});
   }
 }

 /* ---------------- Mission 5: 好中球にPVLを食べさせよ ---------------- */
 function enterMission5(){
   mission=5;
   player.x=W/2; player.y=H-160; tail.forEach((seg,i)=>{ seg.x=W/2; seg.y=H-160+(i+1)*4; });
   boss={x:W/2, y:180, r:34, hp:M5_TARGET, wob:0};
   vanRain5=[]; pvlShots=[]; m5hits=0; m5SpawnTimer=20;
   hudTitle.innerHTML='ミッション5　最終決戦<span>バンコマイシンを避けながら、好中球にPVLを食べさせよ。</span>';
   counterEl.textContent='PVL命中 0 / '+M5_TARGET;
   actionBtn.classList.add('visible');
   showLine('PVLボタンで好中球を攻撃しよう',player.x,player.y-60);
 }
 function updateMission5(){
   m5SpawnTimer--;
   if(m5SpawnTimer<=0){
     vanRain5.push({x:20+Math.random()*(W-40), y:-20, r:9, vy:2+Math.random()*1.8});
     m5SpawnTimer=30+Math.random()*16;
   }
   for(let i=vanRain5.length-1;i>=0;i--){
     const b=vanRain5[i]; b.y+=b.vy;
     if(b.y>H+30){ vanRain5.splice(i,1); continue; }
     const d=Math.hypot(player.x-b.x, player.y-b.y);
     if(d<player.r+b.r && invuln<=0){
       vanRain5.splice(i,1); invuln=40; hitFlash=14;
       showLine('バンコマイシンだけは今も効く、避けろ！',player.x,player.y-40);
       player.y=Math.min(H-90,player.y+18);
     }
   }
   boss.wob+=0.05;
   boss.x=W/2+Math.sin(boss.wob)*60;

   if(actionHeld){
     if(!boss.shotCooldown || boss.shotCooldown<=0){
       const ang=Math.atan2(boss.y-player.y, boss.x-player.x);
       pvlShots.push({x:player.x,y:player.y,vx:Math.cos(ang)*6,vy:Math.sin(ang)*6,r:5});
       boss.shotCooldown=14;
     }
   }
   if(boss.shotCooldown>0) boss.shotCooldown--;

   for(let i=pvlShots.length-1;i>=0;i--){
     const s=pvlShots[i]; s.x+=s.vx; s.y+=s.vy;
     if(s.x<0||s.x>W||s.y<0||s.y>H){ pvlShots.splice(i,1); continue; }
     const d=Math.hypot(s.x-boss.x, s.y-boss.y);
     if(d<boss.r+s.r){
       pvlShots.splice(i,1); m5hits++;
       counterEl.textContent='PVL命中 '+m5hits+' / '+M5_TARGET;
       burst(boss.x,boss.y,'#D85A30',8);
       showLine('PVL命中！',boss.x,boss.y-40);
     }
   }
 }
 function checkMission5Complete(){
   if(m5hits>=M5_TARGET && !transitioning && !gameFinished){
     showBanner('ミッション成功　上がり');
     gameFinished=true;
     queueTransition(function(){
       actionBtn.classList.remove('visible');
       burst(player.x,player.y,'#FAC775',16);
       setTimeout(()=>{ clearPanel.style.display='flex'; },900);
     }, {from:COL_GOLD, to:COL_DEEPGOLD});
   }
 }

 /* ---------------- shared update/draw ---------------- */
 function update(){
   if(clearPanel.style.display==='flex') return;

   if(transitioning){
     transformT=Math.min(1,transformT+0.05);
     if(transformT>=1){
       transitioning=false;
       const fn=pendingTransition; pendingTransition=null;
       if(fn) fn();
     }
     return;
   }

   if(pointer){
     const dx=pointer.x-player.x, dy=pointer.y-player.y;
     const dist=Math.hypot(dx,dy);
     const speed=Math.min(dist,3.8);
     if(dist>2){ player.x+=dx/dist*speed; player.y+=dy/dist*speed; }
   }
   player.x=Math.max(player.r,Math.min(W-player.r,player.x));
   player.y=Math.max(80,Math.min(H-80,player.y));

   let leadX=player.x, leadY=player.y;
   for(const seg of tail){
     const dx=leadX-seg.x, dy=leadY-seg.y;
     const d=Math.hypot(dx,dy)||0.001;
     const minD=player.r*0.9;
     if(d>minD){ seg.x+=dx/d*(d-minD); seg.y+=dy/d*(d-minD); }
     leadX=seg.x; leadY=seg.y;
   }

   if(hitFlash>0) hitFlash--;
   if(invuln>0) invuln--;

   if(mission===1){ updateMission1(); }
   else if(mission===2){ updateMission2(); }
   else if(mission===3){ updateMission3(); }
   else if(mission===4){ updateMission4(); }
   else if(mission===5){ updateMission5(); }

   if(speech){ speech.life--; if(speech.life<=0) speech=null; }
   for(let i=particles.length-1;i>=0;i--){
     const p=particles[i]; p.x+=Math.cos(p.a)*p.sp; p.y+=Math.sin(p.a)*p.sp; p.life--;
     if(p.life<=0) particles.splice(i,1);
   }

   if(mission===1) checkMission1Complete();
   else if(mission===2) checkMission2Complete();
   else if(mission===3) checkMission3Complete();
   else if(mission===4) checkMission4Complete();
   else if(mission===5) checkMission5Complete();
 }

 function lerp(c0,c1,t){
   const a=parseInt(c0.slice(1),16), b=parseInt(c1.slice(1),16);
   const ar=(a>>16)&255, ag=(a>>8)&255, ab=a&255;
   const br=(b>>16)&255, bg=(b>>8)&255, bb=b&255;
   const r=Math.round(ar+(br-ar)*t), g=Math.round(ag+(bg-ag)*t), bl=Math.round(ab+(bb-ab)*t);
   return 'rgb('+r+','+g+','+bl+')';
 }
 function drawCocci(x,y,r,color){
   ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
   ctx.fillStyle=color; ctx.fill();
   ctx.lineWidth=1.5; ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.stroke();
   ctx.fillStyle='rgba(0,0,0,0.55)';
   ctx.beginPath(); ctx.arc(x-r*0.28,y-r*0.05,r*0.11,0,Math.PI*2); ctx.fill();
   ctx.beginPath(); ctx.arc(x+r*0.28,y-r*0.05,r*0.11,0,Math.PI*2); ctx.fill();
 }
 function drawChain(x,y,shake){
   const dx=shake?(Math.random()-0.5)*4:0;
   ctx.fillStyle='#C0DD97';
   for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.arc(x+dx+i*15,y,9,0,Math.PI*2); ctx.fill(); }
 }
 function drawEnemy(en){
   ctx.fillStyle='#EAF3DE'; ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1.2;
   ctx.beginPath();
   const bumps=6;
   for(let i=0;i<=bumps;i++){
     const a=(i/bumps)*Math.PI*2;
     const rr=en.r+Math.sin(a*3+en.wob)*3;
     const px=en.x+Math.cos(a)*rr, py=en.y+Math.sin(a)*rr;
     if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
   }
   ctx.closePath(); ctx.fill(); ctx.stroke();
 }
 function drawZone(z,color,textColor){
   const bob=Math.sin(z.wobble)*2;
   ctx.beginPath(); ctx.arc(z.x,z.y+bob,z.r,0,Math.PI*2);
   ctx.fillStyle=color; ctx.globalAlpha=0.85; ctx.fill(); ctx.globalAlpha=1;
   ctx.strokeStyle=textColor; ctx.lineWidth=1.5; ctx.stroke();
   if(z.label){
     ctx.fillStyle=textColor; ctx.font='10px "Noto Sans JP",sans-serif'; ctx.textAlign='center';
     ctx.fillText(z.label,z.x,z.y+bob+3); ctx.textAlign='left';
   }
 }
 function roundRect(x,y,w,h,r){
   ctx.beginPath();
   ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
   ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
 }

 function draw(){
   ctx.clearRect(0,0,W,H);
   ctx.fillStyle='#f5f1e8'; ctx.fillRect(0,0,W,H);

   if(mission===1){
     for(const z of h2o2zones) drawZone(z,'#97C459','#173404');
     for(const n of npcs){ const bob=Math.sin(n.wobble)*2; drawCocci(n.x,n.y+bob,n.r,'#85B7EB'); }
   } else if(mission===2){
     for(const s of strepList) drawChain(s.x,s.y,s.shake>0);
     ctx.fillStyle='#93C5E8';
     for(const d of h2oDroplets){ ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2); ctx.fill(); }
     ctx.fillStyle='#D85A30';
     for(const b of penRain){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); }
   } else if(mission===3){
     for(const z of penZonesSafe) drawZone(z,'#B5D4F4','#185FA5');
     for(const z of dangerZones) drawZone(z,'#F09595','#A32D2D');
     for(const a of allies){ const bob=Math.sin(a.wobble)*2; drawCocci(a.x,a.y+bob,a.r,'#7F77DD'); }
   } else if(mission===4){
     ctx.fillStyle='#93C5E8';
     for(const b of cefRain){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); }
     ctx.fillStyle='#D85A30';
     for(const b of vanRain4){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); }
     for(const en of leuko) drawEnemy(en);
   } else if(mission===5){
     ctx.fillStyle='#D85A30';
     for(const b of vanRain5){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); }
     ctx.save();
     ctx.fillStyle='#EAF3DE'; ctx.strokeStyle='#A32D2D'; ctx.lineWidth=1.5;
     ctx.beginPath();
     const bumps=7;
     for(let i=0;i<=bumps;i++){
       const a=(i/bumps)*Math.PI*2;
       const rr=boss.r+Math.sin(a*4+boss.wob*3)*4;
       const px=boss.x+Math.cos(a)*rr, py=boss.y+Math.sin(a)*rr;
       if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
     }
     ctx.closePath(); ctx.fill(); ctx.stroke();
     ctx.restore();
     ctx.fillStyle='#993c1d';
     for(const s of pvlShots){ ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); }
   }

   for(let i=tail.length-1;i>=0;i--){ drawCocci(tail[i].x,tail[i].y,player.r*0.85,'#7F77DD'); }

   let pcolor = transitioning ? lerp(colorFrom,colorTo,transformT) : player.color;
   if(hitFlash>0) pcolor='#E24B4A';
   drawCocci(player.x,player.y,player.r,pcolor);

   for(const p of particles){
     ctx.globalAlpha=Math.max(0,p.life/40); ctx.fillStyle=p.color;
     ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill();
     ctx.globalAlpha=1;
   }

   if(speech){
     ctx.globalAlpha=Math.min(1,speech.life/20);
     const padding=10, maxW=Math.min(230,W-40);
     ctx.font='13px "Noto Sans JP",sans-serif';
     const bw=Math.min(maxW,ctx.measureText(speech.text).width+padding*2);
     const bx=Math.max(10,Math.min(W-bw-10,speech.x-bw/2));
     const by=Math.max(80,speech.y-50);
     ctx.fillStyle='#fdfaf3'; ctx.strokeStyle='#d8cfb8'; ctx.lineWidth=1;
     roundRect(bx,by,bw,32,10); ctx.fill(); ctx.stroke();
     ctx.fillStyle='#3c3428';
     ctx.fillText(speech.text,bx+padding,by+20,bw-padding*2);
     ctx.globalAlpha=1;
   }
 }

 function loop(){ update(); draw(); requestAnimationFrame(loop); }
 retryBtn.addEventListener('click',reset);
 reset();
 loop();
})();
</script>
