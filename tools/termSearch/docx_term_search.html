<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOCX 用語検索</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #f4f6f8; color: #222;
  }
  .wrap { max-width: 1100px; margin: 32px auto; padding: 0 20px; }
  h1 { margin: 0 0 8px; font-size: 28px; }
  .sub { color:#666; margin-bottom: 24px; }
  .card {
    background:#fff; border-radius:14px; padding:22px;
    box-shadow:0 3px 14px rgba(0,0,0,.08); margin-bottom:18px;
  }
  label { display:block; font-weight:700; margin:12px 0 8px; }
  input[type=file], input[type=text] {
    width:100%; padding:12px; border:1px solid #ccd2d8;
    border-radius:8px; font-size:16px;
  }
  button {
    border:0; border-radius:9px; padding:11px 18px;
    font-size:15px; font-weight:700; cursor:pointer;
    background:#1769aa; color:#fff; margin-top:14px;
  }
  button:disabled { background:#aaa; cursor:not-allowed; }
  .secondary { background:#66717d; margin-left:8px; }
  .status { margin-top:14px; color:#555; min-height:24px; }
  .summary {
    display:flex; gap:18px; flex-wrap:wrap; margin-bottom:16px;
  }
  .stat {
    background:#f0f5f9; border-radius:10px; padding:12px 16px;
    min-width:130px;
  }
  .stat b { display:block; font-size:22px; }
  .result {
    border:1px solid #dde2e6; border-radius:10px;
    padding:14px; margin:10px 0; background:#fff;
  }
  .meta { font-weight:700; margin-bottom:7px; }
  .hit { background:#fff29a; font-weight:700; padding:1px 2px; }
  .context { line-height:1.7; white-space:normal; }
  .note { color:#777; font-size:13px; line-height:1.6; }
  .empty { color:#777; padding:20px 0; }
  .error { color:#b00020; font-weight:700; }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📄 DOCX 用語検索</h1>
  <div class="sub">Wordファイルを読み込み、用語が含まれる段落・推定ページ・行を表示します。</div>

  <div class="card">
    <label for="file">1. DOCXファイル</label>
    <input id="file" type="file" accept=".docx">

    <label for="term">2. 検索する用語</label>
    <input id="term" type="text" placeholder="例：Staphylococcus aureus">

    <button id="searchBtn" disabled>🔍 検索</button>
    <button id="csvBtn" class="secondary" disabled>CSV出力</button>
    <div id="status" class="status">DOCXファイルを選択してください。</div>
  </div>

  <div id="resultCard" class="card hidden">
    <div id="summary" class="summary"></div>
    <div id="results"></div>
  </div>

  <div class="card">
    <div class="note">
      <b>注意：</b> DOCXは内部的に固定された「ページ」や「行」を持たないため、
      このツールのページ番号・行番号は、A4・標準的な余白・11pt程度の文字サイズを
      仮定して算出する「推定値」です。Word上の実際のページ番号・行番号と完全一致する
      ことは保証されません。検索自体はDOCX内の本文テキストを対象に行います。
    </div>
  </div>
</div>

<!-- Mammoth.js: DOCX → HTML -->
<script src="https://unpkg.com/mammoth@1.9.0/mammoth.browser.min.js"></script>
<script>
const fileInput = document.getElementById('file');
const termInput = document.getElementById('term');
const searchBtn = document.getElementById('searchBtn');
const csvBtn = document.getElementById('csvBtn');
const status = document.getElementById('status');
const resultCard = document.getElementById('resultCard');
const summary = document.getElementById('summary');
const results = document.getElementById('results');

let currentFile = null;
let lastResults = [];

fileInput.addEventListener('change', () => {
  currentFile = fileInput.files[0] || null;
  searchBtn.disabled = !currentFile;
  csvBtn.disabled = true;
  resultCard.classList.add('hidden');
  status.textContent = currentFile
    ? `選択中：${currentFile.name}`
    : 'DOCXファイルを選択してください。';
});

termInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !searchBtn.disabled) search();
});

searchBtn.addEventListener('click', search);
csvBtn.addEventListener('click', downloadCSV);

async function search() {
  const term = termInput.value.trim();
  if (!currentFile) return;
  if (!term) {
    status.innerHTML = '<span class="error">検索語を入力してください。</span>';
    return;
  }

  searchBtn.disabled = true;
  csvBtn.disabled = true;
  status.textContent = 'DOCXを解析しています……';
  resultCard.classList.add('hidden');
  results.innerHTML = '';

  try {
    const arrayBuffer = await currentFile.arrayBuffer();

    // DOCXをHTML化
    const mammothResult = await mammoth.convertToHtml(
      { arrayBuffer },
      {
        includeDefaultStyleMap: true
      }
    );

    const temp = document.createElement('div');
    temp.innerHTML = mammothResult.value;

    // Word文書の段落を取得
    const blocks = [...temp.querySelectorAll('p, li, h1, h2, h3, h4, h5, h6')];
    const paragraphs = blocks
      .map(el => el.textContent.replace(/\s+/g, ' ').trim())
      .filter(Boolean);

    // 検索
    const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(escaped, 'gi');

    let charCount = 0;
    let lineCount = 0;
    const charsPerLine = 75;     // 推定
    const linesPerPage = 45;     // 推定
    const pageCharCapacity = charsPerLine * linesPerPage;

    paragraphs.forEach((text, i) => {
      let match;
      re.lastIndex = 0;

      while ((match = re.exec(text)) !== null) {
        // 文書全体の概算文字位置
        const absoluteChar = charCount + match.index;
        const page = Math.floor(absoluteChar / pageCharCapacity) + 1;

        // 段落内の推定行
        const lineInParagraph = Math.floor(match.index / charsPerLine) + 1;
        const line = Math.floor(absoluteChar / charsPerLine) + 1;

        const contextStart = Math.max(0, match.index - 90);
        const contextEnd = Math.min(text.length, match.index + term.length + 90);
        let context = text.slice(contextStart, contextEnd);
        context = escapeHtml(context);
        const safeTerm = escapeHtml(term);
        const hitRe = new RegExp(
          safeTerm.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'),
          'gi'
        );
        context = context.replace(hitRe, m => `<span class="hit">${m}</span>`);

        lastResults.push({
          no: lastResults.length + 1,
          page,
          line,
          paragraph: i + 1,
          context: stripHtml(context)
        });

        const div = document.createElement('div');
        div.className = 'result';
        div.innerHTML = `
          <div class="meta">#${lastResults.length}　推定 P.${page} / L.${line}
            <span style="font-weight:400;color:#777;">（段落 ${i + 1}）</span>
          </div>
          <div class="context">…${context}…</div>
        `;
        results.appendChild(div);

        if (match[0].length === 0) re.lastIndex++;
      }

      // 段落間に概算改行を加える
      charCount += text.length + 1;
      lineCount += Math.max(1, Math.ceil(text.length / charsPerLine)) + 1;
    });

    const totalChars = charCount;
    const totalPages = Math.max(1, Math.ceil(totalChars / pageCharCapacity));

    summary.innerHTML = `
      <div class="stat"><b>${lastResults.length}</b>該当箇所</div>
      <div class="stat"><b>${paragraphs.length}</b>段落</div>
      <div class="stat"><b>${totalPages}</b>推定ページ</div>
    `;

    resultCard.classList.remove('hidden');

    if (lastResults.length === 0) {
      results.innerHTML = `<div class="empty">「${escapeHtml(term)}」は見つかりませんでした。</div>`;
    } else {
      status.textContent = `検索完了：${lastResults.length}件`;
      csvBtn.disabled = false;
    }

  } catch (err) {
    console.error(err);
    status.innerHTML = `<span class="error">読み込みに失敗しました。Wordファイルが破損していないか確認してください。</span>`;
  } finally {
    searchBtn.disabled = false;
  }
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function stripHtml(s) {
  const d = document.createElement('div');
  d.innerHTML = s;
  return d.textContent;
}

function downloadCSV() {
  if (!lastResults.length) return;

  const header = ['No', '推定ページ', '推定行', '段落', '前後の文章'];
  const rows = lastResults.map(r =>
    [r.no, r.page, r.line, r.paragraph, r.context]
  );

  const csv = [header, ...rows]
    .map(row => row.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))
    .join('\r\n');

  const blob = new Blob(['\uFEFF' + csv], {
    type: 'text/csv;charset=utf-8;'
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'docx_search_results.csv';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
