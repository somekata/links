<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown → PDF 変換</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  :root { --accent: #1a56a0; --border: #ccc; }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: #000; background: #f4f5f7;
    font-family: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.7;
  }
  header.app { background: #fff; border-bottom: 1px solid var(--border); padding: 12px 24px; }
  header.app h1 { font-size: 20px; margin: 0; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section.pane { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  section.pane h2 { font-size: 16px; margin: 0 0 8px; }
  #drop {
    border: 2px dashed var(--border); border-radius: 8px; padding: 12px;
    text-align: center; margin-bottom: 8px; cursor: pointer;
  }
  #drop.over { border-color: var(--accent); background: #eef4fb; }
  textarea {
    width: 100%; height: 60vh; font-family: Consolas, "BIZ UDGothic", monospace;
    font-size: 14px; padding: 8px; border: 1px solid var(--border); border-radius: 6px; resize: vertical;
  }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px;
    padding: 8px 16px; font-size: 15px; cursor: pointer; font-family: inherit;
  }
  button.sub { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  select { padding: 6px; font-family: inherit; }

  /* ===== 文書本体（プレビュー兼印刷対象） ===== */
  #doc {
    background: #fff; color: #000; padding: 24px; border-radius: 6px;
    font-size: 11pt; overflow-wrap: anywhere;
  }
  #doc h1, #doc h2, #doc h3, #doc h4 { line-height: 1.4; margin: 1.4em 0 .5em; page-break-after: avoid; }
  #doc h1 { font-size: 1.8em; border-bottom: 2px solid var(--accent); padding-bottom: .2em; }
  #doc h2 { font-size: 1.45em; border-bottom: 1px solid var(--border); padding-bottom: .15em; }
  #doc h3 { font-size: 1.2em; }
  #doc p, #doc ul, #doc ol, #doc blockquote, #doc pre, #doc table { margin: .6em 0; }
  #doc blockquote { border-left: 4px solid var(--accent); margin-left: 0; padding: .2em 1em; background: #f6f8fa; }
  #doc code { font-family: Consolas, monospace; background: #f1f1f1; padding: .1em .3em; border-radius: 3px; font-size: .92em; }
  #doc pre { background: #f6f8fa; border: 1px solid var(--border); padding: 10px; border-radius: 6px; white-space: pre-wrap; page-break-inside: avoid; }
  #doc pre code { background: none; padding: 0; }
  #doc table { border-collapse: collapse; width: 100%; page-break-inside: avoid; }
  #doc th, #doc td { border: 1px solid #888; padding: 6px 10px; text-align: left; }
  #doc th { background: #eef2f7; }
  #doc img { max-width: 100%; }
  #doc hr { border: 0; border-top: 1px solid var(--border); margin: 1.5em 0; }

  footer.notice {
    margin: 2em 0 0; padding-top: .8em; border-top: 1px solid #888;
    font-size: 9pt; color: #000; line-height: 1.6;
  }

  /* ===== 印刷（PDF保存）設定 ===== */
  @page { size: A4; margin: 18mm 16mm; }
  @media print {
    body { background: #fff; }
    header.app, #inputPane, .no-print { display: none !important; }
    main { display: block; padding: 0; }
    section.pane { border: 0; padding: 0; }
    #previewTitle { display: none; }
    #doc { padding: 0; }
  }
</style>
</head>
<body>

<header class="app"><h1>Markdown → PDF 変換</h1></header>

<main>
  <section class="pane" id="inputPane">
    <h2>入力</h2>
    <div id="drop">.md ファイルをここにドロップ、またはクリックして選択</div>
    <input type="file" id="file" accept=".md,.markdown,.txt" hidden>
    <textarea id="src" placeholder="ここに Markdown を貼り付け"></textarea>
    <div class="toolbar">
      <label>文字サイズ
        <select id="fs">
          <option value="10pt">10pt</option>
          <option value="11pt" selected>11pt</option>
          <option value="12pt">12pt</option>
          <option value="14pt">14pt</option>
        </select>
      </label>
      <button class="sub" id="clear" type="button">クリア</button>
    </div>
  </section>

  <section class="pane">
    <h2 id="previewTitle">プレビュー</h2>
    <div id="doc"></div>
    <div class="toolbar no-print">
      <button id="print" type="button">PDFとして保存</button>
      <span>※ 印刷ダイアログで「PDFに保存」を選択してください</span>
    </div>
  </section>
</main>

<script>
  const src = document.getElementById('src');
  const doc = document.getElementById('doc');
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');

  const NOTICE_HTML = `
    <footer class="notice">
      本テキストは AI（Claude, Anthropic）を用いて作成されました。内容には誤りが含まれる可能性があります。医療上の判断には必ず公式の教科書・文献・専門家の指導を参照してください。<br>
      二次利用・再配布は自己責任のもとで可能です。その際、本注記の保持を推奨します。
    </footer>`;

  function render() {
    const raw = marked.parse(src.value || '*Markdown を入力するとここに表示されます*', { breaks: true, gfm: true });
    doc.innerHTML = DOMPurify.sanitize(raw) + NOTICE_HTML;
    // ファイル名（タイトル）をPDFの既定名に反映
    const h1 = doc.querySelector('h1');
    document.title = h1 ? h1.textContent : 'Markdown → PDF 変換';
  }

  function loadFile(f) {
    if (!f) return;
    const reader = new FileReader();
    reader.onload = e => { src.value = e.target.result; render(); };
    reader.readAsText(f, 'UTF-8');
  }

  src.addEventListener('input', render);
  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', e => loadFile(e.dataTransfer.files[0]));

  document.getElementById('fs').addEventListener('change', e => { doc.style.fontSize = e.target.value; });
  document.getElementById('clear').addEventListener('click', () => { src.value = ''; render(); });
  document.getElementById('print').addEventListener('click', () => window.print());

  render();
</script>
</body>
</html>
